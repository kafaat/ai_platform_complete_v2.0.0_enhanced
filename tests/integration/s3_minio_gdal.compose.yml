# Disposable loopback-only acceptance lab. No reuse of production volumes.
# Image digest matches SAHOOL's currently pinned Compose MinIO mirror.
services:
  s3-acceptance-minio:
    image: ${S3_TEST_MINIO_IMAGE:-coollabsio/minio:2025-04-22T22-12-26Z@sha256:a4938f37f1be1841b8e7b627ad0207b265345fd0d063e42d7410c78af0e63e68}
    restart: "no"
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    # Accept only local host connections, NOT a public listener.
    ports:
      - "127.0.0.1:${S3_TEST_HOST_PORT:?set test port}:9000"
    environment:
      MINIO_ROOT_USER: ${S3_TEST_ROOT_USER:?test-only credential required}
      MINIO_ROOT_PASSWORD: ${S3_TEST_ROOT_PASSWORD:?test-only credential required}
      # No TLS certificates, --certs-dir or externally supplied redirect controls.
    command: server /data --console-address ":9001"
    tmpfs:
      - /data:size=128m
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 6s
