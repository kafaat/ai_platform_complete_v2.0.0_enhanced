# TEST-ONLY. The relay is operator-managed and NOT installed by the SAHOOL chart.
# These names refer to simulated in-cluster Pods; no credentials or external URL here.
authEmailRelay:
  enabled: true
  serviceName: sahool-mail-relay
  podComponent: sahool-mail-relay
  port: 587
  from: noreply@sahool.example.invalid
  credentialsSecret: sahool-mail-relay-credentials
  usernameKey: username
  passwordKey: password
  dnsNamespace: kube-system
  dnsPodComponent: kube-dns
  dependencyEgress:
    - purpose: database
      namespace: sahool
      podComponent: sahool-postgres
      port: 5432
    - purpose: redis
      namespace: sahool
      podComponent: sahool-redis
      port: 6379
