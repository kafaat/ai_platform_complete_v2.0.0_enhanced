# Explicit device profile for the repository's Mosquitto 2.0.x image.
# Mount INSTEAD OF mosquitto.conf on a dedicated broker; never combine listeners
# with the legacy shared-account broker. Provision passwd/acl/certificates first.
# Reference: https://mosquitto.org/man/mosquitto-conf-5.html
listener 8883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/device-passwd
acl_file /mosquitto/config/device-acl
cafile /mosquitto/config/tls/ca.crt
certfile /mosquitto/config/tls/server.crt
keyfile /mosquitto/config/tls/server.key
require_certificate false
tls_version tlsv1.2
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Missing/bad keys, CA, password file or ACL abort broker startup.
# No plaintext listener and no default broad device grant.
