# SAHOOL — وسيط MQTT (Eclipse Mosquitto) لاستقبال أوامر actuator-service.
# مُستخدَم داخليّاً فقط (شبكة sahool-internal، غير مكشوف للمضيف).
# الوصول المجهول مرفوض (allow_anonymous false): المصادقة إلزاميّة عبر password_file.
# ملفّ passwd يُولَّد عند إقلاع الحاوية من MQTT_USERNAME/MQTT_PASSWORD (لا سرّ في
# المستودع — انظر خدمة sahool-fastbee في docker-compose.v9.yml). ACL أدقّ إن كُشف الوسيط.
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
persistence true
persistence_location /mosquitto/data/
# autosave دوريّ كي لا تضيع الرسائل المحتفَظ بها (retained) عند إعادة التشغيل.
autosave_interval 60

# ── A8 (تدقيق 2026-11-01): ACL لكلّ هويّة + TLS — **معلَّقان** حتّى تُزوَّد الهويّات المنفصلة ──
# الحساب المشترك أعلاه بلا ACL: أيّ حاملٍ ينشر أيّ موضوع. القالب والأسرار المطلوبة في
# mosquitto/acl.template. التفعيل (قرار نشر): انسخه إلى /mosquitto/config/acl بعد ملء أسطر
# الأجهزة، ثمّ أزِل التعليق:
# acl_file /mosquitto/config/acl
# listener 8883 0.0.0.0
# cafile /mosquitto/config/tls/ca.crt
# certfile /mosquitto/config/tls/server.crt
# keyfile /mosquitto/config/tls/server.key
# require_certificate false
