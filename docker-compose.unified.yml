x-limits: &default-limits
  deploy:
    resources:
      limits: {cpus: '1.0', memory: 512M}
      reservations: {memory: 128M}

# version removed (deprecated in Compose v2)
# SAHOOL v9.1 — UNIFIED PRODUCTION COMPOSE (FIXED)
# FIX: healthchecks use curl (not wget)

networks:
  sahool-net:
    driver: bridge
    ipam:
      config: [{ subnet: "172.20.0.0/16" }]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  zlmediakit_data:
  fastbee_data:
  ollama_models:
  qdrant_data:

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-db-env: &db-env
  DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@sahool-postgis:5432/sahool"
  REDIS_URL: "redis://sahool-redis:6379/0"
  NATS_URL: "nats://sahool-nats:4222"
  MQTT_BROKER_URL: "mqtt://sahool-fastbee:1883"

services:
  nginx:
    image: nginx:alpine
    container_name: sahool-nginx
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.unified.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - auth-service
      - supervisor-agent
      - frontend
      - local-ai-rag
      - odoo-bridge
      - agriai-engine
    networks: [sahool-net]
    <<: *logging

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: sahool-frontend
    restart: unless-stopped
    expose: ["80"]
    depends_on: [auth-service, supervisor-agent]
    networks: [sahool-net]
    <<: *logging

  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: sahool-auth
    restart: unless-stopped
    ports: ["8120:8000"]
    environment:
      <<: *db-env
      JWT_SECRET: "${JWT_SECRET}"
      SAHOOL_ENV: "production"
    depends_on:
      postgis: { condition: service_healthy }
      redis:   { condition: service_healthy }
    networks: [sahool-net]
    <<: *logging
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  supervisor-agent:
    build:
      context: .
      dockerfile: services/supervisor-agent/Dockerfile
    container_name: sahool-supervisor
    restart: unless-stopped
    ports: ["8096:8000"]
    environment:
      SAHOOL_AGENT_TOKEN: "${SAHOOL_AGENT_TOKEN}"
      MCP_SENTINEL_HUB_URL: "http://sahool-sentinel-hub-mcp:8000/mcp/v1"
      MCP_WEATHER_URL: "http://sahool-weather-mcp:8000/mcp/v1"
      MCP_WOFOST_URL: "http://sahool-wofost-mcp:8000/mcp/v1"
      MCP_MARKET_URL: "http://sahool-market-mcp:8000/mcp/v1"
      MCP_AGRIAI_URL: "http://sahool-agriai-engine:8000/mcp/v1"
      GUARDRAILS_URL: "http://sahool-guardrails:8000"
      REDIS_URL: "redis://sahool-redis:6379/0"
      JWT_SECRET: "${JWT_SECRET}"
    depends_on:
      sentinel-hub-mcp: { condition: service_healthy }
      weather-mcp:       { condition: service_healthy }
      wofost-mcp:        { condition: service_healthy }
      market-mcp:        { condition: service_healthy }
      agriai-engine:     { condition: service_healthy }
      guardrails:        { condition: service_healthy }
      redis:             { condition: service_healthy }
    networks: [sahool-net]
    <<: *logging
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/healthz"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  guardrails:
    build:
      context: .
      dockerfile: services/guardrails-engine/Dockerfile
    container_name: sahool-guardrails
    restart: unless-stopped
    ports: ["8097:8000"]
    environment:
      JWT_SECRET: "${JWT_SECRET}"
      <<: *db-env
    depends_on:
      postgis: { condition: service_healthy }
    networks: [sahool-net]
    <<: *logging
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3

  sentinel-hub-mcp:
    build:
      context: .
      dockerfile: services/mcp_servers/Dockerfile
    container_name: sahool-sentinel-hub-mcp
    restart: unless-stopped
    ports: ["8091:8000"]
    environment:
      SH_CLIENT_ID: "${SH_CLIENT_ID}"
      SH_CLIENT_SECRET: "${SH_CLIENT_SECRET}"
      JWT_SECRET: "${JWT_SECRET}"
    networks: [sahool-net]
    <<: *logging
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  weather-mcp:
    build:
      context: .
      dockerfile: services/mcp_servers/Dockerfile
    container_name: sahool-weather-mcp
    restart: unless-stopped
    command: python weather_server.py
    ports: ["8092:8000"]
    environment:
      JWT_SECRET: "${JWT_SECRET}"
    networks: [sahool-net]
    <<: *logging
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  wofost-mcp:
    build:
      context: .
      dockerfile: services/mcp_servers/Dockerfile
    container_name: sahool-wofost-mcp
    restart: unless-stopped
    command: python wofost_server.py
    ports: ["8093:8000"]
    environment:
      JWT_SECRET: "${JWT_SECRET}"
    networks: [sahool-net]
    <<: *logging
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  market-mcp:
    build:
      context: .
      dockerfile: services/mcp_servers/Dockerfile
    container_name: sahool-market-mcp
    restart: unless-stopped
    command: python market_server.py
    ports: ["8094:8000"]
    environment:
      <<: *db-env
      JWT_SECRET: "${JWT_SECRET}"
      ODOO_BRIDGE_URL: "http://sahool-odoo-bridge:8126"
    depends_on:
      postgis: { condition: service_healthy }
    networks: [sahool-net]
    <<: *logging
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  edge-inference:
    build:
      context: .
      dockerfile: services/edge-inference/Dockerfile.arm64
    container_name: sahool-edge
    restart: unless-stopped
    ports: ["8100:8000"]
    environment:
      EDGE_DEVICE: "${EDGE_DEVICE:-rpi5}"
      OFFLINE_MODE: "${OFFLINE_MODE:-false}"
      SAHOOL_CLOUD_URL: "http://sahool-supervisor:8000"
      EDGE_SYNC_TOKEN: "${EDGE_SYNC_TOKEN}"
      AUTO_DOWNLOAD_MODELS: "true"
    volumes:
      - edge_data:/data
      - ./models:/models:ro
    networks: [sahool-net]
    <<: *logging
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  video-processor:
    build:
      context: .
      dockerfile: services/video-processor/Dockerfile
    container_name: sahool-video-processor
    restart: unless-stopped
    ports: ["8110:8000"]
    environment:
      MQTT_BROKER_URL: "mqtt://sahool-fastbee:1883"
      EDGE_INFERENCE_URL: "http://sahool-edge:8000"
      ZLMEDIA_API_URL: "http://sahool-zlmediakit:8080"
      REDIS_URL: "redis://sahool-redis:6379/3"
    depends_on:
      - fastbee
      - edge-inference
      - redis
    networks: [sahool-net]
    <<: *logging
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  actuator-service:
    build:
      context: .
      dockerfile: services/actuator-service/Dockerfile
    container_name: sahool-actuator
    restart: unless-stopped
    ports: ["8111:8000"]
    environment:
      <<: *db-env
      MQTT_BROKER_URL: "mqtt://sahool-fastbee:1883"
      JWT_SECRET: "${JWT_SECRET}"
    depends_on:
      - fastbee
      - postgis
      - redis
    networks: [sahool-net]
    <<: *logging
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  fastbee:
    image: registry.cn-chengdu.aliyuncs.com/fastbee/fastbee:latest
    container_name: sahool-fastbee
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8081:8080"
    environment:
      - DB_HOST=sahool-postgis
      - DB_PORT=5432
      - DB_NAME=fastbee
      - DB_USER=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - MQTT_ENABLED=true
      - MQTT_PORT=1883
    volumes:
      - fastbee_data:/app/data
    depends_on:
      postgis: { condition: service_healthy }
    networks: [sahool-net]
    <<: *logging
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  zlmediakit:
    image: panjjo/zlmediakit:v6.0.0  # pinned
    container_name: sahool-zlmediakit
    restart: unless-stopped
    ports:
      - "8082:8080"
      - "554:554"
      - "10000:10000/udp"
    volumes:
      - zlmediakit_data:/zlmediakit/data
    networks: [sahool-net]
    <<: *logging
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  local-ai-rag:
    build:
      context: .
      dockerfile: services/local-ai-rag/Dockerfile
    container_name: sahool-local-ai-rag
    restart: unless-stopped
    ports: ["8125:8000"]
    environment:
      OLLAMA_BASE_URL: "http://sahool-ollama:11434"
      LLM_MODEL: "${LLM_MODEL:-qwen3:32b}"
      EMBED_MODEL: "${EMBED_MODEL:-nomic-embed-text}"
      QDRANT_URL: "http://sahool-qdrant:6333"
      COLLECTION_NAME: "sahool_agri_kb"
      NUM_CTX: "${NUM_CTX:-8192}"
    depends_on:
      - qdrant
      - ollama
    networks: [sahool-net]
    <<: *logging
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  ollama:
    image: ollama/ollama:0.3.0  # HIGH-DOCKER-03: pinned
    container_name: sahool-ollama
    restart: unless-stopped
    ports: ["11434:11434"]
    volumes:
      - ollama_models:/root/.ollama
    networks: [sahool-net]
    <<: *logging
    healthcheck:
      # The ollama/ollama image bundles the `ollama` CLI (no curl). `ollama list`
      # talks to the local API and exits 0 once the server is ready.
      # Generous start_period: the server can be slow to come up on first run.
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  qdrant:
    image: qdrant/qdrant:v1.11.0  # HIGH-DOCKER-03: pinned
    container_name: sahool-qdrant
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY}"  # C-02 FIX
    restart: unless-stopped
    ports: ["127.0.0.1:6333:6333"]  # HIGH-DOCKER-01: localhost only
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [sahool-net]
    <<: *logging
    # NOTE: the official qdrant/qdrant image is DISTROLESS — no curl/wget/sh —
    # so an in-container HTTP healthcheck cannot run and would mark the
    # container permanently "unhealthy". We deliberately define NO healthcheck
    # here; dependents use plain depends_on (service_started). For a true
    # readiness gate, build a wrapper image adding a static healthcheck binary
    # (see report).

  agriai-engine:
    build:
      context: .
      dockerfile: services/agriai-engine/Dockerfile
    container_name: sahool-agriai-engine
    restart: unless-stopped
    ports: ["8127:8000"]
    environment:
      <<: *db-env
      JWT_SECRET: "${JWT_SECRET}"
      SENTINEL_HUB_MCP_URL: "http://sahool-sentinel-hub-mcp:8000"
      WEATHER_MCP_URL: "http://sahool-weather-mcp:8000"
      WOFOST_MCP_URL: "http://sahool-wofost-mcp:8000"
      EDGE_INFERENCE_URL: "http://sahool-edge:8000"
    depends_on:
      postgis: { condition: service_healthy }
    networks: [sahool-net]
    <<: *logging
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3


  # ── Odoo ERP Server (C-11 FIX) ──────────────────────────────
  sahool-odoo:
    image: odoo:17
    container_name: sahool-odoo
    restart: unless-stopped
    environment:
      HOST:     sahool-postgres
      USER:     "${DB_USER:-sahool_user}"
      PASSWORD: "${DB_PASSWORD}"
    ports:
      - "127.0.0.1:8069:8069"
    volumes:
      - odoo-filestore:/var/lib/odoo
    depends_on:
      sahool-postgres: { condition: service_healthy }
    networks: [sahool-net]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8069/web/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  odoo-bridge:
    build:
      context: .
      dockerfile: services/odoo-bridge/Dockerfile
    container_name: sahool-odoo-bridge
    restart: unless-stopped
    ports: ["8126:8000"]
    environment:
      <<: *db-env
      ODOO_URL: "${ODOO_URL:-http://odoo:8069}"
      ODOO_DB: "${ODOO_DB:-sahool_erp}"
      ODOO_USER: "${ODOO_USER:-admin}"
      ODOO_PASSWORD: "${ODOO_PASSWORD:?must be set in .env}"
      ODOO_API_KEY: "${ODOO_API_KEY}"
      SAHOOL_API_URL: "http://sahool-auth:8000"
      SAHOOL_AGENT_TOKEN: "${SAHOOL_AGENT_TOKEN}"
      SYNC_INTERVAL_SEC: "300"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET}"
    depends_on:
      postgis: { condition: service_healthy }
      auth-service: { condition: service_healthy }
    networks: [sahool-net]
    <<: *logging
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  telegram-bot:
    build:
      context: .
      dockerfile: bots/telegram/Dockerfile
    container_name: sahool-telegram-bot
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      SUPERVISOR_AGENT_URL: "http://sahool-supervisor:8000"
      AUTH_SERVICE_URL: "http://sahool-auth:8000"
      JWT_SECRET: "${JWT_SECRET}"
      REDIS_URL: "redis://sahool-redis:6379/2"
    depends_on:
      supervisor-agent: { condition: service_healthy }
      redis:             { condition: service_healthy }
    networks: [sahool-net]
    <<: *logging

  postgis:
    image: postgis/postgis:15-3.4
    container_name: sahool-postgis
    restart: unless-stopped
    ports: ["127.0.0.1:5432:5432"]  # HIGH-DOCKER-01: localhost only
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: sahool
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks: [sahool-net]
    <<: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sahool"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: sahool-redis
    restart: unless-stopped
    ports: ["127.0.0.1:6379:6379"]  # HIGH-DOCKER-01: localhost only
    environment:
      # expose the password inside the container so the healthcheck can
      # authenticate (redis-cli -a) and avoid NOAUTH failures.
      REDIS_PASSWORD: "${REDIS_PASSWORD:?must be set in .env}"
    # FIX: there were two `command:` keys — the second silently overrode the
    # first, so --requirepass was DROPPED and redis ran unauthenticated.
    # Merge persistence + auth into a single command.
    command: >
      redis-server --requirepass "${REDIS_PASSWORD:?must be set in .env}"
        --appendonly yes
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
    volumes: [redis_data:/data]
    networks: [sahool-net]
    <<: *logging
    healthcheck:
      # FIX: redis runs with --requirepass, so an unauthenticated PING returns
      # NOAUTH → unhealthy. Authenticate with -a before PING.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: sahool-minio
    restart: unless-stopped
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-sahool}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?must be set in .env}"
    command: server /data --console-address ":9001"
    volumes: [minio_data:/data]
    networks: [sahool-net]
    <<: *logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  nats:
    image: nats:2-alpine
    container_name: sahool-nats
    restart: unless-stopped
    ports: ["127.0.0.1:4222:4222"]  # HIGH-DOCKER-01: localhost only, "8222:8222"
    command: "--js --store_dir /data/jetstream --http_port 8222"
    networks: [sahool-net]
    <<: *logging
    healthcheck:
      # FIX: nats:2-alpine ships BusyBox wget, NOT curl — the old curl test
      # could never run → permanently unhealthy. Hit the monitoring port 8222
      # (enabled via --http_port 8222), not the 4222 client port.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
