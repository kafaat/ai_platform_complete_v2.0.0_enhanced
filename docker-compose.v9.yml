x-logging: &id001
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'
services:
  raster-tiler-service:
    build: ./services/raster-tiler-service
    environment:
    - PORT=8088
    ports:
    - 127.0.0.1:8088:8088
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/healthz',
        timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
  sahool-nginx:
    image: nginx:1.27-alpine
    mem_limit: 384m
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./nginx/nginx.v9.conf:/etc/nginx/templates/nginx.conf.template:ro
    - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
    - ./nginx/ssl:/etc/nginx/ssl:ro
    - nginx-cache:/var/cache/nginx
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: DOMAIN|SAHOOL_AGENT_TOKEN
      DOMAIN: ${DOMAIN:-localhost}
      SAHOOL_AGENT_TOKEN: ${SAHOOL_AGENT_TOKEN:-}
    depends_on:
      sahool-auth:
        condition: service_healthy
      sahool-supervisor-agent:
        condition: service_healthy
      sahool-guardrails-engine:
        condition: service_healthy
      sahool-vegetation-analysis:
        condition: service_healthy
      sahool-indicators-service:
        condition: service_healthy
      sahool-weather-service:
        condition: service_healthy
      sahool-market-mcp:
        condition: service_healthy
      sahool-erp-bridge:
        condition: service_healthy
      sahool-local-ai-rag:
        condition: service_healthy
      sahool-rag-retrieval:
        condition: service_healthy
      sahool-knowledge-graph:
        condition: service_healthy
      sahool-ai-agronomist:
        condition: service_healthy
      sahool-tts-service:
        condition: service_healthy
      sahool-video-processor:
        condition: service_healthy
      sahool-agriai-engine:
        condition: service_healthy
    networks:
    - sahool-public
    - sahool-internal
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost/healthz
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
  sahool-video-processor:
    build:
      context: .
      dockerfile: services/video-processor/Dockerfile
    mem_limit: 768m
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    environment:
      MQTT_BROKER_URL: mqtt://sahool-fastbee:1883
      EDGE_INFERENCE_URL: http://sahool-edge:8100
      ZLMEDIA_API_URL: http://sahool-zlmediakit:80
      ZLMEDIAKIT_API_SECRET: ${ZLMEDIAKIT_API_SECRET:-sahool-zlm-dev-secret}
      REDIS_URL: redis://:${REDIS_PASSWORD}@sahool-redis:6379/3
      JWT_SECRET: ${JWT_SECRET}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      SAHOOL_AGENT_TOKEN: ${SAHOOL_AGENT_TOKEN:-}
      FRAME_INTERVAL_SEC: ${FRAME_INTERVAL_SEC:-5}
      MAX_CONCURRENT_STREAMS: ${MAX_CONCURRENT_STREAMS:-10}
    depends_on:
      sahool-fastbee:
        condition: service_healthy
      sahool-edge:
        condition: service_healthy
      sahool-redis:
        condition: service_healthy
      sahool-zlmediakit:
        condition: service_healthy
    networks:
      sahool-internal:
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/healthz
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s
  sahool-agriai-engine:
    build:
      context: .
      dockerfile: services/agriai-engine/Dockerfile
    mem_limit: 512m
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      SAHOOL_AGENT_TOKEN: ${SAHOOL_AGENT_TOKEN:-}
      SENTINEL_HUB_MCP_URL: http://sahool-sentinel-hub-mcp:8000
      WEATHER_MCP_URL: http://sahool-weather-mcp:8000
      WOFOST_MCP_URL: http://sahool-wofost-mcp:8000
      EDGE_INFERENCE_URL: http://sahool-edge:8100
    depends_on:
      sahool-postgres:
        condition: service_healthy
      sahool-migrate:
        condition: service_completed_successfully
      sahool-sentinel-hub-mcp:
        condition: service_healthy
      sahool-weather-mcp:
        condition: service_healthy
      sahool-wofost-mcp:
        condition: service_healthy
      sahool-edge:
        condition: service_healthy
    networks:
      sahool-internal:
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/healthz
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s
  sahool-tts-service:
    build:
      context: .
      dockerfile: services/tts-service/Dockerfile
    mem_limit: 512m
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@sahool-redis:6379/2
      JWT_SECRET: ${JWT_SECRET}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      SAHOOL_AGENT_TOKEN: ${SAHOOL_AGENT_TOKEN:-}
      SAHOOL_ENV: ${SAHOOL_ENV:-development}
      TTS_CACHE_TTL: ${TTS_CACHE_TTL:-86400}
      TTS_MAX_TEXT_LEN: ${TTS_MAX_TEXT_LEN:-1000}
    depends_on:
      sahool-redis:
        condition: service_healthy
    networks:
      sahool-internal:
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/healthz
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s
  sahool-postgres:
    image: postgis/postgis:15-3.4
    mem_limit: 1g
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    ports:
    - 127.0.0.1:5432:5432
    environment:
      POSTGRES_DB: sahool
      POSTGRES_USER: sahool_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    networks:
    - sahool-internal
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U sahool_user -d sahool
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
  sahool-redis:
    image: redis:7-alpine
    mem_limit: 384m
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    command: 'redis-server --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD required}"
      --maxmemory 256mb --maxmemory-policy allkeys-lru

      '
    volumes:
    - redis-data:/data
    networks:
    - sahool-internal
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  sahool-nats:
    image: nats:2-alpine
    mem_limit: 384m
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    command:
    - -c
    - /etc/nats/nats.conf
    volumes:
    - nats-js:/data/jetstream
    - ./nats/nats.conf:/etc/nats/nats.conf:ro
    networks:
    - sahool-internal
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:8222/healthz || exit 1
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 60s
  sahool-minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2024-10-13T13-34-11Z}
    mem_limit: 384m
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    ports:
    - 127.0.0.1:9000:9000
    - 127.0.0.1:9001:9001
    environment:
      MINIO_ROOT_USER: sahool-admin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
    command: server /data --console-address ":9001"
    volumes:
    - minio-data:/data
    networks:
    - sahool-internal
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 60s
  sahool-qdrant:
    image: qdrant/qdrant:v1.17.1
    mem_limit: 2g
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY required}
    volumes:
    - qdrant-storage:/qdrant/storage
    networks:
    - sahool-internal
  sahool-ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.3.14}
    mem_limit: 4g
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
    volumes:
    - ollama-models:/root/.ollama
    networks:
    - sahool-internal
    healthcheck:
      test:
      - CMD
      - ollama
      - list
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  sahool-migrate:
    image: postgis/postgis:15-3.4
    restart: 'no'
    logging: *id001
    environment:
      PGHOST: sahool-postgres
      PGPORT: 5432
      PGUSER: sahool_user
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      PGDATABASE: sahool
      APP_DB_ROLE: ${APP_DB_ROLE:-sahool_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD required}
      JOBS_DB_ROLE: ${JOBS_DB_ROLE:-sahool_jobs}
      JOBS_DB_PASSWORD: ${JOBS_DB_PASSWORD:?JOBS_DB_PASSWORD required}
    volumes:
    - ./migrations:/migrations:ro
    command:
    - bash
    - /migrations/apply_in_compose.sh
    depends_on:
      sahool-postgres:
        condition: service_healthy
    networks:
    - sahool-internal
  sahool-auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    mem_limit: 512m
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      REDIS_URL: redis://:${REDIS_PASSWORD}@sahool-redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required — min 32 chars}
      JWT_EXPIRE_MINUTES: 60
      REFRESH_EXPIRE_DAYS: 30
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD required}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@sahool.ye}
      FRONTEND_URL: ${FRONTEND_URL:-https://app.sahool.ye}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      sahool-postgres:
        condition: service_healthy
      sahool-redis:
        condition: service_healthy
      sahool-migrate:
        condition: service_completed_successfully
    networks:
    - sahool-internal
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/readyz
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
  sahool-platform:
    build: &id002
      context: .
      dockerfile: services/sahool-platform/Dockerfile
    mem_limit: 1g
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    environment:
      SAHOOL_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required — min 32 chars}
      SAHOOL_ENV: ${SAHOOL_ENV:-production}
      SAHOOL_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required — min 32 chars}
      DATABASE_URL: ${DATABASE_URL:-postgresql://sahool_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD
        required}@sahool-postgres:5432/sahool}
      JOBS_DATABASE_URL: ${JOBS_DATABASE_URL:-postgresql://sahool_jobs:${JOBS_DB_PASSWORD:?JOBS_DB_PASSWORD
        required}@sahool-postgres:5432/sahool}
      REDIS_URL: redis://:${REDIS_PASSWORD}@sahool-redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RASTER_SERVICE_URL: ${RASTER_SERVICE_URL:-http://sahool-raster-service:8001}
      WEATHER_SERVICE_URL: ${WEATHER_SERVICE_URL:-http://sahool-weather-service:8000}
      SOIL_SERVICE_URL: ${SOIL_SERVICE_URL:-http://sahool-soil-service:8000}
      SAHOOL_AGENT_TOKEN: ${SAHOOL_AGENT_TOKEN:?SAHOOL_AGENT_TOKEN required}
      SEGMENTATION_URL: ${SEGMENTATION_URL:-http://sahool-field-segmentation:8000}
      RAG_RETRIEVAL_URL: ${RAG_RETRIEVAL_URL:-http://sahool-rag-retrieval:8000}
      KNOWLEDGE_GRAPH_URL: ${KNOWLEDGE_GRAPH_URL:-http://sahool-knowledge-graph:8000}
      AI_AGRONOMIST_URL: ${AI_AGRONOMIST_URL:-http://sahool-ai-agronomist:8000}
      FEATURE_PORTFOLIO_COMMAND: ${FEATURE_PORTFOLIO_COMMAND:-0}
      FEATURE_DEVICE_TWIN: ${FEATURE_DEVICE_TWIN:-0}
      FEATURE_DELTA_SYNC: ${FEATURE_DELTA_SYNC:-0}
      FEATURE_NATURAL_LANGUAGE_GIS: ${FEATURE_NATURAL_LANGUAGE_GIS:-0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NL_SQL_MODEL: ${NL_SQL_MODEL:-claude-opus-4-8}
      FEATURE_DECISION_STUDIO: ${FEATURE_DECISION_STUDIO:-0}
      FEATURE_OPERATIONS_WALL: ${FEATURE_OPERATIONS_WALL:-0}
      FEATURE_REPLAY_MAP: ${FEATURE_REPLAY_MAP:-0}
      FEATURE_EVIDENCE_MAP: ${FEATURE_EVIDENCE_MAP:-0}
      FEATURE_LEARNING_DASHBOARD: ${FEATURE_LEARNING_DASHBOARD:-0}
      FEATURE_DECISION_CONFIDENCE: ${FEATURE_DECISION_CONFIDENCE:-0}
      FEATURE_UNIFIED_LINEAGE: ${FEATURE_UNIFIED_LINEAGE:-0}
      FEATURE_GIS_KERNEL: ${FEATURE_GIS_KERNEL:-0}
      FEATURE_IRRIGATION_NETWORK: ${FEATURE_IRRIGATION_NETWORK:-0}
      FEATURE_EXECUTION_FEEDBACK: ${FEATURE_EXECUTION_FEEDBACK:-0}
      # RS256: عيّن JWT_PUBLIC_KEY (مفتاح auth العامّ PEM) للإنتاج الحقيقيّ.
      # للترحيل المؤقّت (HS256): أضِف SAHOOL_ALLOW_HS256_IN_PROD=1 في ملفّ .env
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      SAHOOL_ALLOW_HS256_IN_PROD: ${SAHOOL_ALLOW_HS256_IN_PROD:-}
    depends_on:
      sahool-postgres:
        condition: service_healthy
      sahool-redis:
        condition: service_healthy
      sahool-migrate:
        condition: service_completed_successfully
      sahool-field-segmentation:
        condition: service_started
    networks:
    - sahool-internal
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/readyz
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
  sahool-weather-polygon-worker:
    build:
      context: .
      dockerfile: services/weather-polygon-worker/Dockerfile
    restart: unless-stopped
    logging: *id001
    environment:
      JOBS_DATABASE_URL: ${JOBS_DATABASE_URL:-postgresql://sahool_jobs:${JOBS_DB_PASSWORD:?JOBS_DB_PASSWORD
        required}@sahool-postgres:5432/sahool}
      DATABASE_URL: ${DATABASE_URL:-postgresql://sahool_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD
        required}@sahool-postgres:5432/sahool}
      NATS_URL: nats://sahool-nats:4222
      WEATHER_HORIZON_HOURS: ${WEATHER_HORIZON_HOURS:-168}
      # احتياط اتّجاه الرياح من MET Norway حين يغيب من Open-Meteo (بدل قيمة وهميّة).
      METNO_WIND_FALLBACK_ENABLED: ${METNO_WIND_FALLBACK_ENABLED:-1}
      METNO_USER_AGENT: ${METNO_USER_AGENT:-SAHOOL-AgriPlatform/1.0 (https://sahool.ye; ops@sahool.ye)}
    depends_on:
      sahool-postgres:
        condition: service_healthy
      sahool-nats:
        condition: service_started
      sahool-migrate:
        condition: service_completed_successfully
    networks:
    - sahool-internal
    healthcheck:
      test:
      - CMD
      - python
      - /app/worker_health_probe.py
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 40s
  sahool-weather-signal-engine:
    build:
      context: .
      dockerfile: services/weather-signal-engine/Dockerfile
    restart: unless-stopped
    logging: *id001
    environment:
      JOBS_DATABASE_URL: ${JOBS_DATABASE_URL:-postgresql://sahool_jobs:${JOBS_DB_PASSWORD:?JOBS_DB_PASSWORD
        required}@sahool-postgres:5432/sahool}
      DATABASE_URL: ${DATABASE_URL:-postgresql://sahool_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD
        required}@sahool-postgres:5432/sahool}
      WEATHER_SIGNAL_INTERVAL_SEC: ${WEATHER_SIGNAL_INTERVAL_SEC:-300}
    depends_on:
      sahool-postgres:
        condition: service_healthy
      sahool-migrate:
        condition: service_completed_successfully
    networks:
    - sahool-internal
    healthcheck:
      test:
      - CMD
      - python
      - /app/worker_health_probe.py
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 40s
  sahool-supervisor-agent:
    build:
      context: .
      dockerfile: services/supervisor-agent/Dockerfile
    mem_limit: 768m
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    ports:
    - 127.0.0.1:8096:8000
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MCP_SENTINEL_HUB_URL: http://sahool-sentinel-hub-mcp:8000/mcp/v1
      MCP_WEATHER_URL: http://sahool-weather-mcp:8000/mcp/v1
      MCP_WOFOST_URL: http://sahool-wofost-mcp:8000/mcp/v1
      MCP_MARKET_URL: http://sahool-market-mcp:8000/mcp/v1
      SAHOOL_AGENT_TOKEN: ${SAHOOL_AGENT_TOKEN:?SAHOOL_AGENT_TOKEN required}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      sahool-auth:
        condition: service_healthy
    networks:
    - sahool-internal
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/readyz
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 30s
  sahool-guardrails-engine:
    build:
      context: .
      dockerfile: services/guardrails-engine/Dockerfile
    mem_limit: 384m
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    ports:
    - 127.0.0.1:8097:8000
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@sahool-redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      SAHOOL_AGENT_TOKEN: ${SAHOOL_AGENT_TOKEN:?SAHOOL_AGENT_TOKEN required}
    depends_on:
      sahool-postgres:
        condition: service_healthy
      sahool-redis:
        condition: service_healthy
    networks:
    - sahool-internal
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/readyz
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
  sahool-sentinel-hub-mcp:
    build:
      context: .
      dockerfile: services/mcp_servers/Dockerfile
    mem_limit: 384m
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    environment:
      SH_CLIENT_ID: ${SH_CLIENT_ID:?SH_CLIENT_ID required}
      SH_CLIENT_SECRET: ${SH_CLIENT_SECRET:?SH_CLIENT_SECRET required}
      JWT_SECRET: ${JWT_SECRET}
    networks:
    - sahool-internal
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/healthz
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 30s
  sahool-weather-mcp:
    build:
      context: .
      dockerfile: services/mcp_servers/Dockerfile
    mem_limit: 384m
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    environment:
      JWT_SECRET: ${JWT_SECRET}
    networks:
    - sahool-internal
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/healthz
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 30s
  sahool-wofost-mcp:
    build:
      context: .
      dockerfile: services/mcp_servers/Dockerfile
    mem_limit: 384m
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    environment:
      JWT_SECRET: ${JWT_SECRET}
    networks:
    - sahool-internal
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/healthz
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 30s
  sahool-market-mcp:
    build:
      context: .
      dockerfile: services/mcp_servers/Dockerfile
