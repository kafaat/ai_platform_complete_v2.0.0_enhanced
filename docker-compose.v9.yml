x-logging: &id001
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'
# CT-06 (تدقيق الحاويات V21 §2.1+§2.2): كان الفحص القائم على وجود متغيّر بيئة (``&id002``:
# ``DATABASE_URL``/``JOBS_DATABASE_URL``) مُشتركاً عبر عمّال phase-runtime وعامِلَي الراستر.
# حُوِّل كلّ عامل (الخمسة + الراستريّان) إلى نبضة قدرة-واعية تُثبِت تحرّك الحلقة لا مجرّد وجود
# متغيّر، فلم يبقَ أيّ مُشير إلى ``*id002`` وأُزيلت المرساة اليتيمة (لا كتلة ميّتة في المخطّط).
services:
  raster-tiler-service:
    build:
      context: .
      dockerfile: services/raster-tiler-service/Dockerfile
      args:
        SAHOOL_GIT_SHA: ${TESTED_SHA:?TESTED_SHA required for immutable build identity}
        SAHOOL_BUILD_ID: ${SAHOOL_BUILD_ID:?SAHOOL_BUILD_ID required for immutable build identity}
        SAHOOL_SOURCE_REPOSITORY: ${GITHUB_REPOSITORY:-local/unknown}
        SAHOOL_SOURCE_REF: ${GITHUB_REF:-local}
    security_opt:
    - no-new-privileges:true
    environment:
    - PORT=8088
    ports:
    - 127.0.0.1:8088:8088
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/healthz',
        timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
  sahool-nginx:
    image: nginx:1.27-alpine
    mem_limit: 384m
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./nginx/nginx.v9.conf:/etc/nginx/templates/nginx.conf.template:ro
    - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
    - ./nginx/ssl:/etc/nginx/ssl:ro
    - nginx-cache:/var/cache/nginx
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      # SEASON-RECORD-ENTRY-01 3b: أضِف SEASON_ENTRY_SERVICE_TOKEN كي يُستبدَل في القالب.
      # الفلتر يقصر الاستبدال على هذه الأسماء فقط — متغيّرات nginx وقت التشغيل تبقى كما هي.
      NGINX_ENVSUBST_FILTER: DOMAIN|SAHOOL_AGENT_TOKEN|SEASON_ENTRY_SERVICE_TOKEN
      DOMAIN: ${DOMAIN:-localhost}
      SAHOOL_AGENT_TOKEN: ${SAHOOL_AGENT_TOKEN:?SAHOOL_AGENT_TOKEN required}
      # توكن خدمة قناة المواسم (تُحقنه البوّابة upstream نحو scout-ingest). فارغ محلّيّاً ⇒ الخدمة
      # ترفض (SEASON_ENTRY_ENABLED=0 افتراضاً) — نمط READ_TOKEN، لا سرّ بقيمة في compose.
      SEASON_ENTRY_SERVICE_TOKEN: ${SEASON_ENTRY_SERVICE_TOKEN:-}
      EDGE_READINESS_MODE: ${EDGE_READINESS_MODE:-partial}
      EDGE_PRODUCTION_REQUIRED: ${EDGE_PRODUCTION_REQUIRED:-false}
    depends_on:
      sahool-auth:
        condition: service_healthy
      sahool-supervisor-agent:
        condition: service_healthy
      sahool-guardrails-engine:
        condition: service_healthy
      sahool-vegetation-analysis:
        condition: service_healthy
      sahool-indicators-service:
        condition: service_healthy
      sahool-weather-service:
        condition: service_healthy
      sahool-market-mcp:
        condition: service_healthy
      sahool-erp-bridge:
        condition: service_healthy
      sahool-local-ai-rag:
        condition: service_healthy
      sahool-rag-retrieval:
        condition: service_healthy
      sahool-knowledge-graph:
        condition: service_healthy
      sahool-ai-agronomist:
        condition: service_healthy
      sahool-tts-service:
        condition: service_healthy
      sahool-video-processor:
        condition: service_healthy
      sahool-agriai-engine:
        condition: service_healthy
      sahool-remote-sensing-workspace-bff:
        condition: service_healthy
    networks:
    - sahool-public
    - sahool-internal
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost/healthz
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
  sahool-video-processor:
    build:
      context: .
      dockerfile: services/video-processor/Dockerfile
    mem_limit: 768m
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    environment:
      MQTT_BROKER_URL: mqtt://sahool-fastbee:1883
      MQTT_USERNAME: ${MQTT_USERNAME:?MQTT_USERNAME required — anonymous MQTT disabled (allow_anonymous false)}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?MQTT_PASSWORD required — anonymous MQTT disabled (allow_anonymous false)}
      EDGE_INFERENCE_URL: http://sahool-edge:8100
      ZLMEDIA_API_URL: http://sahool-zlmediakit:80
      ZLMEDIAKIT_API_SECRET: ${ZLMEDIAKIT_API_SECRET:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@sahool-redis:6379/3
      JWT_SECRET: ${JWT_SECRET}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      SAHOOL_AGENT_TOKEN: ${SAHOOL_AGENT_TOKEN:?SAHOOL_AGENT_TOKEN required}
      EDGE_READINESS_MODE: ${EDGE_READINESS_MODE:-partial}
      EDGE_PRODUCTION_REQUIRED: ${EDGE_PRODUCTION_REQUIRED:-false}
      FRAME_INTERVAL_SEC: ${FRAME_INTERVAL_SEC:-5}
      MAX_CONCURRENT_STREAMS: ${MAX_CONCURRENT_STREAMS:-10}
    depends_on:
      sahool-fastbee:
        condition: service_healthy
      sahool-edge:
        condition: service_healthy
      sahool-redis:
        condition: service_healthy
      sahool-zlmediakit:
        condition: service_healthy
    networks:
      sahool-internal: null
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/healthz
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s
  sahool-agriai-engine:
    build:
      context: .
      dockerfile: services/agriai-engine/Dockerfile
      args:
        SAHOOL_GIT_SHA: ${TESTED_SHA:?TESTED_SHA required for immutable build identity}
        SAHOOL_BUILD_ID: ${SAHOOL_BUILD_ID:?SAHOOL_BUILD_ID required for immutable build identity}
        SAHOOL_SOURCE_REPOSITORY: ${GITHUB_REPOSITORY:-local/unknown}
        SAHOOL_SOURCE_REF: ${GITHUB_REF:-local}
    mem_limit: 512m
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      SAHOOL_AGENT_TOKEN: ${SAHOOL_AGENT_TOKEN:?SAHOOL_AGENT_TOKEN required}
      # Agronomic-context strictness (soil P0). Set AGRIAI_STRICT_CONTEXT=false in .env if the
      # stack runs before agronomic context/soil profiles are populated.
      AGRIAI_STRICT_CONTEXT: ${AGRIAI_STRICT_CONTEXT:-false}
      AGRIAI_PRODUCTION_MODE: ${AGRIAI_PRODUCTION_MODE:-false}
      EDGE_READINESS_MODE: ${EDGE_READINESS_MODE:-partial}
      EDGE_PRODUCTION_REQUIRED: ${EDGE_PRODUCTION_REQUIRED:-false}
      SENTINEL_HUB_MCP_URL: http://sahool-sentinel-hub-mcp:8000
      WEATHER_MCP_URL: http://sahool-weather-mcp:8000
      WOFOST_MCP_URL: http://sahool-wofost-mcp:8000
      EDGE_INFERENCE_URL: http://sahool-edge:8100
    depends_on:
      sahool-postgres:
        condition: service_healthy
      sahool-migrate:
        condition: service_completed_successfully
      sahool-sentinel-hub-mcp:
        condition: service_healthy
      sahool-weather-mcp:
        condition: service_healthy
      sahool-wofost-mcp:
        condition: service_healthy
      sahool-edge:
        condition: service_healthy
    networks:
      sahool-internal: null
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/healthz
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s
  sahool-tts-service:
    build:
      context: .
      dockerfile: services/tts-service/Dockerfile
    mem_limit: 512m
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@sahool-redis:6379/2
      JWT_SECRET: ${JWT_SECRET}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      SAHOOL_AGENT_TOKEN: ${SAHOOL_AGENT_TOKEN:?SAHOOL_AGENT_TOKEN required}
      EDGE_READINESS_MODE: ${EDGE_READINESS_MODE:-partial}
      EDGE_PRODUCTION_REQUIRED: ${EDGE_PRODUCTION_REQUIRED:-false}
      SAHOOL_ENV: ${SAHOOL_ENV:-development}
      TTS_CACHE_TTL: ${TTS_CACHE_TTL:-86400}
      TTS_MAX_TEXT_LEN: ${TTS_MAX_TEXT_LEN:-1000}
    depends_on:
      sahool-redis:
        condition: service_healthy
    networks:
      sahool-internal: null
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/healthz
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s
  sahool-postgres:
    image: postgis/postgis:15-3.4
    mem_limit: 1g
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    ports:
    - 127.0.0.1:5432:5432
    environment:
      POSTGRES_DB: sahool
      POSTGRES_USER: sahool_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    networks:
    - sahool-internal
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U sahool_user -d sahool
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
  sahool-redis:
    image: redis:7-alpine
    mem_limit: 384m
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    command: 'redis-server --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD required}"
      --maxmemory 256mb --maxmemory-policy allkeys-lru

      '
    volumes:
    - redis-data:/data
    networks:
    - sahool-internal
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  sahool-redis-state:
    # حزمة 72 ساعة (ST-P1-04/Redis): حالة أمنيّة (denylist/reset/MFA/lockout)
    # منفصلة عن الكاش — noeviction + AOF؛ الطرد هنا كان يمحو مفاتيح أمنيّة.
    image: redis:7-alpine
    mem_limit: 384m
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    command: 'redis-server --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD required}"
      --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes

      '
    volumes:
    - redis-state-data:/data
    networks:
    - sahool-internal
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  sahool-nats:
    image: nats:2-alpine
    mem_limit: 384m
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    command:
    - -c
    - /etc/nats/nats.conf
    volumes:
    - nats-js:/data/jetstream
    - ./nats/nats.conf:/etc/nats/nats.conf:ro
    networks:
    - sahool-internal
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:8222/healthz || exit 1
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 60s
  sahool-minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    mem_limit: 384m
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    ports:
    - 127.0.0.1:9000:9000
    - 127.0.0.1:9001:9001
    environment:
      # Single source of truth: .env/secret injection. Do not hardcode a different
      # root user here; otherwise backend S3 clients using MINIO_ACCESS_KEY/S3_*
      # authenticate with a credential different from the running MinIO root
      # (enforced by scripts/ci/minio_s3_contract_gate.py).
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sahool-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
    command: server /data --console-address ":9001"
    volumes:
    - minio-data:/data
    networks:
    - sahool-internal
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 60s
  sahool-minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-04-16T18-13-26Z}
    restart: "no"
    security_opt:
    - no-new-privileges:true
    environment:
      MINIO_ENDPOINT: http://sahool-minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sahool-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
      SCOUT_INGEST_S3_ACCESS_KEY: ${SCOUT_INGEST_S3_ACCESS_KEY:?SCOUT_INGEST_S3_ACCESS_KEY required}
      SCOUT_INGEST_S3_SECRET_KEY: ${SCOUT_INGEST_S3_SECRET_KEY:?SCOUT_INGEST_S3_SECRET_KEY required}
      RASTER_S3_ACCESS_KEY: ${RASTER_S3_ACCESS_KEY:?RASTER_S3_ACCESS_KEY required}
      RASTER_S3_SECRET_KEY: ${RASTER_S3_SECRET_KEY:?RASTER_S3_SECRET_KEY required}
    entrypoint: ["/bin/sh", "/provision.sh"]
    volumes:
    - ./scripts/minio/provision.sh:/provision.sh:ro
    - ./deploy/minio/policies:/policies:ro
    depends_on:
      sahool-minio:
        condition: service_healthy
    networks:
    - sahool-internal
  sahool-qdrant:
    image: qdrant/qdrant:v1.17.1
    mem_limit: 2g
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY required}
    volumes:
    - qdrant-storage:/qdrant/storage
    networks:
    - sahool-internal
    # NO in-container healthcheck: qdrant/qdrant is DISTROLESS (no shell/curl/wget),
    # so any CMD-SHELL/bash probe can never run and marks the container permanently
    # "unhealthy", cascading to every service_healthy dependent (RAG/seed). Dependents
    # gate on service_started; a real readiness probe belongs in a sidecar or the RAG
    # service's own retry/backoff — not a self-healthcheck in the distroless image.
  sahool-ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.3.14}
    mem_limit: 4g
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
    volumes:
    - ollama-models:/root/.ollama
    networks:
    - sahool-internal
    healthcheck:
      test:
      - CMD
      - ollama
      - list
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  sahool-vllm-jais:
    # Internal OpenAI-compatible inference runtime for Jais Natural Farmer.
    # Opt-in only; infrastructure, never retrieval/decision/field authority.
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.26.0}
    profiles:
    - vllm
    ipc: host
    # حرفيّ لا متغيّر بيئة: بوّابة *Validate Docker Compose* تكتب `.ci.env` تُسنِد لكلّ متغيّر
    # مُشار إليه قيمةً وهميّةً نصّيّة، و`mem_limit` حقلٌ عدديّ — فالاستبدال يُنتِج
    # `strconv.ParseFloat: invalid syntax` ويُسقِط الملفّ كلّه. وهو أيضاً النمط الوحيد
    # الشاذّ هنا: بقيّة الخدمات (٥٩) تُصرّح mem_limit حرفيّاً.
    mem_limit: 24g
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    command:
    - --model
    - ${VLLM_MODEL_REPOSITORY:-Solshine/Jais-adapted-7B-Reflection-Tuning-Natural-Farmer}
    - --served-model-name
    - ${VLLM_MODEL:-jais-natural-farmer}
    - --host
    - 0.0.0.0
    - --port
    - "8000"
    - --dtype
    - ${VLLM_DTYPE:-auto}
    - --max-model-len
    - ${VLLM_MAX_MODEL_LEN:-4096}
    - --gpu-memory-utilization
    - ${VLLM_GPU_MEMORY_UTILIZATION:-0.70}
    - --tensor-parallel-size
    - ${VLLM_TENSOR_PARALLEL_SIZE:-1}
    - --api-key
    - ${VLLM_API_KEY:-sahool-vllm-local}
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
    volumes:
    - huggingface-cache:/root/.cache/huggingface
    networks:
    - sahool-internal
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
  sahool-migrate:
    image: postgis/postgis:15-3.4
    restart: 'no'
    logging: *id001
    environment:
      PGHOST: sahool-postgres
      PGPORT: 5432
      PGUSER: sahool_user
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      PGDATABASE: sahool
      APP_DB_ROLE: ${APP_DB_ROLE:-sahool_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD required}
      JOBS_DB_ROLE: ${JOBS_DB_ROLE:-sahool_jobs}
      JOBS_DB_PASSWORD: ${JOBS_DB_PASSWORD:?JOBS_DB_PASSWORD required}
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD:?INGEST_DB_PASSWORD required}
    volumes:
    - ./migrations:/migrations:ro
    command:
    - bash
    - /migrations/apply_in_compose.sh
    depends_on:
      sahool-postgres:
        condition: service_healthy
    networks:
    - sahool-internal
  sahool-auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
      args:
        SAHOOL_GIT_SHA: ${TESTED_SHA:?TESTED_SHA required for immutable build identity}
        SAHOOL_BUILD_ID: ${SAHOOL_BUILD_ID:?SAHOOL_BUILD_ID required for immutable build identity}
        SAHOOL_SOURCE_REPOSITORY: ${GITHUB_REPOSITORY:-local/unknown}
        SAHOOL_SOURCE_REF: ${GITHUB_REF:-local}
    mem_limit: 512m
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      REDIS_URL: redis://:${REDIS_PASSWORD}@sahool-redis-state:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required — min 32 chars}
      # RS256 (غير متماثل، الموصى به): auth يوقّع بالمفتاح الخاصّ والخدمات تتحقّق بالعامّ.
      # لا بدّ أن تُعرَّض هذه هنا كي يكون مسار RS256 قابلاً للضبط على المُوقِّع نفسه — وإلّا
      # ضبطُ JWT_PUBLIC_KEY لمنصّةٍ (RS256) مع بقاء auth بلا مفتاح خاصّ (HS256) ⇒ عدم تطابق
      # خوارزميّة (InvalidAlgorithmError → 401 في التطوير، رفض إقلاع في الإنتاج). تطابق أسماء
      # متغيّرات sahool-platform (JWT_PUBLIC_KEY/SAHOOL_ALLOW_HS256_IN_PROD) — عقد مشترَك متماثل.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      SAHOOL_ALLOW_HS256_IN_PROD: ${SAHOOL_ALLOW_HS256_IN_PROD:-}
      # كوكي مصادقة البلاطات HttpOnly `sahool_at` (تُرسَل تلقائيّاً مع <img> فتُغني عن JWT في
      # الرابط). Secure=1 افتراضاً (صحيح لإنتاج HTTPS). ⚠️ نشرٌ عبر HTTP عاديّ (محلّيّ/staging)
      # يجب أن يضبط AUTH_COOKIE_SECURE=0 وإلّا لا يُرسِل المتصفّح الكوكي ⇒ بوّابة /api/raster
      # ترفض بلاطات <img> بـ403 في بناء الإنتاج (لا fallback لتوكن الرابط). انظر auth main.py:81.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-auto}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      JWT_EXPIRE_MINUTES: 60
      REFRESH_EXPIRE_DAYS: 30
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD required}
