  # مُهيّئ إعداد ZLMediaKit: صورة zlmediakit تولّد api.secret عشوائيّاً عند الإقلاع ولا
  # تقرأ ZLM_API_SECRET ⇒ video-processor لا يستطيع التحكّم بالبثّ (يردّ -100). هذا المُهيّئ
  # ينسخ config الصورة الافتراضيّ (كلّ الإعدادات + الشهادات) إلى حجم مشترك مرّة واحدة، ثمّ
  # يثبّت [api] secret. المُشغّل الرئيسيّ يركّب الحجم بلا تغيير entrypoint ⇒ لا خطر كسر إقلاع.
  sahool-zlmediakit-config:
    image: ${ZLMEDIAKIT_IMAGE:-zlmediakit/zlmediakit:master}
    container_name: sahool-v9-zlmediakit-config
    restart: "no"
    environment:
      ZLM_API_SECRET: ${ZLMEDIAKIT_API_SECRET:-sahool-zlm-dev-secret}
    entrypoint:
    - /bin/sh
    - -c
    - |
      set -e
      if [ ! -f /conf/.sahool_init ]; then cp -a /opt/media/conf/. /conf/ && touch /conf/.sahool_init; fi
      sed -i "s|^secret=.*|secret=${ZLM_API_SECRET}|" /conf/config.ini || true
      echo "zlmediakit config: [api] secret pinned"
    volumes:
    - zlm-conf:/conf
    networks:
    - sahool-internal
  sahool-zlmediakit:
    image: ${ZLMEDIAKIT_IMAGE:-zlmediakit/zlmediakit:master}
    container_name: sahool-v9-zlmediakit
    mem_limit: 768m
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    environment:
      TZ: ${TZ:-UTC}
      ZLM_API_SECRET: ${ZLMEDIAKIT_API_SECRET:-sahool-zlm-dev-secret}
    depends_on:
      sahool-zlmediakit-config:
        condition: service_completed_successfully
    volumes:
    # الإعداد المُثبَّت السرّ (من المُهيّئ) بدل العشوائيّ ⇒ تحكّم فعليّ بالبثّ.
    - zlm-conf:/opt/media/conf
    ports:
    # HTTP/API host port moved 8088 -> 8188: 8088 is already taken by
    # raster-tiler-service (127.0.0.1:8088:8088). Internal callers use the
    # container name (sahool-zlmediakit:80), so only the local dev/test port changes.
    - 127.0.0.1:8188:80
    - 127.0.0.1:8554:554
    - 127.0.0.1:1935:1935
    - 127.0.0.1:10000:10000/udp
    networks:
      sahool-internal:
    healthcheck:
      test:
      - CMD-SHELL
      - (wget -q -O- http://localhost/index/api/getMediaList >/dev/null 2>&1 || curl
        -fsS http://localhost/index/api/getMediaList >/dev/null 2>&1)
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
networks:
  sahool-public:
    driver: bridge
  sahool-internal:
    driver: bridge
    internal: false
volumes:
  postgres-data: null
  raster-data: null
  redis-data: null
  fastbee-data: null
  nats-js: null
  minio-data: null
  qdrant-storage: null
  kg-storage: null
  ollama-models: null
  edge-models: null
  edge-sync: null
  odoo-web-data: null
  odoo-config: null
  odoo-addons: null
  prometheus-data: null
  alertmanager-data: null
  grafana-data: null
  jaeger-data: null
  nginx-cache: null
  zlm-conf: null
