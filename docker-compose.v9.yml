      SAHOOL_API_URL: http://sahool-auth:8000
    depends_on:
      sahool-postgres:
        condition: service_healthy
      sahool-redis:
        condition: service_healthy
      sahool-nats:
        condition: service_healthy
    networks:
    - sahool-internal
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import sys; sys.exit(0 if b'main.py' in open('/proc/1/cmdline','rb').read()
        else 1)"
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s
