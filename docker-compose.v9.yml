      JWT_SECRET: ${JWT_SECRET}
      # ACTUATOR-DISPATCH-CONSUMER (P0 من تدقيق المستهلكين): حلقة استهلاك طلبات التنفيذ
      # المحكومة من decision-service — default-OFF، وتخدم فقط المستأجرين المعيَّنين صراحةً.
      FEATURE_DISPATCH_ACTUATOR: ${FEATURE_DISPATCH_ACTUATOR:-}
