      SAHOOL_AGENT_TOKEN: ${SAHOOL_AGENT_TOKEN:-}
      SEGMENTATION_MODEL_PATH: ${SEGMENTATION_MODEL_PATH:-}
      SEGMENTATION_BACKEND: ${SEGMENTATION_BACKEND:-}
      # H1: when SEGMENTATION_BACKEND=sam2 (GPU profile) this default wires
      # field-segmentation to the SAM2 inference service with no code changes.
      # Leaving SEGMENTATION_BACKEND blank keeps CPU/dev mode honest (503 for auto).
      SEGMENTATION_INFERENCE_URL: ${SEGMENTATION_INFERENCE_URL:-http://sahool-sam2-inference:8080/predict}
      # ExG preprocessor safety/performance limits for map viewport screenshots.
      EXG_MAX_SIDE: ${EXG_MAX_SIDE:-1280}
