    logging: *id001
    environment:
      # Declared owner of `external_submissions` (docs/architecture/db_ownership.yml).
      # Connects with the restricted sahool_ingest role: SELECT+INSERT only, NOBYPASSRLS —
      # RLS stays enforced and the service sets app.current_tenant per operation.
      DATABASE_URL: ${INGEST_DATABASE_URL:-postgresql://sahool_ingest:${INGEST_DB_PASSWORD:?INGEST_DB_PASSWORD required}@sahool-postgres:5432/sahool}
      # Per-source credentials live in external_ingest_sources (X-Scout-Ingest-Token → resolve_ingest_source).
