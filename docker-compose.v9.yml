    # /opt/media/conf layout is what the config entrypoint below depends on, and we
    # do NOT swap to a stale community fork (e.g. panjjo/zlmediakit, whose newest
    # published tag is 1.2.x and whose v6.0.0 in docker-compose.unified.yml 404s).
    # The immutable pin is a resolved sha256 digest set via ZLMEDIAKIT_IMAGE by the
    # release pipeline (not resolvable in this sandbox — no registry pull). Until
    # then this image is the ONLY entry allowlisted in
    # tests_v9/test_compose_image_pinning_guard_v21.py; every other image must stay
    # pinned to an explicit non-master/latest tag.
    image: ${ZLMEDIAKIT_IMAGE:?ZLMEDIAKIT_IMAGE sha256 digest required}
    container_name: sahool-v9-zlmediakit-config
    restart: 'no'
    environment:
      ZLM_API_SECRET: ${ZLMEDIAKIT_API_SECRET:-}
      SAHOOL_ENV: ${SAHOOL_ENV:-production}
    entrypoint:
    - /bin/sh
    - -c
    - |
      set -e
      # Container-audit V21 §4.2: fail-closed — production must not configure ZLMediaKit
      # with a missing/empty or the known-development secret (leaves /index/api/* open).
      if [ "$$SAHOOL_ENV" = "production" ] || [ "$$SAHOOL_ENV" = "prod" ]; then
        if [ -z "$$ZLM_API_SECRET" ] || [ "$$ZLM_API_SECRET" = "sahool-zlm-dev-secret" ]; then
          echo "FATAL: ZLMEDIAKIT_API_SECRET missing/empty/known-dev in production — refusing to configure ZLMediaKit" >&2
          exit 1
        fi
      fi
      if [ ! -f /conf/.sahool_init ]; then cp -a /opt/media/conf/. /conf/ && touch /conf/.sahool_init; fi
      sed -i "s|^secret=.*|secret=$$ZLM_API_SECRET|" /conf/config.ini || true
      echo "zlmediakit config: [api] secret pinned"
    volumes:
    - zlm-conf:/conf
    networks:
    - sahool-internal
  sahool-zlmediakit:
    # CT-07 (V21 §6): see rationale on sahool-zlmediakit-config above — upstream
    # publishes no release tag; immutable pin = sha256 digest via ZLMEDIAKIT_IMAGE
    # in the release pipeline. Allowlisted in the compose image-pinning guard.
    image: ${ZLMEDIAKIT_IMAGE:?ZLMEDIAKIT_IMAGE sha256 digest required}
    container_name: sahool-v9-zlmediakit
    mem_limit: 768m
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    environment:
      TZ: ${TZ:-UTC}
      ZLM_API_SECRET: ${ZLMEDIAKIT_API_SECRET:-}
    depends_on:
      sahool-zlmediakit-config:
        condition: service_completed_successfully
    volumes:
    - zlm-conf:/opt/media/conf
    ports:
    - 127.0.0.1:8188:80
    - 127.0.0.1:8554:554
    - 127.0.0.1:1935:1935
    - 127.0.0.1:10000:10000/udp
    networks:
      sahool-internal: null
    healthcheck:
      test:
      - CMD-SHELL
      - (wget -q -O- http://localhost/index/api/getMediaList >/dev/null 2>&1 || curl
        -fsS http://localhost/index/api/getMediaList >/dev/null 2>&1)
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
  sahool-canonical-execution-learning-worker:
    build: *id003
    mem_limit: 512m
    security_opt:
    - no-new-privileges:true
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    restart: unless-stopped
    logging: *id001
    environment:
      SAHOOL_ENV: ${SAHOOL_ENV:-production}
      PYTHONDONTWRITEBYTECODE: "1"
      DATABASE_URL: ${DATABASE_URL:-postgresql://sahool_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD required}@sahool-postgres:5432/sahool}
      NATS_URL: ${NATS_URL:-nats://sahool-nats:4222}
      CANONICAL_LEARNING_DURABLE: ${CANONICAL_LEARNING_DURABLE:-canonical-execution-learning-v1}
    command:
    - python
    - /app/workers/canonical_execution_learning_worker.py
    depends_on:
      sahool-postgres:
        condition: service_healthy
      sahool-nats:
        condition: service_started
      sahool-migrate:
        condition: service_completed_successfully
      # The `sahool` JetStream stream that carries this worker's subjects is created by
      # agents/notification/agent.py:449 — not by sahool-nats, not by sahool-migrate.
      # Without this edge the worker may reach `js.subscribe` before any stream covers
      # `sahool.>` and exit; `restart: unless-stopped` then retries until the agent is
      # up. Declaring the edge makes the ordering visible instead of emergent. It is
      # ordering only: `service_started` says the agent's process began, not that the
      # stream exists, so the worker's fail-closed startup remains the real guarantee.
      sahool-notification-agent:
        condition: service_started
    networks:
    - sahool-internal
    healthcheck:
      test: ["CMD-SHELL", "python /app/workers/canonical_execution_learning_worker.py --preflight"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
networks:
  sahool-public:
    driver: bridge
  sahool-internal:
    driver: bridge
    internal: false

volumes:
  postgres-data: null
  raster-data: null
  redis-data: null
  redis-state-data: null
  fastbee-data: null
  nats-js: null
  minio-data: null
  qdrant-storage: null
  kg-storage: null
  ollama-models: null
  huggingface-cache: null
  edge-models: null
  edge-sync: null
  odoo-web-data: null
  odoo-config: null
  odoo-addons: null
  prometheus-data: null
  alertmanager-data: null
  grafana-data: null
