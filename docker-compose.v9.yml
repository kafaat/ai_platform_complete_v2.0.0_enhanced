  sahool-decision-service:
    # INTERIM non-authoritative MIRROR by default (dual-path d201527): sahool-platform is the
    # authoritative Source-of-Record and performs the real DB write, then best-effort mirrors
    # here. SoR-promotion code-prep (DEPLOYED-DECISION-SOR-PROMOTION): DB env is now an OPT-IN
    # passthrough that DEFAULTS EMPTY — with DECISION_SERVICE_DATABASE_URL unset, DATABASE_URL is
    # "" so sor_enabled() stays false and the service remains an honest mirror (persisted:false).
    # The operator cutover is therefore env-only (supply DECISION_SERVICE_DATABASE_URL — a
    # restricted, non-superuser, non-BYPASSRLS role — AND DECISION_SERVICE_SOR_ENABLED=true) with
    # NO code change. Schema is NEVER auto-applied at startup: run the explicit, observable
    # pre-deploy step scripts/deploy/decision_service_migrate.sh (migration_runner.py --apply,
    # gated by DECISION_SERVICE_ALLOW_SCHEMA_CHANGE) first. The platform deliberately does NOT
    # depend on this service's health: a dead/unhealthy mirror never blocks or fails the
    # authoritative platform write (the facade wraps mirror calls in try/except).
    build:
      context: .
      dockerfile: services/decision-service/Dockerfile
      args:
        SAHOOL_GIT_SHA: ${TESTED_SHA:?TESTED_SHA required for immutable build identity}
        SAHOOL_BUILD_ID: ${SAHOOL_BUILD_ID:?SAHOOL_BUILD_ID required for immutable build identity}
        SAHOOL_SOURCE_REPOSITORY: ${GITHUB_REPOSITORY:-local/unknown}
        SAHOOL_SOURCE_REF: ${GITHUB_REF:-local}
    mem_limit: 256m
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    environment:
      # Default empty ⇒ mirror mode (no accidental authoritative write). Set both at cutover.
      DATABASE_URL: ${DECISION_SERVICE_DATABASE_URL:-}
      DECISION_SERVICE_SOR_ENABLED: ${DECISION_SERVICE_SOR_ENABLED:-false}
      # Forensic hardening (73666ee audit) — staged production-checklist flags, default off:
      # AUTH_TOKEN gates every non-probe request on the internal port; REQUIRE_AUTH_TOKEN
      # (F-09) makes /readyz degraded when SoR runs without a token; STRICT_WORKER_TENANTS
      # (F-01) makes UNREGISTERED runtime workers fail-closed on the work feed.
      DECISION_SERVICE_AUTH_TOKEN: ${DECISION_SERVICE_AUTH_TOKEN:-}
      DECISION_REQUIRE_AUTH_TOKEN: ${DECISION_REQUIRE_AUTH_TOKEN:-false}
      DECISION_STRICT_WORKER_TENANTS: ${DECISION_STRICT_WORKER_TENANTS:-false}
      # WORKER-IDENTITY-BINDING (staged): when set, the worker-driven endpoints (work-feed +
      # tenant discovery) require a request-scoped X-Worker-Assertion proving the caller IS the
      # worker_id. Unset = header-only compatibility (dev / existing installs); REQUIRED in
      # production (503 when set here but the caller cannot sign). Must MATCH the adapter's key.
      DECISION_WORKER_ASSERTION_KEY: ${DECISION_WORKER_ASSERTION_KEY:-}
      DECISION_WORKER_ASSERTION_KEY_ID: ${DECISION_WORKER_ASSERTION_KEY_ID:-current}
      DECISION_WORKER_ASSERTION_PREVIOUS_KEY: ${DECISION_WORKER_ASSERTION_PREVIOUS_KEY:-}
      DECISION_WORKER_ASSERTION_PREVIOUS_KEY_ID: ${DECISION_WORKER_ASSERTION_PREVIOUS_KEY_ID:-previous}
      # Nonce replay store (Redis). Production never falls back to process memory: a set key with
      # no replay store fails closed (503).
      DECISION_WORKER_ASSERTION_REDIS_URL: ${DECISION_WORKER_ASSERTION_REDIS_URL:-}
      # Gate-Trust-1 Slice 2: activation gate production profile. DEFAULT OFF (transitional — the
      # mirror deployment must not be forced fail-closed). When the operator cuts the activation gate
      # over to enforced production, set ACTIVATION_REQUIRE_PRODUCTION_HARDENING=true — startup then
      # HARD-FAILS unless DEPLOY_BUILD_SHA + ACTIVATION_PROBE_SIGNING_KEY + the enforcement flag are
      # set, and CI-issued (external) evidence receipts must be signed. Never a silent fail-open.
      ACTIVATION_REQUIRE_PRODUCTION_HARDENING: ${ACTIVATION_REQUIRE_PRODUCTION_HARDENING:-false}
      DEPLOY_BUILD_SHA: ${DEPLOY_BUILD_SHA:-}
      ACTIVATION_PROBE_SIGNING_KEY: ${ACTIVATION_PROBE_SIGNING_KEY:-}
      # Trust root for stored producer-issued evidence receipts. Required to ingest/resolve any
      # receipt; the evidence-ingest and gate-completion paths fail closed (503) without it.
      ACTIVATION_EVIDENCE_SIGNING_KEY: ${ACTIVATION_EVIDENCE_SIGNING_KEY:-}
      IRR_F01_RESERVATION_ENFORCE_ACTIVATION: ${IRR_F01_RESERVATION_ENFORCE_ACTIVATION:-false}
      # Soil/agronomic evidence gates. Contract guards mandate production-safe defaults here;
      # the DISPATCH-blocking gate stays OFF by default so the live stack is not fail-closed
      # until soil profiles exist. On a stack without populated agronomic context/soil profiles,
      # set DECISION_REQUIRE_AGRONOMIC_CONTEXT=false and DECISION_REQUIRE_SOIL_PROFILE=false in
      # .env to avoid fail-closed decisions until the data is populated.
      DECISION_REQUIRE_SOIL_EVIDENCE_GATE: ${DECISION_REQUIRE_SOIL_EVIDENCE_GATE:-false}
      DECISION_REQUIRE_AGRONOMIC_CONTEXT: ${DECISION_REQUIRE_AGRONOMIC_CONTEXT:-false}
      DECISION_REQUIRE_SOIL_PROFILE: ${DECISION_REQUIRE_SOIL_PROFILE:-false}
    networks:
    - sahool-internal
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8160/healthz
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s
  sahool-model-lifecycle-adapter:
    # WX-12 lifecycle runtime (services/model-registry-adapter): drives decision-service's
    # governed runtime-work feed (activation/rollback/verification/rollout/monitoring/
    # retraining/reconcile) against external side-effect backends. DISTINCT from
    # sahool-model-registry-worker (api.phase_runtime_workers model), which processes the
    # platform-owned model_promotion_history_runtime table — the two are complementary.
    # Opt-in profile: production requires operator-supplied external backend URLs/tokens
    # (the runtime fails closed without them when SAHOOL_ENV=production), so the adapter
    # must not silently start half-configured in the default stack.
    #   docker compose -f docker-compose.v9.yml --profile model-lifecycle up -d
    build:
      context: services/model-registry-adapter
      dockerfile: Dockerfile
    profiles:
    - model-lifecycle
    mem_limit: 256m
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging: *id001
    environment:
      SAHOOL_ENV: ${SAHOOL_ENV:-production}
      DECISION_SERVICE_URL: http://sahool-decision-service:8160
      # Same shared bearer the decision-service token guard validates (single source).
      DECISION_SERVICE_TOKEN: ${DECISION_SERVICE_AUTH_TOKEN:-}
      REGISTRY_ADAPTER_ID: ${REGISTRY_ADAPTER_ID:-}
      # WORKER-IDENTITY-BINDING: when set, the adapter signs an X-Worker-Assertion binding its
      # REGISTRY_ADAPTER_ID (subject) to each worker-driven GET. Must MATCH the decision-service
      # DECISION_WORKER_ASSERTION_KEY. Unset = no signing (dev / single-tenant installs).
      DECISION_WORKER_ASSERTION_KEY: ${DECISION_WORKER_ASSERTION_KEY:-}
      DECISION_WORKER_ASSERTION_KEY_ID: ${DECISION_WORKER_ASSERTION_KEY_ID:-current}
      # Tenant partition: leave empty for server discovery (the authorized SaaS path);
      # env pins remain for single-tenant installs only.
      RUNTIME_TENANT_IDS: ${RUNTIME_TENANT_IDS:-}
      RUNTIME_TENANT_ID: ${RUNTIME_TENANT_ID:-}
      RUNTIME_POLL_INTERVAL_SECONDS: ${RUNTIME_POLL_INTERVAL_SECONDS:-10}
      MODEL_TRAFFIC_CONTROLLER_URL: ${MODEL_TRAFFIC_CONTROLLER_URL:-}
      MODEL_TRAFFIC_CONTROLLER_TOKEN: ${MODEL_TRAFFIC_CONTROLLER_TOKEN:-}
      MODEL_INFERENCE_VERIFY_URL: ${MODEL_INFERENCE_VERIFY_URL:-}
      MODEL_INFERENCE_VERIFY_TOKEN: ${MODEL_INFERENCE_VERIFY_TOKEN:-}
      MODEL_METRICS_SOURCE_URL: ${MODEL_METRICS_SOURCE_URL:-}
      MODEL_METRICS_SOURCE_TOKEN: ${MODEL_METRICS_SOURCE_TOKEN:-}
      MODEL_TRAINING_BACKEND_URL: ${MODEL_TRAINING_BACKEND_URL:-}
      MODEL_TRAINING_BACKEND_TOKEN: ${MODEL_TRAINING_BACKEND_TOKEN:-}
    depends_on:
      sahool-decision-service:
        condition: service_healthy
    networks:
    - sahool-internal
