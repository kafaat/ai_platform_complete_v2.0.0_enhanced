      SEASON_ENTRY_ENABLED: ${SEASON_ENTRY_ENABLED:-0}
      # توكن خدمة مخصّص لقناة إدخال المواسم (القيمة مُحقَنة بيئيّاً، لا سرّ في compose — نمط READ_TOKEN).
      SEASON_ENTRY_SERVICE_TOKEN: ${SEASON_ENTRY_SERVICE_TOKEN:-}
      # GAP-FIELD-FORMS-01 (Slice 1/2): واجهات النماذج الميدانيّة /internal/field-forms/*
      # خلف راية مستقلّة (off ⇒ 404) وتوكن قناة مخصّص يحقنه proxy المنصّة (§8.6).
      FIELD_FORMS_ENABLED: ${FIELD_FORMS_ENABLED:-0}
