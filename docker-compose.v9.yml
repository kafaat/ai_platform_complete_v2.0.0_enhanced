        required}@sahool-postgres:5432/sahool}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-5}
      RASTER_ASYNC_BACKFILL_ENABLED: ${RASTER_ASYNC_BACKFILL_ENABLED:-true}
      EARTH_SEARCH_URL: ${EARTH_SEARCH_URL:-https://earth-search.aws.element84.com/v1}
      REDIS_URL: redis://:${REDIS_PASSWORD}@sahool-redis:6379/0
