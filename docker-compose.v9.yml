    environment:
      # عزل الثقة (مثل بقيّة الخدمات): التحقّق من توقيع JWT للمتّصِل. HS256 عبر JWT_SECRET
      # أو RS256 عبر JWT_PUBLIC_KEY. غيابهما ⇒ الخدمة fail-closed 503 «JWT_SECRET غير مضبوط».
      JWT_SECRET: ${JWT_SECRET}
