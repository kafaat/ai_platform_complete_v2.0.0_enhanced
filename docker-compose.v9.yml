# ═══════════════════════════════════════════════════════════════════
# SAHOOL v9.1.0 — docker-compose.fixed.yml
# إصلاح 14 خطأ حرج في البنية التحتية
# التاريخ: 2026-05-20
# ═══════════════════════════════════════════════════════════════════

version: "3.8"

# ── المتطلبات البيئية (ضعها في .env) ─────────────────────────────
# JWT_SECRET=your-min-32-char-secret-here
# SAHOOL_AGENT_TOKEN=your-agent-token-here
# DATABASE_URL=postgresql://sahool_user:${DB_PASSWORD}@sahool-postgres:5432/sahool
# REDIS_PASSWORD=your-redis-password-here
# MINIO_ROOT_PASSWORD=your-minio-password-here
# ODOO_PASSWORD=your-odoo-password-here
# TELEGRAM_BOT_TOKEN=your-telegram-token-here
# QDRANT_API_KEY=your-qdrant-api-key-here
# SMTP_PASSWORD=your-smtp-password-here
# SH_CLIENT_ID=your-sentinel-hub-id
# SH_CLIENT_SECRET=your-sentinel-hub-secret
# COPERNICUS_USER=your-copernicus-user
# COPERNICUS_PASSWORD=your-copernicus-password
# ═══════════════════════════════════════════════════════════════════

services:
  # ═══════════════════════════════════════════════════════════════
  # 1. REVERSE PROXY (Nginx)
  # ═══════════════════════════════════════════════════════════════
  sahool-nginx:
    image: nginx:alpine
    container_name: sahool-nginx
    mem_limit: 384m
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # FIX: الملفّ كان nginx.conf (مفقود) → استُبدل بـnginx.v9.conf الموجود.
      # يُركّب كـtemplate ليعالج envsubst متغيّر ${DOMAIN} تلقائيّاً (nginx:alpine).
      - ./nginx/nginx.v9.conf:/etc/nginx/templates/nginx.conf.template:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-cache:/var/cache/nginx
    environment:
      # envsubst يعالج فقط DOMAIN (الفلتر يحمي متغيّرات nginx: $host, $request_uri...)
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: "DOMAIN"
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      sahool-auth:
        condition: service_healthy
      sahool-supervisor-agent:
        condition: service_healthy
      sahool-guardrails-engine:
        condition: service_healthy
      sahool-vegetation-analysis:
        condition: service_healthy
      sahool-indicators-service:
        condition: service_healthy
      sahool-weather-service:
        condition: service_healthy
      sahool-market-mcp:
        condition: service_healthy
      sahool-odoo-bridge:
        condition: service_healthy
      sahool-local-ai-rag:
        condition: service_healthy
    networks:
      - sahool-public
      - sahool-internal
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ═══════════════════════════════════════════════════════════════
  # 2. PostgreSQL + PostGIS (FIX: was postgres:15, now postgis)
  # FIX-01: استبدل postgres:15 بـ postgis/postgis:15-3.4
  # FIX-02: منفذ مكشوف 0.0.0.0 → 127.0.0.1 فقط (أو أزل ports)
  # ═══════════════════════════════════════════════════════════════
  sahool-postgres:
    image: postgis/postgis:15-3.4
    container_name: sahool-postgres
    mem_limit: 1g
    restart: unless-stopped
    # منفذ مكشوف للمضيف فقط — إذا لم تحتاجه من الخارج، أزل السطر التالي
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: sahool
      POSTGRES_USER: sahool_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahool_user -d sahool"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ═══════════════════════════════════════════════════════════════
  # 3. Redis (FIX: بدون كلمة سر → requirepass)
  # FIX-03: Redis محمي بكلمة سر
  # ═══════════════════════════════════════════════════════════════
  sahool-redis:
    image: redis:7-alpine
    container_name: sahool-redis
    mem_limit: 384m
    restart: unless-stopped
    # FIX: لا تكشف Redis للمضيف إلا إذا احتجت debugging
    # ports:
    #   - "127.0.0.1:6379:6379"
    environment:
      # FIX: expose the password inside the container so the healthcheck can
      # authenticate (redis-cli -a) and avoid NOAUTH failures.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    command: >
      sh -c '
        echo "requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}" > /usr/local/etc/redis/redis.conf &&
        echo "maxmemory 256mb" >> /usr/local/etc/redis/redis.conf &&
        echo "maxmemory-policy allkeys-lru" >> /usr/local/etc/redis/redis.conf &&
        redis-server /usr/local/etc/redis/redis.conf
      '
    volumes:
      - redis-data:/data
    networks:
      - sahool-internal
    healthcheck:
      # FIX: redis runs with --requirepass, so an unauthenticated PING returns
      # NOAUTH and the check fails. Authenticate with -a before PING.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ═══════════════════════════════════════════════════════════════
  # 4. NATS JetStream (FIX: بدون persistence → JetStream store)
  # FIX-04: JetStream store دائم
  # ═══════════════════════════════════════════════════════════════
  sahool-nats:
    image: nats:2-alpine
    container_name: sahool-nats
    mem_limit: 384m
    restart: unless-stopped
    command: >
      --js
      --store_dir /data/jetstream
      --http_port 8222
    volumes:
      - nats-js:/data/jetstream
    networks:
      - sahool-internal
    healthcheck:
      # FIX: nats:2-alpine ships BusyBox wget (no curl). Hit the monitoring
      # port 8222 (enabled via --http_port 8222), not the 4222 client port.
      # Use -qO- instead of --spider (BusyBox --spider is unreliable).
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 25s

  # ═══════════════════════════════════════════════════════════════
  # 5. MinIO (FIX: كلمة سر جذرية مكشوفة → env var)
  # FIX-05: MINIO_ROOT_PASSWORD من .env
  # ═══════════════════════════════════════════════════════════════
  sahool-minio:
    image: minio/minio:latest
    container_name: sahool-minio
    mem_limit: 384m
    restart: unless-stopped
    ports:
      # SECURITY FIX: bind to 127.0.0.1 only — access via Nginx reverse proxy
      # في الإنتاج: Nginx يُضيف TLS + auth قبل الـMinIO
      - "127.0.0.1:9000:9000"     # S3 API (داخلي عبر Nginx فقط)
      - "127.0.0.1:9001:9001"     # MinIO Console (admin UI, internal only)
    environment:
      MINIO_ROOT_USER: sahool-admin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ═══════════════════════════════════════════════════════════════
  # 6. Qdrant (FIX: بدون API key → مُحمي)
  # FIX-06: Qdrant API Key
  # ═══════════════════════════════════════════════════════════════
  sahool-qdrant:
    image: qdrant/qdrant:v1.17.1  # مثبّت على مستقرّ حديث (آخر GitHub، مارس 2026)؛ نشر جديد فلا هجرة RocksDB
    container_name: sahool-qdrant
    mem_limit: 2g
    restart: unless-stopped
    # لا تكشف Qdrant للمضيف إلا إذا احتجت debugging
    # ports:
    #   - "127.0.0.1:6333:6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY required}
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - sahool-internal
    # FIX: the official qdrant/qdrant image is DISTROLESS — it has NO curl,
    # wget or shell, so the previous `curl ... /healthz` test could NEVER run
    # and the container was always marked "unhealthy", which then cascaded to
    # every service that waits on it via `condition: service_healthy`.
    # There is no usable HTTP client inside the image, so we cannot run an
    # in-container HTTP healthcheck without rebuilding the image. We therefore
    # drop the in-container healthcheck and gate dependents on service_started.
    # (If a true readiness gate is required, build a wrapper image that adds a
    #  static healthcheck binary — see report.)

  # ═══════════════════════════════════════════════════════════════
  # 7. Ollama (FIX: مفقود للـ RAG)
  # FIX-07: أضف Ollama لخدمة local-ai-rag
  # ═══════════════════════════════════════════════════════════════
  sahool-ollama:
    image: ollama/ollama:latest
    container_name: sahool-ollama
    mem_limit: 4g
    restart: unless-stopped
    # GPU اختياري — أزل deploy.resources إذا لم تكن بحاجة لها
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - sahool-internal
    healthcheck:
      # FIX: the ollama/ollama image does NOT ship curl — the old
      # `curl -f http://localhost:11434` test could never run, so ollama was
      # always "unhealthy" and every dependent (local-ai-rag, qdrant-seed) that
      # waits on `condition: service_healthy` failed to start.
      # The image DOES bundle the `ollama` CLI; `ollama list` hits the local API
      # and exits 0 once the server is ready.
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ═══════════════════════════════════════════════════════════════
  # 8. Auth Service (FIX: JWT_SECRET فارغ → required)
  # FIX-08: JWT_SECRET مطلوب
  # ═══════════════════════════════════════════════════════════════
  sahool-auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: sahool-auth
    mem_limit: 512m
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      REDIS_URL: redis://:${REDIS_PASSWORD}@sahool-redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required — min 32 chars}
      JWT_EXPIRE_MINUTES: 60
      REFRESH_EXPIRE_DAYS: 30
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD required}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@sahool.ye}
      FRONTEND_URL: ${FRONTEND_URL:-https://app.sahool.ye}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      sahool-postgres:
        condition: service_healthy
      sahool-redis:
        condition: service_healthy
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ═══════════════════════════════════════════════════════════════
  # 8b. SAHOOL Platform — المنطق الأساسي (143 endpoint)
  #     كان غير منشور؛ أُضيف ليخدم الواجهة الموحّدة عبر Nginx.
  # ═══════════════════════════════════════════════════════════════
  sahool-platform:
    build:
      context: .
      dockerfile: services/sahool-platform/Dockerfile
    container_name: sahool-platform
    mem_limit: 1g
    restart: unless-stopped
    environment:
      # المنصّة تقرأ SAHOOL_* — يجب تمرير نفس السرّ الذي يوقّع به auth
      SAHOOL_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required — min 32 chars}
      SAHOOL_ENV: ${SAHOOL_ENV:-production}
      SAHOOL_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required — min 32 chars}
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@sahool-redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RASTER_SERVICE_URL: ${RASTER_SERVICE_URL:-http://sahool-raster-service:8001}
      WEATHER_SERVICE_URL: ${WEATHER_SERVICE_URL:-http://sahool-weather-service:8000}
      SOIL_SERVICE_URL: ${SOIL_SERVICE_URL:-http://sahool-soil-service:8000}
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ═══════════════════════════════════════════════════════════════
  # 9. Supervisor Agent (FIX: SAHOOL_AGENT_TOKEN فارغ → required)
  # FIX-09: SAHOOL_AGENT_TOKEN مطلوب
  # ═══════════════════════════════════════════════════════════════
  sahool-supervisor-agent:
    build:
      context: .
      dockerfile: services/supervisor-agent/Dockerfile
    container_name: sahool-supervisor-agent
    mem_limit: 768m
    restart: unless-stopped
    ports:
      - "127.0.0.1:8096:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MCP_SENTINEL_HUB_URL: http://sahool-sentinel-hub-mcp:8000/mcp/v1
      MCP_WEATHER_URL: http://sahool-weather-mcp:8000/mcp/v1
      MCP_WOFOST_URL: http://sahool-wofost-mcp:8000/mcp/v1
      MCP_MARKET_URL: http://sahool-market-mcp:8000/mcp/v1
      SAHOOL_AGENT_TOKEN: ${SAHOOL_AGENT_TOKEN:?SAHOOL_AGENT_TOKEN required}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      sahool-auth:
        condition: service_healthy
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ═══════════════════════════════════════════════════════════════
  # 10. Guardrails Engine
  # ═══════════════════════════════════════════════════════════════
  sahool-guardrails-engine:
    build:
      context: .
      dockerfile: services/guardrails-engine/Dockerfile
    container_name: sahool-guardrails-engine
    mem_limit: 384m
    restart: unless-stopped
    ports:
      - "127.0.0.1:8097:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@sahool-redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      sahool-postgres:
        condition: service_healthy
      sahool-redis:
        condition: service_healthy
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ═══════════════════════════════════════════════════════════════
  # 11. MCP Servers (4 خدمات — منافذ داخلية مختلفة ليست ضرورية)
  # ═══════════════════════════════════════════════════════════════
  sahool-sentinel-hub-mcp:
    build:
      context: .
      dockerfile: services/mcp_servers/Dockerfile
    container_name: sahool-sentinel-hub-mcp
    mem_limit: 384m
    restart: unless-stopped
    environment:
      SH_CLIENT_ID: ${SH_CLIENT_ID:?SH_CLIENT_ID required}
      SH_CLIENT_SECRET: ${SH_CLIENT_SECRET:?SH_CLIENT_SECRET required}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  sahool-weather-mcp:
    build:
      context: .
      dockerfile: services/mcp_servers/Dockerfile
    container_name: sahool-weather-mcp
    mem_limit: 384m
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  sahool-wofost-mcp:
    build:
      context: .
      dockerfile: services/mcp_servers/Dockerfile
    container_name: sahool-wofost-mcp
    mem_limit: 384m
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  sahool-market-mcp:
    build:
      context: .
      dockerfile: services/mcp_servers/Dockerfile
    container_name: sahool-market-mcp
    mem_limit: 384m
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      ODOO_BRIDGE_URL: http://sahool-odoo-bridge:8126
      SAHOOL_API_URL: http://sahool-auth:8000
    depends_on:
      sahool-postgres:
        condition: service_healthy
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ═══════════════════════════════════════════════════════════════
  # 12. Vegetation Analysis
  # ═══════════════════════════════════════════════════════════════
  sahool-vegetation-analysis:
    build:
      context: .
      dockerfile: services/vegetation-analysis-service/Dockerfile
    container_name: sahool-vegetation-analysis
    mem_limit: 768m
    restart: unless-stopped
    environment:
      NATS_URL: nats://sahool-nats:4222
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SH_CLIENT_ID: ${SH_CLIENT_ID}
      SH_CLIENT_SECRET: ${SH_CLIENT_SECRET}
      CDSE_CLIENT_ID: ${CDSE_CLIENT_ID:-}
      CDSE_CLIENT_SECRET: ${CDSE_CLIENT_SECRET:-}
      SH_BASE_URL: ${SH_BASE_URL:-https://sh.dataspace.copernicus.eu}
      SH_TOKEN_URL: ${SH_TOKEN_URL:-https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token}
      COPERNICUS_USER: ${COPERNICUS_USER}
      COPERNICUS_PASSWORD: ${COPERNICUS_PASSWORD}
    depends_on:
      sahool-nats:
        condition: service_healthy
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ═══════════════════════════════════════════════════════════════
  # 12b. Raster Service — صور Sentinel-2/1 (Element84 Earth Search)
  # ═══════════════════════════════════════════════════════════════
  sahool-raster-service:
    build:
      context: .
      dockerfile: services/raster-service/Dockerfile
    container_name: sahool-raster-service
    mem_limit: 1536m
    restart: unless-stopped
    environment:
      EARTH_SEARCH_URL: ${EARTH_SEARCH_URL:-https://earth-search.aws.element84.com/v1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RASTER_UPLOAD_DIR: /data/rasters
      SAHOOL_AGENT_TOKEN: ${SAHOOL_AGENT_TOKEN:-}
      # خادم بلاطات ديناميكي (TiTiler) للـCOG — سدّ فجوة P0. عند ضبطه
      # تُخدَم البلاطات ديناميكيّاً من COG؛ وإلّا تبقى البلاطات الثابتة fallback.
      TITILER_URL: ${TITILER_URL:-http://sahool-titiler:8000}
      # ضبط مرونة STAC (قلب النظام): إعادة محاولة + cache TTL
      STAC_MAX_RETRIES: ${STAC_MAX_RETRIES:-3}
      STAC_CACHE_TTL: ${STAC_CACHE_TTL:-900}
      STAC_FALLBACK_ENABLED: ${STAC_FALLBACK_ENABLED:-true}
      PLANETARY_COMPUTER_URL: ${PLANETARY_COMPUTER_URL:-https://planetarycomputer.microsoft.com/api/stac/v1}
      DEAFRICA_ENABLED: ${DEAFRICA_ENABLED:-false}
      DEAFRICA_STAC_URL: ${DEAFRICA_STAC_URL:-https://explorer.digitalearth.africa/stac}
    volumes:
      - raster-data:/data/rasters
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/healthz')"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ═══════════════════════════════════════════════════════════════
  # 12b. TiTiler — خادم بلاطات COG ديناميكي (Development Seed)
  # ═══════════════════════════════════════════════════════════════
  # سدّ فجوة P0: MapLibre لا يدعم COG أصلاً؛ TiTiler ينتج بلاطات عند الطلب
  # من COG مع تمدّد ألوان ديناميكي. بديل عن البلاطات الثابتة المُولَّدة مسبقاً.
  sahool-titiler:
    image: ghcr.io/developmentseed/titiler:latest
    container_name: sahool-titiler
    command: uvicorn titiler.application.main:app --host 0.0.0.0 --port 8000 --workers 1
    mem_limit: 1024m
    restart: unless-stopped
    environment:
      # CORS للسماح للواجهة بطلب البلاطات
      TITILER_API_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ═══════════════════════════════════════════════════════════════
  # 13. Indicators Service
  # ═══════════════════════════════════════════════════════════════
  sahool-indicators-service:
    build:
      context: .
      dockerfile: services/indicators-service/Dockerfile
    container_name: sahool-indicators-service
    mem_limit: 384m
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@sahool-redis:6379/0
      NATS_URL: nats://sahool-nats:4222
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      sahool-postgres:
        condition: service_healthy
      sahool-redis:
        condition: service_healthy
      sahool-nats:
        condition: service_healthy
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ═══════════════════════════════════════════════════════════════
  # 14. Weather Service
  # ═══════════════════════════════════════════════════════════════
  sahool-weather-service:
    build:
      context: .
      dockerfile: services/weather-service/Dockerfile
    container_name: sahool-weather-service
    mem_limit: 384m
    restart: unless-stopped
    environment:
      NATS_URL: nats://sahool-nats:4222
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      sahool-nats:
        condition: service_healthy
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ═══════════════════════════════════════════════════════════════
  # 15. Actuator Service
  # ═══════════════════════════════════════════════════════════════
  sahool-actuator-service:
    build:
      context: .
      dockerfile: services/actuator-service/Dockerfile
    container_name: sahool-actuator-service
    mem_limit: 384m
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@sahool-redis:6379/0
      MQTT_BROKER_URL: mqtt://sahool-fastbee:1883
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      sahool-postgres:
        condition: service_healthy
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ═══════════════════════════════════════════════════════════════
  # 16. Edge Inference (FIX: صورة عامة → build)
  # FIX-10: build context بدل image عامة
  # ═══════════════════════════════════════════════════════════════
  sahool-edge:
    build:
      context: .
      dockerfile: services/edge-inference/Dockerfile.arm64
    container_name: sahool-edge
    mem_limit: 1536m
    restart: unless-stopped
    environment:
      SAHOOL_CLOUD_URL: https://api.sahool.local
      EDGE_SYNC_TOKEN: ${EDGE_SYNC_TOKEN:-}
      EDGE_DEVICE: ${EDGE_DEVICE:-rpi5}
      OFFLINE_MODE: ${OFFLINE_MODE:-false}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-3600}
      MODEL_CACHE: /models
      SAHOOL_AGENT_TOKEN: ${SAHOOL_AGENT_TOKEN:-}
    volumes:
      - edge-models:/models
      - edge-sync:/data/sync_queue
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ═══════════════════════════════════════════════════════════════
  # 17. Video Processor (FIX: ملف مقطوع → مُعلق حتى الإصلاح)
  # FIX-11: مُعلق — أكمل services/video-processor/main.py أولاً
  # ═══════════════════════════════════════════════════════════════
  # sahool-video-processor:
  #   build:
  #     context: .
  #     dockerfile: services/video-processor/Dockerfile
  #   container_name: sahool-video-processor
  #   restart: unless-stopped
  #   environment:
  #     MQTT_BROKER_URL: mqtt://sahool-fastbee:1883
  #     EDGE_INFERENCE_URL: http://sahool-edge:8100
  #     ZLMEDIA_API_URL: http://sahool-zlmediakit:8080
  #   networks:
  #     - sahool-internal

  # ═══════════════════════════════════════════════════════════════
  # 18. Local AI RAG (FIX: Ollama URL داخل Docker)
  # FIX-12: EMBEDDING_URL و LLM_URL يشيران إلى sahool-ollama
  # ═══════════════════════════════════════════════════════════════
  sahool-local-ai-rag:
    build:
      context: .
      dockerfile: services/local-ai-rag/Dockerfile
    container_name: sahool-local-ai-rag
    mem_limit: 2g
    restart: unless-stopped
    environment:
      QDRANT_HOST: sahool-qdrant
      QDRANT_PORT: 6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      SAHOOL_AGENT_TOKEN: ${SAHOOL_AGENT_TOKEN:-}
      EMBEDDING_URL: http://sahool-ollama:11434/api/embeddings
      LLM_URL: http://sahool-ollama:11434/api/generate
      EMBEDDING_MODEL: nomic-embed-text
      LLM_MODEL: llama3.2:3b
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      sahool-qdrant:
        condition: service_started  # FIX: qdrant image is distroless, no healthcheck
      sahool-ollama:
        condition: service_healthy
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ═══════════════════════════════════════════════════════════════
  # 19. Qdrant Seed (FIX: restart دائم → "no")
  # FIX-13: لا يُعاد تشغيله تلقائيًا
  # ═══════════════════════════════════════════════════════════════
  sahool-qdrant-seed:
    build:
      context: .
      dockerfile: services/qdrant-seed/Dockerfile
    container_name: sahool-qdrant-seed
    mem_limit: 384m
    restart: "no"
    environment:
      QDRANT_HOST: sahool-qdrant
      QDRANT_PORT: 6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      EMBEDDING_URL: http://sahool-ollama:11434/api/embeddings
      EMBEDDING_MODEL: nomic-embed-text
    depends_on:
      sahool-qdrant:
        condition: service_started  # FIX: qdrant image is distroless, no healthcheck
      sahool-ollama:
        condition: service_healthy
    networks:
      - sahool-internal

  # ═══════════════════════════════════════════════════════════════
  # 20. Odoo Bridge (FIX: ODOO_PASSWORD فارغ → required)
  # FIX-14: ODOO_PASSWORD مطلوب
  # ═══════════════════════════════════════════════════════════════
  sahool-odoo-bridge:
    build:
      context: .
      dockerfile: services/odoo-bridge/Dockerfile
    container_name: sahool-odoo-bridge
    mem_limit: 512m
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # مفتاح تبديل مزوّد ERP: odoo | erpnext | none (إيقاف)
      ERP_PROVIDER: ${ERP_PROVIDER:-odoo}
      ERPNEXT_URL: ${ERPNEXT_URL:-http://sahool-erpnext:8000}
      ERPNEXT_API_KEY: ${ERPNEXT_API_KEY:-}
      ERPNEXT_API_SECRET: ${ERPNEXT_API_SECRET:-}
      ODOO_URL: ${ODOO_URL:-http://sahool-odoo:8069}
      ODOO_DB: ${ODOO_DB:-sahool}
      ODOO_USER: ${ODOO_USER:-admin}
      ODOO_PASSWORD: ${ODOO_PASSWORD:?ODOO_PASSWORD required}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      sahool-postgres:
        condition: service_healthy
      # Odoo اختياري: الجسر يعمل مع أيّ مزوّد (odoo/erpnext/none).
      # required:false يمنع فشل الجسر حين يكون Odoo معطّلاً (profile غير نشط).
      sahool-odoo:
        condition: service_healthy
        required: false
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8126/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ═══════════════════════════════════════════════════════════════
  # 21. Odoo ERP (FIX: مفقود في unified.yml → أضفه)
  # FIX-15: Odoo service مُضاف
  # ═══════════════════════════════════════════════════════════════
  sahool-odoo:
    image: odoo:17.0
    container_name: sahool-odoo
    # مفتاح التبديل: يعمل فقط مع --profile odoo (أو ERP_PROVIDER=odoo)
    profiles: ["odoo"]
    mem_limit: 1536m   # FIX: Odoo 17 يحتاج ~1GB+ — 384m كان يسبّب OOM kill عند البدء
    restart: unless-stopped
    ports:
      - "127.0.0.1:8069:8069"
    environment:
      HOST: sahool-postgres
      USER: sahool_user
      PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${ODOO_DB:-sahool}
    volumes:
      - odoo-web-data:/var/lib/odoo
      - odoo-config:/etc/odoo
      - odoo-addons:/mnt/extra-addons
      - odoo-filestore:/var/lib/odoo/filestore
    depends_on:
      sahool-postgres:
        condition: service_healthy
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ═══════════════════════════════════════════════════════════════
  # 21-ب. ERPNext (بديل Odoo) — معماريّة Frappe متعدّدة الخدمات
  # ⚠ ERPNext ليس حاوية واحدة: يحتاج configurator+backend+frontend+
  #   websocket+workers+scheduler+MariaDB. لذا فُصِل في ملفّ مستقلّ:
  #   docker-compose.erpnext.yml (الطريقة الصحيحة حسب توثيق Frappe).
  # التشغيل: docker compose -f docker-compose.erpnext.yml --env-file .env up -d
  # التبديل في الجسر: ERP_PROVIDER=erpnext + المفاتيح في .env
  # (لا نُعرّف ERPNext هنا كحاوية مبسّطة — كان سيفشل: Frappe يحتاج bench كامل)



  # ═══════════════════════════════════════════════════════════════
  # 22. Telegram Bot (FIX: TELEGRAM_BOT_TOKEN فارغ → required)
  # FIX-16: TELEGRAM_BOT_TOKEN مطلوب
  # ═══════════════════════════════════════════════════════════════
  sahool-telegram-bot:
    build:
      context: .
      dockerfile: bots/telegram/Dockerfile
    container_name: sahool-telegram-bot
    mem_limit: 384m
    restart: unless-stopped
    environment:
      # كان :?required ويوقف compose كلّه إن غاب. جُعل اختياريّاً —
      # البوت لن يعمل بلا token لكنّه لا يمنع بقيّة الخدمات.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?TELEGRAM_WEBHOOK_SECRET required}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@sahool-redis:6379/0
      NATS_URL: nats://sahool-nats:4222
      EDGE_INFERENCE_URL: http://sahool-edge:8100
      SUPERVISOR_AGENT_URL: http://sahool-supervisor-agent:8000
      SAHOOL_API_URL: http://sahool-auth:8000
    depends_on:
      sahool-postgres:
        condition: service_healthy
      sahool-redis:
        condition: service_healthy
      sahool-nats:
        condition: service_healthy
    networks:
      - sahool-internal
    healthcheck:
      # البوت polling بلا خادم HTTP → curl دائماً يفشل. pgrep هو الصحيح
      # (يطابق Dockerfile). أُزيل JWT_SECRET — البوت لم يعد يصكّ توكنات (B5).
      test: ["CMD-SHELL", "pgrep -f 'python main.py' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ═══════════════════════════════════════════════════════════════
  # 23. Notification Agent
  # ═══════════════════════════════════════════════════════════════
  sahool-notification-agent:
    build:
      context: .
      dockerfile: agents/notification/Dockerfile
    container_name: sahool-notification-agent
    mem_limit: 384m
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@sahool-redis:6379/0
      NATS_URL: nats://sahool-nats:4222
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      sahool-postgres:
        condition: service_healthy
      sahool-redis:
        condition: service_healthy
      sahool-nats:
        condition: service_healthy
    networks:
      - sahool-internal
    healthcheck:
      # وكيل الإشعارات يستمع على 8123 ويخدّم /health (لا 8000/healthz).
      test: ["CMD", "curl", "-f", "http://localhost:8123/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ═══════════════════════════════════════════════════════════════
  # 24. Frontend React (FIX: npm install كـ root)
  # FIX-17: build multi-stage مع user node
  # ═══════════════════════════════════════════════════════════════
  sahool-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_WS_URL: ${VITE_WS_URL:-/ws}
    container_name: sahool-frontend
    mem_limit: 384m
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:8080"
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_WS_URL: ${VITE_WS_URL:-/ws}
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ═══════════════════════════════════════════════════════════════
  # 25. Prometheus + Grafana (Observability)
  # ═══════════════════════════════════════════════════════════════
  sahool-prometheus:
    image: prom/prometheus:latest
    container_name: sahool-prometheus
    mem_limit: 384m
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # AlertManager — يستقبل إنذارات Prometheus ويوجّهها (ملاحظة المراجعة: كان
  # prometheus يشير لـalertmanager غير موجود). المستقبِلات الحقيقيّة تُضاف عبر
  # تراكب النشر (Slack/email/Telegram) — الافتراضيّ no-op (لا ضجيج).
  sahool-alertmanager:
    image: prom/alertmanager:latest
    container_name: sahool-alertmanager
    mem_limit: 128m
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  sahool-grafana:
    image: grafana/grafana:latest
    container_name: sahool-grafana
    mem_limit: 384m
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:?must be set in .env}"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ═══════════════════════════════════════════════════════════════
  # 26. Jaeger (Tracing)
  # ═══════════════════════════════════════════════════════════════
  sahool-jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: sahool-jaeger
    mem_limit: 384m
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    volumes:
      - jaeger-data:/badger
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:14269/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ═══════════════════════════════════════════════════════════════
  # 27. Soil Service (FIX: ملف فارغ → مُعلق)
  # FIX-18: مُعلق حتى تُكمل services/soil-service/main.py
  # ═══════════════════════════════════════════════════════════════
  # sahool-soil-service:
  #   build:
  #     context: .
  #     dockerfile: services/soil-service/Dockerfile
  #   container_name: sahool-soil-service
  #   restart: unless-stopped
  #   environment:
  #     DATABASE_URL: ${DATABASE_URL}
  #     NATS_URL: nats://sahool-nats:4222
  #   networks:
  #     - sahool-internal

  # ═══════════════════════════════════════════════════════════════
  # 28. AgriAI Engine (FIX: لا يوجد كود → مُعلق)
  # FIX-19: مُعلق حتى تُكمل services/agriai-engine/main.py
  # ═══════════════════════════════════════════════════════════════
  # sahool-agriai-engine:
  #   build:
  #     context: .
  #     dockerfile: services/agriai-engine/Dockerfile
  #   container_name: sahool-agriai-engine
  #   restart: unless-stopped
  #   environment:
  #     DATABASE_URL: ${DATABASE_URL}
  #     SAHOOL_AGENT_TOKEN: ${SAHOOL_AGENT_TOKEN:-}  # /recommend يتطلّبه
  #   networks:
  #     - sahool-internal

# ═══════════════════════════════════════════════════════════════════
# NETWORKS
# ═══════════════════════════════════════════════════════════════════
networks:
  sahool-public:
    driver: bridge
  sahool-internal:
    driver: bridge
    internal: false   # true إذا أردت عزل تام (لكن Jaeger/Prometheus تحتاج access)

# ═══════════════════════════════════════════════════════════════════
# VOLUMES (Persistent)
# ═══════════════════════════════════════════════════════════════════
volumes:
  postgres-data:
  raster-data:
  redis-data:
  nats-js:
  minio-data:
  qdrant-storage:
  ollama-models:
  edge-models:
  edge-sync:
  odoo-web-data:
  odoo-config:
  odoo-addons:
  odoo-filestore:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  jaeger-data:
  nginx-cache:
