global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    environment: 'production'
    project:     'sahool-v9'

rule_files: []

scrape_configs:
  # ── Backend Services ──────────────────────────────────────────


  - job_name: 'nats-exporter'
    static_configs:
      - targets: ['sahool-nats:8222']
    metrics_path: '/metrics'

  - job_name: 'nginx'
    static_configs:
      #

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'sahool-raster-service'
    static_configs:
      - targets: ['sahool-raster-service:8001']
    metrics_path: '/metrics'
