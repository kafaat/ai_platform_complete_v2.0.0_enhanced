# postgres/pg_hba.conf — مصادقةُ sahool-postgres في مكدّس v9 (يُركَّب للقراءة، `hba_file=`).
#
# POSTGRES-V9-HAS-NO-TLS-SO-EVERY-CLIENT-IS-PLAINTEXT-01: كان الخادمُ بلا أيّ إعداد TLS، والملفُّ
# الذي تكتبه صورةُ postgis عند initdb يقبل `host all all all scram-sha-256` — أي اتّصالاً **نصّيّاً**
# من أيّ عنوان (و`prefer` في asyncpg/libpq يسقط إليه صامتاً). صار الإغلاقُ على الخادم لا على حسن
# نيّة العميل: كلُّ اتّصال TCP يجب أن يكون TLS، وإلّا يُرفَض قبل المصادقة.
#
# الترتيبُ مقصود — Postgres يأخذ **أوّلَ** سطرٍ يطابق:
#   1) `local` (مقبسُ يونكس داخل الحاوية وحدها): trust كما تكتبه الصورةُ نفسُها — يحتاجه
#      docker-entrypoint عند initdb (خادمٌ مؤقّت بـ`listen_addresses=''`) وفحصُ `pg_isready`.
#      لا يبلغه شيءٌ من الشبكة.
#   2) `hostnossl … reject`: أيُّ TCP بلا TLS يُرفَض صراحةً، من أيّ عنوان — بما فيه 127.0.0.1
#      (المنفذُ المنشور إلى المضيف) الذي كانت الصورةُ تثق به بلا كلمة مرور.
#   3) `hostssl … scram-sha-256`: TLS **و**كلمةُ مرور. لا `host` في هذا الملفّ قطّ.
#
# والعميلُ يُكمل الطرفَ الآخر: `sslmode=verify-full` بـCA الخادم (لا يقبل خادماً منتحَلاً).
# أحدُهما دون الآخر لا يُغلق. الشاهدان: tests_v9/test_postgres_tls.py.

# TYPE      DATABASE  USER  ADDRESS  METHOD
local       all       all            trust
hostnossl   all       all   all      reject
hostssl     all       all   all      scram-sha-256
