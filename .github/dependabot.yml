version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # توجيه صريح إلى main (لا الفرع الافتراضيّ للمستودع): تحديثات التبعيّات تُفتَح
    # على الخطّ الرئيس مباشرةً بدل فرع العمل، فتُدمَج تحت Ratchet كأيّ تغيير آخر.
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
