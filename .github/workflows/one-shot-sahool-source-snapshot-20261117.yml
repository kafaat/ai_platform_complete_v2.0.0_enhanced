name: One-shot SAHOOL selective sources for independent local lab
on:
  push:
    branches: [lab/source-snapshot-pr1525-20261117]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact authored files from both repair heads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/source-export
          FILES=(
            scripts/ci/export_explorer_routes.py
            tests_v9/test_explorer_route_export_contract.py
            tests_v9/test_semantic_convergence_01.py
            services/ai_agronomist/ai_evidence_runtime.py
            docs/architecture/guard_mutation_registry.json
            docs/architecture/blocking_surface_additions.json
          )
          for entry in 1527:9c5f6d34f4e00e3e8a341f1e6607cb58791d65fa 1528:b282ca3394298df9c856bd82292825e755bd8650; do
            name="${entry%%:*}"; target="${entry#*:}"
            git fetch --no-tags --quiet origin "$target"
            test "$(git rev-parse "$target^{commit}")" = "$target"
            git archive --format=tar "$target" "${FILES[@]}" | gzip -1 > "/tmp/source-export/pr${name}-authored.tar.gz"
            printf '%s\n' "$target" > "/tmp/source-export/pr${name}-SHA"
          done
          (cd /tmp/source-export && sha256sum *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sahool-comparison-authored-1527-1528
          path: /tmp/source-export/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
