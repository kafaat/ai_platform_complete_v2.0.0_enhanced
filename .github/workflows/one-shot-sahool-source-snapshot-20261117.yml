name: One-shot SAHOOL source snapshot for independent local lab
on:
  push:
    branches: [lab/source-snapshot-pr1525-20261117]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact reviewed commit, never the temporary workflow
        shell: bash
        env:
          SOURCE_SHA: bffed764271e93837d0edd9554d522359896cd4b
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          mkdir -p /tmp/source-export
          git archive --format=tar "$SOURCE_SHA" | gzip -1 > /tmp/source-export/sahool-source.tar.gz
          sha256sum /tmp/source-export/sahool-source.tar.gz > /tmp/source-export/SHA256SUMS
          printf '%s\n' "$SOURCE_SHA" > /tmp/source-export/SOURCE_SHA
          du -h /tmp/source-export/sahool-source.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sahool-source-pr1525-exact
          path: /tmp/source-export/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
