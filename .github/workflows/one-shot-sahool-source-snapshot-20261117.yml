name: One-shot SAHOOL exact final authored diff for offline validation
on:
  push:
    branches: [lab/source-snapshot-pr1525-20261117]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact test from unified commit, do not mutate PR branch
        shell: bash
        env:
          SOURCE_SHA: e02cc1b3c107e757eef465f164126f75b43bd833
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin "$SOURCE_SHA"
          test "$(git rev-parse "$SOURCE_SHA^{commit}")" = "$SOURCE_SHA"
          mkdir -p /tmp/source-export
          git archive --format=tar "$SOURCE_SHA" tests_v9/test_semantic_convergence_01.py | gzip -1 > /tmp/source-export/exact-semantic-test.tar.gz
          printf '%s\n' "$SOURCE_SHA" > /tmp/source-export/SOURCE_SHA
          (cd /tmp/source-export && sha256sum exact-semantic-test.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr1525-unified-exact-test
          path: /tmp/source-export/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
