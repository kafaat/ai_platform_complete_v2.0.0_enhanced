name: PR1063 one-shot regeneration
on:
  push:
    branches: [codex/merge-tree-preservation-20260921]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install repository CI tooling
        run: |
          python -m pip install --disable-pip-version-check -q ruff pytest
      - name: Remove this one-shot workflow before deriving artifacts
        run: rm .github/workflows/pr1063-regenerate.yml
      - name: Format changed Python
        run: |
          ruff format scripts/ci/merge_tree_preservation_guard.py tests_v9/test_merge_tree_preservation_guard.py
          ruff check scripts/ci/merge_tree_preservation_guard.py tests_v9/test_merge_tree_preservation_guard.py
      - name: Regenerate to fixed point
        run: |
          git add -A
          python scripts/ci/verify_all_generated.py --fix
          git add -A
          python scripts/ci/verify_all_generated.py --check
      - name: Build release bundle last
        run: |
          python scripts/release/build_release_bundle.py
          git add -A
          python scripts/release/validate_release_package.py --root .
      - name: Targeted witnesses
        run: |
          python -m pytest -q tests_v9/test_merge_tree_preservation_guard.py
          python scripts/ci/guard_mutation_guard.py --run
          python scripts/ci/guard_catalogue.py --check
          python scripts/ci/capability_mapping_engine.py --check
      - name: Commit converged tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore(ci): converge merge-tree guard artifacts"
          git push origin HEAD:codex/merge-tree-preservation-20260921
