name: SAHOOL Railway staging connection preflight

# Staging only. No deployments, database calls, migrations or config mutations.
on:
  pull_request:
    paths:
      - ".github/workflows/railway-staging-connection-preflight.yml"
      - "scripts/ci/railway_staging_connection_preflight.py"
      - "tests_v9/test_railway_staging_connection_preflight.py"
      - "docs/runbooks/RAILWAY_GITHUB_ACTIONS_CONNECTION.md"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact reviewed 40-character main SHA for read-only staging connectivity"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}-{2}', github.workflow, github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  parser-contract:
    name: Read-only staging parser and receipt contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install pinned pytest for registered unit marker
        run: python -m pip install pytest==9.1.1
      - name: Prove fail-closed staging scope and secret-free receipts
        run: python -m pytest --noconftest -q -m unit tests_v9/test_railway_staging_connection_preflight.py

  staging-connection:
    name: Staging project-token status read (never deploy)
    needs: parser-contract
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CI: "true"
      RAILWAY_NO_AUTO_UPDATE: "1"
      SAHOOL_RAILWAY_PROJECT_ID: "33c50993-1110-43eb-8e92-04c15edae51e"
      SAHOOL_RAILWAY_STAGING_ENVIRONMENT_ID: "70cc51f8-b11f-4506-87b2-4b6615e472be"
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Refuse non-main source and SHA drift
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Only refs/heads/main is eligible for staging connection proof"
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ || "$EXPECTED_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Expected SHA differs from checked-out main commit"
            exit 1
          fi
          echo "source_sha=$GITHUB_SHA scope=read-only-staging"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install pinned Railway CLI before exposing project token
        run: npm install --global @railway/cli@5.63.1
      - name: Read Railway staging context (raw output never printed)
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.SAHOOL_RAILWAY_STAGING_PROJECT_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${RAILWAY_TOKEN:-}" ]]; then
            echo "::error::Missing SAHOOL_RAILWAY_STAGING_PROJECT_TOKEN secret"
            exit 1
          fi
          if [[ -n "${RAILWAY_API_TOKEN:-}" ]]; then
            echo "::error::Account-wide Railway token is forbidden"
            exit 1
          fi
          status_file="$RUNNER_TEMP/railway-staging-status.json"
          error_file="$RUNNER_TEMP/railway-staging-stderr.txt"
          if ! timeout 90s railway status --json \
              --project "$SAHOOL_RAILWAY_PROJECT_ID" \
              --environment "$SAHOOL_RAILWAY_STAGING_ENVIRONMENT_ID" \
              >"$status_file" 2>"$error_file"; then
            echo "::error::Railway status read failed; check token, scope or platform incident. Raw response withheld"
            exit 1
          fi
      - name: Verify exact IDs and produce redacted evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/railway_staging_connection_preflight.py \
            --status-json "$RUNNER_TEMP/railway-staging-status.json" \
            --source-sha "$GITHUB_SHA" \
            --evidence "$RUNNER_TEMP/railway-staging-connection-evidence.json"
      - name: Store sanitized read-only receipt only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sahool-railway-staging-connection-${{ github.sha }}
          path: ${{ runner.temp }}/railway-staging-connection-evidence.json
          if-no-files-found: error
          retention-days: 14
  generator-railway-surface:
    name: Temporary source-truth artifact regeneration (read-only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Recreate final workflow and run canonical generators
        run: |
          set -euo pipefail
          python -m pip install PyYAML==6.0.3 ruff==0.15.8
          python - <<'PY'
          from pathlib import Path
          path=Path(".github/workflows/railway-staging-connection-preflight.yml")
          source=path.read_text(encoding="utf-8")
          marker="\n  generator-railway-surface:\n"
          assert source.count(marker)==1, "temporary block changed"
          path.write_text(source.split(marker,1)[0].rstrip()+"\n",encoding="utf-8")
          PY
          ruff format scripts/ci/railway_staging_connection_preflight.py tests_v9/test_railway_staging_connection_preflight.py
          ruff check scripts/ci/railway_staging_connection_preflight.py tests_v9/test_railway_staging_connection_preflight.py
          python scripts/ci/guard_mutation_guard.py --blocking-surface --enforce
          python scripts/ci/guard_catalogue.py
          python scripts/ci/capability_mapping_engine.py --generate
          python scripts/ci/capability_management_engine.py --generate
          python scripts/ci/pr_capability_impact_gate.py --generate-index
          python scripts/release/build_release_bundle.py
          python scripts/ci/guard_catalogue.py --check
          python scripts/ci/capability_mapping_engine.py --check
          python scripts/ci/capability_management_engine.py --check
          python scripts/ci/pr_capability_impact_gate.py --check-index
          python scripts/release/validate_release_package.py --root .
      - name: Emit SHA-verified bounded patches for generated files
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,difflib,hashlib,json,subprocess
          wf=".github/workflows/railway-staging-connection-preflight.yml"
          allowed_prefixes=("docs/capability-registry/generated/","docs/runbooks/GUARD_CATALOGUE.md","release/")
          changed=subprocess.check_output(["git","diff","--name-only","HEAD"],text=True).splitlines()
          allowed_sources=("scripts/ci/railway_staging_connection_preflight.py","tests_v9/test_railway_staging_connection_preflight.py")
          if wf not in changed or any(p!=wf and p not in allowed_sources and not p.startswith(allowed_prefixes) for p in changed):
              raise SystemExit("Unexpected generated file outside allowlist: "+str(changed))
          total=0
          for path in changed:
              if path==wf: continue
              before=subprocess.check_output(["git","show",f"HEAD:{path}"])
              after=Path(path).read_bytes()
              a=before.decode().splitlines(keepends=True)
              b=after.decode().splitlines(keepends=True)
              ops=[{"start":i1,"end":i2,"lines":"".join(b[j1:j2])}
                   for kind,i1,i2,j1,j2 in difflib.SequenceMatcher(None,a,b,autojunk=False).get_opcodes()
                   if kind!="equal"]
              payload=json.dumps({"path":path,"before_sha256":hashlib.sha256(before).hexdigest(),
                                  "after_sha256":hashlib.sha256(after).hexdigest(),"ops":ops},
                                 ensure_ascii=False,separators=(",",":"))
              blob=base64.b64encode(payload.encode()).decode()
              total+=len(blob)
              if total>1600000: raise SystemExit("bounded patch budget exceeded")
              parts=[blob[i:i+1900] for i in range(0,len(blob),1900)]
              print(f"SAHOOL_REGEN_SUMMARY|{path}|{len(before)}|{len(after)}|{len(ops)}|{len(parts)}",flush=True)
              for i,s in enumerate(parts):
                  print(f"SAHOOL_REGEN_PATCH|{path}|{i}|{len(parts)}|{s}",flush=True)
          print("SAHOOL_REGEN_DONE",flush=True)
          PY
