name: SAHOOL Railway staging connection preflight

# Staging only. No deployments, database calls, migrations or config mutations.
on:
  pull_request:
    paths:
      - ".github/workflows/railway-staging-connection-preflight.yml"
      - "scripts/ci/railway_staging_connection_preflight.py"
      - "tests_v9/test_railway_staging_connection_preflight.py"
      - "docs/runbooks/RAILWAY_GITHUB_ACTIONS_CONNECTION.md"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact reviewed 40-character main SHA for read-only staging connectivity"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sahool-railway-staging-connection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  parser-contract:
    name: Read-only staging parser and receipt contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install pinned pytest for registered unit marker
        run: python -m pip install pytest==9.1.1
      - name: Prove fail-closed staging scope and secret-free receipts
        run: python -m pytest --noconftest -q -m unit tests_v9/test_railway_staging_connection_preflight.py

  staging-connection:
    name: Staging project-token status read (never deploy)
    needs: parser-contract
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CI: "true"
      RAILWAY_NO_AUTO_UPDATE: "1"
      SAHOOL_RAILWAY_PROJECT_ID: "33c50993-1110-43eb-8e92-04c15edae51e"
      SAHOOL_RAILWAY_STAGING_ENVIRONMENT_ID: "70cc51f8-b11f-4506-87b2-4b6615e472be"
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Refuse non-main source and SHA drift
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Only refs/heads/main is eligible for staging connection proof"
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ || "$EXPECTED_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Expected SHA differs from checked-out main commit"
            exit 1
          fi
          echo "source_sha=$GITHUB_SHA scope=read-only-staging"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install pinned Railway CLI before exposing project token
        run: npm install --global @railway/cli@5.63.1
      - name: Read Railway staging context (raw output never printed)
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.SAHOOL_RAILWAY_STAGING_PROJECT_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${RAILWAY_TOKEN:-}" ]]; then
            echo "::error::Missing SAHOOL_RAILWAY_STAGING_PROJECT_TOKEN secret"
            exit 1
          fi
          if [[ -n "${RAILWAY_API_TOKEN:-}" ]]; then
            echo "::error::Account-wide Railway token is forbidden"
            exit 1
          fi
          status_file="$RUNNER_TEMP/railway-staging-status.json"
          error_file="$RUNNER_TEMP/railway-staging-stderr.txt"
          if ! timeout 90s railway status --json \
              --project "$SAHOOL_RAILWAY_PROJECT_ID" \
              --environment "$SAHOOL_RAILWAY_STAGING_ENVIRONMENT_ID" \
              >"$status_file" 2>"$error_file"; then
            echo "::error::Railway status read failed; check token, scope or platform incident. Raw response withheld"
            exit 1
          fi
      - name: Verify exact IDs and produce redacted evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/railway_staging_connection_preflight.py \
            --status-json "$RUNNER_TEMP/railway-staging-status.json" \
            --source-sha "$GITHUB_SHA" \
            --evidence "$RUNNER_TEMP/railway-staging-connection-evidence.json"
      - name: Store sanitized read-only receipt only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sahool-railway-staging-connection-${{ github.sha }}
          path: ${{ runner.temp }}/railway-staging-connection-evidence.json
          if-no-files-found: error
          retention-days: 14

  impact-release-cascade:
    name: Temporary impact-index and release proof (no write token)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Regenerate index and release against exact final workflow
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install PyYAML==6.0.3
          python - <<'PY'
          from pathlib import Path
          target = Path(".github/workflows/railway-staging-connection-preflight.yml")
          data = target.read_text(encoding="utf-8")
          marker = "\n  impact-release-cascade:\n"
          assert data.count(marker) == 1
          target.write_text(data.split(marker, 1)[0].rstrip() + "\n", encoding="utf-8")
          PY
          python scripts/ci/guard_catalogue.py --check
          python scripts/ci/capability_mapping_engine.py --check
          python scripts/ci/capability_management_engine.py --check
          python scripts/ci/pr_capability_impact_gate.py --generate-index
          python scripts/ci/pr_capability_impact_gate.py --check-index
          python scripts/release/build_release_bundle.py
          python scripts/release/validate_release_package.py --root .
      - name: Emit bounded, reviewed index and release patch only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import difflib
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          workflow = ".github/workflows/railway-staging-connection-preflight.yml"
          allowed = {
              workflow,
              "docs/capability-registry/generated/impact/impact_index_summary.json",
              "release/FILE_CHECKSUMS.sha256",
              "release/SAHOOL_RELEASE_MANIFEST_20260626.json",
          }
          changed = subprocess.check_output(["git", "diff", "--name-only", "HEAD"], text=True).splitlines()
          if workflow not in changed or any(p not in allowed for p in changed):
              raise SystemExit("SAHOOL_IMPACT_CASCADE_OUT_OF_SCOPE")
          targets = [p for p in changed if p != workflow]
          if "docs/capability-registry/generated/impact/impact_index_summary.json" not in targets:
              raise SystemExit("SAHOOL_IMPACT_INDEX_NOT_REGENERATED")
          print(f"SAHOOL_IMPACT_FILES|{len(targets)}|{','.join(targets)}")
          for p in targets:
              old = subprocess.check_output(["git", "show", f"HEAD:{p}"])
              new = Path(p).read_bytes()
              a, b = old.decode().splitlines(keepends=True), new.decode().splitlines(keepends=True)
              ops = [
                  {"start": i1, "end": i2, "lines": "".join(b[j1:j2])}
                  for tag, i1, i2, j1, j2 in difflib.SequenceMatcher(
                      None, a, b, autojunk=False
                  ).get_opcodes() if tag != "equal"
              ]
              obj = {
                  "path": p,
                  "before_sha256": hashlib.sha256(old).hexdigest(),
                  "after_sha256": hashlib.sha256(new).hexdigest(),
                  "ops": ops,
              }
              data = base64.b64encode(json.dumps(obj, ensure_ascii=False, separators=(",", ":")).encode()).decode()
              parts = [data[i:i+1700] for i in range(0, len(data), 1700)]
              print(f"SAHOOL_IMPACT_SUMMARY|{p}|{len(old)}|{len(new)}|{len(ops)}|{len(parts)}")
              for i, part in enumerate(parts):
                  print(f"SAHOOL_IMPACT_PATCH|{p}|{i}|{len(parts)}|{part}")
          print("SAHOOL_IMPACT_DONE")
          PY
