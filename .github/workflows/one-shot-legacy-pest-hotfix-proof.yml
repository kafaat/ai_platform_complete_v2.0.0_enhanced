# Ephemeral verification for a legacy release-branch safety hotfix.
# Self-removes after checks; never deploys to Railway.
name: One-shot legacy pest acknowledgment hotfix proof
on:
  push:
    branches:
      - fix/prod-pest-ack-hotfix-20261117
permissions:
  contents: write
jobs:
  pest-receipt-proof:
    if: github.ref == 'refs/heads/fix/prod-pest-ack-hotfix-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install CI test/format tools
        run: |
          pip install -r tests_v9/requirements-test.txt
          python -m ruff --version
      - name: Format only the bounded hotfix source and tests
        run: |
          ruff check --fix services/sahool-platform/core/pest_escalation_flow.py services/sahool-platform/tests/test_pest_escalation_flow.py
          ruff format services/sahool-platform/core/pest_escalation_flow.py services/sahool-platform/tests/test_pest_escalation_flow.py
      - name: Run targeted regression and workflow tests
        env:
          PYTHONPATH: services/sahool-platform:.
        run: |
          python -m pytest -q services/sahool-platform/tests/test_pest_escalation_flow.py tests_v9/test_new_modules.py -k 'pest or escalation or execute or follow_up'
      - name: Remove one-shot workflow and retain source formatting
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-legacy-pest-hotfix-proof.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(pest): green bounded legacy hotfix proof; remove temporary workflow'
          git push origin HEAD:fix/prod-pest-ack-hotfix-20261117
