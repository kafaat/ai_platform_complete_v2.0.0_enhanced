name: Realtime Mobile
on:
  pull_request:
    paths:
      - 'mobile/sahool_app/**'
      - '.github/workflows/realtime-mobile.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/sahool_app/**'
      - '.github/workflows/realtime-mobile.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}-{2}', github.workflow, github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/sahool_app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true
      - name: Verify PMTiles protobuf compatibility
        working-directory: mobile/sahool_app/packages/pmtiles
        run: |
          dart pub get --enforce-lockfile
          dart test
      - name: Resolve actual native dependencies
        id: resolve
        run: flutter pub get
      - name: Preserve actual solver lock for review
        if: steps.resolve.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: realtime-mobile-resolved-lock
          path: mobile/sahool_app/pubspec.lock
          if-no-files-found: error
      - name: Analyze realtime client
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/features/realtime test/realtime
      - name: Test capture lifecycle and authorization
        run: flutter test test/realtime
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile native Android application
        run: flutter build apk --debug
      - name: Require committed lock matches the actual solver
        if: always()
        run: git diff --exit-code -- pubspec.lock
