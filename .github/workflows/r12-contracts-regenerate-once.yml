name: R12 C38 contract provenance deterministic regeneration

on:
  push:
    branches:
      - fix/contracts-r9-tenant-provision-response-20261113

permissions:
  contents: write

jobs:
  regenerate-c38:
    if: startsWith(github.event.head_commit.message, 'r12-run-generator')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout R12 branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/contracts-r9-tenant-provision-response-20261113
          fetch-depth: 0
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install governance prerequisites
        run: python -m pip install pytest==9.1.1 PyYAML==6.0.2 jsonschema==4.26.0
      - name: Regenerate, check, remove workflow, and commit only governed outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/r12-contracts-regenerate-once.yml
          git add -A
          python scripts/ci/capability_linker.py --apply
          python scripts/ci/capability_mapping_engine.py --generate
          python scripts/ci/capability_evidence_maturity_engine.py --generate
          python scripts/ci/capability_shadow_reconciliation.py --generate
          python scripts/ci/capability_parity_investment_engine.py --generate
          python scripts/ci/capability_management_engine.py --generate
          python scripts/ci/pr_capability_impact_gate.py --generate-index
          python scripts/ci/static_governance_closure.py --generate
          python scripts/ci/capability_shadow_reconciliation.py --check
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("docs/capability-registry/generated/evidence/capability_evidence_matrix.json")
          rows = json.loads(p.read_text(encoding="utf-8"))["capabilities"]
          fm = next(row for row in rows if row["capability_id"] == "FM-001")
          expected_unit = "tests_v9/test_tenant_provision_response_shape.py"
          assert fm["assessed_maturity"] == 2, fm
          assert fm["maturity_alignment"] == "declared_above_evidence", fm
          assert fm["runtime_verified"] is False, fm
          assert fm["evidence"]["integration_tests"] is False, fm
          assert expected_unit in fm["unit_test_paths"], fm["unit_test_paths"]
          assert expected_unit not in fm["integration_test_paths"], fm["integration_test_paths"]
          print("R12 FM-001 source-only contract proof: PASS")
          PY
          python -m pytest -q --noconftest tests_v9/test_tenant_provision_response_shape.py
          # Release is generated after every other artifact; the sweep checks the release.
          python scripts/release/build_release_bundle.py
          git add -A
          python scripts/ci/verify_all_generated.py --check
          python scripts/release/validate_release_package.py
          python -m pytest -q --noconftest tests/architecture/test_capability_mapping_engine.py tests/architecture/test_capability_compatibility_roundtrip_guard.py
          python - <<'PY'
          import subprocess
          changed = subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines()
          allowed_exact = {
              ".github/workflows/r12-contracts-regenerate-once.yml",
              "capabilities/registry/capabilities.json",
          }
          allowed_prefixes = (
              "capabilities/generated/",
              "docs/capability-registry/generated/",
              "governance/generated/",
              "release/",
          )
          forbidden = [p for p in changed if p not in allowed_exact and not p.startswith(allowed_prefixes)]
          if forbidden:
              raise SystemExit(f"R12 refuses to commit unrelated source paths: {forbidden}")
          print("R12 governed paths:", *changed, sep="\n")
          PY
          git diff --cached --quiet && { echo 'No generated changes: no release commit'; exit 1; }
          git commit -m 'chore(contracts): regenerate evidence and checksums for R12 latest main'
          git push origin HEAD:refs/heads/fix/contracts-r9-tenant-provision-response-20261113
