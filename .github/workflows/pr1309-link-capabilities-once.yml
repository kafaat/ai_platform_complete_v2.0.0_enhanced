# One-shot scoped generator; removes itself before scanning the final index.
name: PR1309 regenerate conservative capability links once
on:
  push:
    branches:
      - test/ui-quality-accessibility-e2e-20261031
    paths:
      - .github/workflows/pr1309-link-capabilities-once.yml
permissions:
  contents: write
jobs:
  link:
    if: ${{ github.repository == 'kafaat/ai_platform_complete_v2.0.0_enhanced' && github.ref == 'refs/heads/test/ui-quality-accessibility-e2e-20261031' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Regenerate source-bound links and their release/governance checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'test/ui-quality-accessibility-e2e-20261031'
          git rm -- .github/workflows/pr1309-link-capabilities-once.yml
          python scripts/ci/capability_linker.py --apply
          python scripts/ci/capability_linker.py --check
          python - <<'PY'
          from pathlib import Path
          import hashlib
          def update_manifest(name, targets):
              path = Path(name)
              lines = path.read_text(encoding="utf-8").splitlines()
              changed = set()
              for i, line in enumerate(lines):
                  if "  " not in line:
                      continue
                  _, rel = line.split("  ", 1)
                  if rel in targets:
                      digest = hashlib.sha256(Path(rel).read_bytes()).hexdigest()
                      lines[i] = f"{digest}  {rel}"
                      changed.add(rel)
              if changed != set(targets):
                  raise SystemExit(f"Missing checksum targets in {name}: {set(targets)-changed}")
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          candidate = "capabilities/generated/capability_link_candidates.csv"
          registry = "capabilities/registry/capabilities.json"
          static = "governance/generated/STATIC_GOVERNANCE_ARTIFACTS.sha256"
          update_manifest(static, [candidate])
          update_manifest("release/FILE_CHECKSUMS.sha256", [candidate, registry, static])
          PY
          git add -- capabilities/registry/capabilities.json capabilities/generated/capability_link_candidates.csv \
            governance/generated/STATIC_GOVERNANCE_ARTIFACTS.sha256 release/FILE_CHECKSUMS.sha256
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate conservative capability links and pinned manifest hashes'
          git push origin HEAD:refs/heads/test/ui-quality-accessibility-e2e-20261031
