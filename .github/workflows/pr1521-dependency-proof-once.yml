name: PR1521 one-shot dependency verification and release regeneration
on:
  push:
    paths:
      - .github/workflows/pr1521-dependency-proof-once.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prod-pest-ack-hotfix-20261117
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate exact dependency checksum and validate release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          rel = "services/sahool-platform/api/requirements.txt"
          ledger = Path("release/FILE_CHECKSUMS.sha256")
          rows = ledger.read_text().splitlines()
          count = 0
          for i, row in enumerate(rows):
              if row.endswith("  " + rel):
                  rows[i] = hashlib.sha256(Path(rel).read_bytes()).hexdigest() + "  " + rel
                  count += 1
          assert count == 1, count
          ledger.write_text("\n".join(rows) + "\n")
          PY
          python scripts/release/validate_release_package.py
      - name: Verify dependency resolution
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --dry-run -r services/sahool-platform/api/requirements.txt > /tmp/pr1521-resolution.log
          tail -n 6 /tmp/pr1521-resolution.log
      - name: Remove temporary workflow and push only verified checksum
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr1521-dependency-proof-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/FILE_CHECKSUMS.sha256 .github/workflows/pr1521-dependency-proof-once.yml
          git commit -m 'build(release): attest patched platform dependency checksum'
          git push origin HEAD:fix/prod-pest-ack-hotfix-20261117
