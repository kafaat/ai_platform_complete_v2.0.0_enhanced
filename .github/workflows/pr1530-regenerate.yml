name: PR 1530 Regenerate and Verify
on:
  push:
    branches:
      - fix/sahool-wiring-acceptance-20261118
    paths:
      - .github/workflows/pr1530-regenerate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr1530-regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.repository == 'kafaat/ai_platform_complete_v2.0.0_enhanced' && github.ref == 'refs/heads/fix/sahool-wiring-acceptance-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/sahool-wiring-acceptance-20261118
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install verification dependencies
        run: python -m pip install pytest pytest-asyncio ruff
      - name: Generate governance, inventory, and release evidence
        run: |
          set -euo pipefail
          python scripts/ci/tenant_guc_scope_guard.py --generate
          python scripts/ci/generate_service_inventory.py --write-registry
          python scripts/ci/api_versioning_policy_guard.py
          python scripts/ci/platform_route_budget_guard.py --write-generated
          python scripts/ci/platform_route_ownership_guard.py --write-generated
          python scripts/ci/platform_route_governance_attestation.py --write-generated
          python scripts/release/platform_route_release_binding.py --write-source
          python scripts/release/build_release_bundle.py --root .
          git diff --check
          git diff --stat
      - name: Check regenerated evidence
        run: |
          set -euo pipefail
          python scripts/ci/tenant_guc_scope_guard.py --check
          python scripts/ci/generate_service_inventory.py --check
          python scripts/ci/api_versioning_policy_guard.py --check
          python scripts/ci/platform_route_budget_guard.py --check-generated
          python scripts/ci/platform_route_ownership_guard.py --check-generated
          python scripts/ci/platform_route_governance_attestation.py --check-generated
          python scripts/release/platform_route_release_binding.py --check-source
          python scripts/release/validate_release_package.py --root .
          ruff check .
          python -m pytest -q tests/ci/test_phase16_ci_cd_gates.py tests/deploy/test_phase15_deployment_readiness_contracts.py tests/release/test_phase14_release_packaging_contracts.py tests/observability/test_phase13_observability_assets.py tests/security/test_phase12_final_production_gates.py
      - name: Commit exact regenerated outputs to PR branch
        run: |
          set -euo pipefail
          git add -u
          git diff --cached --check
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): regenerate PR 1530 inventories, provenance, and release evidence"
          git push origin HEAD:refs/heads/fix/sahool-wiring-acceptance-20261118
