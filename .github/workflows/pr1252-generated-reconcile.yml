name: PR1252 Generated Artifact Reconciliation
on:
  push:
    branches:
      - chatgpt/livekit-readiness-security-20261020
permissions:
  contents: write
concurrency:
  group: pr1252-generated-reconcile
  cancel-in-progress: false
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install test dependencies for source generators
        run: python -m pip install -r tests_v9/requirements-test.txt
      - name: Regenerate tracked source evidence without weakening gates
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/chatgpt/livekit-readiness-security-20261020'
          git rm -f -- .github/workflows/pr1252-generated-reconcile.yml
          git add -A
          python scripts/release/build_release_bundle.py
          git add -A
          python scripts/ci/verify_all_generated.py --fix
          git add -A
          python scripts/release/build_release_bundle.py
          git add -A
          python scripts/ci/verify_all_generated.py --fix
          git add -A
          python scripts/release/build_release_bundle.py
          git add -A
          python scripts/ci/verify_all_generated.py --check
          python scripts/release/validate_release_package.py
          git status --short
      - name: Commit generated results to PR branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No generated changes'; exit 0; }
          git commit -m 'chore(generated): reconcile PR1252 with main and verify deterministic artifacts'
          git push origin HEAD:refs/heads/chatgpt/livekit-readiness-security-20261020
