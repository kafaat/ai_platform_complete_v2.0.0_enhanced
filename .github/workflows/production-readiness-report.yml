name: Production Readiness Report

# أداة مشغّل تُستدعى يدويّاً — نفس نمط `runtime-image-provenance.yml` و
# `path3-runtime-verification.yml`. **ليست بوّابة PR عمداً:** البوّابات السبع التي
# يُشغّلها محجوبة أصلاً كلٌّ في وظيفتها، فتشغيلها هنا على كلّ دفعة تكرارٌ خالص.
# قيمتها أنّها تجمعها في تقرير واحد مؤرشَف قبل نشرٍ حيّ، حيث لا CI.
#
# والوصل ليس شكليّاً: السكربت يُستدعى فعلاً هنا. سكربتٌ يذكر `--check` ولا يعرفه أيّ
# workflow يُوقِف `verify_all_generated` — والمخرج الخطأ كان تصنيفه «انحرافاً معروفاً»
# في أساسٍ **صفريّ يتقلّص ولا ينمو**، أي وسمَه مولّداً وهو ليس كذلك.

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full 40-char commit SHA this checkout must match
        required: false
        default: ""
      full_unit:
        description: Also run the unit suite (adds ~4 min)
        type: boolean
        required: false
        default: false
      repository_tests:
        description: Run the blocking Repository Tests job (pytest tests/)
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: production-readiness-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      FULL_UNIT: ${{ inputs.full_unit }}
      REPOSITORY_TESTS: ${{ inputs.repository_tests }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install gate dependencies
        run: pip install -q -r requirements.txt
      # المسابير الحيّة وفحوص PostgreSQL تحتاج مكدّساً قائماً، ولا مكدّس هنا؛
      # فتُتخطّى وتظهر في `critical_skipped` صراحةً — لا تُبتلَع في «صفر إخفاقات».
      - name: Collect readiness evidence (static gates only)
        run: |
          set -euo pipefail
          [[ -z "$EXPECTED_SHA" || "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          args=(--project-dir . --output artifacts/production-readiness/report.json)
          [[ -n "$EXPECTED_SHA" ]] && args+=(--expected-sha "$EXPECTED_SHA")
          case "$FULL_UNIT" in true) args+=(--full-unit) ;; false) ;; *) exit 2 ;; esac
          case "$REPOSITORY_TESTS" in true) args+=(--repository-tests) ;; false) ;; *) exit 2 ;; esac
          python scripts/release/production_readiness_orchestrator.py \
            "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-readiness-report-${{ github.sha }}
          path: artifacts/production-readiness/report.json
          if-no-files-found: error
          retention-days: 30
