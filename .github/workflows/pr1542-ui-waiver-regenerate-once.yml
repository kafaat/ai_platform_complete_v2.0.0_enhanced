name: PR1542 UI waiver generated artifacts repair
on:
  push:
    branches:
      - upgrade/staging-platform-sharing-soil-water-20261119
    paths:
      - .github/workflows/pr1542-ui-waiver-regenerate-once.yml
permissions:
  contents: write
concurrency:
  group: pr1542-ui-waiver-repair
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: upgrade/staging-platform-sharing-soil-water-20261119
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install generator dependencies
        run: python -m pip install pytest==9.1.1 PyYAML==6.0.2 jsonschema==4.26.0 httpx PyJWT
      - name: Stage removal of this temporary workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/pr1542-ui-waiver-regenerate-once.yml
          git add -A
      - name: Regenerate and validate all artifacts
        env:
          PYTHONIOENCODING: utf-8
        run: bash scripts/ci/regenerate_all_generated.sh
      - name: Validate fixed waiver contract
        run: |
          set -euo pipefail
          python -m pytest -q tests_v9/test_endpoint_ui_coverage_gate.py tests_v9/test_platform_catalog_gate.py
          git diff --check
          git add -u
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Commit and push only if checks passed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(staging): reconcile UI waiver and generated release evidence"
            git push origin HEAD:refs/heads/upgrade/staging-platform-sharing-soil-water-20261119
          fi
