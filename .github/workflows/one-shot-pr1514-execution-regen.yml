# One-shot generated artifact reconciliation for PR #1514 follow-up. Removes itself
# before the final tree is checked. This action never deploys to Railway or main.
name: One-shot PR1514 execution outcome generated artifacts
on:
  push:
    branches:
      - fix/pr1514-pest-execution-outcome-20261117
permissions:
  contents: write
jobs:
  regenerate:
    if: github.ref == 'refs/heads/fix/pr1514-pest-execution-outcome-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install repository test tooling
        run: pip install -r tests_v9/requirements-test.txt
      - name: Format the two authored Python files under pinned CI Ruff
        run: |
          set -euo pipefail
          pip install -c constraints-ci-tools.txt ruff
          ruff check --fix services/sahool-platform/core/pest_escalation_flow.py services/sahool-platform/tests/test_pest_execution_outcome.py
          ruff format services/sahool-platform/core/pest_escalation_flow.py services/sahool-platform/tests/test_pest_execution_outcome.py
      - name: Reconcile tracked generated outputs, remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm '.github/workflows/one-shot-pr1514-execution-regen.yml'
          git add -A
          python scripts/ci/verify_all_generated.py --fix
          git add -A
          python scripts/ci/verify_all_generated.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(generated): reconcile PR1514 execution outcome follow-up [regen]'
          git push origin HEAD:'fix/pr1514-pest-execution-outcome-20261117'
