name: Capability Governance

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  capability-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      # jsonschema: this job runs `verify_all_generated`, and the sweep DISCOVERS its
      # step list from the workflows — so it picks up `schema_validation_guard.py --check`
      # even though that step is declared in ci.yml. A gate the sweep can invoke must have
      # its dependencies wherever the sweep runs, not only where the step was written.
      # Measured on PR #787: installed in Repository Structural Lint alone, and this job
      # failed with "closed rather than skipping quietly" — the guard refusing to fake a
      # pass without its library, which is the behaviour it was built to have.
      - name: Install test runner
        run: pip install pytest==9.1.1 PyYAML==6.0.2 jsonschema==4.26.0
      - name: Validate architecture graph drift
        run: python scripts/ci/architecture_graph.py --check
      - name: Validate API versioning inventory and legacy-route ratchet
        run: python scripts/ci/api_versioning_policy_guard.py --check
      # الخضرة الزائفة: دالّة test_* بلا assert/raises وتُرجِع قيمة لا يمكن أن تفشل
      # (pytest يُهمِل القيمة الراجعة). المجموعة مُجمَّدة وتتقلّص ولا تنمو.
      - name: Reject new tests that cannot fail (no assertion, returns a value)
        run: python scripts/ci/assertion_presence_guard.py --check
      # وصنفٌ ثانٍ من الخضرة الزائفة: `test.fixme` يجعل الاختبار **يُعَدّ ولا يُنفَّذ**،
      # فيقول تقرير Playwright «0 failed» صادقاً حرفيّاً وكاذباً دلاليّاً. الراتشِت يحجب
      # الزيادة **والنقصان بلا خفض الأساس** — سقفٌ مُرتخٍ يبتلع عودة الدَّين صامتاً.
      - name: Visual test debt must not accumulate (test.fixme ratchet)
        run: python scripts/ci/visual_fixme_baseline_guard.py
      - name: Validate platform route release source binding
        run: python scripts/release/platform_route_release_binding.py --check-source
      - name: Validate runtime contract drift
        run: python scripts/ci/runtime_contract_generator.py --check
      - name: Validate decision lineage drift
        run: python scripts/ci/decision_lineage_graph.py --check
      - name: Validate execution dependency audit drift
        run: python scripts/ci/execution_dependency_audit.py --check
      - name: Reject duplicate definitions in the same lexical scope
        run: python scripts/ci/duplicate_definition_guard.py --check
      - name: Validate router reachability inventory
        run: python scripts/ci/router_reachability_guard.py --check
      - name: Validate route conflict inventory
        run: python scripts/ci/route_conflict_guard.py --check
      - name: Validate event contract graph drift
        run: python scripts/ci/event_contract_graph.py --check
      - name: Validate gateway reachability inventory
        run: python scripts/ci/gateway_reachability_guard.py --check
      - name: Validate database contract graph drift
        run: python scripts/ci/database_contract_graph.py --check
      - name: Validate RLS policy inventory
        run: python scripts/ci/rls_policy_guard.py --check
      - name: Validate migration graph
        run: python scripts/ci/migration_graph_guard.py --check
      - name: Validate functional probe plans
        run: python scripts/ci/functional_probe_runner.py --check
      - name: Validate runtime identity trust bridge
        run: python scripts/ci/runtime_identity_bridge.py --check
      - name: Assert clean checkout remains zero in bridge dry-run
        run: |
          output="$(python scripts/ci/runtime_identity_bridge.py --dry-run --target-sha "$GITHUB_SHA")"
          printf '%s\n' "$output"
          grep -F "would_set_runtime_verified: 0" <<<"$output"
          grep -F "production_certified: 0" <<<"$output"
      - name: Validate runtime verification harness plan
        run: python scripts/ci/runtime_verification_harness.py --check
      - name: Validate runtime evidence ingestion (fail-closed)
        run: python scripts/ci/runtime_evidence_ingestion.py --check
      - name: Validate runtime certification gate (fail-closed)
        run: python scripts/ci/runtime_certification_gate.py --check
      - name: Validate PATH-2 integration runtime governance closure
        run: python scripts/ci/integration_runtime_governance_closure.py --check
      - name: Validate capability registry
        run: python scripts/ci/capability_registry_guard.py --check
      - name: Validate capability linkage runtime evidence
        run: python scripts/ci/capability_runtime_evidence.py --check
      - name: Validate canonical Capability Registry v1
        run: python scripts/ci/capability_registry_v1.py --check
      - name: Validate forensic capability mapping drift
        run: python scripts/ci/capability_mapping_engine.py --check
      - name: Validate capability evidence and maturity baseline
        run: python scripts/ci/capability_evidence_maturity_engine.py --check
      - name: Validate capability parity and investment baseline
        run: python scripts/ci/capability_parity_investment_engine.py --check
      - name: Validate roadmap-to-capability linkage
        run: python scripts/ci/capability_roadmap_linker.py --check
      - name: Validate conservative capability linker drift
        run: python scripts/ci/capability_linker.py --check
      - name: Validate capability release history
        run: python scripts/ci/capability_release_history.py --check
      - name: Validate unified capability management layer
        run: python scripts/ci/capability_management_engine.py --check
      - name: Enforce capability-core production consumption
        run: python scripts/ci/capability_core_consumption_guard.py --check
      # «مستهلك» ليس «قابل للوصول»: وحدةٌ يستوردها مستهلكٌ لا يستدعيه شيء تبقى ميتة،
      # ويمرّ عليها كلّ فحص استيراد ساذج. يصنّف كلّ وحدة بجذرها التنفيذيّ الحقيقيّ.
      - name: Classify platform module reachability by executable root
        run: python scripts/ci/platform_module_reachability_guard.py --check
      - name: Validate capability impact index drift
        run: python scripts/ci/pr_capability_impact_gate.py --check-index
      - name: Enforce declared PR capability impact
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git cat-file -e "$BASE_SHA^{commit}" || git fetch --no-tags origin "$BASE_SHA"
          git cat-file -e "$HEAD_SHA^{commit}" || git fetch --no-tags origin "pull/$PR_NUMBER/head"
          printf '%s' "$PR_BODY" > /tmp/pr-body.txt
          python scripts/ci/pr_capability_impact_gate.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --pr-body-file /tmp/pr-body.txt \
            --output /tmp/capability-impact.json
      - name: Validate PATH-1 static governance closure
        run: python scripts/ci/static_governance_closure.py --check
      - name: Run capability governance + architecture-graph tests
        run: |
          python -m pytest -q \
            tests/architecture/test_capability_registry_guard.py \
            tests/architecture/test_capability_traceability.py \
            tests/architecture/test_architecture_graph.py \
            tests/architecture/test_runtime_contract_generator.py \
            tests/architecture/test_decision_lineage_graph.py \
            tests/architecture/test_execution_dependency_audit.py \
            tests/architecture/test_duplicate_definition_guard.py \
            tests/architecture/test_router_reachability_guard.py \
            tests/architecture/test_route_conflict_guard.py \
            tests/architecture/test_event_contract_graph.py \
            tests/architecture/test_gateway_reachability_guard.py \
            tests/architecture/test_database_contract_graph.py \
            tests/architecture/test_functional_probe_plan.py \
            tests/architecture/test_runtime_identity_bridge.py \
            tests/architecture/test_runtime_evidence_trust_hardening.py \
            tests/architecture/test_runtime_build_identity_attestation.py \
            tests/architecture/test_runtime_verification_harness.py \
            tests/architecture/test_runtime_evidence_ingestion.py \
            tests/architecture/test_runtime_certification_gate.py \
            tests/architecture/test_integration_runtime_governance_closure.py \
            tests/architecture/test_capability_registry_v1.py \
            tests/architecture/test_capability_mapping_engine.py \
            tests/architecture/test_capability_evidence_maturity_engine.py \
            tests/architecture/test_capability_parity_investment_engine.py \
            tests/architecture/test_capability_roadmap_linker.py \
            tests/architecture/test_capability_linker.py \
            tests/architecture/test_capability_release_history.py \
            tests/architecture/test_capability_management_engine.py \
            tests/architecture/test_capability_truth_preconditions.py \
            tests/architecture/test_capability_regression_gate.py \
            tests/architecture/test_pr_capability_impact_gate.py \
            tests/architecture/test_path3_run_attestation.py \
            tests/architecture/test_path3_attestation_policy.py \
            tests/architecture/test_path3_live_acceptance_gate.py \
            tests/architecture/test_static_governance_closure.py \
            tests/architecture/test_verify_all_generated.py \
            tests/architecture/test_check_steps_are_read_only.py \
            tests/architecture/test_marker_coverage_guard.py \
            tests/architecture/test_arch_test_ci_coverage_guard.py \
            tests/architecture/test_brain_commit_claim_guard.py \
            tests/architecture/test_brain_deferral_registry_guard.py \
            tests/architecture/test_brain_state_consistency.py \
            tests/architecture/test_brain_state_transition_guard.py \
            tests/architecture/test_capability_core_consumption_guard.py \
            tests/architecture/test_immutable_build_wrapper_behaviour.py \
            tests/architecture/test_immutable_local_build_entrypoints.py \
            tests/architecture/test_phase21_legacy_quarantine.py \
            tests/architecture/test_phase21_source_of_truth.py \
            tests/architecture/test_platform_route_placement_guard.py \
            tests/architecture/test_provenance_receipt_and_replay.py \
            tests/architecture/test_runtime_probe_batch.py \
            tests/architecture/test_runtime_verification_apply.py \
            tests/architecture/test_runtime_verification_promotion_workflow.py \
            tests/architecture/test_runtime_environment_preflight.py \
            tests/architecture/test_compose_runtime_target_resolver.py \
            tests/architecture/test_path3_runtime_readiness_closure.py \
            tests/architecture/test_generate_service_inventory.py \
            tests/architecture/test_raster_service_route_migration_plan.py \
            tests/release/test_platform_route_release_binding.py
      # ARCH-TESTS-UNLISTED-IN-CI-01: القائمة أعلاه **يدويّة**، وكانت تبيت بصمت —
      # ١٧ من ٥٤ اختباراً خارجها، منها حرّاس بُنيت في اليوم نفسه. هذا الحارس يقارنها
      # بمحتوى المجلّد، فملفّ جديد غير مُدرَج يُسقِط CI بدل أن يمرّ غير منفَّذ.
      - name: Every architecture test must be run by a workflow
        run: python scripts/ci/arch_test_ci_coverage_guard.py
      - name: Verify runtime environment preflight artifact
        run: python scripts/ci/runtime_environment_preflight.py --check
      - name: Verify Compose runtime target resolution
        run: python scripts/ci/compose_runtime_target_resolver.py --check
      - name: Verify PATH-3 runtime readiness closure
        run: python scripts/ci/path3_runtime_readiness_closure.py --check
      # المكنسة (#691) لم تكن موصولة بأيّ workflow — لا هي ولا اختبارها. أداة تُشغَّل
      # يدويّاً لا تحرس شيئاً؛ وهي الحالة الثالثة اليوم لـARCH-TESTS-UNLISTED-IN-CI-01.
      # تعمل **أخيراً**: تُعيد فحص ما سبق، وتلتقط ما لا يلتقطه أيّ فحص منفرد —
      # حارساً كتب أثناء الفحص (CHECK-STEPS-MUTATE-THE-TREE-01).
      - name: Sweep every generated artifact, and catch guards that write while checking
        run: python scripts/ci/verify_all_generated.py

  # MERGED-WHILE-A-REVIEW-WAS-IN-FLIGHT-01 — القفل خارج المستودع، فيُدقَّق وجودُه.
  #
  # العطل وقع **مرّتين**: #810 دُمِج قبل وصول REQUEST_CHANGES، و#816 بعد إنشاء تعليقَي
  # المراجعة بـ٤١ ثانية. والدرس كان مكتوباً في hot.md منذ 2026-08-07 — فتكرارُه بعد
  # تسجيله هو الدليل على أنّ التسجيل لا يفرض.
  #
  # ووظيفةٌ تقرأ الخيوط لا تُغلِق السباق: خيطٌ يُفتَح **بين** الفحص والدمج غير مرئيّ
  # لفحصٍ اخضرّ سلفاً. الذي يُعطّل الزرّ إعدادُ الحماية نفسه — وهذه الوظيفة تمنع
  # إطفاءه **صامتاً**، لا أكثر. حدّ المدى مكتوب في الحارس.
  #
  # وهي وظيفة مستقلّة لا خطوة في `capability-registry`: تحتاج سرّاً لا تحتاجه تلك،
  # وفشلُها يقول شيئاً آخر تماماً — «الحماية غير مضبوطة» لا «الحوكمة انحرفت».
  branch-protection-contract:
    name: Conversation resolution must be required before merging
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # `fetch-depth: 0` لأنّ البند المشروط يشتقّ ما مسّته الـPR بـ`merge-base`،
      # واستنساخٌ بعمق ١ لا يملك سلفاً مشتركاً فيموت الاشتقاق `no merge base`.
      # وهذا قِيس على هذه الـPR نفسها بعد جعل الاشتقاق يفشل مغلقاً — تفصيلُه أدناه.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      # الشبكة هنا والحكم في الحارس — قسمةٌ تُرضي درسين متعارضين:
      #   · منطقٌ مدفون في `run: |` لا يُقاس إلّا بتشغيل الوظيفة كاملةً
      #     (درس `resilient_docker_pull.sh` المكتوب في ci.yml)؛
      #   · وحالةُ GitHub لا تدخل أداةً محلّيّة (عقد test_local_preflight_contract).
      # فتُجسَّد الاستجابة في ملفّ ويُحكَم عليها — كما يفعل `--pr-body-file` تماماً.
      #
      # تُقرأ **القواعد النافذة** (`rules/branches/main`) لا الحماية الكلاسيكيّة:
      # القفل مُفعَّل عبر Ruleset، و`branches/main/protection` أجابت 404 Branch not
      # protected (تشغيل 31407522822) — فكان الحارس يسأل عن آليّةٍ غير المستعمَلة.
      # ويبقى السرّ لأنّه مضبوط ومُثبَت؛ تقليل الصلاحية قياسٌ مستقلّ لا يُخلَط بهذا.
      #
      # الفشل يجب أن يُشخّص نفسه. «صفر قاعدة» احتمل سببين: إمّا أنّ الـRuleset لا
      # ينطبق على `main`، وإمّا أنّ سرّ التدقيق أعمى عن الـrulesets فتعود له `[]`.
      # قِيسا بعينَين في تشغيل 31417746270 (سرّ التدقيق + GITHUB_TOKEN الافتراضيّ):
      # **كلاهما رأى صفراً** — فسقط عمى الرمز، وبقي أنّ الـRuleset غير نافذ على main.
      #
      # فالسؤال التالي: أين هو إذن؟ نطبع جردَ الـrulesets نفسها (اسم · هدف · حالة
      # الإنفاذ · أنماط الفروع المشمولة) فيُسمّي الفشلُ الحقلَ الواجب تصحيحه بدل أن
      # يترك المالك يخمّن بين «Active غير محفوظة» و«هدفٍ لا يطابق main».
      # (`repos/{repo}/rulesets` يحتاج صلاحية إدارة؛ نتسامح مع تعذّرها ولا نحجب بها.)
      #
      # ولا تحكم الصدفة على رمز HTTP: `curl` يُسجّل الحالة كما هي (`-w '%{http_code}'`)
      # ويكتب الجسم دائماً، فتصل `401/403/404/429/5xx` إلى الحارس **بنداً في العقد** لا
      # إجهاضاً بـ`set -e`. حكمٌ مدفون في `run: |` لا يُقاس إلّا بتشغيل الوظيفة كاملةً.
      - name: Fetch the protection contract for main
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_AUDITOR_TOKEN }}
          REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || {
            echo '::error::missing BRANCH_PROTECTION_AUDITOR_TOKEN — «لم يُقرأ» ليس «مضبوط»'
            exit 1
          }
          ENDPOINT="https://api.github.com/repos/${REPO}/rules/branches/main"
          HTTP_STATUS=$(curl -sS -o rules_body.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${ENDPOINT}" || echo '000')
          echo "HTTP ${HTTP_STATUS} ← ${ENDPOINT}"
          # جسمٌ غير قابل للتحليل (خنقٌ يُعيد HTML مثلاً) يُجسَّد null فيسقط في فحص
          # `rules` بدل أن يُسقِط الخطوة — الحكم في الحارس، والتسجيل هنا.
          jq -n \
            --arg schema 'sahool.branch-protection-evidence.v1' \
            --arg repo "${REPO}" \
            --arg branch 'main' \
            --arg endpoint "${ENDPOINT}" \
            --arg sha "${TESTED_SHA}" \
            --argjson status "${HTTP_STATUS}" \
            --argjson rules "$(jq -c '.' rules_body.json 2>/dev/null || echo null)" \
            '{schema_version: $schema, repository: $repo, branch: $branch,
              endpoint: $endpoint, http_status: $status, commit_sha: $sha, rules: $rules}' \
            > protection.json
          echo '— القواعد النافذة على main —'
          jq -r 'if (.rules | type) != "array" then "(لا مصفوفة قواعد — استجابةٌ ليست قراءة)"
                 elif (.rules | length) == 0 then "(صفر قاعدة)"
                 else .rules[].type end' protection.json
          echo '— جردُ الـrulesets المُعرَّفة (اسم · هدف · إنفاذ · فروع مشمولة) —'
          if gh api "repos/${REPO}/rulesets" > rulesets.json 2>/dev/null; then
            jq -r 'if length == 0 then "(لا ruleset معرَّف إطلاقاً)" else .[] | "\(.id)\t\(.name)\ttarget=\(.target)\tenforcement=\(.enforcement)" end' rulesets.json
            for id in $(jq -r '.[].id' rulesets.json); do
              gh api "repos/${REPO}/rulesets/${id}" \
                | jq -r '"  ↳ \(.name): include=\(.conditions.ref_name.include // "—") exclude=\(.conditions.ref_name.exclude // "—") rules=\([.rules[].type] | join(","))",
                         "     pull_request.parameters=\([.rules[] | select(.type == "pull_request") | .parameters] | if length == 0 then "(لا قاعدة pull_request)" else .[0] | tojson end)",
                         "     required_status_checks.parameters=\([.rules[] | select(.type == "required_status_checks") | .parameters] | if length == 0 then "(لا قاعدة required_status_checks)" else .[0] | tojson end)"' \
                || echo "  ↳ ${id}: (تعذّرت قراءة التفاصيل)"
            done
          else
            echo '(تعذّر جردُ الـrulesets — السرّ بلا صلاحية إدارة؛ ليس حكماً على الإعداد)'
          fi
      - name: Conversation resolution must be required before merging
        env:
          REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # GATE01-AUTHORIZATION-ORIGIN-UNENFORCED-01: البند المشروط يحتاج معرفة
          # ما مسّته الـPR. الاشتقاق هنا لا في الحارس — `scripts/ci/**` لا يستدعي
          # GitHub ولا يقرأ حالته (عقد `test_local_preflight_contract`).
          #
          # **ويفشل مغلقاً، ورفعته مراجعةٌ آليّة أصابت:** الصيغة الأولى كانت
          # `git diff … > changed.txt || : > changed.txt` — فأيّ تعذّر في الجلب أو
          # الاشتقاق يكتب قائمةً **فارغة**، فيقرأ الحارس «لم تُمَسّ التفويضات»
          # ويُطفَأ البند الحاجب صامتاً. وقائمةٌ فارغة عن فشلٍ تُقرأ كقائمةٍ فارغة
          # عن براءة، ولا شيء يفرّق بينهما — وهو بعينه الصنف الذي تطارده هذه الـPR.
          #
          # **وأوّل تشغيلٍ صادق كذّب الاشتقاق نفسه** (94753838446):
          # `fatal: origin/main...HEAD: no merge base` — الاستنساخ بعمق ١ والجلب
          # بـ`--depth=1` لا يلتقيان في سلف. أي أنّ `changed.txt` كانت **فارغة في
          # كلّ تشغيلٍ سابق**، والبند المشروط لم يُقيَّم مرّةً واحدة منذ كُتِب. فسقط
          # الشحّ في العمق (`fetch-depth: 0` أعلاه) وسقط `--depth=1` هنا.
          if [ -n "${BASE_REF}" ]; then
            git fetch origin "${BASE_REF}" -q
            git diff --name-only "origin/${BASE_REF}...HEAD" > changed.txt
          elif [ -n "${PUSH_BEFORE:-}" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            # على `push` لا PR ولا `base_ref`؛ والمقيس عندئذٍ ما أضافته الدفعة نفسها.
            git diff --name-only "${PUSH_BEFORE}" "${GITHUB_SHA}" > changed.txt
          else
            echo "✗ تعذّر اشتقاق ما مسّه هذا الحدث — ولا يُقرأ التعذّر «لم يُمَسّ»." >&2
            exit 1
          fi
          echo "— المسارات المشتقّة: $(wc -l < changed.txt) —"
          python scripts/ci/branch_protection_contract_guard.py \
            --protection-file protection.json \
            --expect-repository "${REPO}" \
            --expect-sha "${TESTED_SHA}" \
            --changed-files changed.txt
