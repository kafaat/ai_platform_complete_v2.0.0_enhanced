name: Field Workspace Production Closure

on:
  pull_request:
  push:
    branches: [main]

# أقلّ امتياز: كلّ ما تفعله هذه الوظيفة قراءةُ الشجرة وتشغيل بوّابات ساكنة — لا
# كتابة، ولا حِزَم، ولا نشر. والرمز الافتراضيّ أوسع من ذلك، والسعة التي لا تُستعمَل
# تبقى سطحاً قائماً.
permissions:
  contents: read

# دفعتان متتاليتان على نفس المرجع تُشغّلان جولتين؛ الأقدم تصير جواباً عن شجرةٍ لم
# تعد قائمة. تُلغى **في الـPR وحدها**: على main يبقى لكلّ التزامٍ مدموج سجلٌّ خاصّ به،
# وإلغاؤه يُفقِد الدليل عن التزامٍ هبط فعلاً.
concurrency:
  group: field-workspace-closure-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  field-workspace-closure:
    runs-on: ubuntu-24.04
    # المقيس ~٧٠ ثانية؛ والسقف الافتراضيّ ٦ ساعات. وظيفةٌ معلَّقة بلا سقف تُستهلِك
    # مُشغِّلاً وتُبقي الـPR «قيد التشغيل» بلا خبر — والانتظار الطويل يُقرأ عطلاً في
    # الفحص لا في الشجرة.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # الحُرّاس تستورد التطبيق الحيّ (api.main) عبر check_runtime_routes ⇒ تحتاج
      # تبعيّات المنصّة الكاملة (jwt/fastapi/asyncpg/numpy...) لا فقط مفسّر بايثون.
      # نفس أمر وظيفة Platform Unit Tests في ci.yml (المُتحقَّق نجاحه حيّاً) + تبعيّات
      # weather-service التي تحتاجها بوّابة العقد الحقيقيّ.
      - name: Install backend runtime dependencies
        run: |
          pip install -r tests_v9/requirements-test.txt -r services/sahool-platform/api/requirements.txt pillow
          pip install -r services/weather-service/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Field Workspace contract typecheck
        working-directory: frontend
        run: npm run typecheck:field-workspace-contract
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
      - name: Frontend JavaScript bundle budget
        working-directory: frontend
        run: npm run verify:bundle-budget
      - name: Layer registry contract test
        working-directory: frontend
        run: npx vitest run src/lib/layerRegistry.test.ts
      - name: Field Workspace Python closure gate
        run: |
          python scripts/ci/field_workspace_production_closure_gate.py
          python scripts/ci/edge_inference_service_contract_gate.py
          python scripts/ci/weather_service_real_contract_gate.py
      - name: Decision SoR cutover readiness gate
        run: python scripts/ci/decision_sor_cutover_readiness_gate.py
      - name: Decision SoR shadow promotion gate
        run: python scripts/ci/decision_sor_shadow_promotion_gate.py

      - name: Decision SoR staging probe gate
        run: python scripts/ci/decision_sor_staging_probe_gate.py
      - name: Decision SoR final certification gate
        run: python scripts/ci/decision_sor_final_certification_gate.py
      - name: Field Workspace guard tests
        run: |
          pytest -q \
            services/sahool-platform/tests/test_p0_raster_weather_decision_evidence_guard.py \
            services/sahool-platform/tests/test_p0_decision_sor_migration_guard.py \
            services/sahool-platform/tests/test_p0_2_decision_sor_cutover_readiness_guard.py \
            services/sahool-platform/tests/test_p0_3_decision_sor_shadow_promotion_guard.py \
            services/sahool-platform/tests/test_p0_4_decision_sor_staging_probe_guard.py \
            services/sahool-platform/tests/test_p0_5_decision_sor_final_certification_guard.py \
            services/sahool-platform/tests/test_p0_weather_service_real_contract_guard.py \
            services/sahool-platform/tests/test_ui20_field_workspace_backend_facade_guard.py \
            services/sahool-platform/tests/test_ui24_ui26_workspace_imagery_weather_irrigation_guard.py \
            services/sahool-platform/tests/test_ui27_backend_facades_guard.py \
            services/sahool-platform/tests/test_ui28_ui30_workspace_route_cleanup_guard.py \
            services/sahool-platform/tests/test_ui31_ui35_workspace_completion_guard.py

      # حدّ الادّعاء — يُكتَب في ملخّص الجولة نفسها لا في وثيقةٍ جانبيّة.
      #
      # اسم الوظيفة «Production Closure»، وأخضرُها يُقرأ «الإنتاج مُغلَق». والمقيس
      # فعلاً **عقودٌ ساكنة**: تحقّق أنواع، وبناء واجهة، وميزانية حزمة، وبوّابات نصّيّة،
      # واختبارات حرّاس. ولا بيئة حيّة في أيّ خطوة: لا قاعدة، ولا وسيط، ولا واجهة
      # منشورة، ولا طلبٌ واحد إلى خدمةٍ تعمل. فالفارق بين «العقود متماسكة» و«النظام
      # يعمل» ليس تفصيلاً — وهو الصنف المُسجَّل في هذا المستودع: **خضرةٌ عن سؤالٍ لم
      # يُطرَح**.
      #
      # و`if: always()` مقصود: الحدّ يُكتَب مع الأحمر أيضاً. حدٌّ يظهر عند النجاح وحده
      # يُقرأ تهنئةً، وهو أوان الحاجة إليه أقلّ من أوان الفشل.
      - name: Claim boundary — what this green does and does not say
        if: always()
        run: |
          {
            echo "## Field Workspace Production Closure — CONTRACT_CLOSURE_ONLY"
            echo
            echo "**المقيس هنا (ساكن):**"
            echo "- تحقّق أنواع عقد Field Workspace · بناء الواجهة للإنتاج · ميزانية الحزمة"
            echo "- سجلّ الطبقات (\`layerRegistry\`) · بوّابات إغلاق بايثون الثلاث"
            echo "- بوّابات Decision SoR الأربع (cutover · shadow · staging-probe · final)"
            echo "- ١٢ اختبار حارس تحت \`services/sahool-platform/tests/\`"
            echo
            echo "**وما لا يُقاس هنا — والخضرة لا تقوله:**"
            echo "- لا قاعدة بيانات حيّة، ولا PostGIS، ولا هجرة مُطبَّقة"
            echo "- لا وسيط MQTT/NATS، ولا أثر فيزيائيّ، ولا تحقّق من نتيجة تشغيل"
            echo "- لا واجهة منشورة، ولا طلب واحد إلى خدمةٍ تعمل"
            echo "- لا شهادة إنتاج: \`runtime_verified\` و\`production_certified\` لا تتحرّكان بهذه الجولة"
            echo
            echo "**فالخضرة تعني:** العقود المُعدَّدة أعلاه متماسكة على هذه الشجرة."
            echo "**ولا تعني:** أنّ النظام يعمل — ذلك يُقاس حيّاً، وهو خطوة منفصلة."
          } >> "$GITHUB_STEP_SUMMARY"
