# One-shot source-only verification and derived-artifact repair for #1525 unit regressions.
# No Railway source/variables/deploy, migrations, main merges or physical operations.
name: One-shot PR1525 unit regression certification
on:
  push:
    branches:
      - fix/pr1525-eight-unit-regressions-20261117
permissions:
  contents: write
concurrency:
  group: pr1525-unit-fix-${{ github.ref }}
  cancel-in-progress: false
jobs:
  certify-and-regenerate:
    if: github.ref == 'refs/heads/fix/pr1525-eight-unit-regressions-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the repository's existing test and lint toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r tests_v9/requirements-test.txt
          python -m pip install -c constraints-ci-tools.txt ruff
      - name: Remove temporary verification workflow before evaluating live guard surface
        shell: bash
        run: |
          set -euo pipefail
          git rm '.github/workflows/one-shot-pr1525-unit-repair-20261117.yml'
      - name: Exercise the eight failure classes on the integrated source
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests_v9/test_explorer_route_export_contract.py             tests_v9/test_text_encoding_locale.py             tests_v9/test_semantic_convergence_01.py             tests_v9/test_blocking_surface_freeze.py
      - name: Falsify R13 export guard using its named source mutation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/guard_mutation_guard.py --run --only scripts/ci/export_explorer_routes.py
      - name: Regenerate all derived files and verify a stable source tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          python scripts/ci/verify_all_generated.py --fix
          python scripts/ci/verify_all_generated.py --check
          python scripts/ci/guard_catalogue.py --check
          python scripts/ci/capability_registry_guard.py --check
          python scripts/release/validate_release_package.py --root .
          python -m pytest -q             tests_v9/test_guard_catalogue.py             tests/architecture/test_capability_mapping_engine.py             tests/architecture/test_ci_impact_preflight_skill_mapping.py             tests/architecture/test_verify_all_generated.py             tests/release/test_phase14_release_packaging_contracts.py
      - name: Commit derived proof after tests without leaving a temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(generated): certify R13 and RAG review-fix source and checksums'
          git push origin HEAD:fix/pr1525-eight-unit-regressions-20261117
