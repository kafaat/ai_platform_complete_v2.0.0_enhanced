name: SIM GOLDEN Certification

on:
  workflow_dispatch:
    inputs:
      dataset_path:
        description: Path to the protected runner-mounted golden dataset
        required: true
        type: string
      policy_path:
        description: Path to the operator policy matching the configured trusted digest
        required: true
        type: string

permissions:
  contents: read

jobs:
  sim-golden:
    runs-on: [self-hosted, sim-golden]
    environment: staging
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Evaluate held-out real harvest seasons
        env:
          SIM_GOLDEN_EVIDENCE_KEY: ${{ secrets.SIM_GOLDEN_EVIDENCE_KEY }}
          SIM_GOLDEN_POLICY_SHA256: ${{ vars.SIM_GOLDEN_POLICY_SHA256 }}
          DATASET_PATH: ${{ inputs.dataset_path }}
          POLICY_PATH: ${{ inputs.policy_path }}
        run: python3 scripts/simulation/sim_golden.py "$DATASET_PATH" --policy "$POLICY_PATH" --require-promotion-eligible
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sim-golden-evidence
          path: certification/evidence/sim_golden_summary.json
          if-no-files-found: error
          retention-days: 90
