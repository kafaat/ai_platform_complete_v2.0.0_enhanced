name: vegetation-container-contract

on:
  pull_request:
    paths:
      - 'services/vegetation-analysis-service/**'
      - 'docker-compose.v9.yml'
      - 'scripts/ci/vegetation_container_contract_guard.py'
      - 'tests_v9/test_vegetation_container_contract_guard.py'
  push:
    branches: [ main ]

# عبءُ أجهزة التشغيل: دفعٌ جديد إلى الـPR نفسه يلغي تشغيلَه الأقدم لهذا المسار (كـci.yml)؛ وأحداثُ
# غير الـPR مجموعتُها فريدة (run_id) فلا تُلغى ولا تُسلسَل — كلُّ دمجٍ إلى main يُفحص كاملاً.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}-{2}', github.workflow, github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    name: vegetation-container-contract / guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python scripts/ci/vegetation_container_contract_guard.py
      # conftest tests_v9 يستورد httpx/pydantic دائماً ⇒ بيئة الاختبار الكاملة
      # إلزاميّة لا pytest وحده (درس fresh-runner + conftest المُوثَّق).
      - run: python -m pip install -r tests_v9/requirements-test.txt
      - run: python -m pytest -q tests_v9/test_vegetation_container_contract_guard.py
