name: Report Index
on:
  pull_request:
  push:
    branches: [ main, develop ]
jobs:
  report-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/ci/report_index_guard.py --check
