name: PR-B temporary Ruff format diff (read-only)
on:
  pull_request:
    paths:
      - 'shared/feature_store/ml_quality_bridge.py'
      - 'tests/phase6/test_ml_quality_bridge.py'
      - '.github/workflows/prb-format-diagnostic.yml'
permissions:
  contents: read
jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -c constraints-ci-tools.txt ruff
      - name: Print formatter diff without writing source
        run: |
          ruff check shared/feature_store/ml_quality_bridge.py tests/phase6/test_ml_quality_bridge.py
          ruff format --diff shared/feature_store/ml_quality_bridge.py tests/phase6/test_ml_quality_bridge.py
