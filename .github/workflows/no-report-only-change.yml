name: No Report-only Change
on:
  pull_request:
jobs:
  no-report-only-change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check changed files
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD | python scripts/ci/no_report_only_change_guard.py --stdin
      - name: Prevent brain-only certification state transitions
        run: python scripts/ci/brain_state_transition_guard.py --base "origin/${{ github.base_ref }}" --head HEAD
      # BRAIN-DEFERRAL-LEAK-01: كلّ تأجيل في hot.md يحتاج معرّف فجوة مسجَّلاً.
      # القاعدة كانت عُرفاً في CLAUDE.md؛ هنا تصير إنفاذاً.
      - name: Deferrals in hot.md must be registered as gaps
        run: python scripts/ci/brain_deferral_registry_guard.py
      # BRAIN-CLAIM-UNVERIFIED-01: رسالة الالتزام تذكر معرّف فجوة ⇒ ادّعاء وجودها.
      - name: Gap IDs claimed in commit messages must exist in the registry
        run: python scripts/ci/brain_commit_claim_guard.py --base "origin/${{ github.base_ref }}" --head HEAD
