name: No Report-only Change
on:
  pull_request:
jobs:
  no-report-only-change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check changed files
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD | python scripts/ci/no_report_only_change_guard.py --stdin
