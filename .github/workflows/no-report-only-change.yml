name: No Report-only Change
on:
  pull_request:
jobs:
  no-report-only-change:
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check changed files
        run: |
          git diff --name-only "origin/${BASE_REF}...HEAD" | python scripts/ci/no_report_only_change_guard.py --stdin
      - name: Prevent brain-only certification state transitions
        run: python scripts/ci/brain_state_transition_guard.py --base "origin/${BASE_REF}" --head HEAD
      # BRAIN-DEFERRAL-LEAK-01: كلّ تأجيل في hot.md يحتاج معرّف فجوة مسجَّلاً.
      # القاعدة كانت عُرفاً في CLAUDE.md؛ هنا تصير إنفاذاً.
      - name: Deferrals in hot.md must be registered as gaps
        run: python scripts/ci/brain_deferral_registry_guard.py
      # BRAIN-CLAIM-UNVERIFIED-01: رسالة الالتزام تذكر معرّف فجوة ⇒ ادّعاء وجودها.
      - name: Gap IDs claimed in commit messages must exist in the registry
        run: python scripts/ci/brain_commit_claim_guard.py --base "origin/${BASE_REF}" --head HEAD
      # DETERMINISTIC-GENERATION-AND-MERGE-SAFETY-01 (L2): `merge=union` — المُفعَّل على
      # هذه الملفّات الأربعة في `.gitattributes` — يحلّ التعارض بضمّ سطور الجانبين.
      # وحين يُحرّر الجانبان **نفس السطر** (تحديث حالة فجوة من جلستين) يُبقي النسختين
      # ويخرج بـ0: فجوة واحدة بحالتين متناقضتين، بلا علامة تعارض ولا اختبار ساقط.
      # هذا الحارس هو الوحيد الذي يرى ذلك. أوّل إصابة له كانت **قائمة في الشجرة**
      # قبل وصله (`BRANCH-GRAVEYARD-POLICY`، سطران متلاصقان).
      - name: Union merges must not leave one gap wearing two states
        run: python scripts/ci/brain_duplicate_gap_identity_guard.py
      # BRAIN-APPEND-ONLY-TRUNCATION-GUARD-01 (2026-08-05): `sahool-brain/log.md` ذهب من
      # ١٬٣٨٣٬٣٦٨ بايت إلى **صفر** في `cb6598fe` وبقي فارغاً على `main` نحو خمس ساعات،
      # وكلّ البوّابات خضراء. لم يكن شيء معطوباً — لم يكن للملفّ حارس: الحرّاس الثلاثة
      # أعلاه تفحص الادّعاءات والانتقالات لا الحجم، و`resolve_merge_conflicts` يعرف
      # التصنيف لكنّه لا يعمل إلّا عند تعارض مُبلَّغ (والدمج الصامت لا تعارض فيه)،
      # و**بصمة ملفّ فارغ بصمة صحيحة** فالمولّدات تختمها راضية.
      #
      # ووعي الدمج جوهر الأمر: النجاة وقعت لأنّ والداً يحمل الملفّ والآخر لا. فحصٌ
      # مقابل **أحد** الوالدَين يمرّ؛ ومقابل **كليهما** يُمسِك. مُثبَت بالتكذيب على
      # `32efdc90..cb6598fe` (يسقط) وعلى دمج اصطناعيّ يأخذ الجانب الفارغ.
      - name: An append-only journal may not shrink, on any parent
        run: python scripts/ci/brain_append_only_guard.py --base "origin/${BASE_REF}" --head HEAD
      # MERGE-TREE-CAN-DROP-EVIDENCE-THAT-BRANCH-HISTORY-PRESERVED-01:
      # #1061 passed branch-history checks yet its final tree dropped #1059 operational
      # evidence. HEAD on pull_request is GitHub's synthetic merge candidate, so compare
      # that tree with the current base and preserve existing evidence/gap identities.
      - name: Final merge tree must preserve recorded evidence identities
        run: python scripts/ci/merge_tree_preservation_guard.py --base "origin/${BASE_REF}" --head HEAD
      # ANNOTATED-SUPERSESSION-CLOSES-A-GAP-WITHOUT-A-WITNESS-01: أدخل #1031 وسمَ
      # `current`/`historical` ليحسم العناوين المكرّرة — علاجٌ صحيح حفظ نصَّ الاكتشاف
      # بدل محوه. لكنّه دخل **بلا كلفة**: قارئٌ واحد يقرؤه، واختبارٌ واحد يفحص
      # **شكلَه** فقط، ولا شيء يربط `current` بكونها فعلاً المتأخّرة. فبقي أخضرَ أن
      # تنسخ عنوانَ فجوةٍ `open`، تسم النسخةَ `fixed` بـ`current` والأصلَ
      # `historical`، فتختفي الفجوة من كلّ عدٍّ يُقرأ. و`gap-registry-report` حاملةٌ
      # `continue-on-error` فلا تحجب حتّى على تناقضٍ صريح.
      - name: An annotated supersession may not close a gap for free
        run: python scripts/ci/brain_annotated_supersession_guard.py
      # GAP-HEADING-WITHOUT-A-STATE-RECORD-IS-INVISIBLE-01: عنوانُ فجوةٍ يحمل حالتَه في
      # العنوان (`— مفتوحة` · `— ✅ FIXED`) لا يقابله سجلُّ حالةٍ قانونيّ، فلا يظهر
      # `open` ولا `unclassified`: يختفي من كلّ عدٍّ يُقرأ ووظيفةُ القياس خضراء. مقيسٌ
      # على مصنوعَتَي #1033 و#1035 (`heading_count` 263⇒264 و`section_state_count` 42
      # ثابت). راتشِتٌ لا صفرٌ مفروض: المقيسُ 211 من 264، وأكثرُها سردٌ تاريخيّ.
      - name: A gap heading may not carry its state where nothing reads it
        run: python scripts/ci/gap_heading_state_guard.py
      # A-HAND-WRITTEN-COUNT-IN-THE-JOURNAL-DRIFTS-FROM-ITS-OWN-MEASUREMENT-01:
      # «Gap registry measurement» تقيس السجلَّ وتحفظ الخرجَ مصنوعاً، **ولا تقارن ما
      # كُتِب بما قِيس** — فخضرتُها تُثبِت أنّ القياسَ جرى لا أنّ النصَّ صادق. ومرّ بها
      # إلى `main` في #1038 سطرٌ يقول `heading_count=272`/`section_state_count=51`
      # والمقيسُ 273/52. رقمٌ عن الحاضر يجب أن يصدق الآن؛ ورقمٌ عن شجرةٍ ماضيةٍ يجب
      # أن يذكر بصمتَها — وذاك وحدَه ما يُعفيه، كي لا يُحمِّر الحارسُ على السرد.
      - name: A hand-written count must equal what the registry measures
        run: |
          python -m pip install 'PyYAML==6.0.2'
          python scripts/ci/gap_registry_claim_guard.py

  # ── وظيفةٌ مستقلّة عمداً ────────────────────────────────────────────────────
  # GATE01-DIAGNOSIS-HIDDEN-BY-THE-JOB-NAME-01: كان هذا الفحص خطوةً داخل وظيفة
  # `no-report-only-change`، فيقرأ المحكِّم في GitHub «‏No Report-only Change = RED»
  # بينما السبب «مسارٌ فيزيائيّ مجمَّد خلف GATE-01 مُسّ». اسمٌ يصف غير ما قاس يُطيل
  # التشخيص ويُخفي مَن يُصلِح — وهو صنفٌ مُسجَّل في هذا المستودع لا ملاحظةُ ذوق.
  # وفصلُها يُتيح كذلك إعادة تشغيل البوّابة وحدها بدل الجناح كلّه.
  gate01-physical-effect-freeze:
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      # حكم المالك (2026-08-09) يمنع تعديل مسارات التنفيذ الفيزيائيّ قبل تجميد أدلّة
      # المرحلة 0. وكان مفروضاً بقراءة بشرٍ لملفٍّ نثريّ — فمُسّت المسارات **مرّتين**
      # (2026-08-09 و2026-08-13)، وفي المرّتين نُفِّذت رقعةٌ كاملة ثمّ أُرجِعت بايتاً.
      # والنموذج الآن يقبل **تفويضاً مقيَّداً يُستهلَك**: البوّابة تبقى مغلقة عالميّاً،
      # ويأذن المالك لبايتاتٍ بعينها في مسارٍ بعينه — فلا يُفتَح الكلّ لأجل رقعة، ولا
      # يُردّ إصلاحٌ صحيح.
      - name: GATE-01 physical-effect freeze (scoped authorization)
        run: |
          git diff --name-only "origin/${BASE_REF}...HEAD" | python scripts/ci/gate01_frozen_path_guard.py --stdin
