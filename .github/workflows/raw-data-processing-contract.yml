name: raw-data-processing-contract

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  raw-data-processing-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python scripts/ci/raw_data_processing_contract_guard.py
      # conftest tests_v9 يستورد httpx/pydantic دائماً ⇒ بيئة الاختبار الكاملة
      # إلزاميّة لا pytest وحده (درس fresh-runner + conftest المُوثَّق).
      - run: python -m pip install -r tests_v9/requirements-test.txt
      - run: python -m pytest -q tests_v9/test_raw_data_processing_contract_guard.py
