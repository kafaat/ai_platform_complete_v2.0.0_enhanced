name: Prepare ET0 generated artifacts on isolated review branch

on:
  push:
    branches: [codex/et0-platform-boundary-20261023]
    paths: [.github/workflows/et0-review-artifact-preparation.yml]

permissions:
  contents: write

concurrency:
  group: et0-review-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.ref == 'refs/heads/codex/et0-platform-boundary-20261023'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install existing declared generator requirements
        run: python -m pip install -r services/weather-service/requirements.txt -r services/sahool-platform/api/requirements.txt -r tests_v9/requirements-test.txt
      - name: Verify fixed branch and canonical source identity
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = codex/et0-platform-boundary-20261023
          git fetch origin "refs/heads/$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$GITHUB_REF_NAME")"
          git diff --exit-code 235a972938f9f634e228dcd0627f088ca8a3d906 HEAD -- '*.py' docs/architecture/platform_extraction_map.json
      - name: Generate for the final tree without this temporary helper
        run: |
          set -euo pipefail
          git rm .github/workflows/et0-review-artifact-preparation.yml
          python -m scripts.ci.verify_all_generated --fix
          python -m scripts.ci.verify_all_generated --check
          python scripts/release/build_release_bundle.py --root .
          python scripts/release/validate_release_package.py --root .
          python -m scripts.ci.verify_all_generated --check
          test "$(git hash-object execution-audit/generated/execution_dependency_audit.json)" = e5e43e45d046a365ae53fb3766ba296129d13172
          git diff --check
      - name: Store generated blobs on the same review branch only
        run: |
          set -euo pipefail
          git add -A
          # Keep the helper unchanged in this intermediate commit: the connected
          # publisher removes it next, leaving exactly the tree validated above.
          git restore --source=HEAD --staged --worktree .github/workflows/et0-review-artifact-preparation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'chore(et0): prepare generated blobs for workflow-free final review tree'
            git push origin HEAD:codex/et0-platform-boundary-20261023
          fi
