# TEMPORARY ONE-SHOT WORKFLOW — removes itself in the generated commit.
name: PR1309 generate source-bound capability mapping once
on:
  push:
    branches:
      - test/ui-quality-accessibility-e2e-20261031
    paths:
      - .github/workflows/pr1309-regenerate-once.yml
permissions:
  contents: write
jobs:
  regenerate:
    if: ${{ github.repository == 'kafaat/ai_platform_complete_v2.0.0_enhanced' && github.ref == 'refs/heads/test/ui-quality-accessibility-e2e-20261031' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Generate candidate against FINAL tree and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'test/ui-quality-accessibility-e2e-20261031'
          git rm -- .github/workflows/pr1309-regenerate-once.yml
          python scripts/ci/capability_mapping_engine.py --generate
          python scripts/ci/capability_mapping_engine.py --check
          git add -- docs/capability-registry/generated/mapping
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate capability mapping from reviewed UI test source tree'
          git push origin HEAD:refs/heads/test/ui-quality-accessibility-e2e-20261031
