# One-shot source-only Ruff proof; removes itself. Does not touch Railway or main.
name: One-shot PR1527 Ruff formatting evidence
on:
  push:
    branches: [fix/pr1527-ruff-format-20261117]
permissions:
  contents: write
jobs:
  formatting-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned formatter
        run: pip install -c constraints-ci-tools.txt ruff
      - name: Format exact changed file then prove Ruff clean
        shell: bash
        run: |
          set -euo pipefail
          ruff format tests_v9/test_semantic_convergence_01.py
          ruff format --check tests_v9/test_semantic_convergence_01.py
      - name: Remove branch-only workflow after proof
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-pr1527-ruff-verification-20261117.yml
          git add tests_v9/test_semantic_convergence_01.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: remove one-shot Ruff formatting proof'
          git push origin HEAD:fix/pr1527-ruff-format-20261117
