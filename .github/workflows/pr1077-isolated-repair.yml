name: PR1077 isolated repair builder

on:
  push:
    branches: [codex/pr1077-repair-builder-20260923]
    paths: [.github/workflows/pr1077-isolated-repair.yml]

permissions:
  contents: read

concurrency:
  group: pr1077-isolated-repair-20260923
  cancel-in-progress: true

jobs:
  repair:
    if: github.repository == 'kafaat/ai_platform_complete_v2.0.0_enhanced' && github.ref == 'refs/heads/codex/pr1077-repair-builder-20260923'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
    env:
      SOURCE_SHA: fedead5ad85855e5e29c87f78d9f87e408aadcc5
      SOURCE_BASE: bd88aa0402947e054a7d9bb76580d3b79ba15378
      TARGET_BRANCH: wc005-live-proof-closure-20260923
      RESULT_BRANCH: codex/pr1077-repair-result-20260923
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout concurrent source fix, excluding this temporary workflow
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fedead5ad85855e5e29c87f78d9f87e408aadcc5
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Assert pinned head and canonical consumption provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test ! -e .github/workflows/pr1077-isolated-repair.yml
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SOURCE_BASE"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$SOURCE_SHA"
          gh api repos/kafaat/ai_platform_complete_v2.0.0_enhanced/pulls/1076 > "$RUNNER_TEMP/pr1076.json"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          pr = json.loads((Path(os.environ['RUNNER_TEMP']) / 'pr1076.json').read_text())
          assert pr['merged'] is True and pr['merge_commit_sha'] == os.environ['SOURCE_BASE']
          adj = json.loads(Path('docs/architecture/gates/adjudications/GATE01-ADJ-2026-09-23-001.json').read_text())
          assert adj['status'] == 'CONSUMED'
          assert adj['consumption']['merge_sha'] == pr['merge_commit_sha']
          assert adj['consumption']['merge_evidence_url'] == pr['html_url']
          for path, blob in adj['authorized_blobs'].items():
              actual = subprocess.check_output(['git', 'rev-parse', f"{pr['merge_commit_sha']}:{path}"], text=True).strip()
              assert actual == blob, (path, actual, blob)
          print('Concurrent source fix preserved; actual PR1076 merge and authorized blobs match')
          PY
      - name: Install repository CI dependencies
        run: python -m pip install -r tests_v9/requirements-test.txt
      - name: Test complete Gate01 suite on unchanged concurrent fix
        run: python -m pytest -q --tb=short tests_v9/test_gate01_frozen_path_guard.py --junitxml="$RUNNER_TEMP/pr1077-gate01-after.xml"
      - name: Regenerate capability mapping first
        run: |
          set -euo pipefail
          python scripts/ci/capability_mapping_engine.py --generate
          python scripts/ci/capability_mapping_engine.py --check
      - name: Reconcile canonical generated chain to fixed point
        run: |
          set -euo pipefail
          python scripts/ci/verify_all_generated.py --fix 2>&1 | tee "$RUNNER_TEMP/pr1077-generation.log"
          python scripts/ci/verify_all_generated.py 2>&1 | tee "$RUNNER_TEMP/pr1077-generated-check.log"
      - name: Build and verify release package last
        run: |
          set -euo pipefail
          python scripts/release/build_release_bundle.py --root .
          python scripts/release/validate_release_package.py --root .
      - name: Run mapping, release, deploy, observability and security contracts
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short \
            tests/architecture/test_capability_mapping_engine.py \
            tests/ci/test_phase16_ci_cd_gates.py \
            tests/deploy/test_phase15_deployment_readiness_contracts.py \
            tests/release/test_phase14_release_packaging_contracts.py \
            tests/observability/test_phase13_observability_assets.py \
            tests/security/test_phase12_final_production_gates.py \
            --junitxml="$RUNNER_TEMP/pr1077-contracts.xml"
          bash scripts/ci/preflight.sh --fast 2>&1 | tee "$RUNNER_TEMP/pr1077-preflight.log"
      - name: Reject all changes outside generated capability and release artifacts
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess
          source = os.environ['SOURCE_SHA']
          release = {'release/FILE_CHECKSUMS.sha256', 'release/SAHOOL_RELEASE_MANIFEST_20260626.json', 'release/SBOM_MINIMAL.json'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', source], text=True).splitlines())
          print('CHANGED FILES:', *sorted(changed), sep='\n')
          unexpected = {p for p in changed if p not in release and not p.startswith('docs/capability-registry/generated/')}
          assert changed and not unexpected, f'Unexpected edits: {sorted(unexpected)}'
          untracked = subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines()
          assert not untracked, f'Unexpected untracked source files: {untracked}'
          PY
          git diff --check
          git diff --exit-code "$SOURCE_SHA" -- services/ migrations/ tests/ tests_v9/ scripts/ .github/ sahool-brain/ docs/architecture/ certification/
      - name: Commit tested artifacts and prove the seal stable on its own SHA
        run: |
          set -euo pipefail
          git config user.name 'kafaat'
          git config user.email '80758750+kafaat@users.noreply.github.com'
          git add -u
          git commit -m 'fix(governance): regenerate PR1077 capability artifacts and final release seal'
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          python scripts/ci/capability_mapping_engine.py --check
          python scripts/release/build_release_bundle.py --root .
          python scripts/release/validate_release_package.py --root .
          git diff --exit-code
          test -z "$(git status --porcelain)"
          git rev-parse HEAD | tee "$RUNNER_TEMP/pr1077-result-sha.txt"
      - name: Publish to isolated result only with unchanged remote head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$RESULT_BRANCH" = 'codex/pr1077-repair-result-20260923'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SOURCE_BASE"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$SOURCE_SHA"
          test -z "$(git ls-remote origin "refs/heads/$RESULT_BRANCH")"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$RESULT_BRANCH"
          printf 'Tested repair commit: `%s`\nSource head: `%s`\nBase: `%s`\n' "$(git rev-parse HEAD)" "$SOURCE_SHA" "$SOURCE_BASE" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve actual witnesses and generation logs outside the repository
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr1077-repair-witnesses
          path: |
            ${{ runner.temp }}/pr1077-*.xml
            ${{ runner.temp }}/pr1077-*.log
            ${{ runner.temp }}/pr1077-result-sha.txt
          if-no-files-found: warn
          retention-days: 14
