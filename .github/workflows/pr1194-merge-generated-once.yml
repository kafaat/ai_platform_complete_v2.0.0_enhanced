name: PR1194 one-shot merge artifact convergence

on:
  push:
    branches:
      - fix/worker-heartbeat-liveness-batch-20261015
    paths:
      - .github/workflows/pr1194-merge-generated-once.yml

permissions:
  contents: write

concurrency:
  group: pr1194-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  converge:
    if: github.repository == 'kafaat/ai_platform_complete_v2.0.0_enhanced'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/worker-heartbeat-liveness-batch-20261015
          fetch-depth: 0
          persist-credentials: true
      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install generator dependencies
        run: |
          python -m pip install -c constraints-ci-tools.txt ruff
          python -m pip install pytest==9.1.1 PyYAML==6.0.2 jsonschema==4.26.0
      - name: Remove temporary workflow before measuring generated assets
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/fix/worker-heartbeat-liveness-batch-20261015
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          git rm .github/workflows/pr1194-merge-generated-once.yml
      - name: Converge all generated artifacts to merged source
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.ci.verify_all_generated --fix
          python -m scripts.ci.verify_all_generated --check
          python scripts/release/build_release_bundle.py --root .
          python scripts/release/validate_release_package.py --root .
          python -m scripts.ci.verify_all_generated --check
          git diff --check
      - name: Commit verified artifacts to this PR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No changes required'; exit 0; }
          git commit -m 'chore(generated): converge #1193 merge and heartbeat source artifacts'
          git push origin HEAD:refs/heads/fix/worker-heartbeat-liveness-batch-20261015
