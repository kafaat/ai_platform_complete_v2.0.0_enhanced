name: AI Container Contract

on:
  pull_request:
    paths:
      - 'services/ai_agronomist/**'
      - 'services/agriai-engine/**'
      - 'services/local-ai-rag/**'
      - 'services/rag-retrieval/**'
      - 'services/knowledge-graph/**'
      - 'services/supervisor-agent/**'
      - 'services/guardrails-engine/**'
      - 'services/edge-inference/**'
      - 'services/sam2-inference/**'
      - 'docker-compose.v9.yml'
      - 'scripts/ci/ai_container_contract_guard.py'
      - 'tests_v9/test_ai_container_contract_guard.py'
  push:
    branches: [ main ]

jobs:
  ai-container-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python scripts/ci/ai_container_contract_guard.py --check
      # conftest tests_v9 يستورد httpx/pydantic دائماً ⇒ بيئة الاختبار الكاملة
      # إلزاميّة لا pytest وحده (درس fresh-runner + conftest المُوثَّق).
      - run: python -m pip install -r tests_v9/requirements-test.txt
      - run: python -m pytest -q tests_v9/test_ai_container_contract_guard.py
