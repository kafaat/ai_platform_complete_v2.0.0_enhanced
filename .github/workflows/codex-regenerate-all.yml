name: Codex canonical generated closure

on:
  push:
    branches:
      - codex/c12-live-evidence-closure

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/c12-live-evidence-closure
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests_v9/requirements-test.txt
      - name: Reach canonical fixed point
        run: |
          git rm -- .github/workflows/codex-regenerate-all.yml
          ruff format tests_v9/test_c12_live_activation_receipt.py
          git add -A
          bash scripts/ci/regenerate_all_generated.sh
          pytest -q tests_v9/test_c12_live_activation_receipt.py
          python scripts/ci/guard_mutation_guard.py --run --only scripts/ci/c12_governed_learning_promotion_certification.py
          ruff check scripts/ci/c12_governed_learning_promotion_certification.py scripts/staging/c12_live_activation_receipt.py tests_v9/test_c12_live_activation_receipt.py
          ruff format --check scripts/ci/c12_governed_learning_promotion_certification.py scripts/staging/c12_live_activation_receipt.py tests_v9/test_c12_live_activation_receipt.py
      - name: Stage canonical final commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: reach canonical generated artifact fixed point"
          git push origin HEAD:refs/heads/codex/c12-generated-output-staging-v2 --force
