name: Runtime Real Smoke
on:
  pull_request:
  push:
    branches: [ main, develop ]
# عبءُ أجهزة التشغيل: دفعٌ جديد إلى الـPR نفسه يلغي تشغيلَه الأقدم لهذا المسار (كـci.yml)؛ وأحداثُ
# غير الـPR مجموعتُها فريدة (run_id) فلا تُلغى ولا تُسلسَل — كلُّ دمجٍ إلى main يُفحص كاملاً.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}-{2}', github.workflow, github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime-real-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      # اختبارات العقد المستهدفة (weather/edge) تستورد fastapi/TestClient وonnxruntime-path —
      # تبعيّات الخدمتين إلزاميّة لا tests_v9 فقط (نفس درس jwt في workflow الإغلاق:
      # التحقّق المحلّي لا يُحاكي fresh runner).
      - run: >-
          python -m pip install
          -r tests_v9/requirements-test.txt
          -r services/weather-service/requirements.txt
          -r services/edge-inference/requirements.txt
      - run: scripts/ci/runtime_real_smoke.sh
