name: PR1298 isolated merge-conflict regeneration (temporary)
on:
  push:
    branches:
      - codex/pr1298-conflicts-resolve-20261028
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'kafaat/ai_platform_complete_v2.0.0_enhanced'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Regenerate merged source and check fixed-point consistency
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/codex/pr1298-conflicts-resolve-20261028"
          mkdir -p "$RUNNER_TEMP/conflict-resolution"
          git rev-parse HEAD > "$RUNNER_TEMP/conflict-resolution/input-sha.txt"
          git rm .github/workflows/pr1298-conflicts-regeneration-probe.yml
          git add -A
          python -m pip install pytest==9.1.1 PyYAML==6.0.2 jsonschema==4.26.0 > "$RUNNER_TEMP/conflict-resolution/bootstrap.log" 2>&1
          if ! python scripts/ci/verify_all_generated.py --fix > "$RUNNER_TEMP/conflict-resolution/fix.log" 2>&1; then
            tail -n 100 "$RUNNER_TEMP/conflict-resolution/fix.log"
            exit 1
          fi
          if ! python scripts/ci/verify_all_generated.py --check > "$RUNNER_TEMP/conflict-resolution/check.log" 2>&1; then
            tail -n 100 "$RUNNER_TEMP/conflict-resolution/check.log"
            exit 1
          fi
          python scripts/ci/decision_lineage_graph.py --check
          python scripts/ci/execution_dependency_audit.py --check
          python scripts/ci/capability_mapping_engine.py --check
          python scripts/ci/capability_management_engine.py --check
          python scripts/ci/static_governance_closure.py --check
          git add -A
          git diff --cached --check
          git diff --cached --name-only | tee "$RUNNER_TEMP/conflict-resolution/changed-paths.txt"
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/pr1298-conflicts-regeneration-probe.yml|REPORT_INDEX.md|decision-lineage/generated/*|execution-audit/generated/*|event-audit/generated/*|docs/capability-registry/generated/*|governance/generated/*|governance/path2-generated/*|architecture/generated/*|runtime-contracts/generated/*|capabilities/generated/*|docs/architecture/generated/*|docs/runbooks/GUARD_CATALOGUE.md|release/FILE_CHECKSUMS.sha256|release/SAHOOL_RELEASE_MANIFEST_20260626.json|release/SBOM_MINIMAL.json|platform_catalog.generated.json|runtime_capability_manifest.generated.json|frontend/src/lib/platformCatalog.generated.ts) ;;
              *) printf 'UNEXPECTED_MUTATED_PATH: %s\n' "$path" >&2; exit 3 ;;
            esac
          done < "$RUNNER_TEMP/conflict-resolution/changed-paths.txt"
          git config user.name "SAHOOL Isolated Governance Regeneration"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: reconcile generated registries after main sync"
          git rev-parse HEAD > "$RUNNER_TEMP/conflict-resolution/output-sha.txt"
          git push origin HEAD:refs/heads/codex/pr1298-conflicts-resolve-20261028
      - name: Preserve native generator logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr1298-merge-conflicts-regeneration
          path: ${{ runner.temp }}/conflict-resolution
          if-no-files-found: warn
          retention-days: 7
