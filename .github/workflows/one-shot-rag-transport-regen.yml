# One-shot generated-artifact refresh for PR #1519. Self-removing; never deploys.
name: One-shot RAG transport generated artifacts
on:
  push:
    branches:
      - fix/ai-rag-transport-degrade-20261117
permissions:
  contents: write
jobs:
  regenerate:
    if: github.ref == 'refs/heads/fix/ai-rag-transport-degrade-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install repository tooling
        run: pip install -r tests_v9/requirements-test.txt
      - name: Format authored files with CI Ruff
        run: |
          set -euo pipefail
          pip install -c constraints-ci-tools.txt ruff
          ruff check --fix services/ai_agronomist/ai_evidence_runtime.py tests_v9/test_ai_rag_tenant_corpus_empty_degrade.py
          ruff format services/ai_agronomist/ai_evidence_runtime.py tests_v9/test_ai_rag_tenant_corpus_empty_degrade.py
      - name: Regenerate, verify, and delete this workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm '.github/workflows/one-shot-rag-transport-regen.yml'
          git add -A
          python scripts/ci/verify_all_generated.py --fix
          git add -A
          python scripts/ci/verify_all_generated.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(generated): reconcile RAG transport fail-soft [regen]'
          git push origin HEAD:'fix/ai-rag-transport-degrade-20261117'
