name: Railway Crypto Pin Repair

on:
  push:
    branches: [codex/railway-staging-repair-lab-20260928]
    paths: [.github/workflows/railway-crypto-pin-repair.yml, .github/repair-lab/railway_crypto_pin.py]

permissions:
  contents: read

concurrency:
  group: railway-crypto-pin-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      SOURCE_SHA: f6cd3f5532a816d29192461e65d3f0f2bd41b0ae
      MAIN_SHA: 52deac58088406be76b04a5216c2bddffb12cdcf
      RESULT_BRANCH: codex/railway-crypto-pinned-20260928
    steps:
      - name: Read isolated repair controller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Copy controllers outside the candidate tree
        run: |
          cp control/.github/repair-lab/railway_crypto_pin.py "$RUNNER_TEMP/railway_crypto_pin.py"
          cp control/.github/repair-lab/railway_rs256_repair.py "$RUNNER_TEMP/railway_rs256_probe_source.py"
      - name: Check out exact current PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install repository test tools
        working-directory: candidate
        run: python -m pip install --retries 3 --timeout 60 -r tests_v9/requirements-test.txt jsonschema packaging
      - name: Reproduce ratchet failure, pin dependency, and validate image and generators
        working-directory: candidate
        run: python "$RUNNER_TEMP/railway_crypto_pin.py"
      - name: Publish verified candidate without changing the PR branch
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_SHA"
          test "$(git ls-remote origin refs/heads/railway/fix-deploy-8a3aec | cut -f1)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          candidate_sha="$(git rev-parse HEAD)"
          test "$(jq -r .candidate_sha "$RUNNER_TEMP/railway-crypto-pin-evidence/summary.json")" = "$candidate_sha"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$RESULT_BRANCH"
          printf '%s\n' "$candidate_sha" > "$RUNNER_TEMP/railway-crypto-pin-evidence/published-sha.txt"
      - name: Retain measured evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: railway-crypto-pin-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/railway-crypto-pin-evidence
          if-no-files-found: warn
          retention-days: 14
