name: PR-B generated artifacts evidence (read-only temporary)
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  regenerate-evidence:
    if: ${{ github.event.pull_request.head.ref == 'feat/ml-quality-readonly-bridge-20261028' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install regeneration dependencies
        run: python -m pip install pytest==9.1.1 PyYAML==6.0.2 jsonschema==4.26.0
      - name: Regenerate and bundle exact changed files (no push)
        shell: bash
        env:
          OUT_DIR: ${{ runner.temp }}/prb-regeneration
        run: |
          set -uo pipefail
          mkdir -p "$OUT_DIR"
          git rev-parse HEAD > "$OUT_DIR/source-sha.txt"
          python scripts/ci/verify_all_generated.py --fix > "$OUT_DIR/regeneration.log" 2>&1
          rc=$?
          printf '%s\n' "$rc" > "$OUT_DIR/regeneration.exitcode"
          git add -A
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import zipfile

          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ["OUT_DIR"])
          changed_raw = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only", "--diff-filter=ACMRT", "-z"]
          )
          removed_raw = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only", "--diff-filter=D", "-z"]
          )
          changed = sorted(os.fsdecode(x) for x in changed_raw.split(b"\0") if x)
          removed = sorted(os.fsdecode(x) for x in removed_raw.split(b"\0") if x)
          manifest = {
              "schema": "prb-generated-evidence/v1",
              "source_sha": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "regeneration_exit_code": int((out / "regeneration.exitcode").read_text().strip()),
              "added_or_modified": {},
              "deleted": removed,
              "production_accepted": False,
              "files_from_git_stage_only": True,
          }
          with zipfile.ZipFile(out / "regenerated-files.zip", "w", zipfile.ZIP_DEFLATED) as bundle:
              for name in changed:
                  path = root / name
                  if path.is_symlink() or not path.is_file() or not path.resolve().is_relative_to(root):
                      raise RuntimeError("unsupported generated path: " + name)
                  data = path.read_bytes()
                  manifest["added_or_modified"][name] = hashlib.sha256(data).hexdigest()
                  bundle.writestr("files/" + name, data)
              bundle.writestr(
                  "manifest.json",
                  json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              )
          (out / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Preserve regeneration evidence even when convergence fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prb-generated-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prb-regeneration/
          if-no-files-found: error
          retention-days: 7
      - name: Fail closed if regeneration did not converge
        if: always()
        shell: bash
        env:
          OUT_DIR: ${{ runner.temp }}/prb-regeneration
        run: |
          set -euo pipefail
          test -s "$OUT_DIR/manifest.json"
          test "$(cat "$OUT_DIR/regeneration.exitcode")" = "0"
