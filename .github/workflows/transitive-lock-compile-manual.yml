name: Manual Transitive Lock Compile

on:
  workflow_dispatch:
    inputs:
      pypi_mirror_url:
        description: 'Package index URL used for pip/pip-tools. Defaults to official PyPI; Alibaba mirror may be supplied explicitly.'
        required: false
        default: 'https://pypi.org/simple'
      pip_trusted_host:
        description: 'Trusted host for the configured package index.'
        required: false
        default: ''

# أقلّ صلاحيّة (I5): قراءة المستودع فقط؛ أيّ وظيفة تحتاج أكثر تُعلنه على مستواها.
permissions:
  contents: read

jobs:
  compile-transitive-locks:
    runs-on: ubuntu-latest
    env:
      PYPI_MIRROR_URL: ${{ inputs.pypi_mirror_url }}
      PIP_TRUSTED_HOST: ${{ inputs.pip_trusted_host }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Compile transitive service locks through configured mirror
        run: scripts/ci/compile_transitive_service_locks.sh
      - name: Show generated lock diff
        run: git diff -- services/**/requirements.lock || true
