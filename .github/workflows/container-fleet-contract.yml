name: container-fleet-contract

on:
  pull_request:
    paths:
      - 'services/**/Dockerfile*'
      - 'services/**/requirements.txt'
      - 'scripts/ci/container_fleet_contract_guard.py'
      - 'tests_v9/test_container_fleet_contract_guard.py'
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python scripts/ci/container_fleet_contract_guard.py
      # conftest tests_v9 يستورد httpx/pydantic دائماً ⇒ بيئة الاختبار الكاملة
      # إلزاميّة لا pytest وحده (درس fresh-runner + conftest المُوثَّق).
      - run: python -m pip install -r tests_v9/requirements-test.txt
      - run: python -m pytest -q tests_v9/test_container_fleet_contract_guard.py
