name: Production Evidence Pack
on:
  pull_request:
  push:
    branches: [ main, develop ]
jobs:
  evidence-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/ci/production_evidence_pack_guard.py --check
