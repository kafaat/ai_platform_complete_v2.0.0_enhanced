name: Production Evidence Pack
on:
  pull_request:
  push:
    branches: [ main, develop ]
jobs:
  evidence-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python scripts/ci/production_evidence_pack_guard.py --check
      # الحزمةُ تفحص **صلاحيّة الدليل الموجود**؛ وهذا يفحص **أنّ له مُنتِجاً أصلاً**.
      # وبدون الثاني كانت الأولى تُبقي خمسةَ حواجزَ `pending` صحيحةَ الشكل إلى الأبد،
      # فيُقرأ الحكمُ عجزاً في القياس لا غياباً في الإنتاج. الحاجبُ هنا لا في
      # `production-certification-blockers.yml`: تلك تُشغَّل يدويّاً (`workflow_dispatch`)
      # فلا تحرس دمجاً، وهذه تعمل على كلّ PR ودفعٍ إلى main.
      - run: python scripts/ci/certification_evidence_producer_guard.py
