name: PR1076 one-shot regenerate

on:
  push:
    branches:
      - wc005-failure-cas-20260923
    paths:
      - .github/workflows/pr1076-one-shot-regenerate.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: wc005-failure-cas-20260923
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install CI tooling
        run: python -m pip install -c constraints-ci-tools.txt ruff PyYAML jsonschema
      - name: Remove this one-shot workflow before deriving final artifacts
        run: git rm .github/workflows/pr1076-one-shot-regenerate.yml
      - name: Format changed Python
        run: ruff format tests_v9/test_outbox_idempotent_consumption.py
      - name: Stage source before generators
        run: git add -A
      - name: Regenerate to fixed point
        run: python scripts/ci/verify_all_generated.py --fix
      - name: Stage generated artifacts
        run: git add -A
      - name: Rebuild release package last
        run: python scripts/release/build_release_bundle.py
      - name: Validate final generated state
        run: |
          git add -A
          python scripts/ci/verify_all_generated.py --check
          python scripts/release/validate_release_package.py --root .
          ruff format --check .
      - name: Commit and push final bytes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ci): regenerate PR1076 derived artifacts"
          git push origin HEAD:wc005-failure-cas-20260923
