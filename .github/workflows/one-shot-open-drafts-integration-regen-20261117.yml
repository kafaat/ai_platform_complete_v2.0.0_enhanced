# One-shot source reconciliation. Branch-only, no Railway/production deploy.
name: One-shot open drafts selective integration regeneration
on:
  push:
    branches:
      - integrate/open-drafts-selective-20261117
permissions:
  contents: write
jobs:
  regenerate:
    if: github.ref == 'refs/heads/integrate/open-drafts-selective-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install repository test and format tooling
        run: |
          set -euo pipefail
          pip install -r tests_v9/requirements-test.txt
          pip install -c constraints-ci-tools.txt ruff
      - name: Format only authored Python paths
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            scripts/ci/capability_mapping_engine.py
            scripts/ci/export_explorer_routes.py
            scripts/ci/capability_registry_guard.py
            scripts/ci/verify_all_generated.py
            services/ai_agronomist/ai_evidence_runtime.py
            services/sahool-platform/api/field_context.py
            services/sahool-platform/api/routers/field_ai_context.py
            services/sahool-platform/api/routers/sharing.py
            services/sahool-platform/api/routers/yield_interval.py
            services/sahool-platform/core/crop_intelligence/knowledge_layer.py
            services/sahool-platform/core/data_quality.py
            services/sahool-platform/tests/test_cropin_advisor_crop_reference_v1.py
            services/sahool-platform/tests/test_cropin_unique_scene_dates_v1.py
            services/sahool-platform/tests/test_data_quality.py
            tests/architecture/test_capability_registry_guard.py
            tests/architecture/test_verify_all_generated.py
            tests_v9/test_explorer_route_export_contract.py
            tests_v9/test_cropin_advisor_crop_and_water_boundary_v1.py
            tests_v9/test_cropin_governed_routes_static_v1.py
            tests_v9/test_ai_rag_tenant_corpus_empty_degrade.py
          )
          ruff check --fix "${paths[@]}"
          ruff format "${paths[@]}"
          python -m compileall -q "${paths[@]}"
      - name: Remove workflow, regenerate and prove source tree
        shell: bash
        run: |
          set -euo pipefail
          git rm '.github/workflows/one-shot-open-drafts-integration-regen-20261117.yml'
          git add -A
          python scripts/ci/verify_all_generated.py --fix
          git add -A
          python scripts/ci/verify_all_generated.py --check
          python scripts/ci/capability_registry_guard.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(generated): reconcile selectively integrated open drafts [regen]'
          git push origin HEAD:'integrate/open-drafts-selective-20261117'
