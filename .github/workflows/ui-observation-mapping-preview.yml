name: Temporary read-only source-bound UI observation mapping preview
on:
  pull_request:
    branches: [exp/impeccable-readonly-ui4-20261031]
    paths:
      - '.github/workflows/ui-observation-mapping-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  exact-base-generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install generator dependencies without modifying the repository
        run: python -m pip install --disable-pip-version-check --no-input 'PyYAML==6.0.2' 'jsonschema==4.26.0'
      - name: Generate official mapping and management outputs on the actual feature-head tree
        shell: bash
        run: |
          set -euo pipefail
          printf 'GENERATED_FROM_PR1308_HEAD=%s\n' "$(git rev-parse HEAD)"
          python scripts/ci/capability_mapping_engine.py --generate
          python scripts/ci/capability_mapping_engine.py --check
          python scripts/ci/capability_management_engine.py --generate
          python scripts/ci/capability_management_engine.py --check
          python scripts/ci/pr_capability_impact_gate.py --generate-index
          python scripts/ci/pr_capability_impact_gate.py --check-index
          python scripts/ci/guard_catalogue.py
          cat docs/capability-registry/generated/mapping/mapping_manifest.json
          cat docs/capability-registry/generated/impact/impact_index_summary.json
          git diff --name-only -- docs/capability-registry/generated/ docs/runbooks/GUARD_CATALOGUE.md
          git rev-parse HEAD > docs/capability-registry/generated/GENERATION_SOURCE_SHA.txt
      - name: Preserve source-bound generated candidates for independent review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-observation-source-bound-governance-candidates
          path: |
            docs/capability-registry/generated/
            docs/runbooks/GUARD_CATALOGUE.md
          retention-days: 5
          if-no-files-found: error
