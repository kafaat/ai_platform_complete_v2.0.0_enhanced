name: platform-main-subinventory
on:
  pull_request:
  push:
    branches: [main, develop]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/ci/platform_main_subinventory_guard.py --check
