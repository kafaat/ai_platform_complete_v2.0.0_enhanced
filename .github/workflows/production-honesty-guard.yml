name: Production Honesty Guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  honesty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prevent fabricated production outputs
        run: python scripts/ci/production_honesty_guard.py
