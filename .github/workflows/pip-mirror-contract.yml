name: Pip Mirror Contract

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  pip-mirror-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/ci/pip_mirror_contract_guard.py
