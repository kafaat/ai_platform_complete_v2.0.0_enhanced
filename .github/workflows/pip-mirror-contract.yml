name: Pip Mirror Contract

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  pip-mirror-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python scripts/ci/pip_mirror_contract_guard.py
