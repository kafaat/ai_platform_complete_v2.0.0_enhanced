name: Dependency Inventory Drift

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  dependency-inventory-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify dependency inventory drift
        run: python scripts/ci/dependency_inventory_guard.py --check
      - name: Verify all service dependency pins
        run: python scripts/ci/dependency_pin_guard.py
