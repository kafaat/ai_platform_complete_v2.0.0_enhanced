name: WX-12 Runtime Certification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'services/decision-service/**'
      - 'services/model-registry-adapter/**'
      - 'scripts/wx12/**'
      - 'scripts/ci/wx12_runtime_certification_gate.py'
jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - run: python scripts/ci/wx12_runtime_certification_gate.py
      - run: python -m compileall -q services/model-registry-adapter scripts/wx12
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: {POSTGRES_USER: sahool, POSTGRES_PASSWORD: sahool, POSTGRES_DB: sahool}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sahool" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://sahool:sahool@localhost:5432/sahool
      DECISION_SERVICE_ALLOW_SCHEMA_CHANGE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      # migration_runner connects via asyncpg — that is all this cert step needs.
      - run: pip install asyncpg
      # WX-12 runtime certification proves the decision-service migration set applies cleanly and
      # is idempotent (--check) against a real Postgres. The decision-service TEST SUITE is NOT run
      # here: it is owned end-to-end by the "Decision Service Tests" job in ci.yml, which runs each
      # file with the correct per-file environment (SoR-on files vs the mirror-mode contract file
      # need CONTRADICTORY DECISION_SERVICE_SOR_ENABLED values, so a single blanket
      # `pytest services/decision-service/tests` invocation can never satisfy both — it is a
      # redundant, mis-configured duplicate of that job). Keep this gate scoped to the migration
      # certification that is unique to it.
      - run: python services/decision-service/migration_runner.py --apply
      - run: python services/decision-service/migration_runner.py --check
