name: WX-12 Runtime Certification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'services/decision-service/**'
      - 'services/model-registry-adapter/**'
      - 'scripts/wx12/**'
      - 'scripts/ci/wx12_runtime_certification_gate.py'
# عبءُ أجهزة التشغيل: دفعٌ جديد إلى الـPR نفسه يلغي تشغيلَه الأقدم لهذا المسار (كـci.yml)؛ وأحداثُ
# غير الـPR مجموعتُها فريدة (run_id) فلا تُلغى ولا تُسلسَل — كلُّ دمجٍ إلى main يُفحص كاملاً.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}-{2}', github.workflow, github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - run: python scripts/ci/wx12_runtime_certification_gate.py
      - run: python -m compileall -q services/model-registry-adapter scripts/wx12
  postgres:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://sahool:sahool@localhost:5432/sahool
      DECISION_SERVICE_ALLOW_SCHEMA_CHANGE: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - name: Start digest-pinned PostgreSQL 16 with PostGIS packages
        run: |
          set -euo pipefail
          postgres_base_image=public.ecr.aws/docker/library/postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
          postgis_image=sahool-wx12-postgis-16:ci
          scripts/ci/build_postgis_test_image.sh "$postgres_base_image" 16 "$postgis_image"
          docker run -d --name wx12-postgres --pull=never \
            -e POSTGRES_USER=sahool -e POSTGRES_PASSWORD=sahool -e POSTGRES_DB=sahool \
            -p 5432:5432 --health-cmd "pg_isready -U sahool -d sahool" \
            --health-interval 5s --health-timeout 5s --health-retries 20 "$postgis_image"
          for attempt in $(seq 1 30); do
            docker exec wx12-postgres pg_isready -U sahool -d sahool && break
            sleep 2
          done
          docker exec wx12-postgres pg_isready -U sahool -d sahool
      # migration_runner connects via asyncpg — that is all this cert step needs.
      - run: pip install asyncpg
      # WX-12 runtime certification proves the decision-service migration set applies cleanly and
      # is idempotent (--check) against a real Postgres. The decision-service TEST SUITE is NOT run
      # here: it is owned end-to-end by the "Decision Service Tests" job in ci.yml, which runs each
      # file with the correct per-file environment (SoR-on files vs the mirror-mode contract file
      # need CONTRADICTORY DECISION_SERVICE_SOR_ENABLED values, so a single blanket
      # `pytest services/decision-service/tests` invocation can never satisfy both — it is a
      # redundant, mis-configured duplicate of that job). Keep this gate scoped to the migration
      # certification that is unique to it.
      - run: python services/decision-service/migration_runner.py --apply
      - run: python services/decision-service/migration_runner.py --check
      - name: Remove test database container
        if: always()
        run: docker rm -f wx12-postgres 2>/dev/null || true
