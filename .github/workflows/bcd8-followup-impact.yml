        with:
          ref: bcd8ad8ad64fff83941c8f386a7a993bb489972f
          persist-credentials: false
      - name: Compute exact impact
        run: |
          python scripts/ci/capability_impact.py --json \
            docs/architecture/db_writer_ownership_baseline.json \
            docs/architecture/db_writer_ownership_triage.json \
