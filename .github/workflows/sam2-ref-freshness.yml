# SAM2-REF-FLOATS-ON-MAIN-AND-WEIGHTS-UNVERIFIED-01 — تنبيهُ تقادمٍ لا بوّابة.
#
# `services/sam2-inference/Dockerfile` يثبّت `ARG SAM2_REF` على SHA التزامٍ كامل حتى
# يُنتج كلُّ بناءٍ الشيفرةَ نفسها. هذا الـworkflow يقارن ذلك الـSHA برأس فرع `main`
# في facebookresearch/sam2 أسبوعيّاً، فإن تأخّر فتح issue واحدة أو حدّثها (عنوانٌ ثابت).
#
# غيرُ حاجبٍ بالتصميم: لا يعمل على pull_request ولا push، ولا يُعلَن فحصاً مطلوباً.
# الترقية قرارٌ بشريّ (بناء على GPU + تحقّق توافق)، لا تحديثٌ آليّ.
name: SAM2 Ref Freshness

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sam2-ref-freshness
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Compare pinned SAM2_REF with upstream main and open/update one issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DOCKERFILE: services/sam2-inference/Dockerfile
          UPSTREAM: https://github.com/facebookresearch/sam2.git
          ISSUE_TITLE: "SAM2_REF is behind facebookresearch/sam2 main"
        run: |
          set -euo pipefail

          pinned="$(sed -n 's/^ARG SAM2_REF=\([0-9a-f]\{40\}\)[[:space:]]*$/\1/p' "$DOCKERFILE")"
          if [ -z "$pinned" ]; then
            echo "::error::$DOCKERFILE has no 'ARG SAM2_REF=<40-hex sha>' line"
            exit 1
          fi

          upstream="$(timeout 120 git ls-remote "$UPSTREAM" refs/heads/main | cut -f1)"
          if ! printf '%s' "$upstream" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::could not read upstream main HEAD (got: '$upstream')"
            exit 1
          fi

          echo "pinned   SAM2_REF: $pinned"
          echo "upstream main HEAD: $upstream"
          if [ "$pinned" = "$upstream" ]; then
            echo "SAM2_REF is current — nothing to do."
            exit 0
          fi

          # Commits behind (best effort; the public compare API may be rate-limited).
          behind="$(gh api "repos/facebookresearch/sam2/compare/${pinned}...${upstream}" \
                      --jq '.ahead_by' 2>/dev/null || echo unknown)"
          echo "behind by: $behind commit(s)"

          body="$(mktemp)"
          {
            echo "The pinned \`ARG SAM2_REF\` in \`$DOCKERFILE\` is behind upstream \`main\`."
            echo
            echo "| | commit |"
            echo "|---|---|"
            echo "| pinned | \`$pinned\` |"
            echo "| upstream main | \`$upstream\` |"
            echo "| commits behind | $behind |"
            echo
            echo "Diff: https://github.com/facebookresearch/sam2/compare/${pinned}...${upstream}"
            echo
            echo "To upgrade: set \`ARG SAM2_REF\` to the new SHA (and the dated comment above it),"
            echo "rebuild \`sam2-inference\` on a GPU host and verify inference. This check is"
            echo "informational and never blocks merges."
            echo
            echo "_Last checked: $(date -u +%Y-%m-%dT%H:%MZ) by workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}_"
          } > "$body"

          # One issue only: find an open issue by its exact fixed title.
          existing="$(gh issue list --state open --limit 500 --json number,title \
                        --jq 'map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$body"
            echo "updated issue #$existing"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file "$body"
          fi
