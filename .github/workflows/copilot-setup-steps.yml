# Copilot Setup Steps — يُسبق-تثبيت تبعيّات التطوير/الاختبار لجلسات وكيل Copilot
# فلا يُعاد بناء venv ولا تثبيت pytest/ruff/defusedxml يدويّاً كلّ جلسة، ويُجنَّب
# عثرات «No module named jose/defusedxml». الوظيفة يجب أن تُسمّى copilot-setup-steps.
# لا يعمل في كلّ دفع: فقط يدويّاً أو عند تغيّر هذا الملفّ (اختبار ذاتيّ) — لا حِمل CI إضافيّ.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

# عبءُ أجهزة التشغيل: دفعٌ جديد إلى الـPR نفسه يلغي تشغيلَه الأقدم لهذا المسار (كـci.yml)؛ وأحداثُ
# غير الـPR مجموعتُها فريدة (run_id) فلا تُلغى ولا تُسلسَل — كلُّ دمجٍ إلى main يُفحص كاملاً.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}-{2}', github.workflow, github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev, test & platform dependencies
        run: |
          python -m pip install --upgrade pip
          # أدوات التطوير/الاختبار (pytest, ruff, bandit, alembic, pytest-cov …)
          pip install -r requirements-dev.txt
          pip install -r tests_v9/requirements-test.txt
          # تبعيّات منصّة sahool الفعليّة (fastapi, asyncpg, numpy/scipy,
          # defusedxml, python-multipart …) كي تُستورَد api/main.py وتُشغَّل اختباراتها.
          pip install -r services/sahool-platform/api/requirements.txt
