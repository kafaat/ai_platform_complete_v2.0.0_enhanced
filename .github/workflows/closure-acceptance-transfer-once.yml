name: Transfer verified closure acceptance tree once
on:
  push:
    branches: [codex/closure-runtime-acceptance-20261018]
    paths: [.github/workflows/closure-acceptance-transfer-once.yml]
permissions:
  contents: read
jobs:
  transfer:
    if: github.repository == 'kafaat/ai_platform_complete_v2.0.0_enhanced' && github.ref == 'refs/heads/codex/closure-runtime-acceptance-20261018'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Apply exact reviewed patch and remove this one-shot workflow
        env:
          PATCH_ZLIB_BASE64: ''
          PATCH_SHA256: '7ace12f8f62574f80ad008bed4221e7ec6f02df6a4959b56405a58dbba83ea7b'
          EXPECTED_TREE: 'b9c80b874341670bc06807c9d7e4ac23d6e2639d'
          EXPECTED_PARENT: '2d55c73e6f5283d089792aa22382b6cabe6487f3'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python3 - <<'PY'
          import os, base64, zlib, hashlib, subprocess
          patch = zlib.decompress(base64.b64decode(os.environ["PATCH_ZLIB_BASE64"], validate=True))
          assert hashlib.sha256(patch).hexdigest() == os.environ["PATCH_SHA256"]
          subprocess.run(["git", "apply", "--index", "--binary", "-"], input=patch, check=True)
          PY
          git rm -- .github/workflows/closure-acceptance-transfer-once.yml
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git fetch origin "refs/heads/codex/closure-runtime-acceptance-20261018"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ci): probe internal container loopback and synchronize generated acceptance artifacts"
          git push origin HEAD:refs/heads/codex/closure-runtime-acceptance-20261018
