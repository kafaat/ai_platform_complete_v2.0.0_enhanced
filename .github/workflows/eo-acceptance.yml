name: Earth observation experiment contracts
on:
  pull_request:
    paths:
      - 'tools/eo_acceptance/**'
      - 'services/raster-service/stac_vrt.py'
      - 'services/raster-service/band_math.py'
      - '.github/workflows/eo-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-and-postgis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgis:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: eo_test
          POSTGRES_PASSWORD: eo_disposable_only
          POSTGRES_DB: eo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eo_test -d eo_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      EO_TEST_DATABASE_URL: postgresql://eo_test:eo_disposable_only@localhost:5432/eo_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/eo_acceptance/requirements.txt
      - run: python -m pytest -q tools/eo_acceptance/tests --confcutdir=tools/eo_acceptance --junitxml=/tmp/eo-tests.xml
      - run: python -m tools.eo_acceptance.run spatial --output /tmp/eo-spatial.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eo-acceptance-evidence
          path: /tmp/eo-*.xml
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eo-spatial-measurements
          path: /tmp/eo-spatial.json
          if-no-files-found: warn
