name: Contract and Capabilities Schema Guard

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  contract-capabilities-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check /contract and /capabilities schema inventory
        run: python scripts/ci/contract_capabilities_schema_guard.py --check
