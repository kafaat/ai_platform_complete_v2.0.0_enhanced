name: Temporary guarded generated-artifact application PR 1252

on:
  pull_request:
    types: [synchronize]

concurrency:
  group: realtime-1252-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.event.pull_request.number == 1252 && github.event.pull_request.head.ref == 'chatgpt/livekit-readiness-security-20261020' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Fetch immutable, read-only generated artifact from recorded run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 39501825192 --repo "$GITHUB_REPOSITORY" \
            --name realtime-1252-generated-48ae335402ac4344ec7dfa4ff62687e16d6c516d \
            --dir "$RUNNER_TEMP/realtime-1252-artifact"
      - name: Verify receipt, exact path allowlist, per-file hashes, and apply to working tree
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/realtime-1252-artifact
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, shutil
          root = Path.cwd().resolve()
          source = Path(os.environ["ARTIFACT_DIR"]).resolve()
          receipt = json.loads((source / "receipt.json").read_text())
          assert receipt.get("source_sha") == "48ae335402ac4344ec7dfa4ff62687e16d6c516d"
          allowed = {
              "docs/capability-registry/generated/impact/impact_index_summary.json",
              "docs/capability-registry/generated/management/management_manifest.json",
              "docs/capability-registry/generated/mapping/CAPABILITY_MAPPING_REPORT.md",
              "docs/capability-registry/generated/mapping/capability_mapping.json",
              "docs/capability-registry/generated/mapping/mapping_manifest.json",
              "docs/capability-registry/generated/mapping/unmapped_artifacts.json",
              "event-audit/generated/event_contract_graph.json",
              "execution-audit/generated/.audit.sha256",
              "execution-audit/generated/EXECUTION_DEPENDENCY_AUDIT_REPORT.md",
              "execution-audit/generated/dead_code_candidates.csv",
              "execution-audit/generated/execution_audit_summary.json",
              "execution-audit/generated/execution_dependency_audit.json",
              "execution-audit/generated/route_conflicts.json",
              "execution-audit/generated/route_handlers.csv",
              "governance/generated/STATIC_GOVERNANCE_ARTIFACTS.sha256",
              "governance/path2-generated/INTEGRATION_RUNTIME_GOVERNANCE_ARTIFACTS.sha256",
              "release/FILE_CHECKSUMS.sha256",
              "release/SAHOOL_RELEASE_MANIFEST_20260626.json",
          }
          files = receipt.get("files")
          assert isinstance(files, list) and {r["path"] for r in files} == allowed and len(files) == len(allowed)
          for item in files:
              rel = item["path"]
              src = source / rel
              dst = root / rel
              assert src.is_file() and not src.is_symlink() and src.resolve().is_relative_to(source)
              assert dst.is_file() and not dst.is_symlink() and dst.resolve().is_relative_to(root)
              data = src.read_bytes()
              assert len(data) == item["bytes"] and hashlib.sha256(data).hexdigest() == item["sha256"]
              shutil.copyfile(src, dst)
          print(f"verified and applied {len(files)} generated files from immutable source receipt")
          PY
          # This helper is temporary and was intentionally absent from the generator's
          # worktree. Delete it before the release checks and final branch commit.
          rm .github/workflows/realtime-1252-apply-generated.yml
          git diff --check
      - name: Validate most relevant contracts on the final no-helper worktree
        run: |
          set -euo pipefail
          python -m pip install pytest==9.1.1 PyYAML==6.0.2 jsonschema==4.26.0
          python scripts/ci/execution_dependency_audit.py --check
          python scripts/ci/capability_mapping_engine.py --check
          python scripts/ci/event_contract_graph.py --check
          python scripts/ci/route_conflict_guard.py --check
          python scripts/ci/prohibition_reason_guard.py --check
          python scripts/release/validate_release_package.py --root .
      - name: Commit only verified artifacts to the exact expected PR head
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          gh auth setup-git
          remote_sha=$(git ls-remote origin refs/heads/chatgpt/livekit-readiness-security-20261020 | cut -f1)
          test "$remote_sha" = "$EXPECTED_HEAD" || { echo "Branch moved: refusing stale push"; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --check
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 19
          git commit -m "chore(generated): reconcile verified LiveKit-readiness graphs and remove temporary helper"
          git push origin HEAD:refs/heads/chatgpt/livekit-readiness-security-20261020
