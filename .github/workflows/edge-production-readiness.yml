name: Edge Production Readiness Policy

on:
  pull_request:
    paths:
      - 'services/edge-inference/**'
      - 'docker-compose.v9.yml'
      - 'scripts/ci/edge_production_readiness_guard.py'
  push:
    branches: [ main ]
    paths:
      - 'services/edge-inference/**'
      - 'docker-compose.v9.yml'
      - 'scripts/ci/edge_production_readiness_guard.py'

jobs:
  edge-production-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python scripts/ci/edge_production_readiness_guard.py
