name: Edge Production Readiness Policy

on:
  pull_request:
    paths:
      - 'services/edge-inference/**'
      - 'docker-compose.v9.yml'
      - 'scripts/ci/edge_production_readiness_guard.py'
  push:
    branches: [ main ]
    paths:
      - 'services/edge-inference/**'
      - 'docker-compose.v9.yml'
      - 'scripts/ci/edge_production_readiness_guard.py'

jobs:
  edge-production-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python scripts/ci/edge_production_readiness_guard.py
