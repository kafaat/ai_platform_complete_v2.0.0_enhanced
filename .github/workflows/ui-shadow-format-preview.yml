name: Temporary read-only Ruff formatting candidate
on:
  pull_request:
    branches: [exp/ui-quality-impeccable-shadow-20261031]
    paths:
      - '.github/workflows/ui-shadow-format-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  format-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install the repository constrained formatter
        run: python -m pip install --disable-pip-version-check --no-input -c constraints-ci-tools.txt ruff
      - name: Generate exact diff and format in disposable runner
        run: |
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          ruff format --diff experiments/ui-quality-shadow/ui_quality_shadow.py experiments/ui-quality-shadow/test_ui_quality_shadow.py || :
          ruff format experiments/ui-quality-shadow/ui_quality_shadow.py experiments/ui-quality-shadow/test_ui_quality_shadow.py
          ruff format --check experiments/ui-quality-shadow/ui_quality_shadow.py experiments/ui-quality-shadow/test_ui_quality_shadow.py
          sha256sum experiments/ui-quality-shadow/ui_quality_shadow.py experiments/ui-quality-shadow/test_ui_quality_shadow.py
      - name: Preserve output for independent review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-shadow-formatted-source
          path: |
            experiments/ui-quality-shadow/ui_quality_shadow.py
            experiments/ui-quality-shadow/test_ui_quality_shadow.py
          retention-days: 3
          if-no-files-found: error
