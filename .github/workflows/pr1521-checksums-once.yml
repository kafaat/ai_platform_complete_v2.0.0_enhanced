name: PR1521 one-shot release checksum reconciliation
on:
  push:
    paths:
      - .github/workflows/pr1521-checksums-once.yml
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prod-pest-ack-hotfix-20261117
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify expected head and regenerate only changed checksum entries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          ledger = Path("release/FILE_CHECKSUMS.sha256")
          targets = {"tests_v9/test_auth_admin_stepup_mfa.py", "tests_v9/test_certification_verdict_is_not_forgeable.py"}
          lines = ledger.read_text().splitlines()
          found = set()
          out = []
          for line in lines:
              if "  " in line:
                  digest, rel = line.split("  ", 1)
                  if rel in targets:
                      digest = hashlib.sha256(Path(rel).read_bytes()).hexdigest()
                      found.add(rel)
                      line = f"{digest}  {rel}"
              out.append(line)
          if found != targets:
              raise SystemExit(f"missing checksums: {targets - found}")
          ledger.write_text("\n".join(out) + "\n")
          PY
          python scripts/release/validate_release_package.py
          python -m compileall -q tests_v9/test_auth_admin_stepup_mfa.py tests_v9/test_certification_verdict_is_not_forgeable.py
      - name: Remove temporary workflow and commit verified checksum ledger
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr1521-checksums-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/FILE_CHECKSUMS.sha256 .github/workflows/pr1521-checksums-once.yml
          git commit -m 'build(release): reconcile PR1521 test-fixture checksums after validation'
          git push origin HEAD:fix/prod-pest-ack-hotfix-20261117
