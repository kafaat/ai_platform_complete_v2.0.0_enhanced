name: Publish validated recovery objects
on:
  push:
    branches: ['codex/publish-notification-a190-20260920']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Restore exact verified objects to an isolated candidate branch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, pathlib
          data = base64.b64decode("", validate=True)
          if hashlib.sha256(data).hexdigest() != "727046c7a1255e38b7c998b6328d4f53592d5b33541dbf5dd036f702bdae4e13":
              raise SystemExit("recovery bundle checksum mismatch")
          (pathlib.Path(os.environ["RUNNER_TEMP"]) / "recovery.bundle").write_bytes(data)
          PY
          git bundle verify "$RUNNER_TEMP/recovery.bundle"
          git fetch "$RUNNER_TEMP/recovery.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "7387c12808d16f9c6afa47ff8b801bfe7b01642e"
          test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "617a7c17d0588e3e91dd4e57f49a7290f2fa9170"
          git merge-base --is-ancestor 1e4bca59f00c3cbd3ce69b9ed024f4889fa971c3 7387c12808d16f9c6afa47ff8b801bfe7b01642e
          git merge-base --is-ancestor a1908ec0f56b53e00e57471bd91abb6df68b7b5a 7387c12808d16f9c6afa47ff8b801bfe7b01642e
          git push origin 7387c12808d16f9c6afa47ff8b801bfe7b01642e:refs/heads/codex/notification-validated-a190-20260920
          echo "Published verified commit 7387c12808d16f9c6afa47ff8b801bfe7b01642e, tree 617a7c17d0588e3e91dd4e57f49a7290f2fa9170" >> "$GITHUB_STEP_SUMMARY"
