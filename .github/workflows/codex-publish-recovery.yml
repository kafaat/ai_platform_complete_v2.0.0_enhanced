name: Publish validated recovery objects
on:
  push:
    branches: ['codex/publish-notification-b310-20260920']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Restore exact verified objects to an isolated candidate branch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, pathlib
          data = base64.b64decode("", validate=True)
          if hashlib.sha256(data).hexdigest() != "1f2ce5f7821c097d2bed1c04a03f9d796596eadb613f7223c1d3240d0b4f081a":
              raise SystemExit("recovery bundle checksum mismatch")
          (pathlib.Path(os.environ["RUNNER_TEMP"]) / "recovery.bundle").write_bytes(data)
          PY
          git bundle verify "$RUNNER_TEMP/recovery.bundle"
          git fetch "$RUNNER_TEMP/recovery.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "1e4bca59f00c3cbd3ce69b9ed024f4889fa971c3"
          test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "c37f5707ea633cc197f092aa1e99b73895a25bd7"
          git merge-base --is-ancestor 6fc7b75cfed1654789cc87b93886c7002a1d7971 1e4bca59f00c3cbd3ce69b9ed024f4889fa971c3
          git merge-base --is-ancestor b3109c7bf5f7af35ccbf071e3ea10e1777255854 1e4bca59f00c3cbd3ce69b9ed024f4889fa971c3
          git push origin 1e4bca59f00c3cbd3ce69b9ed024f4889fa971c3:refs/heads/codex/notification-validated-b310-20260920
          echo "Published verified commit 1e4bca59f00c3cbd3ce69b9ed024f4889fa971c3, tree c37f5707ea633cc197f092aa1e99b73895a25bd7" >> "$GITHUB_STEP_SUMMARY"
