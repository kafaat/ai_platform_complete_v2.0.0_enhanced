name: Publish validated recovery objects
on:
  push:
    branches: ['codex/publish-inventory-claims-20260920']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Restore exact verified objects to an isolated candidate branch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, pathlib
          data = base64.b64decode("", validate=True)
          if hashlib.sha256(data).hexdigest() != "bfaae386931d081b5ce83c76de229020a81d8b527351e28695eb56742c0cc602":
              raise SystemExit("recovery bundle checksum mismatch")
          (pathlib.Path(os.environ["RUNNER_TEMP"]) / "recovery.bundle").write_bytes(data)
          PY
          git bundle verify "$RUNNER_TEMP/recovery.bundle"
          git fetch "$RUNNER_TEMP/recovery.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "8f066874efaf62e61e912aa2b03f7712c75e3429"
          test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "f1fd4303ebadc19c314172cbf89985b2679b47f2"
          git merge-base --is-ancestor d7f248f5c09e1acb6f5cc7631549065ee541dd95 8f066874efaf62e61e912aa2b03f7712c75e3429
          git merge-base --is-ancestor fc6afcbeb77b5b7df40f130ee6ad98f54b148464 8f066874efaf62e61e912aa2b03f7712c75e3429
          git push origin 8f066874efaf62e61e912aa2b03f7712c75e3429:refs/heads/codex/inventory-surface-claims-20260920
          echo "Published verified commit 8f066874efaf62e61e912aa2b03f7712c75e3429, tree f1fd4303ebadc19c314172cbf89985b2679b47f2" >> "$GITHUB_STEP_SUMMARY"
