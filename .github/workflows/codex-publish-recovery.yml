name: Publish validated recovery objects
on:
  push:
    branches: ['codex/publish-notification-14c-20260920']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Restore exact verified objects to an isolated candidate branch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, pathlib
          data = base64.b64decode("", validate=True)
          if hashlib.sha256(data).hexdigest() != "67a332b86d002b0846eb48a30aa9fa14a5eaaf4749b34a650907128a6c7938c5":
              raise SystemExit("recovery bundle checksum mismatch")
          (pathlib.Path(os.environ["RUNNER_TEMP"]) / "recovery.bundle").write_bytes(data)
          PY
          git bundle verify "$RUNNER_TEMP/recovery.bundle"
          git fetch "$RUNNER_TEMP/recovery.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "5e4c7a38dfe5c1a7fb54702209155798ff221372"
          test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "d82ed3822e8cf5bbef806d43fcfbda4050820f8f"
          git merge-base --is-ancestor 7387c12808d16f9c6afa47ff8b801bfe7b01642e 5e4c7a38dfe5c1a7fb54702209155798ff221372
          git merge-base --is-ancestor 14c674bf9ca9d7d31aabbb5bc1bcbee23ca752a2 5e4c7a38dfe5c1a7fb54702209155798ff221372
          git push origin 5e4c7a38dfe5c1a7fb54702209155798ff221372:refs/heads/codex/notification-validated-14c-20260920
          echo "Published verified commit 5e4c7a38dfe5c1a7fb54702209155798ff221372, tree d82ed3822e8cf5bbef806d43fcfbda4050820f8f" >> "$GITHUB_STEP_SUMMARY"
