name: Nginx Weather Edge Paths

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  nginx-weather-edge-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify weather and edge gateway paths
        run: python scripts/ci/nginx_weather_edge_path_guard.py
