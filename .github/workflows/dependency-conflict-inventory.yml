name: Dependency Conflict Inventory

on:
  pull_request:
    paths:
      - 'services/**/requirements*.txt'
      - 'scripts/ci/service_dependency_conflict_guard.py'
      - 'scripts/ci/build_service_dependency_bundle.py'
      - 'dependency_conflicts.generated.json'
      - 'dependency_conflicts.csv'
      - 'requirements.services.direct.lock'
  push:
    branches: [ main ]
    paths:
      - 'services/**/requirements*.txt'
      - 'scripts/ci/service_dependency_conflict_guard.py'
      - 'scripts/ci/build_service_dependency_bundle.py'
      - 'dependency_conflicts.generated.json'
      - 'dependency_conflicts.csv'
      - 'requirements.services.direct.lock'

# عبءُ أجهزة التشغيل: دفعٌ جديد إلى الـPR نفسه يلغي تشغيلَه الأقدم لهذا المسار (كـci.yml)؛ وأحداثُ
# غير الـPR مجموعتُها فريدة (run_id) فلا تُلغى ولا تُسلسَل — كلُّ دمجٍ إلى main يُفحص كاملاً.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}-{2}', github.workflow, github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-conflict-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python scripts/ci/service_dependency_conflict_guard.py --check
      - run: python scripts/ci/build_service_dependency_bundle.py --check
