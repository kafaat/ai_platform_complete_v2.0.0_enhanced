name: Dependency Conflict Inventory

on:
  pull_request:
    paths:
      - 'services/**/requirements*.txt'
      - 'scripts/ci/service_dependency_conflict_guard.py'
      - 'scripts/ci/build_service_dependency_bundle.py'
      - 'dependency_conflicts.generated.json'
      - 'dependency_conflicts.csv'
      - 'requirements.services.direct.lock'
  push:
    branches: [ main ]
    paths:
      - 'services/**/requirements*.txt'
      - 'scripts/ci/service_dependency_conflict_guard.py'
      - 'scripts/ci/build_service_dependency_bundle.py'
      - 'dependency_conflicts.generated.json'
      - 'dependency_conflicts.csv'
      - 'requirements.services.direct.lock'

jobs:
  dependency-conflict-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python scripts/ci/service_dependency_conflict_guard.py --check
      - run: python scripts/ci/build_service_dependency_bundle.py --check
