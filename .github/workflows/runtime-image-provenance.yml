name: Runtime Image Provenance

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA to build
        required: true

# **الصلاحياتُ على مستوى الملفّ تُورَّث إلى كلّ وظيفة، ومَن لا يحتاجها يحملها.**
# `publish-manifest` أدناه لا يدفع صورةً ولا يُصدِر شهادةً — يجمّع شظايا JSON —
# وكان يعمل ومعه `packages:write` و`id-token:write` و`attestations:write`.
# فالحدُّ الأدنى هنا، والامتيازُ في الوظيفة التي تستعمله وحدَها.
permissions:
  contents: read

concurrency:
  group: runtime-image-provenance-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  build-and-attest:
    runs-on: ubuntu-24.04
    # الوظيفةُ الوحيدةُ التي تدفع صورةً وتُصدِر شهادةَ منشأ — فهي وحدَها تحمل الامتياز.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: weather-service
            dockerfile: services/weather-service/Dockerfile
            image_name: sahool-weather-service
          - service: soil-service
            dockerfile: services/soil-service/Dockerfile
            image_name: sahool-soil-service
          - service: sahool-platform
            dockerfile: services/sahool-platform/Dockerfile
            image_name: sahool-platform
          # raster-service دخلت هنا مع وصل هويّتها. صورةٌ تحمل SHA صحيحاً وهي مبنيّة
          # محلّيّاً ما زالت **غير موثَّقة** — والفجوة الأصليّة نصّها «يمكن بناء صورة لا
          # يمكن ربطها بالـSHA المختبر»، والربط المقصود attestation لا وسم.
          # وإضافةُ صفٍّ هنا وحدها لا تكفي: `publish-manifest` أدناه يحمل مجموعة
          # متوقَّعة مثبَّتة نصّاً، وتركُها يُفشِل تجميع البيان بعد بناء ناجح.
          - service: raster-service
            dockerfile: services/raster-service/Dockerfile
            image_name: sahool-raster-service
          - service: auth-service
            dockerfile: services/auth/Dockerfile
            image_name: sahool-auth
          - service: decision-service
            dockerfile: services/decision-service/Dockerfile
            image_name: sahool-decision-service
          - service: guardrails-engine
            dockerfile: services/guardrails-engine/Dockerfile
            image_name: sahool-guardrails-engine
          - service: supervisor-agent
            dockerfile: services/supervisor-agent/Dockerfile
            image_name: sahool-supervisor-agent
          - service: raster-tiler-service
            dockerfile: services/raster-tiler-service/Dockerfile
            image_name: raster-tiler-service
          - service: agriai-engine
            dockerfile: services/agriai-engine/Dockerfile
            image_name: sahool-agriai-engine
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
      # **الفحصُ كان يقع بعد أن صار المدخلُ شيفرة، فلا يفحص شيئاً.**
      # `source_sha` مدخلُ `workflow_dispatch` **حرُّ النصّ** (بلا `type:`)، وكان
      # يُحقَن في متن `run` بـ`${{ }}`: القالبُ يُصيّره نصَّ السكربت **قبل** أن
      # يبدأ bash، فسطرُ `[[ … =~ ^[0-9a-f]{40}$ ]]` يُنفَّذ في سكربتٍ حُقِن أصلاً.
      # وهذه الوظيفةُ بعينها تحمل `attestations:write` و`id-token:write` —
      # فالحقنُ فيها يُصدِر شهادةَ منشأٍ مُوقَّعة، وهو **نقضُ فصلِ السلطة نفسِه**
      # الذي تقوم عليه هذه السلسلة، لا مجرّد تنفيذِ أمرٍ في عدّاء.
      # فالقيمةُ تُمرَّر عبر `env` (بيانات لا شيفرة)، **والشكلُ يُفحَص أوّلاً**.
      - name: Validate exact checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # **`provenance: false` كان ينقض اسمَ هذا الـworkflow.** الملفُّ اسمُه
      # «Runtime Image Provenance» ويُوقّع بصمةً بـ`actions/attest`، لكنّ BuildKit
      # لم يكن يُنتِج مُسنَدَ منشأٍ أصلاً — فالشهادةُ تربط البايتات بالتشغيل **ولا
      # تقول كيف بُنِيت**. و`mode=max` يُدرِج المصدرَ وخطواتِ البناء والمواد.
      #
      # **و`sbom: true` ليس زينةً:** الفحصُ أدناه يحجب على HIGH/CRITICAL، وبلا
      # جردِ مكوّناتٍ لا يُعرَف **ما الذي فُحِص**. والاثنان يُدفَعان مع الصورة،
      # ولذلك `push: true` ولا `load: true`: مُصدِّرُ docker المحلّيّ **يُسقِط
      # المُسنَدات**، فتُبنى صورةٌ تبدو موثَّقةً ولا تحمل توثيقاً في السجلّ.
      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}:${{ inputs.source_sha }}
          build-args: |
            SAHOOL_GIT_SHA=${{ inputs.source_sha }}
            SAHOOL_BUILD_ID=gha-image-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service }}
            SAHOOL_SOURCE_REPOSITORY=${{ github.repository }}
            SAHOOL_SOURCE_REF=${{ github.ref }}
      # ── الفحصُ يسبق الشهادة، والأداةُ مثبَّتةٌ بالبصمة ──────────────────────
      # **`--version` ليس مرجعَ ثقة** — أداةٌ رسميّةٌ واحدة على الأقلّ تطبع حالةَ
      # بناءٍ فيها `dirty`. المرجعُ رابطُ الإصدار المُثبَّت وبصمتُه، ويُطابَقان
      # **قبل** فكِّ الأرشيف لا بعده.
      - name: Install pinned Trivy
        shell: bash
        env:
          TRIVY_VERSION: "0.74.0"
          TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
        run: |
          set -euo pipefail
          asset="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL --retry 3 --max-time 300 -o "$asset" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${asset}"
          echo "${TRIVY_SHA256}  ${asset}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/trivy" && tar xzf "$asset" -C "${RUNNER_TEMP}/trivy" trivy
          echo "${RUNNER_TEMP}/trivy" >> "$GITHUB_PATH"

      # **قاعدةٌ غائبةٌ ليست صفرَ ثغرات.** بلا `--exit-code 1` على خطأِ التحديث
      # يُخرِج Trivy تقريراً فارغاً وينجح، فيُقرأ الفراغُ سلامةً — وهو تحويلُ
      # غيابِ البيانات إلى نجاح. فتُحمَّل القاعدةُ في خطوةٍ **تفشل** إن تعذّرت.
      - name: Warm Trivy database (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          trivy image --download-db-only --timeout 10m

      # **يُفحَص بالبصمة لا بالوسم:** الوسمُ قد يُعاد توجيهه بين الفحص والترقية،
      # والبصمةُ لا. والفشلُ على HIGH/CRITICAL حاجبٌ بالقصد.
      - name: Scan image by digest (blocking on HIGH/CRITICAL)
        shell: bash
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}@${{ steps.build.outputs.digest }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          mkdir -p image-evidence
          trivy image --quiet --scanners vuln --ignore-unfixed=false \
            --severity HIGH,CRITICAL --exit-code 1 --format json \
            --output "image-evidence/${SERVICE}.trivy.json" "$IMAGE_REF"

      # **جردُ مكوّناتٍ مستقلٌّ عن جردِ BuildKit** — قارئان لحقيقةٍ واحدة يكشفان
      # انحرافَ أحدهما. وصيغةُ CycloneDX هي ما يتحقّق منه PATH-3 لاحقاً بالنوع.
      - name: Generate CycloneDX image SBOM
        shell: bash
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}@${{ steps.build.outputs.digest }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          trivy image --quiet --format cyclonedx \
            --output "image-evidence/${SERVICE}.sbom.cdx.json" "$IMAGE_REF"
          test -s "image-evidence/${SERVICE}.sbom.cdx.json"

      - name: Attest build provenance for the image digest
        uses: actions/attest-build-provenance@977bb373b6ba1878c4dc1e1e2ce09ee8e3a9a6ec # v3.0.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest the CycloneDX SBOM for the same digest
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v3.0.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: image-evidence/${{ matrix.service }}.sbom.cdx.json
          push-to-registry: true

      # **إصدارُ شهادةٍ ليس التحقّقَ منها.** `ATTESTED-IS-NOT-CERTIFIED-01` في هذا
      # المستودع نصُّه أنّ حزمةً صحيحةً تشفيريّاً بالكامل خرجت من تشغيلٍ فاشل.
      # فيُتحقَّق هنا من **نوعَي المُسنَد** صراحةً وبهويّة الـworkflow المتوقَّعة،
      # ولا يُقبَل وجودُ الوسم دليلَ منشأ.
      - name: Verify both predicate types against the digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}@${{ steps.build.outputs.digest }}
          SERVICE: ${{ matrix.service }}
          SIGNER: ${{ github.repository }}/.github/workflows/runtime-image-provenance.yml
        run: |
          set -euo pipefail
          gh attestation verify "oci://${IMAGE_REF}" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$SIGNER" \
            --predicate-type https://slsa.dev/provenance/v1 \
            --format json > "image-evidence/${SERVICE}.provenance-verification.json"
          gh attestation verify "oci://${IMAGE_REF}" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$SIGNER" \
            --predicate-type https://cyclonedx.org/bom \
            --format json > "image-evidence/${SERVICE}.sbom-verification.json"
          test -s "image-evidence/${SERVICE}.provenance-verification.json"
          test -s "image-evidence/${SERVICE}.sbom-verification.json"
      # الموضعُ الثاني للحقن نفسِه: مستندٌ هنا (heredoc) يحمل `${{ inputs.source_sha }}`.
      # يُمرَّر عبر `env` كسابقه — والتوسيعُ هنا توسيعُ **متغيّر صَدَفة**، لا إقحامَ قالب.
      - name: Write image manifest fragment
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}@${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          BUILDER_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p image-manifest-fragments
          # **البصماتُ الأربعُ تُربَط بالبيان لا تُرفَق به.** مصنوعةٌ مرفوعةٌ بجانب
          # البيان تُستبدَل أو تُسقَط بلا أن يتغيّر البيان؛ وبصمةٌ **داخله** تجعل
          # كلَّ استبدالٍ يُحمِّر عند المستهلك. وPATH-3 يرفض الناقصَ منها.
          scan_digest="$(sha256sum "image-evidence/${SERVICE}.trivy.json" | cut -d' ' -f1)"
          sbom_digest="$(sha256sum "image-evidence/${SERVICE}.sbom.cdx.json" | cut -d' ' -f1)"
          prov_digest="$(sha256sum "image-evidence/${SERVICE}.provenance-verification.json" | cut -d' ' -f1)"
          sbomv_digest="$(sha256sum "image-evidence/${SERVICE}.sbom-verification.json" | cut -d' ' -f1)"
          cat > "image-manifest-fragments/${SERVICE}.json" <<EOF
          {
            "service": "${SERVICE}",
            "image": "${IMAGE_REF}",
            "source_sha": "${SOURCE_SHA}",
            "builder_workflow": "${BUILDER_REPO}/.github/workflows/runtime-image-provenance.yml",
            "builder_run_id": "${RUN_ID}",
            "builder_run_attempt": "${RUN_ATTEMPT}",
            "evidence": {
              "scan_sha256": "${scan_digest}",
              "sbom_sha256": "${sbom_digest}",
              "provenance_verification_sha256": "${prov_digest}",
              "sbom_verification_sha256": "${sbomv_digest}"
            }
          }
          EOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-image-fragment-${{ matrix.service }}
          path: image-manifest-fragments/${{ matrix.service }}.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-image-evidence-${{ matrix.service }}
          path: image-evidence/
          if-no-files-found: error
          retention-days: 30

  publish-manifest:
    needs: build-and-attest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runtime-image-fragment-*
          path: image-manifest-fragments
          merge-multiple: true
      - name: Assemble immutable image manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          fragments={}
          for p in sorted(Path('image-manifest-fragments').glob('*.json')):
              row=json.loads(p.read_text())
              fragments[row['service']]=row
          expected={'weather-service','soil-service','raster-service','sahool-platform','auth-service','decision-service','guardrails-engine','supervisor-agent','raster-tiler-service','agriai-engine'}
          if set(fragments)!=expected:
              raise SystemExit(f'image manifest incomplete: {sorted(set(fragments)^expected)}')
          # **شظيّةٌ بلا بصماتها الأربع تُرفَض هنا، لا عند المستهلك.** فالبيانُ
          # المُجمَّع هو العقد، وقبولُ شظيّةٍ ناقصةٍ يجعله يَعِد بما لا يحمل.
          REQUIRED_EVIDENCE={'scan_sha256','sbom_sha256','provenance_verification_sha256','sbom_verification_sha256'}
          for service,row in sorted(fragments.items()):
              evidence=row.get('evidence') or {}
              missing=REQUIRED_EVIDENCE-set(evidence)
              if missing:
                  raise SystemExit(f'{service}: evidence digests missing: {sorted(missing)}')
              bad=[k for k,v in evidence.items() if not (isinstance(v,str) and len(v)==64 and all(c in "0123456789abcdef" for c in v))]
              if bad:
                  raise SystemExit(f'{service}: evidence digests malformed: {sorted(bad)}')
          out={'schema_version':'1.0','source_sha':os.environ['SOURCE_SHA'],'repository':os.environ['GITHUB_REPOSITORY'],'source_ref':os.environ['GITHUB_REF'],'builder_workflow':f"{os.environ['GITHUB_REPOSITORY']}/.github/workflows/runtime-image-provenance.yml",'builder_run_id':os.environ['GITHUB_RUN_ID'],'images':fragments}
          Path('runtime-image-manifest.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          PY
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-image-manifest-${{ inputs.source_sha }}
          path: runtime-image-manifest.json
          if-no-files-found: error
          retention-days: 30
