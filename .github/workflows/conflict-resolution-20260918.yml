name: Temporary PR conflict resolution 20260918
on:
  push:
    branches: [ops/conflict-resolution-20260918]
permissions:
  contents: write
  actions: read
concurrency:
  group: temporary-conflict-resolution-resume-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  resolve:
    name: Resume validated PR 1021 candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MAIN_SHA: 3873838bbdc3cbcac6ba52ac6b0a7ca3f2ce991b
      PR_SHA: 45d5205ee7acb4e1a4d182d451dc26cb80cdc012
      PR_BRANCH: codex/edge-model-artifact-digest-01
      PR_NUMBER: '1021'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests_v9/requirements-test.txt
      - name: Install existing test dependencies and the pinned formatter
        timeout-minutes: 10
        run: python -m pip install -r tests_v9/requirements-test.txt ruff==0.15.8
      - name: Recover the exact previously regenerated snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          repository: kafaat/ai_platform_complete_v2.0.0_enhanced
          run-id: 35379278784
          artifact-ids: 10561743910
          path: ${{ runner.temp }}/restored
          merge-multiple: true
      - name: Resume, validate, and publish a new candidate ref only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          python .github/maintenance/resolve_prs_20260918.py 2>&1 | tee "$RUNNER_TEMP/evidence/operation.log"
      - name: Preserve source and diagnostics even on failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          if [ -d "$RUNNER_TEMP/candidate" ]; then
            git -C "$RUNNER_TEMP/candidate" bundle create "$RUNNER_TEMP/evidence/candidate.bundle" HEAD
            git -C "$RUNNER_TEMP/candidate" status --porcelain=v1 > "$RUNNER_TEMP/evidence/status.txt"
            git -C "$RUNNER_TEMP/candidate" diff --binary HEAD > "$RUNNER_TEMP/evidence/worktree.patch"
            git -C "$RUNNER_TEMP/candidate" diff --name-only --diff-filter=U > "$RUNNER_TEMP/evidence/unresolved.txt"
          fi
          cd "$RUNNER_TEMP/evidence"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: conflict-resolution-pr1021-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 7
