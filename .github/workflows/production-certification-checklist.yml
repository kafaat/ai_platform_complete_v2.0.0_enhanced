name: production-certification-checklist
on:
  pull_request:
  push:
    branches: [main, develop]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/ci/production_certification_checklist_guard.py --check
