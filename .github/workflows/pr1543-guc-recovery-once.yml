name: PR1543 pinned GUC provenance recovery
on:
  push:
    branches: [ci/pr1543-guc-recovery-20261119]
    paths: [.github/workflows/pr1543-guc-recovery-once.yml]

permissions:
  contents: read

concurrency:
  group: pr1543-guc-recovery-4006d462
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      EXPECTED_HEAD: 4006d46251d8ffb50c5d9d23397aa841547f5222
      EXPECTED_BASE: 39bb70637fe29afd0684224be5015329ed4c25ee
      TARGET_BRANCH: docs/sharing-retired-route-alignment-20261119
      CANDIDATE_BRANCH: ci/pr1543-guc-generated-4006d462
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 4006d46251d8ffb50c5d9d23397aa841547f5222
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tests_v9/requirements-test.txt
            services/sahool-platform/api/requirements.txt
      - name: Verify pinned source and current target before executing
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = 18622b08839dcdf3e6163371851a46a569ab6af3
          test -z "$(git status --porcelain)"
          current_target="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          current_base="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$current_target" = "$EXPECTED_HEAD"
          test "$current_base" = "$EXPECTED_BASE"
          existing_candidate="$(git ls-remote origin "refs/heads/$CANDIDATE_BRANCH")"
          test -z "$existing_candidate"
          test ! -e .github/workflows/pr1543-guc-recovery-once.yml
          evidence_dir="$(dirname "$GITHUB_WORKSPACE")/pr1543-recovery"
          mkdir -p "$evidence_dir"
          printf 'PR1543_EVIDENCE_DIR=%s\n' "$evidence_dir" >> "$GITHUB_ENV"
          printf 'SOURCE_DATE_EPOCH=%s\n' "$(git show -s --format=%ct "$EXPECTED_HEAD")" >> "$GITHUB_ENV"
          git rev-parse HEAD HEAD^{tree} > "$evidence_dir/source-identity.txt"
          cp docs/architecture/tenant_guc_scope_baseline.json "$evidence_dir/baseline-before.json"
      - name: Install the repository's declared test dependencies
        run: |
          set -euo pipefail
          python -m pip install -r tests_v9/requirements-test.txt -r services/sahool-platform/api/requirements.txt pillow edge-tts==7.2.8
          bash scripts/ci/resilient_apt_install.sh redis-server
          sudo systemctl stop redis-server
          sudo systemctl disable redis-server
          redis-server --version
      - name: Verify the immutable continuation package
        working-directory: .claude/skills/work-continuation
        run: sha256sum -c SHA256SUMS
      - name: Reproduce the stale provenance failure
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          python scripts/ci/tenant_guc_scope_guard.py --check > "$PR1543_EVIDENCE_DIR/before-check.log" 2>&1 || rc=$?
          cat "$PR1543_EVIDENCE_DIR/before-check.log"
          test "$rc" -eq 1
          python - <<'PY'
          import os
          from pathlib import Path
          log = (Path(os.environ["PR1543_EVIDENCE_DIR"]) / "before-check.log").read_text(encoding="utf-8")
          assert "PROVENANCE_STALE" in log, log
          assert "0f8b4276f6cb" in log and "8592fa4236da" in log, log
          PY
      - name: Run the unchanged generator and verify the ratchet
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/tenant_guc_scope_guard.py --generate
          python scripts/ci/tenant_guc_scope_guard.py --check | tee "$PR1543_EVIDENCE_DIR/after-check.log"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          evidence = Path(os.environ["PR1543_EVIDENCE_DIR"])
          before = json.loads((evidence / "baseline-before.json").read_text(encoding="utf-8"))
          after = json.loads(Path("docs/architecture/tenant_guc_scope_baseline.json").read_text(encoding="utf-8"))
          for key in ("offenders", "guc_names", "measurement_contract_version", "measurement_algorithm_digest"):
              assert after[key] == before[key], key
          assert after["measurement_basis_digest"] == "8592fa4236da6a91468fd7b9967f720ac362ff19b4266a4559f685e968ead018"
          assert after["measured_on"] == os.environ["EXPECTED_HEAD"]
          old = {item["path"]: item["sha256"] for item in before["measurement_inputs"]}
          new = {item["path"]: item["sha256"] for item in after["measurement_inputs"]}
          assert old.keys() == new.keys()
          changed_inputs = [path for path in sorted(old) if old[path] != new[path]]
          assert changed_inputs == ["services/sahool-platform/api/main.py"], changed_inputs
          evidence.joinpath("ratchet-review.json").write_text(json.dumps({
              "source_head": os.environ["EXPECTED_HEAD"],
              "offenders_unchanged": True,
              "guc_names_unchanged": True,
              "algorithm_unchanged": True,
              "changed_inputs": changed_inputs,
              "measurement_basis_digest": after["measurement_basis_digest"]
          }, indent=2) + "\n", encoding="utf-8")
          PY
          python -m pytest -q tests_v9/test_measurement_basis_freshness.py tests_v9/test_tenant_guc_scope_guard.py --junitxml="$PR1543_EVIDENCE_DIR/focused-tests.xml" | tee "$PR1543_EVIDENCE_DIR/focused-tests.log"
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path(os.environ["PR1543_EVIDENCE_DIR"]) / "focused-tests.xml"
          suites = list(ET.parse(report).getroot().iter("testsuite"))
          assert suites and sum(int(s.get("tests", "0")) for s in suites) > 0
          for suite in suites:
              for field in ("failures", "errors", "skipped"):
                  assert int(suite.get(field, "0")) == 0, (field, suite.attrib)
          PY
      - name: Build release metadata from the complete source tree
        shell: bash
        run: |
          set -euo pipefail
          git add docs/architecture/tenant_guc_scope_baseline.json
          python scripts/release/build_release_bundle.py --root .
          python scripts/release/validate_release_package.py --root . | tee "$PR1543_EVIDENCE_DIR/release-validation.log"
          git add release/FILE_CHECKSUMS.sha256 release/SAHOOL_RELEASE_MANIFEST_20260626.json release/SBOM_MINIMAL.json
          python scripts/ci/verify_all_generated.py --check | tee "$PR1543_EVIDENCE_DIR/generated-check.log"
      - name: Checkpoint generated bytes before extended verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PR1543_EVIDENCE_DIR/generated-unaccepted"
          cp --parents docs/architecture/tenant_guc_scope_baseline.json release/FILE_CHECKSUMS.sha256 release/SAHOOL_RELEASE_MANIFEST_20260626.json release/SBOM_MINIMAL.json "$PR1543_EVIDENCE_DIR/generated-unaccepted/"
          git diff HEAD --binary > "$PR1543_EVIDENCE_DIR/generated-unaccepted.patch"
          printf '%s\n' 'PRECHECKS_PASSED; FULL_PREFLIGHT_PENDING; NOT_ACCEPTED_FOR_PR' > "$PR1543_EVIDENCE_DIR/checkpoint-status.txt"
      - name: Retain the unaccepted generation checkpoint
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr1543-guc-generated-preflight-pending-4006d462
          path: ${{ env.PR1543_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14
      - name: Run the repository pre-push protocol
        shell: bash
        env:
          BASE: 39bb70637fe29afd0684224be5015329ed4c25ee
          REDIS_ACL_LIVE_REQUIRED: "1"
        run: |
          set -euo pipefail
          bash scripts/ci/preflight.sh --no-fetch | tee "$PR1543_EVIDENCE_DIR/preflight.log"
      - name: Validate the final scoped diff and publish a candidate only
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/tenant_guc_scope_guard.py --check
          python scripts/release/validate_release_package.py --root .
          git diff --check
          git diff --cached --check
          test -z "$(git ls-files --others --exclude-standard)"
          python - <<'PY'
          import subprocess
          allowed = {
              "docs/architecture/tenant_guc_scope_baseline.json",
              "release/FILE_CHECKSUMS.sha256",
              "release/SAHOOL_RELEASE_MANIFEST_20260626.json",
              "release/SBOM_MINIMAL.json",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only", "HEAD"], text=True).splitlines())
          assert changed <= allowed, sorted(changed - allowed)
          assert "docs/architecture/tenant_guc_scope_baseline.json" in changed
          assert "release/FILE_CHECKSUMS.sha256" in changed
          print("Reviewed generated paths:", *sorted(changed), sep="\n")
          PY
          git add docs/architecture/tenant_guc_scope_baseline.json release/FILE_CHECKSUMS.sha256 release/SAHOOL_RELEASE_MANIFEST_20260626.json release/SBOM_MINIMAL.json
          git diff --cached --binary > "$PR1543_EVIDENCE_DIR/regeneration.patch"
          current_target="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          current_base="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$current_target" = "$EXPECTED_HEAD"
          test "$current_base" = "$EXPECTED_BASE"
          existing_candidate="$(git ls-remote origin "refs/heads/$CANDIDATE_BRANCH")"
          test -z "$existing_candidate"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(governance): regenerate tenant GUC provenance on PR1543"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
          git rev-parse HEAD HEAD^{tree} > "$PR1543_EVIDENCE_DIR/candidate-identity.txt"
          git push --force-with-lease="refs/heads/$CANDIDATE_BRANCH:" origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
      - name: Retain recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr1543-guc-recovery-4006d462
          path: ${{ env.PR1543_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14
