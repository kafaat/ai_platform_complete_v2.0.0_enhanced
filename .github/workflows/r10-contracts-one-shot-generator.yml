name: R10 contracts one-shot deterministic artifact regeneration

on:
  push:
    branches:
      - fix/contracts-r9-tenant-provision-response-20261113

permissions:
  contents: write

jobs:
  regenerate-contract-artifacts:
    if: startsWith(github.event.head_commit.message, 'r10-run-generator')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the R9 branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/contracts-r9-tenant-provision-response-20261113
          fetch-depth: 0
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install generator prerequisites
        run: python -m pip install pytest==9.1.1 PyYAML==6.0.2 jsonschema==4.26.0
      - name: Regenerate with source-controlled generators and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # A temporary workflow must not become an input of the release inventory.
          git rm -f .github/workflows/r10-contracts-one-shot-generator.yml
          git add -A
          # Linker writes only its declared evidence fields; canonical fields remain projected.
          python scripts/ci/capability_linker.py --apply
          python scripts/ci/verify_all_generated.py --fix
          git add -A
          python scripts/ci/verify_all_generated.py --check
          python scripts/ci/capability_compatibility_roundtrip_guard.py
          # Source release bundle is always built AFTER every other generated artifact.
          python scripts/release/build_release_bundle.py
          git add -A
          python scripts/release/validate_release_package.py
          python -m pytest -q tests/architecture/test_capability_mapping_engine.py tests/architecture/test_capability_compatibility_roundtrip_guard.py
          # Fail closed if any generator modified authored source rather than a governed
          # artifact. Do not auto-commit unrelated code or trust config.
          python - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          allowed_prefixes = (
              'docs/capability-registry/generated/',
              'capabilities/generated/',
              'release/',
              'docs/architecture/generated/',
          )
          allowed_exact = {
              '.github/workflows/r10-contracts-one-shot-generator.yml',
              'capabilities/registry/capabilities.json',
              'docs/capability-registry/capability_management_matrix.json',
          }
          rejected = [p for p in paths if p not in allowed_exact and not p.startswith(allowed_prefixes)]
          if rejected:
              raise SystemExit(f'R10 generator produced unapproved source changes: {rejected}')
          print(f'R10 governed changes: {len(paths)}', *paths, sep='\n')
          PY
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 1
          fi
          git commit -m 'chore(contracts): regenerate capability evidence and release bundle after R9'
          git push origin HEAD:refs/heads/fix/contracts-r9-tenant-provision-response-20261113
