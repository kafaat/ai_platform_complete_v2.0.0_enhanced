name: P1 Main Decomposition Guard

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  p1-main-decomposition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/ci/p1_main_decomposition_guard.py
