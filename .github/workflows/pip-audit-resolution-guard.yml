name: pip-audit resolution guard

on:
  pull_request:
    paths:
      - "requirements*.txt"
      - "services/**/requirements*.txt"
      - "tests_v9/requirements-test.txt"
      - "scripts/ci/pip_audit_resolution_guard.py"
      - "tests_v9/test_pip_audit_resolution_guard.py"
      - ".github/workflows/pip-audit-resolution-guard.yml"
  push:
    branches: [main]
    paths:
      - "requirements*.txt"
      - "services/**/requirements*.txt"
      - "tests_v9/requirements-test.txt"
      - "scripts/ci/pip_audit_resolution_guard.py"
      - "tests_v9/test_pip_audit_resolution_guard.py"
      - ".github/workflows/pip-audit-resolution-guard.yml"

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/ci/pip_audit_resolution_guard.py
      # conftest tests_v9 يستورد httpx/pydantic دائماً ⇒ بيئة الاختبار الكاملة
      # إلزاميّة لا pytest وحده (درس fresh-runner + conftest المُوثَّق).
      - run: python -m pip install -r tests_v9/requirements-test.txt
      - run: python -m pytest -q tests_v9/test_pip_audit_resolution_guard.py
