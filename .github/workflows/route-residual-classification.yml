name: Route Residual Classification
on:
  pull_request:
  push:
    branches: [ main, develop ]
jobs:
  classify-main-route-residuals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python scripts/ci/route_residual_classification_guard.py --check
