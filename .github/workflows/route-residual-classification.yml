name: Route Residual Classification
on:
  pull_request:
  push:
    branches: [ main, develop ]
jobs:
  classify-main-route-residuals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/ci/route_residual_classification_guard.py --check
