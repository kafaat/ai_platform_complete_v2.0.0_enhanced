name: Regenerate immutable mirror PR artifacts

on:
  push:
    branches: [codex/ecr-ghcr-immutable-mirror-20261015]
    paths:
      - .github/workflows/ci-immutable-mirror-regenerate.yml
      - .github/workflows/ci-immutable-image-mirror.yml
      - .github/workflows/railway-dockerfile-pr-build.yml
      - tests_v9/test_ci_image_mirror.py

permissions:
  contents: write

concurrency:
  group: ci-mirror-regenerate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regeneration:
    name: Regenerate and attest release files (one-shot)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install pinned formatter and declared generator tooling
        run: |
          python -m pip install -c constraints-ci-tools.txt ruff
          python -m pip install pytest==9.1.1 PyYAML==6.0.2 jsonschema==4.26.0
      - name: Refuse checkout if branch advanced
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${GITHUB_REF_NAME}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/${GITHUB_REF_NAME}")" || {
            echo "::error::Checkout stale; a newer branch head must be regenerated" >&2
            exit 1
          }
      - name: Format regression witnesses on exact checked-out source
        run: ruff format tests_v9/test_ci_image_mirror.py
      - name: Converge and validate generated artifacts
        run: |
          set -euo pipefail
          # Use the same fixed-point engine through its module entrypoint.
          # The workflow scanner must not recursively register the generator
          # as a child of itself; both actual passes remain mandatory.
          python -m scripts.ci.verify_all_generated --fix
          python -m scripts.ci.verify_all_generated --check
      - name: Build release bundle last, validate and record exact tree
        run: |
          set -euo pipefail
          python scripts/release/build_release_bundle.py --root .
          python scripts/release/validate_release_package.py --root .
          python -m scripts.ci.verify_all_generated --check
          git diff --check
          git add -A
          if git diff --cached --quiet; then
            echo "Generated artifacts unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(ci): regenerate mirror governance and verified release package"
            git push origin HEAD:codex/ecr-ghcr-immutable-mirror-20261015
          fi
