name: Docker Build Matrix - Critical Services

# P-CERT-1 (Docker build matrix) + بداية دليل P-CERT-4 (خدمات النماذج).
# المرجع التشغيليّ: docs/runbooks/DOCKER_BUILD_CHECKLIST_P_CERT_CRITICAL_SERVICES.md
# القاعدة: الحاويات لا "تبني فقط" — تقلع بلا أخطاء استيراد، /healthz صالح،
# /readyz صادق (degraded مسموح، الكذب ممنوع)، وfail-closed عند غياب النماذج.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'services/raster-service/**'
      - 'services/weather-service/**'
      - 'services/edge-inference/**'
      - 'services/sam2-inference/**'
      - '.github/workflows/docker-build-matrix.yml'

jobs:
  docker-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service:
          - raster-service
          - weather-service
          - edge-inference
          - sam2-inference
        include:
          # المنافذ من Dockerfiles الفعليّة (لا من compose): raster 8001 · weather 8000
          # (compose يعيّن 8092 على المضيف فقط) · edge 8100 · sam2 8080.
          - service: raster-service
            dockerfile: services/raster-service/Dockerfile
            image: sahool/raster-service:ci
            port: 8001
            host_port: 18001
            # FIELD_DEM_PATH فارغ صراحةً = DEM غائب بصدق (topographic QA يعلن غيابه).
            run_env: '-e FIELD_DEM_PATH='
          - service: weather-service
            dockerfile: services/weather-service/Dockerfile
            image: sahool/weather-service:ci
            port: 8000
            host_port: 18000
            # بلا Redis: cache.py يسقط إلى الذاكرة وreadyz يعلن الخلفيّة بصدق.
            run_env: '-e WEATHER_REDIS_URL='
          - service: edge-inference
            # لا يوجد Dockerfile عاديّ للخدمة؛ .arm64 قاعدة python:3.12 متعدّدة
            # المعماريّات وتُبنى على amd64 أيضاً (onnxruntime عجلة عامّة).
            dockerfile: services/edge-inference/Dockerfile.arm64
            image: sahool/edge-inference:ci
            port: 8100
            host_port: 18100
            # الإقلاع الأوّل بلا نماذج عمداً: strict + production_required يجب أن
            # يُفشِلا /readyz لا /healthz (إثبات fail-closed، لا اختلاق استدلال).
            run_env: '-e EDGE_PRODUCTION_REQUIRED=true -e EDGE_READINESS_MODE=strict'
          - service: sam2-inference
            # صورة CUDA موجَّهة لـGPU؛ على runner بلا GPU البناء والإقلاع يثبتان
            # سلامة الاستيراد وصدق /readyz (model_loaded=false عند غياب checkpoint).
            dockerfile: services/sam2-inference/Dockerfile
            image: sahool/sam2-inference:ci
            port: 8080
            host_port: 18080
            run_env: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── 1. حُرّاس ما قبل البناء (stdlib فقط — لا تثبيت تبعيّات) ──
      - name: Static guards (all services)
        run: |
          python scripts/ci/pip_audit_resolution_guard.py
          python scripts/ci/service_dependency_conflict_guard.py --check
      - name: Raster guards
        if: matrix.service == 'raster-service'
        run: |
          python scripts/ci/raw_data_processing_contract_guard.py
          python scripts/ci/raster_pixel_qa_indicator_guard.py
          python scripts/ci/raster_validated_product_guard.py
          python scripts/ci/raster_topographic_qa_guard.py
      - name: Weather guards
        if: matrix.service == 'weather-service'
        run: |
          python scripts/ci/raw_weather_processing_contract_guard.py
      - name: AI/model guards
        if: matrix.service == 'edge-inference' || matrix.service == 'sam2-inference'
        run: |
          python scripts/ci/ai_container_contract_guard.py --check
          python scripts/ci/edge_model_contract_guard.py
          python scripts/ci/edge_production_readiness_guard.py

      # ── 2. البناء (سياق الجذر — COPY services/... تتطلّبه) ──
      - name: Docker build
        run: |
          docker build \
            -f "${{ matrix.dockerfile }}" \
            -t "${{ matrix.image }}" \
            .

      # ── 3. إقلاع الحاوية منفردة ──
      - name: Start container
        run: |
          docker run --rm -d \
            --name "${{ matrix.service }}-ci" \
            -p "${{ matrix.host_port }}:${{ matrix.port }}" \
            ${{ matrix.run_env }} \
            "${{ matrix.image }}"

      # ── 4. /healthz إلزاميّ 200 (liveness) — لا يُستخدم /readyz هنا أبداً ──
      - name: Healthz smoke
        run: |
          for i in {1..30}; do
            if curl -fsS "http://localhost:${{ matrix.host_port }}/healthz"; then
              exit 0
            fi
            sleep 2
          done
          docker logs "${{ matrix.service }}-ci"
          exit 1

      # ── 5. /readyz معلوماتيّ: degraded/غير-جاهز صادق مسموح؛ الكذب يُكشف يدويّاً ──
      - name: Readyz smoke (informational, honest degraded allowed)
        run: |
          curl -sS "http://localhost:${{ matrix.host_port }}/readyz" || true

      # ── 6. سجلّات الإقلاع خالية من أخطاء الاستيراد ──
      - name: Logs must not contain startup import errors
        run: |
          docker logs "${{ matrix.service }}-ci" > "/tmp/${{ matrix.service }}.log" 2>&1
          ! grep -E "ModuleNotFoundError|ImportError|Traceback" "/tmp/${{ matrix.service }}.log"

      - name: Stop container
        if: always()
        run: |
          docker stop "${{ matrix.service }}-ci" || true
