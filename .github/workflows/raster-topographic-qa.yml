name: Raster Topographic QA Contract

on:
  pull_request:
  push:
    branches: [ main ]

# عبءُ أجهزة التشغيل: دفعٌ جديد إلى الـPR نفسه يلغي تشغيلَه الأقدم لهذا المسار (كـci.yml)؛ وأحداثُ
# غير الـPR مجموعتُها فريدة (run_id) فلا تُلغى ولا تُسلسَل — كلُّ دمجٍ إلى main يُفحص كاملاً.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}-{2}', github.workflow, github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  raster-topographic-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      # الاختبارات تستورد numpy وتمرّ عبر conftest tests_v9 — بيئة الاختبار
      # القانونيّة إلزاميّة، وpython -m pytest لا pytest المجرّد (درس dual-pytest).
      - name: Install test dependencies
        run: python -m pip install -r tests_v9/requirements-test.txt
      - name: Run topographic QA guard
        run: python scripts/ci/raster_topographic_qa_guard.py
      - name: Run guard test
        run: python -m pytest -q tests_v9/test_raster_topographic_qa_guard.py
