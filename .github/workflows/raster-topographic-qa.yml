name: Raster Topographic QA Contract

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  raster-topographic-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run topographic QA guard
        run: python scripts/ci/raster_topographic_qa_guard.py
      - name: Run guard test
        run: pytest -q tests_v9/test_raster_topographic_qa_guard.py
