name: Build and verify daily aquifer guard
on:
  push:
    branches: [ci/farmland-daily-build-0d601b-b9a3e146]
permissions:
  contents: write
jobs:
  build-preflight-retain:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BASE: db79cf6d33fb8adb900f049d742de229f8616d4b
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      REDIS_ACL_LIVE_REQUIRED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.14"
      - name: Apply verified inputs to the pinned coordinated source head
        shell: bash
        run: python build_candidate.py prepare
      - name: Install project requirements and isolate temporary outputs
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/daily-preflight-venv"
          "$RUNNER_TEMP/daily-preflight-venv/bin/python" -m pip install \
            -r "$RUNNER_TEMP/daily-source/tests_v9/requirements-test.txt" \
            -r "$RUNNER_TEMP/daily-source/services/sahool-platform/api/requirements.txt"
          "$RUNNER_TEMP/daily-preflight-venv/bin/python" -m pip check
          "$RUNNER_TEMP/daily-preflight-venv/bin/python" -m pip freeze > "$RUNNER_TEMP/daily-build-evidence/environment.txt"
          echo "$RUNNER_TEMP/daily-preflight-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/daily-preflight-venv" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/daily-tmp" >> "$GITHUB_ENV"
          echo "PYTEST_DEBUG_TEMPROOT=$RUNNER_TEMP/daily-pytest-tmp" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/daily-cache" >> "$GITHUB_ENV"
          echo "RUFF_CACHE_DIR=$RUNNER_TEMP/daily-cache/ruff" >> "$GITHUB_ENV"
          echo "COVERAGE_FILE=$RUNNER_TEMP/daily-coverage" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/daily-tmp" "$RUNNER_TEMP/daily-pytest-tmp" "$RUNNER_TEMP/daily-cache"
          free -m > "$RUNNER_TEMP/daily-build-evidence/memory.txt"
          df -h "$RUNNER_TEMP" > "$RUNNER_TEMP/daily-build-evidence/disk.txt"
      - name: Install Redis with the project's CI service isolation
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/daily-source"
          bash scripts/ci/resilient_apt_install.sh redis-server
          sudo systemctl stop redis-server
          sudo systemctl disable redis-server
          redis-server --version | tee "$RUNNER_TEMP/daily-build-evidence/redis-version.txt"
      - name: Regenerate officially and freeze the candidate
        shell: bash
        run: python build_candidate.py generate
      - name: Run the unchanged contiguous default complete preflight
        shell: bash
        run: python build_candidate.py preflight
      - name: Preserve generation and complete preflight evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: daily-build-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/daily-build-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Retain verified objects and evidence on this CI branch
        shell: bash
        run: python build_candidate.py retain
