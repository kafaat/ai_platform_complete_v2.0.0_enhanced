          DECISION_SERVICE_SOR_ENABLED: "true"
        run: pytest tests/test_wx11_5_model_activation_approval.py -q -p no:cacheprovider
      - name: WX-11.6 registry-activation/receipt/rollback tests (real Postgres, SoR on)
