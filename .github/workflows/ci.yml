name: SAHOOL v9.1.0 CI

# ── لماذا `push` على `main` وحدها ─────────────────────────────────────────────
# CI-DUPLICATE-PUSH-RUN-BLOCKS-THE-PR-01. كانت `on: [push, pull_request]`، فكلّ دفعةٍ
# على فرع شريحة تُنشئ **تشغيلين** على الرأس نفسه: واحدٌ لـ`pull_request` وآخرُ
# لـ`push`. والثاني **لا يُلغى أبداً** — مجموعته أدناه تحوي `run_id` فهي فريدة لكلّ
# تشغيل — فيُعيد الـ٦٨ فحصاً كاملةً بلا فائدة.
#
# **وضررُه ليس الكلفة وحدها، بل الحجب:** GitHub يقرأ **أحدث** سجلٍّ لكلّ اسم فحص.
# فحين يُلغى تشغيل push (أو يسقط لعطلٍ عابر) بعد أن اخضرّ تشغيل الـPR، تعلو نتيجته
# الحمراء على الخضراء ويبقى الـPR محجوباً بلا شيء يُصلَح. مقيس على 2026-08-18: أربعة
# تشغيلات push على فرعٍ واحد — `failure` · عالق ٨٠+ دقيقة · `failure` · `cancelled`
# بعد ٦٥ دقيقة — حجبت الدمج مرّتين، وصفرُ فائدة منها.
#
# **والقصر لا يُنقِص مستهلِكاً واحداً، مقيساً لا مُرجَّحاً:** المستهلك الوحيد لتشغيلات
# `push` هو `certify-run.yml`، وهو يشترط صراحةً
# `workflow_run.event == 'push' && workflow_run.head_branch == 'main'` (سطرا 54-55).
# فتشغيلات push على غير main لم تكن تُغذّي شيئاً أصلاً. وتغطية فروع الشرائح يوفّرها
# تشغيل `pull_request` كاملاً.
on:
  push:
    branches: [main]
  pull_request:

# دفعةٌ فوق دفعةٍ على الـPR تُلغي الجولةَ البائتة — قياسُها لا يعني شيئاً بعد أن
# تجاوزها الرأس. **وعلى main لا إلغاء**: لكلّ التزامٍ سجلُّه، لأنّ تشغيلات main هي
# موضوعُ الاعتماد اللاحق (`certify-run` على `workflow_run: completed`) — جولةٌ
# مُلغاة تعني التزاماً بلا خلاصةِ تنفيذٍ يُعتمَد عليها. وهو قرارُ #843 نفسه مُعمَّماً.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('ci-pr-{0}', github.event.pull_request.number)
        || format('ci-{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  structural-lint:
    name: Repository Structural Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: service-feature-ui-contract-gate
        run: python scripts/ci/service_feature_ui_contract_gate.py

      # عقد backend⇒frontend بالاتّجاهين (core⇒دليل + لا مسار مواجِه فالت/إعفاء بائت)
      - name: endpoint-ui-coverage-gate
        run: python scripts/ci/endpoint_ui_coverage_gate.py

      - name: indicators-registry-gate
        run: python scripts/ci/indicators_registry_gate.py

      - name: indicators-frontend-manifest-sync
        run: python scripts/ci/generate_indicators_frontend_manifest.py --check

      # RIV: السجلّ القانونيّ ⇒ كتالوج المنصّة + قدرات vegetation المولَّدان
      - name: indicators-generated-artifacts-sync
        run: python scripts/ci/generate_indicator_artifacts.py --check

      - name: raster-indicators-vegetation-boundary-gate
        run: |
          python scripts/ci/riv_boundary_gate.py
          python scripts/ci/vegetation_runtime_truth_guard.py
          python scripts/ci/raster_production_truth_guard.py

      # الدماغ لا يحسب طيفيّاً ولا يجلب من المزوّد مباشرة ولا يصل فيزيائيّاً إلا عبر Decision-Service
      - name: intelligence-governance-brain-gate
        run: python scripts/ci/intelligence_governance_gate.py

      # P0-7: الشقّ الفيزيائيّ من المبدأ أعلاه، مفروضاً بعقد بدل ثلاث كلمات مفتاحيّة —
      # HTTP · موضوع أمر على وسيط · استيراد عميل المُشغِّل · غلاف يُخفي النداء.
      - name: physical-effect-boundary-guard
        run: python scripts/ci/physical_effect_boundary_guard.py --check

      # EXPECTED-CONTROL-FLOW-EXCEPTION: موضع يطابق نمط المعالِج الصامت والاستثناء فيه
      # إشارة تحكّم مقصودة — يبقى مُخرَجاً من الدَّين **بشرط** دليله: نوع ضيّق + تعليق
      # عقديّ + اختبار سلوكيّ. حذف الاختبار لا يُسقِط اختباراً (المحذوف لا يُشغَّل)،
      # فيلزم سكربت مستقلّ يفحص وجوده — وحذفه يستلزم تعديل هذا الملفّ صراحةً.
      - name: expected-control-flow-exception-contract
        run: python scripts/ci/expected_control_flow_guard.py --check

      - name: weather-engine-formula-guard
        run: python scripts/ci/weather_engine_formula_guard.py

      - name: crop-intelligence-boundary-gate
        run: python scripts/ci/crop_intelligence_boundary_gate.py

      # WX-10.6: crop→decision candidate path stays a reviewable candidate, never execution
      - name: decision-candidate-boundary-gate
        run: python scripts/ci/decision_candidate_boundary_gate.py

      # WAIVER-EXPIRY-GUARD: fail once any time-boxed governance waiver has expired
      - name: waiver-expiry-guard
        run: python scripts/ci/waiver_expiry_guard.py

      # WX-10.7: reviewer/decision path stays a state transition, never execution
      - name: decision-review-boundary-gate
        run: python scripts/ci/decision_review_boundary_gate.py

      # WX-10.7: while decision_record is interim-bridge (mirror), the review must fail closed
      - name: decision-review-ownership-consistency-gate
        run: python scripts/ci/decision_review_ownership_consistency_gate.py

      # WX-10.7 SoR-promotion cutover-prep: the cutover toolkit/docs must stay review-aware
      - name: decision-sor-review-cutover-gate
        run: python scripts/ci/decision_sor_review_cutover_gate.py

      # WS-E: canonical-product consumers must delegate to the Views + carry lineage (no recompute)
      - name: consumer-contract-gate
        run: python scripts/ci/consumer_contract_gate.py

      # WX-10.9..10.12: the post-approval execution chain stays a state transition, never execution
      - name: WX-10.10 dispatch authorization boundary guard
        run: python scripts/ci/dispatch_authorization_boundary_gate.py
      - name: WX-10.11a execution request boundary guard
        run: python scripts/ci/execution_request_boundary_gate.py
      - name: WX-10.11b execution delivery receipt boundary guard
        run: python scripts/ci/execution_delivery_receipt_boundary_gate.py
      - name: WX-10.12 execution outcome boundary guard
        run: python scripts/ci/execution_outcome_boundary_gate.py

      # WX-10.13..11.6 model/MLOps governance chain stays a state transition, never execution
      - name: WX-10.13 learning attribution boundary guard
        run: python scripts/ci/learning_attribution_boundary_gate.py
      - name: WX-11.1 calibration dataset boundary guard
        run: python scripts/ci/calibration_dataset_boundary_gate.py
      - name: WX-11.2 model evaluation boundary guard
        run: python scripts/ci/model_evaluation_boundary_gate.py
      - name: WX-11.3 model promotion decision boundary guard
        run: python scripts/ci/model_promotion_decision_boundary_gate.py
      - name: WX-11.4 model activation request boundary guard
        run: python scripts/ci/model_activation_request_boundary_gate.py
      - name: WX-11.5 model activation approval boundary guard
        run: python scripts/ci/model_activation_approval_boundary_gate.py
      - name: WX-11.6 model registry activation boundary guard
        run: python scripts/ci/model_registry_activation_boundary_gate.py

      # WX-11.7..11.12 closed-loop completion: rollback receipt/verify/rollout/monitor/retrain stay
      # append-only evidence transitions — never train/activate/actuate.
      - name: WX-11.7..11.12 closed-loop completion guard
        run: python scripts/ci/wx11_closed_loop_completion_gate.py

      # WX-12 runtime adapter: the model-registry-adapter is a governed runtime consumer
      # (compare-and-swap active state, verify, rollout, monitor, dispatch retraining) — it
      # must never train/actuate/publish; required files + Dockerfile must exist.
      - name: WX-12 runtime completion guard
        run: python scripts/ci/wx12_runtime_completion_gate.py
      - name: WX-12 runtime certification guard
        run: python scripts/ci/wx12_runtime_certification_gate.py
      # WX-12.3: monitoring/reconcile scheduling must stay durable + actually emitted by the feed
      - name: WX-12.3 runtime scheduler guard
        run: python scripts/ci/wx12_runtime_scheduler_gate.py
      # WX-12 multitenancy: worker→tenant partitioning stays server-authorized (no free header)
      - name: WX-12 runtime multitenancy guard
        run: python scripts/ci/wx12_runtime_multitenancy_gate.py
      # AC-1: agronomic context contracts stay canonical + point-in-time fail-closed
      - name: AC-1 agronomic context gate
        run: python scripts/ci/agronomic_context_gate.py
      - name: canonical soil profile contract gate
        run: python scripts/ci/soil_profile_contract_guard.py
      - name: canonical soil evidence store gate
        run: python scripts/ci/soil_canonical_store_guard.py
      - name: canonical soil full-chain gate
        run: python scripts/ci/soil_full_chain_guard.py
      - name: durable soil lab projection gate
        run: python scripts/ci/soil_lab_projection_guard.py
      - name: soil runtime certification guard
        run: python scripts/ci/soil_runtime_certification_guard.py
      - name: soil projection and reconciliation guard
        run: python scripts/ci/soil_projection_reconciliation_guard.py
      - name: soil projection observability guard
        run: python scripts/ci/soil_projection_observability_guard.py
      - name: soil supersession and current pointer guard
        run: python scripts/ci/soil_supersession_current_pointer_guard.py
      - name: soil lab supersession lineage guard
        run: python scripts/ci/soil_lab_supersession_lineage_guard.py
      - name: soil P1 governed products guard
        run: python scripts/ci/soil_p1_products_guard.py
      - name: soil P2 spatial products guard
        run: python scripts/ci/soil_p2_products_guard.py
      - name: soil P3 assessment products guard
        run: python scripts/ci/soil_p3_products_guard.py
      - name: soil P4 closed-loop guard
        run: python scripts/ci/soil_p4_closed_loop_guard.py
      - name: soil P5 certification guard
        run: python scripts/ci/soil_p5_certification_guard.py
      - name: soil P6 runtime certification guard
        run: python scripts/ci/soil_p6_runtime_certification_guard.py
      - name: no unresolved merge-conflict markers (repo-wide)
        run: python scripts/ci/no_merge_conflict_markers_guard.py
      # BIDI-CONTROL-CHAR-PASSED-THE-DEFAULT-PREFLIGHT-01: bandit يمسك RLM في نطاق
      # `services/ bots/ agents/` وحده، والمحارف مقيسة في ٩٣ ملفّاً عبر الشجرة —
      # json وmd وyml وsql وtsx وps1. وهو يحجب RLM ولا يحجب LRM، فاستبدال أحدهما
      # بالآخر كان يُمرِّر البوّابة **ويُبقي المحرف الخفيّ**. وهذا يعدّهما معاً،
      # ويحجب **مطلقاً** على محارف قلب الاتّجاه (trojan source) بلا أساس ولا استثناء.
      - name: no hidden bidi control characters (repo-wide)
        run: python scripts/ci/bidi_control_char_guard.py
      # JSON-SCHEMAS-WITH-NO-VALIDATOR-01 — one validator for every *.schema.json in the
      # tree, discovered from git rather than listed. Placed in the central structural
      # job on purpose: a per-domain workflow would give remote_sensing, soil,
      # capabilities and food_grain four checkers that drift apart.
      #
      # This job installs nothing else, so the library is installed here explicitly.
      # The guard exits 2 without it rather than skipping: a validator with no library
      # is the decorative-gate class this repository has paid for twice.
      - name: install the schema validator's library
        run: pip install 'jsonschema>=4.20.0'
      - name: unified JSON Schema validation (all *.schema.json)
        run: python scripts/ci/schema_validation_guard.py --check
      # نطاق GUC المستأجِر شجريّاً (`GUC-SCOPE-GUARD-SEES-ONE-FILE-01`): الحارس السابق
      # يحمل التشخيص الصحيح لعيبٍ إنتاجيّ مؤكَّد لكنّ تأكيده على **ملفّ واحد**. هذا يقيس
      # الشجرة، و**النطاق لا الوجود**: `set_config(..., true)` خارج معاملة يضيع قبل
      # الاستعلام التالي ⇒ RLS يُرجِع صفراً. راتشِت بأساسٍ مُعلَن يتقلّص ولا ينمو.
      - name: tenant GUC scope (tree-wide, ratchet)
        run: python scripts/ci/tenant_guc_scope_guard.py --check
      # كتالوج الحرّاس: مولَّد من الـworkflows + سجلّ الطفرات + توثيق كلّ حارس. أوّل
      # جرد أخرج رقماً لم يكن يعرفه أحد — **٢١٨ حارساً تحجب في CI و٨ فقط مُثبَتة
      # بالتكذيب**. قائمةٌ يدويّة كانت ستبيت عند أوّل حارس جديد؛ هذه تُشتقّ.
      - name: Guard catalogue must match its sources
        run: python scripts/ci/guard_catalogue.py --check
      - name: irrigation MPC — Ky no-economic-coupling guard
        run: python scripts/ci/ky_no_economic_coupling_guard.py
      - name: irrigation MPC — bridge lineage-propagation guard
        run: python scripts/ci/mpc_lineage_propagation_guard.py
      # V21 irrigation engineering program (M2.1–M5): additive domain-contract ratchets. These are
      # static presence/shape guards over the canonical irrigation kernels + migrations v168–v181
      # (renumbered +1; v167 taken by MPC content_digest). Kernels are NOT yet mounted into runtime
      # routes (bridge/execution stay default-off) — the guards pin the contracts, not live wiring.
      - name: irrigation M2.1 engineering foundation guard
        run: python scripts/ci/irrigation_engineering_m2_1_guard.py
      - name: irrigation M2.2 root-zone hydraulic guard
        run: python scripts/ci/irrigation_root_zone_m2_2_guard.py
      - name: irrigation M2.3 well digital-twin guard
        run: python scripts/ci/irrigation_well_digital_twin_m2_3_guard.py
      - name: irrigation M2.4 hydraulic capability guard
        run: python scripts/ci/irrigation_hydraulic_m2_4_guard.py
      - name: irrigation M2.5 machine capability guard
        run: python scripts/ci/irrigation_machine_m2_5_guard.py
      - name: irrigation M2.6 sprinkler/runoff guard
        run: python scripts/ci/irrigation_sprinkler_m2_6_guard.py
      - name: canonical consumer bypass guard (KNOWLEDGE-CANONICAL-CONSUMPTION-01)
        run: python scripts/ci/canonical_consumer_bypass_guard.py
      - name: knowledge provenance guard (KNOWLEDGE-PROVENANCE-01)
        run: python scripts/ci/knowledge_provenance_guard.py
      - name: shadow source-of-truth guard (SHADOW-SOURCE-OF-TRUTH-01)
        run: python scripts/ci/shadow_source_of_truth_guard.py
      - name: undeclared context dependency guard (UNDECLARED-CONTEXT-DEPENDENCY-01)
        run: python scripts/ci/undeclared_context_dependency_guard.py
      - name: rag operational boundary guard (RAG-ANSWERS-AN-OPERATIONAL-FACT-01)
        run: python scripts/ci/rag_operational_boundary_guard.py
      - name: knowledge relation registry guard (KNOWLEDGE-RELATION-01)
        run: python scripts/ci/knowledge_relation_registry_guard.py
      - name: irrigation M2.7 energy microgrid guard
        run: python scripts/ci/irrigation_energy_m2_7_guard.py
      - name: irrigation M2.8 capability graph guard
        run: python scripts/ci/irrigation_capability_graph_m2_8_guard.py
      - name: irrigation M2.9 controller-edge guard
        run: python scripts/ci/irrigation_controller_edge_m2_9_guard.py
      - name: irrigation M2.10 commissioning guard
        run: python scripts/ci/irrigation_commissioning_m2_10_guard.py
      - name: irrigation M2.11 as-applied guard
        run: python scripts/ci/irrigation_as_applied_m2_11_guard.py
      - name: irrigation M3 hourly MPC guard
        run: python scripts/ci/irrigation_hourly_mpc_m3_guard.py
      - name: irrigation M4 VRI prescription guard
        run: python scripts/ci/irrigation_vri_m4_guard.py
      - name: irrigation M5 closed-loop certification guard
        run: python scripts/ci/irrigation_closed_loop_m5_guard.py
      - name: IRR-X1 vendor-neutral engineering workspace guard
        run: python scripts/ci/irrx1_vendor_neutral_guard.py
      - name: IRR-X1.1 digital commissioning runtime guard
        run: python scripts/ci/irrx1_commissioning_runtime_guard.py
      - name: IRR-X1.2 manual execution lifecycle guard
        run: python scripts/ci/irrx1_manual_execution_guard.py
      - name: IRR-X1.3 verified manual as-applied ledger guard
        run: python scripts/ci/irrx1_verified_manual_ledger_guard.py
      - name: IRR-X1.4 farmer manual operations UI guard
        run: python scripts/ci/irrx1_farmer_manual_operations_ui_guard.py
      - name: IRR-PCERT database truth guard
        run: python scripts/ci/irrx1_pcert_guard.py
      - name: IRR-X1.5 authoritative recommendation provenance guard
        run: python scripts/ci/irrx1_authoritative_provenance_guard.py
      - name: IRR-X1.6 operator-declared manual volume guard
        run: python scripts/ci/irrx1_6_manual_volume_guard.py
      - name: IRR-X1.7 interactive irrigation calculator guard
        run: python scripts/ci/irrx1_7_interactive_calculator_guard.py
      - name: IRR-X1.8 reservoir/booster network guard
        run: python scripts/ci/irrx1_8_reservoir_booster_guard.py
      - name: IRR-X1.9 multi-system irrigation calculator guard
        run: python scripts/ci/irrx1_9_multi_system_calculator_guard.py
      # WX-I1 runtime: server-owned hourly MPC orchestrator (recommendation-only) + the durable
      # measured-as-applied → water-ledger reconciliation return path (v184) must stay wired.
      - name: irrigation runtime orchestrator guard
        run: python scripts/ci/irrigation_runtime_orchestrator_guard.py
      - name: irrigation closed-loop runtime guard
        run: python scripts/ci/irrigation_closed_loop_runtime_guard.py
      # Forensic 2026-07-14 (F-01/F-02/F-08): irrigation migrations must use canonical fail-closed
      # RLS — no fail-open WITH CHECK, no non-canonical app.current_tenant_id, idempotent policies.
      - name: irrigation RLS canonical (fail-closed) guard
        run: python scripts/ci/irrigation_rls_canonical_guard.py
      # P0-fix bundle: DB-owned immutable recommendation content-lineage (v182/v183) + JWT/secret
      # configuration hardening (RSA keypair validation + fallback full-tree secret scan).
      - name: decision content-lineage v183 hardening guard
        run: python scripts/ci/decision_lineage_v183_guard.py
      - name: JWT and secret configuration guard
        run: python scripts/ci/jwt_secret_configuration_guard.py
      # VEG-AGRIAI completion: vegetation stays real-source-honest and agriai-engine stays
      # context-bound (delivered increment; its dedicated workflow only runs on main/PR paths,
      # so enforce the structural contract on every push here too).
      - name: vegetation-agriai completion gate
        run: python scripts/ci/vegetation_agriai_completion_gate.py
      - name: vegetation-agriai production gate
        run: python scripts/ci/vegetation_agriai_production_gate.py
      - name: vegetation-agriai full closure gate
        run: python scripts/ci/vegetation_agriai_full_closure_gate.py
      # AC-6/AC-6.1: direct agronomic lineage + tenant-safe DB-level evidence integrity
      - name: AC-6 agronomic decision lineage gate
        run: python scripts/ci/agronomic_decision_lineage_gate.py
      - name: AC-6.1 agronomic lineage integrity gate
        run: python scripts/ci/agronomic_lineage_integrity_gate.py
      # AC-9→terminal: the agronomic evidence/cohort lineage must keep propagating through
      # learning → calibration → evaluation → promotion → activation → runtime → terminal
      # receipts, and no synthetic vegetation value may reach a serving path.
      - name: AC-9 agronomic learning lineage gate
        run: python scripts/ci/agronomic_learning_lineage_gate.py
      - name: agronomic model lifecycle lineage gate
        run: python scripts/ci/agronomic_model_lifecycle_lineage_gate.py
      - name: agronomic runtime lineage gate
        run: python scripts/ci/agronomic_runtime_lineage_gate.py
      - name: agronomic runtime terminal lineage gate
        run: python scripts/ci/agronomic_runtime_terminal_lineage_gate.py
      - name: production truth readiness gate
        run: python scripts/ci/production_truth_readiness_gate.py
      # Phase C: the no-leakage certification surface (randomized PIT property sweep +
      # composer-independent DB row invariants + fail-closed staging runner) stays intact.
      - name: no-leakage certification gate
        run: python scripts/ci/no_leakage_certification_gate.py

      - name: design-token-contrast-gate
        run: python scripts/ci/design_token_contrast_gate.py

      - name: nginx-compose-dns-gate
        run: python scripts/ci/nginx_compose_dns_gate.py

      - name: service-port-gate
        run: python scripts/ci/service_port_gate.py

      - name: minio-s3-contract-gate
        run: python scripts/ci/minio_s3_contract_gate.py

      - name: compose-env-contract-gate
        run: python scripts/ci/compose_env_contract_gate.py

      # env↔compose drift guard (operational-backlog #3): every env var read WITHOUT a default and
      # absent from BOTH compose and .env.example must be classified in the reviewed allowlist
      # (flag / prod-secret / per-env infra URL / perf-default). Catches "code reads env, compose
      # doesn't provide it" before it bites in prod (httpx/JWT_SECRET precedent).
      - name: env-compose-drift-guard
        run: python scripts/ci/env_compose_drift_guard.py --check

      # المحور الثاني — **القيمة** لا الحضور: `.env.example` (الذي يطلب المستودع نسخه)
      # لا يجوز أن يُبطِل افتراض compose الآمن إلى `localhost`. الافتراضيّ `${VAR:-…}`
      # لا يعمل إلّا مع متغيّرٍ **غير مضبوط**، و`localhost` داخل الحاوية هي الحاوية
      # نفسها. قِيس حيّاً (2026-08-12): أربعة عمّال مفصولون عن NATS بهذا السبب —
      # والحضور كان سليماً تماماً، فحارس الانجراف أعلاه لا يراه.
      - name: env-compose-default-override-guard
        run: python scripts/ci/env_compose_default_override_guard.py

      - name: backfill-ui-sync-gate
        run: python scripts/ci/backfill_ui_sync_gate.py

      - name: runtime-contract-gate
        run: python scripts/ci/runtime_contract_gate.py

      - name: runtime-readiness-contract-gate
        run: python scripts/ci/runtime_readiness_contract_gate.py

      - name: raster-main-decomposition-gate
        run: python scripts/ci/raster_main_decomposition_gate.py

      - name: raster-import-graph-gate
        run: python scripts/ci/raster_import_graph_gate.py

      # يُشغَّل هنا ضمن فحص الفرع (لا في push إلى main فقط) كي يُلتقَط انحراف
      # المخزون قبل الدمج/التقديم، لا بعده — مرآة لبوّابة service-inventory-drift.yml.
      - name: service-inventory-drift-gate
        run: python scripts/ci/generate_service_inventory.py --check

      # المخزونان المُولَّدان لـmain.py المنصّة/تركيب الراوترات كانا يُفحَصان في مسارَي
      # main فقط (platform-main-subinventory.yml · runtime_real_smoke) فينحرفان بعد الـFF
      # لا قبله. نُدرِجهما هنا في فحص الفرع (pre-FF) اتّساقاً مع «المخزون ضمن الفحص لا بعده».
      - name: platform-main-subinventory-drift-gate
        run: python scripts/ci/platform_main_subinventory_guard.py --check
      - name: route-mount-inventory-drift-gate
        run: python scripts/ci/route_mount_contract_guard.py --check

      # الكتالوج الموحّد (U2): مُصرِّف حتميّ يركّب السجلّات القائمة — أيّ drift في
      # مخرجاته المولَّدة (كتالوج/قدرات/تعارضات ملكيّة/بيان) يفشل هنا (pre-FF).
      - name: platform-catalog-drift-gate
        run: python scripts/architecture/build_platform_catalog.py --check --enforce-expiry

      # ARCH-S3: تقارب سلطة RAG (Expand→Parity→Cutover→Revoke) — يفشل مغلقاً على
      # قطعٍ قبل اكتمال متطلّباته، أو استثناء Qdrant مباشر منتهٍ/بلا مالك، أو ادّعاء
      # تكافؤ يخالف compose/العقد، أو كتالوج يُرقّي rag-retrieval قبل أوانه.
      - name: rag-authority-convergence-gate
        run: python scripts/architecture/rag_authority_convergence_guard.py

      # C8–C13: عقود تنسيق **لا طبقةَ حقيقةٍ موازية**. كلٌّ منها يفوّض إلى الحرّاس
      # القانونيّين القائمين ويجمع أحكامهم، ويُعيد `EVIDENCE_REQUIRED` صراحةً حين
      # يغيب إيصالٌ حيّ مربوط بالموضوع — فلا يحجب الدمج على غياب دليلٍ حيّ، ويحجبه
      # على **انحدار حارسٍ قانونيّ** (rc≠0). ولا يُرقّي أيٌّ منها سلطةً بحال.
      - name: c8-rag-production-certification-contract
        run: python scripts/ci/c8_rag_production_certification.py
      - name: c9-decision-authority-certification-contract
        run: python scripts/ci/c9_decision_authority_certification.py
      - name: c10-field-authority-certification-contract
        run: python scripts/ci/c10_field_authority_certification.py
      - name: c11-closed-loop-lineage-certification-contract
        run: python scripts/ci/c11_closed_loop_lineage_certification.py
      - name: c12-governed-learning-promotion-certification-contract
        run: python scripts/ci/c12_governed_learning_promotion_certification.py
      - name: c13-physical-shrink-certification
        run: python scripts/ci/c13_physical_shrink_certification.py

      # S4: يمنع عودة مستهلك منصّة لتخزين المعرفة القديم — الملكيّة الوحيدة القانونيّة
      # خدمة knowledge-graph. الأساس مصدرٌ ثابت يُشتقّ من الشجرة الحاليّة لا يُكتَب هنا.
      - name: s4-kg-consumer-freeze-gate
        run: python scripts/architecture/s4_kg_consumer_freeze.py --check

      # S5-EXEC-01: يجمّد سطح الهجرة التشغيليّ لهُويّات Decision SoR الخمس ويمنع نموّاً
      # صامتاً في كاتبي التنفيذ خارج المجموعة المُقرَّرة (٦ كتّاب مجمَّدون).
      - name: s5-exec-01-edge-freeze-gate
        run: python scripts/architecture/s5_exec_01_edge_freeze.py --check

      # يمنع رجوع خطّافات FastAPI المهجورة (@app.on_event) — يُلزِم lifespan واحداً
      # مُرتَّباً (بدء/إيقاف صريحان) فتبقى تحذيرات الإهمال غائبة. يُشغَّل في فحص الفرع (pre-FF).
      - name: fastapi-lifespan-guard
        run: python scripts/ci/fastapi_lifespan_guard.py

      # WX-I1: يُلزِم منتج ETc الساعيّ القانونيّ (ET0 مُزوَّد-أصليّ من المحرّك، Kc مُحقَن،
      # مطر فعّال، بصمة محتوى) موصولاً end-to-end (منتج · جلب · مسار · عميل · مستهلِك M3)
      # بلا نواة ET0 محلّيّة ولا تفكيك زمنيّ يوميّ. يُشغَّل في فحص الفرع (pre-FF).
      - name: weather-hourly-etc-wx-i1-guard
        run: python scripts/ci/weather_hourly_etc_wx_i1_guard.py

      - name: v9-feature-transfer-gate
        run: python scripts/ci/v9_feature_transfer_gate.py

      - name: v9-gpu-contract-gate
        run: python scripts/ci/v9_gpu_contract_gate.py

      - name: Detect bash glob artifacts in paths
        run: |
          # المراجعة الخارجيّة كشفت ١٤ مجلد بأسماء {bots, {services, {migrations,services...}
          # كان السبب: mkdir -p '{a,b}' بدون quoting صحيح
          # هذا الـcheck يمنع التكرار
          set -e
          ARTIFACTS=$(find . -name '*{*' -o -name '*}*' 2>/dev/null | grep -v node_modules | grep -v '.git/' || true)
          if [ -n "$ARTIFACTS" ]; then
            echo "❌ Bash glob artifacts detected (likely from unquoted mkdir):"
            echo "$ARTIFACTS"
            echo ""
            echo "Fix: rm -rf the offending paths, ensure mkdir uses quotes: mkdir -p \"a/b\""
            exit 1
          fi
          echo "✓ No bash glob artifacts found"
      - name: Detect empty directories (potential scaffold leftovers)
        run: |
          # تحذير (ليس fatal) للـempty dirs
          EMPTY=$(find . -type d -empty 2>/dev/null | grep -v node_modules | grep -v '.git/' | grep -v __pycache__ || true)
          if [ -n "$EMPTY" ]; then
            echo "⚠ Empty directories found (consider removing):"
            echo "$EMPTY"
          else
            echo "✓ No empty directories"
          fi

  platform-structure-inspector:
    name: Platform Structure Inspector
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.12"}
      # PyYAML مطلوب لفحص عقد ناشري الأحداث (event_publish_contracts.yaml): H2 publisher
      # coverage + waiver «منشور بلا مشترِك». بدونه يفشل الفحص بـModuleNotFoundError.
      - run: pip install PyYAML
      - run: python3 tools/sahool_inspector.py

  compose-validate:
    name: Validate Docker Compose
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate all compose files
        run: |
          set -e
          # env وهمي حتى لا تفشل قراءة متغيّرات ${VAR:?required} أثناء التحقّق فقط
          python3 - <<'EOF'
          import glob, re
          vs = set()
          for f in glob.glob("docker-compose*.yml"):
              vs |= set(re.findall(r'\$\{([A-Z0-9_]+)', open(f).read()))
          open(".ci.env", "w").write("\n".join(f"{v}=dummy_{v.lower()}_0123456789abcdef" for v in sorted(vs)) + "\n")
          EOF
          for f in docker-compose*.yml; do
            echo "─── Validating $f ───"
            # odoo-snippet مقتطف (fragment) يُلصق داخل compose آخر، وليس ملفّاً مستقلاً.
            # rag-kg-mcp تراكُب (overlay) يُشغَّل مع v9 (يعتمد qdrant/ollama/الشبكة من الأساس)
            # فلا يصحّ التحقّق منه مستقلّاً.
            # soil-strict تراكُب إنتاجيّ (overlay) يحمل environment فقط لخدمات مُعرَّفة في
            # الأساس (v9)، فلا image/build فيه ⇒ لا يصحّ standalone؛ يُطبَّق فوق v9 بعد الشهادة.
            # dev تراكُب تطوير (overlay): environment فقط (soft-fail + كوكي HTTP) فوق v9 ⇒ لا يصحّ standalone.
            # evidence-lab مكدّس معزول زائل يُعلمِن منافذ المضيف (${EVIDENCE_*_PORT}) —
            # لا يتوافق مع env الوهميّ لهذه الحلقة (يجعل المنفذ سلسلة). يُتحقَّق منه في
            # workflow المخصّص .github/workflows/evidence-lab.yml بـenv حقيقيّ.
            if [ "$f" = "docker-compose.odoo-snippet.yml" ] || [ "$f" = "docker-compose.rag-kg-mcp.yml" ] || [ "$f" = "docker-compose.v9.gpu.yml" ] || [ "$f" = "docker-compose.soil-strict.yml" ] || [ "$f" = "docker-compose.dev.yml" ] || [ "$f" = "docker-compose.production.yml" ] || [ "$f" = "docker-compose.evidence-lab.yml" ]; then echo "↷ skip (fragment/overlay)"; continue; fi
            # 1. YAML syntax
            python3 -c "import yaml; yaml.safe_load(open('$f'))"
            # 2. Compose schema (docker compose config) مع env وهمي
            docker compose --env-file .ci.env -f "$f" config --quiet || {
              echo "❌ $f failed compose schema validation"
              exit 1
            }
            echo "✓ $f valid"
          done
          echo "─── Validating docker-compose.v9.yml + docker-compose.v9.gpu.yml overlay ───"
          python3 -c "import yaml; yaml.safe_load(open('docker-compose.v9.gpu.yml'))"
          docker compose --env-file .ci.env -f docker-compose.v9.yml -f docker-compose.v9.gpu.yml --profile gpu config --quiet || {
            echo "❌ v9 GPU overlay failed compose schema validation"
            exit 1
          }
          echo "✓ v9 GPU overlay valid"
      - name: Check for orphaned depends_on blocks
        run: |
          # Defensive: catch the "nats: { condition... }" outside services pattern
          # that broke v9.yml previously.
          if grep -E '^  [a-z_-]+:\s*\{ condition:' docker-compose*.yml | \
             grep -v "depends_on" > /tmp/orphaned.txt; then
            if [ -s /tmp/orphaned.txt ]; then
              echo "❌ Orphaned depends_on entries detected:"
              cat /tmp/orphaned.txt
              exit 1
            fi
          fi
          echo "✓ No orphaned depends_on entries"
      # «مُسجَّل في compose» ليس «موجود في الصورة». مقيس: عامل التعلّم القانونيّ كان
      # يُنفَّذ من /app/scripts/workers/… بينما Dockerfile ينسخ shared/ وجذر الخدمة فقط
      # ⇒ الحاوية تموت عند الإقلاع وrestart يُعيدها إلى الأبد. الفحوص أعلاه تتحقّق من
      # صحّة compose نفسه، ولا واحد منها يسأل: هل المسار الذي يُشغَّل موجود في الصورة؟
      - name: Every executed container path is placed by its image
        run: |
          pip install --quiet pyyaml
          python3 scripts/ci/container_command_path_guard.py --check

  lint:
    name: Lint & Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.12"}
      # المشروع موحّد على ruff (ruff.toml): يغطّي lint + تنسيق + ترتيب الاستيراد،
      # فاستُبدل black/isort بـ`ruff format --check` لتطابق التنسيق المعتمد.
      # ثبّت إصدار ruff: `pip install ruff` (طليق) يجلب أحدث إصدار، وقواعد التنسيق
      # تتغيّر بين الإصدارات ⇒ تنسيق محلّيّ سليم يفشل في CI لا لشيء سوى انجراف الإصدار
      # (حدث فعلاً: ملفّ «already formatted» محلّيّاً صار «would reformat» في CI).
      # التثبيت يجعل التنسيق حتميّاً وقابلاً لإعادة الإنتاج محلّيّاً. حدّثه عمداً عند الرغبة.
      # PyYAML: `ci_unbounded_wait_guard` يقرأ الـworkflows كـYAML، وبيئة
      # `setup-python` لا تحمله — غيابُه أسقط الخطوة بـModuleNotFoundError (مقيس).
      - run: pip install ruff==0.15.8 mypy PyYAML
      # نطاق كامل الشجرة (`.`): تحكمه استثناءات ruff.toml (extend-exclude) وتجاهلاته
      # لكلّ ملفّ. يُغلق ثغرة «الأخضر يقيس ما تختبره فقط» للـlint/format نهائيّاً —
      # كلّ ملفّ بايثون في المستودع (scripts/ tests/ alembic/ sdk/ sahool_ai/ …) مشمول.
      - run: ruff check .
      - run: ruff format --check .
      # TEST-PROBE-LEAKS-INTO-THE-TREE-01: اختبارات الحرّاس تحقن مسارات اصطناعيّة
      # وتستعيدها في `finally` — و`finally` لا ينجو من SIGKILL ولا من إلغاء وظيفة.
      # تسريبٌ كهذا أنتج تقرير اعتماد خارجيّاً بـNO-GO و**١٩ إخفاقاً** عُزيت إلى
      # «تغيير غير محكوم» لمسار لم يدخل المستودع قطّ. هذا الحارس يُسمّي السبب بسطر
      # واحد ويمنع العلاج الخاطئ (تصنيف المسار أو إضافته إلى allowlist).
      - name: test probes must not leak into tracked sources or inventories
        run: python scripts/ci/probe_leak_guard.py
      # CI-UNBOUNDED-PROVISIONING-WAIT-01: المواضع الثلاثة أُصلحت في #868، وهذا يمنع
      # عودة الصنف — إصلاحٌ يُغلق ما وقع، وحارسٌ يمنع أن يقع رابعةً.
      - name: provisioning waits must be bounded (no six-hour silent burn)
        run: python scripts/ci/ci_unbounded_wait_guard.py
      # FAKE-CONNECTION-ENFORCES-NOTHING-01: بعد ٢٢٦ هجرة على PG16 نظيفة، تعطّلت
      # الرحلة القانونيّة أربع مرّات متتالية بأربعة أسباب مختلفة — وكلّها كانت خضراء
      # سنةً على اتّصال وهميّ لا يفرض CHECK ولا TRIGGER ولا يُعيد أنواع asyncpg.
      # راتشِت يمنع نموّ الدَّين ولا يدّعي أنّ ما فيه سليم؛ الخروج منه بإثبات على
      # قاعدة حيّة لا بحذف الكلمة من نصّ الاختبار.
      - name: fake-connection debt ratchet
        run: python scripts/ci/fake_connection_debt_guard.py --check
      # مَنعٌ (`assert "…" not in src`) بلا سببٍ مُعلَن: حين يُطلِق يقول «كسرتَ
      # شيئاً» وهو يعني «نمنع هذا عمداً»، وحين لا يُطلِق لا يُميّزه شيء عن مَنعٍ بطل
      # سببه. الحادثة: حارسٌ ثبّت `timedelta(days=months` فحمى حساباً يُدخِل ١٤ يوماً
      # بصمت، وأسقط الإصلاحَ الصحيح مرّتين على #780.
      - name: prohibition reason ratchet
        run: python scripts/ci/prohibition_reason_guard.py --check
      # اللقطة معنونة بمحتواها، فحقلُ أهليّة داخلها يُغيّر **كلّ هاش قائم** عند أوّل
      # تغيير سياسة ⇒ تنكسر إعادة التشغيل ويُقطَع نَسَب الأدلّة. والعطل لا يظهر يوم
      # يُضاف الحقل بل يوم تتغيّر السياسة، وحينها لا يدلّ شيء على السبب.
      - name: snapshot/eligibility separation
        run: python scripts/ci/snapshot_eligibility_separation_guard.py --check
      # حارس أساس الادّعاءات: مصنوعة `docs/architecture/` إمّا **قياس** يَبيت بحركة
      # الشجرة تحته (فيلزمه `measured_on`) أو **قرار** لا يَبيت بها (فيلزمه
      # `adjudicated_on`). المفردتان كانتا مستعملتين في ثماني مصنوعات من ٢٢ بلا
      # قاعدة تسمّيهما، والنتيجة `baseline_route_count = 633` بجوار قائمة تعدّ ٦٣٥،
      # بلا أساس يُقاس عليه وبلا قارئ واحد في المستودع. يحجب غياب الأساس، ويُبلِّغ
      # عن البيات ولا يحجب عليه — الحجب على التقادم يُدرِّب قارئه على تجاهله.
      - name: claim-base guard
        run: python scripts/ci/claim_base_guard.py
      # حارس الطفرات — الشطر الثابت فقط: الحارس الأخضر يقول شيئاً واحداً بيقين
      # (لم يُطلِق)، و«لم يجد عطلاً» و«لا يرى العطل أصلاً» لا يفرّق بينهما شيء.
      # هذا الشطر بلا تبعيّات (stdlib + json) فموضعه هنا؛ أمّا `--run` فيُشغّل
      # pytest، ووظيفة الـlint لا تُثبّت إلّا ruff وmypy — فموضعه *Unit Tests*.
      - name: guard-mutation guard (static)
        run: python scripts/ci/guard_mutation_guard.py
      # بوّابة مانيفست الإصدار على الفرع أيضاً (لا main-only فقط): تعديل ملفّ مشمول
      # بالمانيفست دون إعادة بناء checksums كان يمرّ على الفرع ثمّ يفشل على main في
      # «Sahool Production Gates». تشغيلها هنا يلتقط الانحراف قبل الدمج لا بعده.
      - name: Release manifest checksum gate (mirror of main-only production gate)
        run: python3 scripts/release/validate_release_package.py --root .
      # mypy إرشادي: أسماء مجلّدات الخدمات مُشرطَنة (services/guardrails-engine)
      # ليست أسماء حزم بايثون صالحة، والتغطية النوعيّة الكاملة ليست بوّابة إلزاميّة بعد.
      - name: mypy (advisory)
        run: mypy services/auth/main.py --ignore-missing-imports --explicit-package-bases
        continue-on-error: true

  frontend-typecheck:
    name: Frontend Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: {node-version: "22"}
      # بوّابة فحص نوعيّ للواجهة: كانت غائبة تماماً، فتراكمت أخطاء TS صامتة (مثل
      # ضياع user_id في login). tsc --noEmit يكشفها قبل الدمج. لا يبني الإنتاج
      # (vite build لا يفحص الأنواع) — هذا الفحص مكمّل له.
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      # `npm run lint` كان **سكربتاً زخرفيّاً**: لا `eslint` في التبعيّات، ولا ملفّ
      # تهيئة في الشجرة، ولا وظيفة تستدعيه — و`--ext` فيه محذوف أصلاً في ESLint 9.
      # سكربتٌ يبدو بوّابةً وليس بوّابة أسوأ من غيابه. أوّل تشغيل حقيقيّ له كشف
      # `useMemo` بعد خروج مبكر في ds/table.tsx (يرمي «Rendered more hooks…» لحظة
      # امتلاء جدول فارغ). النطاق أخطاء منطقيّة لا أسلوب: tsc يغطّي الأنواع.
      # الدَّين الموروث (١١ مخالفة) في `eslint-suppressions.json` — يتقلّص ولا ينمو:
      # ESLint يخرج بـ2 على تثبيت بائت، فلا يبقى الأساس متضخّماً بصمت.
      - run: npm run lint
        working-directory: frontend
      # **والتحذير ليس خطأً هنا — وتلك هي الثغرة.** `no-explicit-any` و
      # `no-unused-vars` تُبلَّغ تحذيراً، فتخرج هذه الوظيفة **خضراء** ومعها ٨٢
      # تحذيراً؛ وGitHub يعرض **عشرة** منها في التعليقات، فيقرأ المالك «عشرة»
      # والواقع ثمانون. عدّادٌ غير مرئيّ وغير محجوب معاً.
      # والرفعُ إلى خطأ دفعةً واحدة يوقف كلّ عمل الواجهة، وإصلاحُ `any` تصميمُ
      # نوعٍ لا استبدالُ كلمة. فراتشِت: السقف ينزل ولا يصعد، ولكلّ قاعدة سقفُها.
      - name: Frontend lint debt must not grow (any / unused-vars ratchet)
        run: python3 scripts/ci/frontend_lint_debt_guard.py

  frontend-e2e:
    name: Frontend E2E (Playwright · MapLibre/WebGL QA)
    runs-on: ubuntu-24.04
    # سقف صارم: المدّة الطبيعيّة المقيسة ~٣ دقائق (تشغيل 32160058172 ⇒ 2م55ث).
    # وبلاه احترق runner على تشغيل 32160054946 وهو عالق في `playwright install
    # --with-deps` (الافتراضيّ ٣٦٠ دقيقة) وحجب الـPR ساعاتٍ على شجرةٍ خضراء.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: {node-version: "22"}
      # بوّابة QA الوظيفيّة لمحرّك MapLibre/WebGL على Chromium حقيقيّ (SwiftShader).
      # هرمسيّة: لا خلفيّة — التركيبات تُعترَض في طبقة Playwright (e2e/support/seed.ts).
      # الـconfig يبني الواجهة بـVITE_MAP_ENGINE=maplibre ويُشغّل preview على :4173.
      # الخطوتان البصريّتان الصرفتان (٧ إزاحة المؤشّر، ٩ تطابق leaflet↔maplibre)
      # مُعلَّمتان @visual ومُخطّاتان (test.fixme) ⇒ تُتخطّى تلقائيّاً، فلا تحجب.
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      # `--with-deps` يستدعي `apt-get` **داخل الأداة**، فلا يبلغه تصلّب APT المكتوب
      # في الـworkflow ولا يراه ماسحٌ يبحث عن `apt-get` نصّاً. مقيس: عَلِق هنا ٨٠+
      # دقيقة على تشغيل 32160054946 بينما نجح على الرأس نفسه في 2م55ث.
      # والمهلة تُحوّل التعليق إلى فشلٍ مقروء ولا تُنجح التثبيت — نفس حدّ
      # `resilient_apt_install.sh` بنصّه. فتُعاد المحاولة ثلاثاً بمهلةٍ لكلٍّ: العابر
      # يُعالَج، والعقد لا يُلَيَّن (استنفادُ الثلاث يبقى حاجباً باسمٍ يقول سببه).
      # مقيس: 32294898446 سقطت بـ124 بعد 4.5د، ونجح الأمرُ نفسه في 2م55ث على رأسٍ
      # آخر — أي أنّ المحاولة الواحدة تُسقِط وظيفةً على انقطاعةٍ لا على عطل.
      - name: Install Playwright browser + OS deps (bounded, retried)
        working-directory: frontend
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            # الحدّ **أوّلُ ما يُنفَّذ في السطر**: `ci_unbounded_wait_guard` يُثبِّت
            # نمطه على بداية الأمر (`_BOUNDED_TOOL.match`)، وخبْؤه داخل `if` يُخفيه
            # عنه. وهو محقّ: حدٌّ لا يظهر في مقدّمة الأمر يسهل أن يزول بإعادة صياغة.
            timeout -k 10 300 npx playwright install --with-deps chromium \
              && { echo "playwright_deps_installed attempt=$attempt"; exit 0; }
            echo "::warning::playwright install تعثّر/تجاوز مهلته (محاولة $attempt من 3)"
            sleep $((attempt * 15))
          done
          echo "::error::PLAYWRIGHT_DEPS_INSTALL_FAILED — ثلاث محاولات مسقوفة"
          exit 1
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    # السقف الافتراضيّ ٦ ساعات، والمقيس اليوم ٤٠–٤٢ دقيقة (زرعُ ٢٤٧ طفرة × إقلاع
    # pytest هو الحدّ الأطول). ٦٠ تُحوّل التعليقَ إلى احمرارٍ يُشخَّص بدل انتظارٍ صامت،
    # وتترك هامشاً فوق أبطأ قياسٍ حقيقيّ. سقفٌ أضيق من الواقع يصنع فشلاً زائفاً.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # `test_no_registry_entry_that_main_has_disappears_from_this_branch` يحتاج
          # `merge-base origin/main HEAD`، وهو غير قابل للحلّ في استنساخ ضحل (الافتراضي 1).
          # وبلا التاريخ الكامل كان الحارس **يُتخطّى** فيُقرأ أخضرُه شهادةً على ما لم يُقَس.
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests_v9/requirements-test.txt
      - run: pip install -r tests_v9/requirements-test.txt
      # TESTS-UNMARKED-DESELECTED-01: ملفّ بلا علامة يستبعده `-m` في **كلّ** وظيفة،
      # فيبدو حيّاً محلّيّاً وهو ميت في البوّابة. الحارس يمنع وُلود خامد جديد؛ الأساس
      # المُجمَّد (١٥ ملفّاً بأسبابها المقيسة) يتقلّص ولا ينمو.
      - run: python scripts/ci/test_marker_coverage_guard.py --check
      # الشطر المُنفَّذ من حارس الطفرات — موضعه هنا لا في *Lint & Format*: يزرع
      # العطل في مصدر كلّ حارس مُواصَف ويُشغّل **pytest** ويؤكّد سقوط الاختبار
      # المُسمّى، فيلزمه جناح اختبار مُثبَّت. (وُضِع أوّلاً في وظيفة الـlint حيث لا
      # pytest، فأبلغ ١٨ إخفاقاً صحيحاً بسبب صحيح: انهيار المُشغِّل ليس دليلاً.)
      # حين يكبر عدد المُواصَفين تُنقَل إلى وظيفة مستقلّة.
      - name: guard-mutation guard (plant the defects)
        run: python scripts/ci/guard_mutation_guard.py --run
      # GUARD-DIES-PRINTING-ITS-OWN-SUCCESS-UNDER-C-LOCALE-01: حارسٌ يحسب صحيحاً ثمّ
      # يموت وهو يطبع نجاحه ⇒ rc=1 يُقرَأ حجباً وهو قد مرّ. أوّل إشعالٍ لكلّ حارسٍ تحت
      # `LC_ALL=C` أعطى ٣٥ انهياراً في الكتابة و٢٣ في القراءة — وكلّها خضراء في CI،
      # لأنّ عدّاء Linux افتراضيّه UTF-8. فالخضرة كانت شهادةً على لغة العدّاء.
      #
      # وموضعها هنا لا في *Lint & Format*: البوّابة **تُشغّل** كلّ حارس، فيلزمها
      # تبعيّاته وإلّا مات بالاستيراد قبل أوّل طباعة — ومرورٌ كهذا ليس دليلاً. وهي
      # تُعلِن عدد من لم يُقَس لهذا السبب بالضبط، فلا تُقرأ خضرتُها أوسع ممّا قاست.
      - name: Every guard survives being run under a C locale
        run: python scripts/ci/guard_locale_survival_guard.py
      # UNIT-SUITE-RUN-TWICE-01 (2026-08-05): كانت هنا خطوتان تُشغّلان **الجناح نفسه
      # مرّتين** — `pytest -v -m unit --cov=services --cov-report=…` ثمّ خطوة بوّابة
      # التغطية `pytest -m unit --cov=services --cov-fail-under=43 -q`. نفس العلامة،
      # نفس التغطية، تشغيلان متتاليان. المقيس: ١٩:٠٩ في CI على #788 مقابل ٦:٣٥
      # محلّيّاً بالتغطية — والحساب ٦:٣٥ × ~١.٤٥ (بطء العدّاء) × ٢ = ١٩:٠٦ يُطابقه.
      # أي أنّ **نصف المسار الحرج لكلّ PR** كان تكراراً، لا عتاداً ولا تجهيزاً.
      #
      # نشأ لأنّ بوّابة التغطية (A1) أُضيفت **بجوار** خطوة قائمة بدل أن تُدمَج فيها.
      # كلتاهما صحيحة منفردة؛ الكلفة في اجتماعهما — صنفٌ لا يظهر في مراجعة سطر واحد.
      #
      # وأُسقِط معها غلاف `|| (echo "التغطية انهارت…" && exit 1)`: رمز خروج pytest
      # واحد (1) لفشل اختبار ولانهيار التغطية معاً، فكان الغلاف يُشخّص خطأً. مُثبَت
      # محلّيّاً: تغطية 100% بلغت الأرضيّة + اختبار فاشل ⇒ طبع «التغطية انهارت».
      # ورسالة pytest-cov نفسها دقيقة ("Required test coverage of 43% not reached")،
      # فالغلاف كان يستبدل تشخيصاً صحيحاً بآخر خاطئ.
      #
      # الراتشِت: 20→40 (2026-07) → 42 → 43 (2026-07-28)؛ ارفعها نحو 55 مع نموّ
      # التغطية. UNIT-TEST-DORMANCY-01 وTESTS-UNMARKED-DESELECTED-01 رفعا المقيس إلى
      # ~47% بأمر CI نفسه. راجع docs/testing/coverage_ratchet.md.
      - name: Unit suite + coverage ratchet (one run — see UNIT-SUITE-RUN-TWICE-01)
        run: >-
          pytest -v -m unit
          --cov=services
          --cov-report=xml
          --cov-report=term
          --cov-fail-under=43
      - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with: {files: coverage.xml}
      # ثلاثة من هذه الأربعة بلا `pytestmark = unit` ⇒ يستبعدها `-m unit`؛ تُشغَّل
      # صراحةً بالمسار. لم تعد تحتاج تثبيتاً معزولاً: fastapi صارت في البيئة
      # المشتركة مثبَّتة على إصدار الإنتاج (UNIT-TEST-DORMANCY-01).
      # تُشغَّل الأربعة **معاً** عمداً: `test_field_forms_sync_binding_p02` كان يفشل
      # عند التجميع وحده (ترتيب HMAC) — «ناجح منفصلاً ≠ ناجح مُجمَّعاً» (#590).
      - name: Field-forms API integration (unmarked files, explicit paths)
        run: |
          pytest -v \
            tests_v9/test_field_forms_api_integration.py \
            tests_v9/test_field_forms_sync_binding_p02.py \
            tests_v9/test_field_forms_device_rotation_grace.py \
            tests_v9/test_erp_bridge_fail_closed.py

  repository-tests:
    name: Repository Tests (tests/)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        # تاريخ كامل: الشجرة تحوي حرّاساً يقرؤون تاريخ git نفسه
        # (`test_brain_commit_claim_guard` يشغّل `git log origin/main..HEAD` وعلى مدايات
        # تاريخيّة مسمّاة). لم يكشفه شيء قبل هذه الوظيفة لأنّه لم يكن يعمل في أيّ مكان —
        # وهو بالضبط ما كانت `ARCH-TESTS-UNLISTED-IN-CI-01` تُخفيه.
        with: {fetch-depth: 0}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests_v9/requirements-test.txt
      - run: pip install -r tests_v9/requirements-test.txt
      # ARCH-TESTS-UNLISTED-IN-CI-01: pytest.ini يحصر testpaths في tests_v9، فكان كلّ ما
      # تحت tests/ يُشغَّل بقائمة مسارات صريحة — وأيّ ملفّ جديد يقع خارجها صامتاً (٦٦ من
      # ١١٢ عند القياس). الشجرة تُشغَّل هنا **كاملةً**، والاستثناءات **تُشتقّ** من
      # docs/testing/tests_tree_baseline.json لا تُكتب هنا: استثناء بلا مدخل مُبرَّر مستحيل،
      # وملفّ جديد مُغطّى تلقائيّاً.
      - run: python scripts/ci/tests_tree_coverage_guard.py --check
      - name: Run the tests/ tree minus the justified baseline
        run: |
          ignores="$(python scripts/ci/tests_tree_coverage_guard.py --pytest-ignores)"
          echo "excluded: $ignores"
          # shellcheck disable=SC2086
          pytest tests -q -p no:cacheprovider $ignores

  platform-unit-tests:
    name: Platform Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tests_v9/requirements-test.txt
            services/sahool-platform/api/requirements.txt
      # اختبارات منطق المنصّة (services/sahool-platform/tests) كانت خارج نطاق CI
      # كلّيّاً: pytest.ini يحصر testpaths في tests_v9، فلم تُجمَع هذه الاختبارات
      # (~١٢٨٢، منطق صرف بلا قاعدة/خدمات) ولم تُشغَّل قطّ رغم نجاحها. هذه الوظيفة
      # تشغّلها فعليّاً من جذر المنصّة (PYTHONPATH=.) لتغطية حقيقيّة في CI.
      # Pillow: ملفّان (test_bivariate_raster/test_raster_export) يستوردان PIL
      # عبر core.spatial.raster_export — تبعيّة خفيفة (بلا GDAL) للإبقاء عليهما.
      - run: pip install -r tests_v9/requirements-test.txt -r services/sahool-platform/api/requirements.txt pillow
      # بوّابة تغطية "ratchet" غير-كاسرة: تُقاس حزمتا api/core، والأرضيّة في
      # .coveragerc مضبوطة عند المقيس الحاليّ (٦١٫٩٢٪) ناقص هامش ⇒ fail_under=60.
      # لا تُفشل CI اليوم؛ يمكنها الصعود فقط (تُرفع الأرضيّة مع نموّ التغطية).
      - name: Run platform pure-logic tests (no DB/services) + coverage ratchet
        working-directory: services/sahool-platform
        run: >-
          PYTHONPATH=. pytest tests -q -p no:cacheprovider
          --cov=api --cov=core --cov-config=.coveragerc
          --cov-report=term --cov-report=xml

  weather-service-unit-tests:
    name: Weather Service Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/weather-service/requirements.txt
      # اختبارات محرّك الطقس (services/weather-service/tests) كانت خارج نطاق CI:
      # الوظيفة الجذر «Unit Tests» تحصر testpaths في tests_v9، و«Platform Unit Tests»
      # تشغّل sahool-platform فقط — فلم تُجمَع اختبارات ET0/VPD/vapor_pressure الكنسيّة
      # (C.1a/C.1b) قطّ رغم نجاحها محليّاً. هذه الوظيفة تُشغّلها فعليّاً (TestClient،
      # بلا شبكة/قاعدة) لتصبح عقود الجودة الكنسيّة (fao56-pm/vpd) مُحكَّمة في CI.
      - run: pip install -r services/weather-service/requirements.txt pytest pytest-asyncio
      - name: Run weather-service pure-logic + route tests (no network/DB)
        working-directory: services/weather-service
        run: PYTHONPATH=. pytest tests -q -p no:cacheprovider

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-24.04
    # سقف صارم: المدّة الطبيعيّة دقائق قليلة؛ بلاه يحترق runner ستّ ساعات على أيّ تجمّد (مقيس).
    timeout-minutes: 30
    # ملاحظة: لا نستخدم `services:` لـPostgres/Redis لأنّ GitHub يسحب صورها عند
    # بدء المهمّة بثلاث محاولات سريعة فقط ⇒ فشل متكرّر حين يتباطأ/يُقيّد Docker Hub
    # (registry-1.docker.io: context deadline exceeded). بدلاً منها نُدير الحاويات
    # يدويّاً بإعادة سحب مرنة (٦ محاولات backoff) — نفس الصور والمنافذ تماماً.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests_v9/requirements-test.txt
      # مرآة سجلّ Docker Hub (Google mirror.gcr.io تعكس Hub كاملاً بما فيه postgis/postgis):
      # أوثق بكثير من Hub المباشر — تُنهي رفرفة «registry-1.docker.io: timeout» التي تُعطّل السحب.
      # تبقى الـ٦ محاولات أدناه خطّ دفاع ثانٍ. (إعادة إصلاح #538 الذي ضاع في إعادة كتابة main.)
      - name: Configure Docker registry mirror (avoid Docker Hub flakes)
        run: |
          echo '{"registry-mirrors":["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: Start Postgres+PostGIS and Redis, then provision the client from the image
        run: |
          set -e
          pull() {
            for i in 1 2 3 4 5 6; do
              docker pull "$1" && return 0
              echo "pull $1 فشل (محاولة $i) — backoff"; sleep $((i * 10))
            done
            echo "::error::تعذّر سحب $1 بعد ٦ محاولات"; return 1
          }
          pull postgis/postgis:15-3.4
          pull redis:7-alpine
          docker run -d --name sahool-pg \
            -e POSTGRES_DB=sahool_test -e POSTGRES_USER=sahool_test \
            -e POSTGRES_PASSWORD=test_password -p 5433:5432 postgis/postgis:15-3.4
          docker run -d --name sahool-redis -p 6380:6379 redis:7-alpine
          # apt بلا مهلة افتراضيّة: مرآة متجمّدة علّقت runner ساعتين (مقيس 2026-08-17
          # على وظيفة Integration Tests — السجلّ صمت بعد إنشاء الحاويتين مباشرةً،
          # وحلقة الانتظار المسقوفة لم تبدأ). timeout يفشل سريعاً فيُعاد على runner سليم.
          bash scripts/ci/provision_pg_client.sh sahool-pg
          export PATH="${RUNNER_TEMP:-/tmp}/pg-client-shims:$PATH"
          command -v pg_isready >/dev/null
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5433 -U sahool_test && break
            echo "بانتظار Postgres ($i)"; sleep 2
          done
          pg_isready -h localhost -p 5433 -U sahool_test
      - run: pip install -r tests_v9/requirements-test.txt
      # تطبيق مخطّط الترحيلات على قاعدة الاختبار قبل اختبارات التكامل (RLS/DB)،
      # وإلّا تفشل الاختبارات التي تُدرج في field_boundaries/ndvi_timeseries… (الجداول غير موجودة).
      - name: Apply migrations to test DB
        env:
          PGPASSWORD: test_password
        run: |
          bash scripts/ci/apply_migration_manifest.sh \
            --port 5433 --user sahool_test --db sahool_test
      - name: Migrations must have created a schema (a silent no-op is a failure)
        # MIGRATIONS-PASSED-WITHOUT-CREATING-ANYTHING-01 — الحلقة أعلاه تقرأ قائمتها
        # من stdin، فأيّ أداةٍ تستنزف المجرى تُنهيها بعد أوّل ملفّ **بنجاح**. وقع
        # مقيساً في 32283081538: الخطوة خضراء ثمّ 57 حالةً بـ`relation ... does not
        # exist`. فالعدّ هنا يحوّل الصمت إلى فشلٍ يسمّي نفسه في موضعه.
        env: {PGPASSWORD: test_password}
        run: |
          set -euo pipefail
          declared=$(grep -cvE '^[[:space:]]*#|^[[:space:]]*$' migrations/MANIFEST.txt)
          tables=$(psql -h localhost -p 5433 -U sahool_test -d sahool_test -Atc \
            "select count(*) from information_schema.tables where table_schema='public'")
          echo "هجرات مُعلَنة=$declared . جداول مُنشأة=$tables"
          [ "$tables" -gt 0 ] || {
            echo "::error::MIGRATIONS_APPLIED_NOTHING - الخطوة مرّت والمخطَّط فارغ"; exit 1; }
      - env:
          TEST_DATABASE_URL: postgresql://sahool_test:test_password@localhost:5433/sahool_test
          TEST_REDIS_URL: redis://localhost:6380/0
          JWT_SECRET: test_secret_min_32_chars_for_sahool_v9
        run: pytest -v -m integration --tb=short
      # ── IRR-F01 live certification ─────────────────────────────────────────────────
      # The shared run above connects as the superuser sahool_test, so the live reservation
      # gates SKIP there (RLS needs a real app role). These dedicated steps run them for real
      # as a restricted NOSUPERUSER/NOBYPASSRLS role with IRR_F01_CERTIFICATION_REQUIRED=1, so
      # any skip (DB down, missing migration, wrong role) becomes a HARD failure — no
      # green-but-skipped certification. Dedicated steps keep app-role scoping out of the
      # shared integration run, which other tests legitimately run as superuser.
      - name: Create restricted application role for RLS certification
        env:
          PGPASSWORD: test_password
        run: |
          psql -h localhost -p 5433 -U sahool_test -d sahool_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sahool_app_test') THEN
              CREATE ROLE sahool_app_test LOGIN PASSWORD 'app_test_password'
                NOSUPERUSER NOBYPASSRLS NOINHERIT;
            END IF;
          END $$;
          GRANT CONNECT ON DATABASE sahool_test TO sahool_app_test;
          GRANT USAGE ON SCHEMA public TO sahool_app_test;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO sahool_app_test;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO sahool_app_test;
          GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO sahool_app_test;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO sahool_app_test;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO sahool_app_test;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT EXECUTE ON FUNCTIONS TO sahool_app_test;
          SQL
          role_flags=$(psql -h localhost -p 5433 -U sahool_test -d sahool_test -Atc \
            "SELECT rolsuper::text || ':' || rolbypassrls::text FROM pg_roles WHERE rolname='sahool_app_test'")
          test "$role_flags" = "false:false" || { echo "::error::invalid RLS role flags: $role_flags"; exit 1; }
      - name: IRR-F01 fresh-schema certification (Gate A + Gate B1)
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://sahool_test:test_password@localhost:5433/sahool_test
          TEST_DATABASE_URL: postgresql://sahool_app_test:app_test_password@localhost:5433/sahool_test
          IRR_F01_CERTIFICATION_REQUIRED: "1"
        run: pytest -v -m integration -rs tests_v9/test_irr_f01_reservation_live_pg.py
      - name: IRR-F01 upgrade certification (Gate U1 — v194→v195/v196)
        env:
          PGHOST: localhost
          PGPORT: "5433"
          ADMIN_USER: sahool_test
          ADMIN_PASS: test_password
          U1_DB: sahool_u1_upgrade
          APP_ROLE: sahool_app_test
          APP_PASS: app_test_password
          IRR_F01_CERTIFICATION_REQUIRED: "1"
        run: |
          bash scripts/irr_f01/upgrade_gate_u1.sh
          export IRR_F01_UPGRADE_DATABASE_URL="postgresql://sahool_app_test:app_test_password@localhost:5433/sahool_u1_upgrade"
          export IRR_F01_UPGRADE_ADMIN_URL="postgresql://sahool_test:test_password@localhost:5433/sahool_u1_upgrade"
          pytest -v -m integration -rs tests_v9/test_irr_f01_upgrade_gate_u1_pg.py
          # Gate A + Gate B1 must also pass over the UPGRADED base, not only fresh schema.
          TEST_DATABASE_URL="$IRR_F01_UPGRADE_DATABASE_URL" \
          TEST_DATABASE_ADMIN_URL="$IRR_F01_UPGRADE_ADMIN_URL" \
            pytest -v -m integration -rs tests_v9/test_irr_f01_reservation_live_pg.py
      # ── H5.1 field↔water-source binding certification ──────────────────────────────
      # The shared integration run connects as the superuser, where the binding resolver's RLS
      # isolation SKIPS (superuser bypasses RLS). This dedicated step runs it as the restricted
      # sahool_app_test role with H51_CERTIFICATION_REQUIRED=1 so any skip becomes a HARD failure —
      # certifying on REAL v214/v168/v170 that the source is server-derived (never client-supplied),
      # the decision-grade sample filter is enforced in SQL, and tenants cannot see each other's
      # bindings. The superuser admin DSN seeds cross-tenant dependency rows only.
      - name: H5.1 field↔source binding certification (real-PG, restricted role)
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://sahool_test:test_password@localhost:5433/sahool_test
          TEST_DATABASE_URL: postgresql://sahool_app_test:app_test_password@localhost:5433/sahool_test
          H51_CERTIFICATION_REQUIRED: "1"
        run: pytest -v -m integration -rs tests_v9/test_h51_field_source_binding_pg.py

  decision-service-tests:
    name: Decision Service Tests
    runs-on: ubuntu-24.04
    # سقف صارم: المدّة الطبيعيّة دقائق قليلة؛ بلاه يحترق runner ستّ ساعات على أيّ تجمّد (مقيس).
    timeout-minutes: 30
    # WX-10.7: decision-service owns the authoritative review transition (state machine + append
    # -only audit + concurrency). Its tests need a real Postgres (the concurrency race + DB-level
    # append-only cannot be faked) — this job is their CI home. Same resilient-pull pattern as
    # Integration Tests (manual docker run + backoff instead of `services:`).
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/decision-service/requirements.txt
      - name: Configure Docker registry mirror (avoid Docker Hub flakes)
        run: |
          echo '{"registry-mirrors":["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: Start Postgres, then provision the client from the image
        run: |
          set -e
          pull() {
            for i in 1 2 3 4 5 6; do
              docker pull "$1" && return 0
              echo "pull $1 فشل (محاولة $i) — backoff"; sleep $((i * 10))
            done
            echo "::error::تعذّر سحب $1 بعد ٦ محاولات"; return 1
          }
          pull postgres:15
          docker run -d --name ds-pg \
            -e POSTGRES_DB=decision_test -e POSTGRES_USER=decision_test \
            -e POSTGRES_PASSWORD=test_password -p 5434:5432 postgres:15
          # apt بلا مهلة افتراضيّة: مرآة متجمّدة علّقت runner ساعتين (مقيس 2026-08-17
          # على وظيفة Integration Tests — السجلّ صمت بعد إنشاء الحاويتين مباشرةً،
          # وحلقة الانتظار المسقوفة لم تبدأ). timeout يفشل سريعاً فيُعاد على runner سليم.
          bash scripts/ci/provision_pg_client.sh ds-pg
          export PATH="${RUNNER_TEMP:-/tmp}/pg-client-shims:$PATH"
          command -v pg_isready >/dev/null
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5434 -U decision_test && break
            echo "بانتظار Postgres ($i)"; sleep 2
          done
          pg_isready -h localhost -p 5434 -U decision_test
      # PyJWT + prometheus-client: required by vegetation_runtime, imported by the
      # vegetation-agriai contract step below (pure logic, but module-level imports).
      - run: pip install -r services/decision-service/requirements.txt asyncpg pytest pytest-asyncio httpx PyJWT prometheus-client
      - name: Apply decision-service migrations (custom runner — 001 through 026)
        env:
          DATABASE_URL: postgresql://decision_test:test_password@localhost:5434/decision_test
          DECISION_SERVICE_ALLOW_SCHEMA_CHANGE: "true"
        run: python services/decision-service/migration_runner.py --apply
      - name: Migration idempotency (re-apply is a no-op / --check clean)
        env:
          DATABASE_URL: postgresql://decision_test:test_password@localhost:5434/decision_test
          DECISION_SERVICE_ALLOW_SCHEMA_CHANGE: "true"
        run: python services/decision-service/migration_runner.py --check
      # Mirror-mode contract (SoR OFF): the interim mirror sink must never claim persistence.
      # No DATABASE_URL / flag on this step ⇒ sor_enabled() is false ⇒ honest mirror behaviour.
      - name: Decision-service mirror-mode contract (SoR off)
        working-directory: services/decision-service
        run: pytest tests/test_p4_decision_service_runtime.py -q -p no:cacheprovider
      # WX-10.7 review transition (SoR ON + real Postgres): state machine + concurrency race +
      # append-only + idempotency. Separate step so SoR env never leaks into the mirror contract.
      - name: WX-10.7 review tests (real Postgres, SoR on)
        working-directory: services/decision-service
        env:
          DATABASE_URL: postgresql://decision_test:test_password@localhost:5434/decision_test
          DECISION_SERVICE_SOR_ENABLED: "true"
        run: pytest tests/test_wx10_7_decision_review.py -q -p no:cacheprovider
      # WX-10.6 crop-decision-candidate DOWNSTREAM consumption (real Postgres, SoR on): the boundary
      # output (a crop_decision_candidate recorded via /v1/decisions/record — the bridge's HTTP
      # target) surfaces in the reviewer queue the Approvals Console consumes and is reviewable,
      # tenant-isolated, never auto-approved. This is the real downstream coverage that replaced the
      # temporary WX-10.6 "pending reviewer UI" endpoint-ui-coverage waiver.
      - name: WX-10.6 crop-candidate downstream E2E (real Postgres, SoR on)
        working-directory: services/decision-service
        env:
          DATABASE_URL: postgresql://decision_test:test_password@localhost:5434/decision_test
          DECISION_SERVICE_SOR_ENABLED: "true"
        run: pytest tests/test_wx10_6_crop_candidate_downstream_e2e.py -q -p no:cacheprovider
      # WX-10.8 review-queue endpoint (monkeypatched: authoritative + tenant-scoped + fail-closed
      # 503 in mirror). No DB needed — runs here because this job has fastapi + pytest-asyncio.
      - name: WX-10.8 review-queue endpoint tests
        working-directory: services/decision-service
        run: pytest tests/test_wx10_8_review_queue.py -q -p no:cacheprovider
      # S5-EXEC-01 recommendation_outcomes cutover (static/text-inspection, no DB): compat shim,
      # decision_record immutability, outcome_record idempotency, and the preflight guard that
      # blocks the cutover until the new writer path is proven — none touch Postgres.
      - name: S5-EXEC-01 recommendation_outcomes cutover tests
        working-directory: services/decision-service
        run: >-
          pytest -q -p no:cacheprovider
          tests/test_s5_exec_01_decision_record_immutable.py
          tests/test_s5_exec_01_outcome_record_idempotency.py
          tests/test_s5_exec_01_recommendation_outcomes_compat.py
          tests/test_s5_exec_01_recommendation_outcomes_preflight.py
      # WX-10.9..10.12 post-approval execution chain (real Postgres, SoR on): each stage is an
      # authoritative append-only transition (plan -> authorize -> execute request -> delivery
      # receipt -> outcome verify), concurrency + idempotency proven on real Postgres.
      - name: WX-10.9..10.12 execution chain tests (real Postgres, SoR on)
        working-directory: services/decision-service
        env:
          DATABASE_URL: postgresql://decision_test:test_password@localhost:5434/decision_test
          DECISION_SERVICE_SOR_ENABLED: "true"
        run: >-
          pytest -q -p no:cacheprovider
          tests/test_wx10_9_execution_plan.py
          tests/test_wx10_10_dispatch_authorization.py
          tests/test_wx10_11_execution_request.py
          tests/test_wx10_11b_execution_delivery_receipt.py
          tests/test_wx10_12_execution_outcome.py
      # IRR-F01 Gate B-delivery (thin inbox, real Postgres): a delivered reservation dispatch
      # INTENT is recorded idempotently (dedup on tenant+source_event_id), a corrupted redelivery
      # is rejected, the receipt is append-preserving, the consumer heartbeat advances — and a
      # delivery does NOT create an execution_request (delivery != fulfillment).
      - name: IRR-F01 Gate B-delivery reservation dispatch-intent inbox (real Postgres)
        working-directory: services/decision-service
        env:
          DATABASE_URL: postgresql://decision_test:test_password@localhost:5434/decision_test
        run: pytest tests/test_gate_b_reservation_dispatch_inbox.py -q -p no:cacheprovider
      # IRR-F01 Phase 1: the irr_f01_reservation ACTIVATION GATE reference implementation
      # (5-state machine + CAS on activation_generation + TTL + stale-evaluating recovery +
      # append-only evidence + probe role/signature + enforcement). The eight mandatory proofs
      # run on real Postgres.
      - name: IRR-F01 activation gate (irr_f01_reservation) proof tests (real Postgres)
        working-directory: services/decision-service
        env:
          DATABASE_URL: postgresql://decision_test:test_password@localhost:5434/decision_test
        run: pytest tests/test_irr_f01_reservation_activation_gate.py -q -p no:cacheprovider
      # IRR-F01 Phase 1 P1-b: the activation gate HTTP surface (operator begin/complete/revoke/
      # reset + guarded probe) and the ingest enforcement wiring, over the real app + Postgres.
      - name: IRR-F01 activation gate HTTP + enforcement (real Postgres)
        working-directory: services/decision-service
        env:
          DATABASE_URL: postgresql://decision_test:test_password@localhost:5434/decision_test
        run: pytest tests/test_irr_f01_activation_endpoints.py -q -p no:cacheprovider
      # Phase 2: the SECOND, independent Category-A activation gate (satellite_cdse) — same state
      # machine/CAS/TTL/evidence proofs, but enforcement is imagery-SOURCE SELECTION (cdse vs the
      # element84 fallback) rather than a refusal. Two independent gates unlock the Phase-3
      # extraction (ACTIVATION-GATE-PROD-07).
      - name: satellite_cdse activation suite (real Postgres)
        working-directory: services/decision-service
        env:
          DATABASE_URL: postgresql://decision_test:test_password@localhost:5434/decision_test
        run: >-
          pytest -q -p no:cacheprovider
          tests/test_satellite_cdse_activation_gate.py
          tests/test_satellite_cdse_activation_endpoints.py
          tests/test_satellite_cdse_live_consumer_e2e.py
      # Gate-Trust-1: the stored producer-issued evidence RECEIPT store is the activation root of
      # trust — the caller submits references, the gate resolves them server-side, and every reject
      # case (unknown/wrong-gate/wrong-env/revoked/expired/not-pass/unknown-producer/unsupported-
      # check) plus "raw caller evidence forbidden (422)" is proven on real Postgres.
      - name: activation evidence receipts trust root (real Postgres)
        working-directory: services/decision-service
        env:
          DATABASE_URL: postgresql://decision_test:test_password@localhost:5434/decision_test
        run: pytest tests/test_activation_evidence_contract.py -q -p no:cacheprovider
      # DECISION-SOR-CUTOVER: the SoR write boundary must be a DB PRIVILEGE boundary, not just a
      # Python guard. This proves it with TWO distinct NOSUPERUSER/NOBYPASSRLS roles (platform_test
      # + decision_service_test, self-created by the test via the superuser DATABASE_URL): after the
      # revoke, a platform-role INSERT raises the DB's InsufficientPrivilegeError while SELECT + the
      # service role's writes survive; catalog grants, table ownership, sequences, SECURITY DEFINER
      # writers, role attributes and SET ROLE are all asserted; rollback restores platform writes.
      - name: decision SoR DB privilege cutover boundary (real Postgres, two roles)
        working-directory: services/decision-service
        env:
          DATABASE_URL: postgresql://decision_test:test_password@localhost:5434/decision_test
        run: pytest tests/test_decision_sor_db_privilege_cutover.py -q -p no:cacheprovider
      # DECISION-SOR-PRE-CUTOVER-ROLE-CERTIFICATION: the certification tool's verdict must be
      # trustworthy — prove role_separation_confirmed is true for two distinct roles and false for a
      # shared role (the "do not REVOKE" signal), and that role attributes + table owners are surfaced.
      - name: decision SoR pre-cutover role certification verdict (real Postgres)
        working-directory: services/decision-service
        env:
          DATABASE_URL: postgresql://decision_test:test_password@localhost:5434/decision_test
        run: pytest tests/test_decision_sor_role_certify_pg.py -q -p no:cacheprovider
      # Gate-Trust-1: the trust root fails closed at READ — deploy_build_sha() and the probe secret
      # raise on absent/invalid config, the evidence window is capped, provenance is canonical. Pure
      # decisions, no DB.
      - name: activation core hardening fail-closed
        working-directory: services/decision-service
        run: pytest tests/test_activation_gate_core_hardening.py -q -p no:cacheprovider
      # Service-token guard middleware (open-ledger #2): the raw internal port refuses spoofed
      # identity headers when a token is configured / production is armed, fails closed (503) when
      # required-but-unset, and in production restricts the auth-exemption set to the health probes.
      # Pure middleware decision, no DB.
      - name: service-token guard middleware
        working-directory: services/decision-service
        run: pytest tests/test_service_token_guard.py -q -p no:cacheprovider
      # LOOP_TABLES drift (no phantom table) + WebSocket auth guard (no WS route bypasses the
      # service-token middleware). Static, no DB.
      - name: loop-tables + websocket governance guards
        working-directory: services/decision-service
        run: pytest tests/test_loop_tables_and_ws_guard.py -q -p no:cacheprovider
      # WORKER-IDENTITY-BINDING: the worker-driven endpoints must verify the caller IS the
      # worker_id (request-scoped signed assertion) before trusting it. Pure decision, no DB.
      - name: worker-identity binding fail-closed
        working-directory: services/decision-service
        run: pytest tests/test_worker_identity_binding.py -q -p no:cacheprovider
      # WX-10.13..11.6 model/MLOps governance chain (real Postgres, SoR on): each stage is an
      # authoritative append-only transition (learning-attribution -> calibration-dataset ->
      # model-evaluation -> promotion-decision -> activation-request -> activation-approval ->
      # registry-activation/receipt/rollback), concurrency + idempotency proven on real Postgres.
      - name: WX-10.13 learning-attribution tests (real Postgres, SoR on)
        working-directory: services/decision-service
        env:
          DATABASE_URL: postgresql://decision_test:test_password@localhost:5434/decision_test
          DECISION_SERVICE_SOR_ENABLED: "true"
        run: pytest tests/test_wx10_13_learning_attribution.py -q -p no:cacheprovider
      - name: WX-11.1..11.6 model registry tests (real Postgres, SoR on)
        working-directory: services/decision-service
        env:
          DATABASE_URL: postgresql://decision_test:test_password@localhost:5434/decision_test
          DECISION_SERVICE_SOR_ENABLED: "true"
        run: >-
          pytest -q -p no:cacheprovider
          tests/test_wx11_1_calibration_dataset.py
          tests/test_wx11_2_model_evaluation.py
          tests/test_wx11_3_model_promotion_decision.py
          tests/test_wx11_4_model_activation_request.py
          tests/test_wx11_5_model_activation_approval.py
          tests/test_wx11_6_registry_activation_boundary.py
      # WX-12.1 runtime work-feed + rollout/retraining dispatch receipts (real Postgres, SoR on):
      # proves the runtime<->decision-service loop persists append-only and closes.
      - name: WX-12.1 runtime work-feed + receipts tests (real Postgres, SoR on)
        working-directory: services/decision-service
        env:
          DATABASE_URL: postgresql://decision_test:test_password@localhost:5434/decision_test
          DECISION_SERVICE_SOR_ENABLED: "true"
        run: pytest tests/test_wx12_1_runtime_receipts.py -q -p no:cacheprovider
      # WX-12.3 durable schedules (real Postgres, SoR on): feed emits due monitoring windows and
      # reconcile work; append-only evidence closes each item; leases still single-owner.
      - name: WX-12.3 runtime schedules tests (real Postgres, SoR on)
        working-directory: services/decision-service
        env:
          DATABASE_URL: postgresql://decision_test:test_password@localhost:5434/decision_test
          DECISION_SERVICE_SOR_ENABLED: "true"
        run: pytest tests/test_wx12_3_runtime_schedules.py -q -p no:cacheprovider
      # AC-1 agronomic context (real Postgres, SoR on): composer determinism + PIT rejection +
      # mandatory decision binding + append-only.
      - name: AC-1 agronomic context tests (real Postgres, SoR on)
        working-directory: services/decision-service
        env:
          DATABASE_URL: postgresql://decision_test:test_password@localhost:5434/decision_test
          DECISION_SERVICE_SOR_ENABLED: "true"
        run: pytest tests/test_ac1_agronomic_context.py -q -p no:cacheprovider
      # AC-6.1: tenant-safe lineage integrity — full-lineage binding, semantic rejections,
      # content-addressed vegetation evidence, DB trigger backstop (real Postgres).
      - name: AC-6.1 agronomic lineage integrity tests (real Postgres, SoR on)
        working-directory: services/decision-service
        env:
          DATABASE_URL: postgresql://decision_test:test_password@localhost:5434/decision_test
          DECISION_SERVICE_SOR_ENABLED: "true"
        run: pytest tests/test_agronomic_lineage_integrity.py -q -p no:cacheprovider
      # Phase C no-leakage certification: randomized property sweep (leaky compositions
      # rejected typed with ZERO writes; clean accepted) + DB row invariants (real Postgres).
      - name: Phase C no-leakage certification tests (real Postgres, SoR on)
        working-directory: services/decision-service
        env:
          DATABASE_URL: postgresql://decision_test:test_password@localhost:5434/decision_test
          DECISION_SERVICE_SOR_ENABLED: "true"
        run: pytest tests/test_no_leakage_certification.py -q -p no:cacheprovider
      # WX-12 multitenancy: registry replay/conflict + partition authorization + the
      # end-to-end 403 for a non-authorized tenant (real Postgres, SoR on).
      - name: WX-12 runtime worker-tenant partitioning tests (real Postgres, SoR on)
        working-directory: services/decision-service
        env:
          DATABASE_URL: postgresql://decision_test:test_password@localhost:5434/decision_test
          DECISION_SERVICE_SOR_ENABLED: "true"
        run: pytest tests/test_runtime_worker_tenants.py -q -p no:cacheprovider
      # Phase E: the decision's full agronomic evidence chain is readable authoritatively
      # (context/historical/manifest/vegetation + PIT stamps), 404 honest, mirror 503.
      - name: Phase E decision evidence read tests (real Postgres, SoR on)
        working-directory: services/decision-service
        env:
          DATABASE_URL: postgresql://decision_test:test_password@localhost:5434/decision_test
          DECISION_SERVICE_SOR_ENABLED: "true"
        run: pytest tests/test_decision_evidence_read.py -q -p no:cacheprovider
      # ACTUATOR-DISPATCH-CONSUMER (P0, consumers audit): queued feed -> claim -> receipt
      # full chain proven on real Postgres; feed serves queued only; mirror 503.
      - name: execution-request delivery feed tests (real Postgres, SoR on)
        working-directory: services/decision-service
        env:
          DATABASE_URL: postgresql://decision_test:test_password@localhost:5434/decision_test
          DECISION_SERVICE_SOR_ENABLED: "true"
        run: pytest tests/test_execution_request_feed.py -q -p no:cacheprovider
      # AC-6: HTTP contract for strict lineage + evidence writer (pure logic, no DB,
      # mirror-mode fail-closed) — deliberately run WITHOUT DATABASE_URL/SoR env.
      - name: AC-6 evidence/lineage contract tests (no DB, mirror fail-closed)
        working-directory: services/decision-service
        run: pytest tests/test_agronomic_evidence_contract.py -q -p no:cacheprovider
      # AC-9→terminal lineage static contracts (pure token checks, no DB).
      - name: agronomic lineage chain static tests
        working-directory: services/decision-service
        run: pytest tests/test_agronomic_learning_lineage.py tests/test_agronomic_model_lifecycle_lineage.py tests/test_agronomic_runtime_lineage.py tests/test_agronomic_runtime_terminal_lineage.py -q -p no:cacheprovider
      # VEG-AGRIAI delivered contracts are pure-logic (no DB): run them here where pytest exists.
      - name: canonical soil profile decision-context tests
        working-directory: services/decision-service
        run: pytest tests/test_soil_profile_context_gate.py -q -p no:cacheprovider
      - name: vegetation-agriai contract tests (pure logic)
        working-directory: services/decision-service
        run: pytest ../agriai-engine/tests/test_agronomic_context_contract.py ../agriai-engine/tests/test_agronomic_adapters.py ../agriai-engine/tests/test_production_readiness_truth.py ../vegetation-analysis-service/test_vegetation_production_contract.py ../vegetation-analysis-service/test_timeseries_honesty.py ../vegetation-analysis-service/test_indicator_registry.py ../vegetation-analysis-service/test_production_truth_closure.py ../vegetation-analysis-service/test_evidence_producer_contract.py -q -p no:cacheprovider
      # WX-12 model-registry-adapter runtime is stdlib-only pure logic (drift classification,
      # bounded backoff, compare-and-swap decision). The contract test additionally imports the
      # decision-service app (fastapi is installed in this job) and replays every request the
      # runtime/worker emit, so URL/header/body drift fails here every push.
      # actuator dispatch-consumer pure logic (plan/risk/tenants + wiring guard) — was
      # previously never exercised by CI (latent break after the P2 decomposition).
      - name: actuator dispatch-consumer pure tests
        working-directory: services/actuator-service
        run: pytest test_dispatch_bridge.py -q -p no:cacheprovider
      - name: WX-12 model-registry-adapter runtime + contract tests
        working-directory: services/decision-service
        env:
          DATABASE_URL: postgresql://decision_test:test_password@localhost:5434/decision_test
        run: pytest ../model-registry-adapter/tests -q -p no:cacheprovider

  live-pg-fake-connection-proofs:
    # FAKE-CONNECTION-ENFORCES-NOTHING-01 — الشطر الذي لا يُسدَّد إلّا بقاعدة حقيقيّة.
    #
    # **لماذا وظيفة مستقلّة ولا تُضَمّ إلى Integration Tests:** اللاتماثل المطلوب هنا
    # معاكس. تلك الوظيفة تتخطّى بأمان حين تغيب القاعدة — وهو الصواب لها. أمّا هذه
    # فتخطّيها **خضرةٌ تعني «لم يُقَس»**، وهو الصنف الذي أوجب الفجوة أصلاً. فتُشغَّل
    # بـ`SAHOOL_REQUIRE_LIVE_PG=1` الذي يجعل غياب القاعدة **خطأ جمع** لا تخطّياً.
    name: Live PG Proofs (fake-connection debt)
    runs-on: ubuntu-24.04
    # سقف صارم: المدّة الطبيعيّة دقائق قليلة؛ بلاه يحترق runner ستّ ساعات على أيّ تجمّد (مقيس).
    timeout-minutes: 30
    # The evidence bytes are now independently attestable. The OIDC token is
    # used only by actions/attest; database credentials remain job-local test values.
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests_v9/requirements-test.txt
      - name: Configure Docker registry mirror (avoid Docker Hub flakes)
        run: |
          echo '{"registry-mirrors":["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: Start PostgreSQL 16 + PostGIS, then provision the client from the image
        id: live_pg_harness
        # حلقة السحب انتقلت إلى `scripts/ci/resilient_docker_pull.sh` كي **تُختبَر**:
        # منطقٌ مدفون في `run: |` لا يُقاس إلّا بتشغيل الوظيفة كاملةً، فيبقى
        # «مقيسٌ بمحاكاة» ادّعاءً في رسالة التزام. الاختبار في
        # `tests_v9/test_resilient_docker_pull.py` يزيّف `docker` ويُثبِت أنّ
        # `docker run` **لم يُنفَّذ** بعد استنفاد المحاولات.
        run: |
          set -euo pipefail
          scripts/ci/resilient_docker_pull.sh postgis/postgis:16-3.4
          docker run -d --name sahool-pg16 \
            -e POSTGRES_DB=sahool -e POSTGRES_USER=sahool_user \
            -e POSTGRES_PASSWORD=test_password -p 5435:5432 --pull=never \
            postgis/postgis:16-3.4
          # apt بلا مهلة افتراضيّة: مرآة متجمّدة علّقت runner ساعتين (مقيس 2026-08-17
          # على وظيفة Integration Tests — السجلّ صمت بعد إنشاء الحاويتين مباشرةً،
          # وحلقة الانتظار المسقوفة لم تبدأ). timeout يفشل سريعاً فيُعاد على runner سليم.
          bash scripts/ci/provision_pg_client.sh sahool-pg16
          export PATH="${RUNNER_TEMP:-/tmp}/pg-client-shims:$PATH"
          command -v pg_isready >/dev/null
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5435 -U sahool_user && break
            echo "بانتظار Postgres ($i)"; sleep 2
          done
          pg_isready -h localhost -p 5435 -U sahool_user
      - name: Apply the canonical MANIFEST
        id: live_pg_migrations
        # `DEDICATED_PG_JOB: migrations mismatch → failure` — الشطر الأوّل منه.
        # الحلقة تُطبِّق وتَعُدّ، ثمّ تُقارِن المُطبَّق بالمُعلَن. بلا العدّاد يستطيع
        # `case` أو `grep` أن يُسقِط ملفّاً صامتاً فتعمل الأدلّة على مخطّط ناقص —
        # وهو انحرافٌ يظهر لاحقاً كفشل ادّعاءٍ يُقرأ «الاختبار خاطئ».
        env: {PGPASSWORD: test_password}
        run: |
          set -euo pipefail
          bash scripts/ci/apply_migration_manifest.sh \
            --port 5435 --user sahool_user --db sahool \
            || { echo "MIGRATION_MANIFEST_APPLY_FAILED" >live_pg_primary_cause.txt; exit 1; }
      - name: Provision the restricted application role
        # `sahool_app` متطلَّب تشغيليّ مُعلَن في `migrations/v56_rls_dynamic_all.sql:27`
        # ولا تُنشئه هجرة — فتُنشئه الوظيفة صراحةً. و`NOBYPASSRLS` ليس تجميلاً: بدونه
        # يمرّ كلّ ادّعاء عزلٍ تحته مجّاناً، ولذلك يقيسه الاختبار الأوّل قبل أيّ عزل.
        env: {PGPASSWORD: test_password}
        run: |
          set -e
          psql -h localhost -p 5435 -U sahool_user -d sahool -v ON_ERROR_STOP=1 -c "
            create role sahool_app login password 'test_password'
              nosuperuser nobypassrls nocreatedb nocreaterole;
            grant usage on schema public to sahool_app;
            grant select, insert, update, delete on all tables in schema public to sahool_app;
            grant usage, select on all sequences in schema public to sahool_app;
          "
      - run: pip install -r tests_v9/requirements-test.txt
      - name: Schema contract must match the live catalogue (before any test)
        # `DEDICATED_PG_JOB: schema mismatch → failure` — ويُفحَص **قبل** الاختبارات
        # كي يُقرأ العطل باسمه: انحرافُ مخطّطٍ يظهر بعدها يُقرأ «الاختبار خاطئ».
        env:
          PGHOST: localhost
          PGPORT: "5435"
          PGPASSWORD: test_password
          SAHOOL_TEST_PGDATABASE: sahool
          SAHOOL_TEST_PGOWNER: sahool_user
        run: |
          set -euo pipefail
          python scripts/ci/live_pg_evidence_guard.py --schema-only
      - name: Live proofs — absence of the database is a failure, never a skip
        env:
          SAHOOL_REQUIRE_LIVE_PG: "1"
          SAHOOL_TEST_PGHOST: localhost
          SAHOOL_TEST_PGPORT: "5435"
          SAHOOL_TEST_PGDATABASE: sahool
          SAHOOL_TEST_PGOWNER: sahool_user
          SAHOOL_TEST_PGROLE: sahool_app
          PGPASSWORD: test_password
        run: |
          set -euo pipefail
          pytest tests_v9/test_live_pg_fake_connection_debt.py -v --tb=short \
            -p no:cacheprovider -o addopts= --junitxml=live_pg_evidence.xml
      - name: Enforce the dedicated-job contract and emit the measured summary
        # يستبدل عدّ `--collect-only | grep -c '::'`، وكان يقيس **الجمع** لا التنفيذ:
        # ملفٌّ يُجمَع ٣٠ اختباراً ثمّ يتخطّاها كلّها كان يمرّ. والعقد الآن يُفرَض من
        # تقرير تنفيذٍ مُهيكَل (`--junitxml`) لا من نصّ سطرٍ يتبدّل بإصدار pytest:
        #
        #   PG غائبة ⇒ فشل · دور غير مُثبَت ⇒ فشل · مُنفَّذ = صفر ⇒ فشل
        #   مُتخطّى > صفر ⇒ فشل · انحراف مخطّط ⇒ فشل
        #
        # ويطبع collected/executed/passed/failed/skipped وإصدارَي الخادم وPostGIS
        # وخصائصَ الدور — بلا أيّ من متغيّرات الاتّصال.
        #
        # **و`if: always()` ليس تساهلاً بل شرطُ وجود الدليل.** الخطوة تكتب
        # `live_pg_evidence.json` بحكمه `PASS`/`FAIL` **قبل** إعادة أيّ رمز خروج غير
        # صفريّ (`--evidence`)، فلو عُلِّقت على نجاح ما قبلها لما وُجِدت الوثيقة إلّا
        # يوم لا نحتاجها. والفشل يبقى فشلاً: رمز الخروج غير الصفريّ يُسقِط الوظيفة.
        if: >-
          always() && steps.live_pg_harness.outcome == 'success' &&
          steps.live_pg_migrations.outcome == 'success'
        env:
          PGHOST: localhost
          PGPORT: "5435"
          PGPASSWORD: test_password
          SAHOOL_TEST_PGDATABASE: sahool
          SAHOOL_TEST_PGOWNER: sahool_user
          SAHOOL_TEST_PGROLE: sahool_app
        run: |
          set -euo pipefail
          python scripts/ci/live_pg_evidence_guard.py --junit live_pg_evidence.xml \
            --min-executed 30 --evidence live_pg_evidence.json
      - name: Prove the evidence role has no direct or transitive role memberships
        # `direct_role_attributes` proves only the named row in pg_roles. This
        # companion proof closes pg_auth_members / SET ROLE ambiguity for the
        # dedicated evidence role by requiring its membership closure to be empty.
        if: >-
          always() && steps.live_pg_harness.outcome == 'success' &&
          steps.live_pg_migrations.outcome == 'success'
        env:
          PGHOST: localhost
          PGPORT: "5435"
          PGPASSWORD: test_password
          SAHOOL_TEST_PGDATABASE: sahool
          SAHOOL_TEST_PGOWNER: sahool_user
          SAHOOL_TEST_PGROLE: sahool_app
        run: |
          set -euo pipefail
          python scripts/ci/live_pg_role_closure_guard.py \
            --evidence live_pg_role_closure.json
      - name: Build the canonical evidence manifest and subject digest set
        id: live_pg_subjects
        if: always()
        run: |
          set -euo pipefail
          # ── لا مجموعةَ بصماتٍ فارغة تُكتَب باسمٍ يَعِد ─────────────────────────
          # `sha256sum … > live_pg_evidence.sha256` تُنشئ الوجهة **قبل** أن تفشل،
          # فتبقى على القرص فارغةً ثمّ تُرفَع مصنوعةً وتُقدَّم موضوعاً للتصديق. مقيس
          # في تشغيل 32274613475: الحزمة حملت `manifest.json` وبصماتٍ فارغة، ثمّ
          # سقط `attest` بـ«no statement subjects» — ثلاثةُ أحمرَ من عطلٍ واحد.
          # فتُفحَص المواضيع أوّلاً، ويُكتَب إلى ملفٍّ مؤقّت، ولا يُسمّى الاسم النهائيّ
          # إلّا بإعادة تسميةٍ ذرّيّة بعد نجاح الجميع.
          subjects=(live_pg_evidence.json live_pg_evidence.xml live_pg_role_closure.json)
          missing=()
          for f in "${subjects[@]}"; do [ -s "$f" ] || missing+=("$f"); done
          if [ "${#missing[@]}" -gt 0 ]; then
            # ── السببُ يُشتقّ ولا يُكتَب بيد ────────────────────────────────────
            # كُتِب هنا أوّلاً `primary_error=POSTGRES_CLIENT_PROVISIONING_FAILED`
            # ثابتاً، فطُبِع في تشغيل 32285597465 **والتوفير ناجح**: `psql` عمل
            # وطبّق `init_v8.sql` كاملةً، والعطل كان اقتطاع حلقة الهجرات. أي أنّ
            # الإصلاح استبدل نسبةً كاذبة (`RESTRICTED_ROLE_NOT_FOUND`) بأخرى.
            # فالسبب يُقاس من حالة العالم: أموجودٌ العميل؟ أقامت القاعدة؟
            # السببُ الأوّل يُورَث ولا يُستبدَل: `JUNIT_REPORT_MISSING` و
            # `RESTRICTED_ROLE_NOT_FOUND` أعراضٌ تالية، ونسبةُ العطل إليها تُفسِد
            # سلسلة النَّسَب. فإن ترك عطلٌ سببيّ فُتاتَه، فهو الحكم.
            if [ -s live_pg_primary_cause.txt ]; then
              primary="$(head -n1 live_pg_primary_cause.txt)"
            elif ! command -v psql >/dev/null 2>&1; then
              primary=POSTGRES_CLIENT_PROVISIONING_FAILED
            elif ! psql -h localhost -p 5435 -U sahool_user \
                   -d "${SAHOOL_TEST_PGDATABASE:-sahool}" -Atc 'select 1' >/dev/null 2>&1; then
              primary=POSTGRES_UNREACHABLE
            else
              primary=PREREQUISITE_STEP_FAILED_SEE_EARLIER_ERROR
            fi
            echo "::error::HARNESS_INVALID — مواضيع الأدلّة غائبة: ${missing[*]}"
            echo "::error::primary_error=$primary (القاعدة لم تبلغ حالةً تُقاس)"
            echo "subjects_ready=false" >>"$GITHUB_OUTPUT"
            exit 1
          fi
          tested_commit="$(git rev-parse HEAD)"
          tested_tree="$(git rev-parse HEAD^{tree})"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            binding_args=(--binding-mode pending_final_rerun)
          else
            binding_args=(--binding-mode exact_commit --accepted-commit-sha "$tested_commit" --accepted-tree-sha "$tested_tree")
          fi
          # هويّة المُنتِج تُشتقّ من البيئة لا تُكتَب بيد: مسار الـworkflow يُقتَطع من
          # `GITHUB_WORKFLOW_REF` (owner/repo/<path>@<ref>) فيتبع إعادة التسمية بصدق.
          workflow_path="${GITHUB_WORKFLOW_REF#"${GITHUB_REPOSITORY}"/}"
          workflow_path="${workflow_path%@*}"
          python scripts/ci/sot_evidence_manifest.py             --output live_pg_canonical_manifest.json             --file live_pg_evidence.json             --file live_pg_evidence.xml             --file live_pg_role_closure.json             --tested-commit "$tested_commit" --tested-tree "$tested_tree"             --source-ref "${GITHUB_REF}"             --producer-repository "${GITHUB_REPOSITORY}"             --producer-workflow-path "${workflow_path}"             --producer-run-id "${GITHUB_RUN_ID}"             --producer-run-attempt "${GITHUB_RUN_ATTEMPT}"             --producer-event "${GITHUB_EVENT_NAME}" "${binding_args[@]}"
          tmp_sums="$(mktemp)"
          sha256sum "${subjects[@]}" live_pg_canonical_manifest.json >"$tmp_sums"
          [ -s "$tmp_sums" ] || { echo "::error::مجموعة البصمات خرجت فارغة"; rm -f "$tmp_sums"; exit 1; }
          mv "$tmp_sums" live_pg_evidence.sha256
          echo "subjects_ready=true" >>"$GITHUB_OUTPUT"
          cat live_pg_evidence.sha256
      # **محاولتان لا واحدة — والسبب مقيس لا مُفترَض.** أوّل تشغيل فعليّ لهذه الخطوة
      # سقط بـ`InternalError: error fetching tlog entry` ⇒ `network timeout` على
      # `rekor.sigstore.dev` (تشغيل 31429802079). والحارسان كانا أخضرين، والدليل
      # رُفِع — أي أنّ **وظيفةً مطلوبة احمرّت لانقطاعٍ في سجلّ شفافيّة خارجيّ**.
      #
      # ورَبطُ اخضرار CI بجاهزيّة خدمةٍ ثالثة يُنتِج أحمرَ لا يملك قارئُه فعلاً حياله،
      # فيُدرَّب على تجاهله — وهو الخطأ الموصوف في عقد `live_pg_schema_contract`.
      # فتُعاد المحاولة مرّةً واحدة: العابر يُعالَج، **والعقد لا يُلَيَّن** — فشلُ
      # المحاولتين معاً يبقى حاجباً لأنّه حينئذٍ عطلٌ لا انقطاعة.
      - name: Attest the evidence subjects with GitHub OIDC + Sigstore
        id: live_pg_attest
        # Fork pull requests do not receive the write-capable token required to
        # persist attestations. Do not pretend an internal SHA file is provenance.
        if: >-
          always() &&
          steps.live_pg_subjects.outputs.subjects_ready == 'true' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: live_pg_evidence.sha256
      - name: Retry the attestation once (transparency-log timeouts are transient)
        id: live_pg_attest_retry
        # حاجزةٌ عمداً: هذه المحاولة الأخيرة، وسقوطُها يعني أنّ المنشأ لم يُثبَت فعلاً.
        if: >-
          always() && steps.live_pg_attest.outcome == 'failure' &&
          steps.live_pg_subjects.outputs.subjects_ready == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: live_pg_evidence.sha256
      - name: Place the signed attestation bundle beside the evidence
        id: live_pg_copy_attestation
        if: >-
          always() &&
          (steps.live_pg_attest.outcome == 'success' || steps.live_pg_attest_retry.outcome == 'success')
        env:
          # **المحاولة الثانية أوّلاً — والترتيب الأصليّ كان عطلاً كامناً.**
          # مخرجُ الثانية لا يوجد إلّا إن عملت، وهي لا تعمل إلّا إن فشلت الأولى؛
          # فوجودُه بذاته يقول «الأولى فشلت والثانية نجحت». أمّا تقديمُ الأولى فيفترض
          # أنّ خطوةً فاشلة لا تترك `bundle-path` — افتراضٌ عن سلوكٍ داخليّ لأكشن لا
          # نملكه، وإخلافُه يعني نسخَ حزمةٍ ناقصة ورفعَها **بوصفها منشأً مُثبَتاً**.
          # وهو الصنف الأسوأ: لا يُحمِرّ شيئاً، ويُنتِج دليلاً كاذباً عند أوّل انقطاعة.
          BUNDLE_PATH: >-
            ${{ steps.live_pg_attest_retry.outputs.bundle-path
                || steps.live_pg_attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -n "$BUNDLE_PATH"
          # والحزمة تُقرأ قبل نسخها: ملفٌّ فارغ أو غير قابل للتحليل ليس توقيعاً،
          # ورفعُه تحت اسم `…attestation…` يُعطي غيابَ الإثبات مظهرَ الإثبات.
          # والترميز مثبَّتٌ صراحةً: `open()` بلا `encoding` يتبع لغة الرَّانر، فيصير
          # الفحص معتمداً على بيئةٍ لا على المحتوى — ونتيجةٌ تتغيّر بتغيّر اللغة ليست قياساً.
          python -c "import json,pathlib,sys; json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))" "$BUNDLE_PATH"
          cp "$BUNDLE_PATH" live_pg_evidence.attestation.json
      - name: Install the pinned GitHub attestation verifier
        if: always() && steps.live_pg_copy_attestation.outcome == 'success'
        run: scripts/ci/install_pinned_gh_attestation_cli.sh
      - name: Fetch independent trusted roots and enforce the provenance gate
        if: always() && steps.live_pg_copy_attestation.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation trusted-root > live_pg_trusted_root.jsonl
          # **المطلوب يتبع المصدر، لا الحدث وحده.** كان التقسيم «pull_request ⇒ L3،
          # وكلّ ما عداه ⇒ L5»، فكان يطلب من دفعةٍ إلى فرع عمل ضمانَ إصدار. والحارس
          # الآن يسقّف الفرع غير المعتمد عند L3 (release_refs في السياسة)، فطلبُ L5
          # منه يحجب كلّ فرع. والسقف والطلب وجهان لعقدٍ واحد: هذا يقول ما يُنال،
          # وذاك ما يُشترَط — وافتراقهما يحجب الصالح أو يمرّر غير الصالح.
          # والقرار هنا تيسيرٌ لا ترخيص: القاطع في الحارس، وهذا لا يمنح ما يمنعه.
          required="L3"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            required="L5"
          fi
          python scripts/ci/sot_provenance_guard.py             --manifest live_pg_canonical_manifest.json             --policy docs/architecture/sot_provenance_policy.json             --bundle live_pg_evidence.attestation.json             --trusted-root live_pg_trusted_root.jsonl             --artifact-file live_pg_evidence.json             --artifact-file live_pg_evidence.xml             --artifact-file live_pg_role_closure.json             --artifact-file live_pg_canonical_manifest.json             --artifact-file live_pg_evidence.sha256             --artifact-file live_pg_evidence.attestation.json             --artifact-file live_pg_trusted_root.jsonl             --artifact-file live_pg_verification_record.json             --required-assurance "$required"             --output live_pg_verification_record.json
      # **قناتان مفصولتان لأنّ الغرضين مختلفان — والخلط بينهما يُسقِط أحدهما.**
      # حفظُ القياس ليس إثباتَ المنشأ: الأوّل يمنع «وظيفةٌ خضراء بلا دليل»، والثاني
      # يمنع «حزمةٌ توحي بمنشأ لم يُثبَت». وربطُ الرفع بنجاح التوقيع يشتري الثانية
      # بثمن الأولى: PR من fork يُتخطّى فيه التوقيع (لا رمز كاتب)، فتُتخطّى معه
      # المصنوعة كلّها — **وظيفةٌ خضراء بصفر دليل**، وهو الصنف بعينه الذي كُتِبت هذه
      # الشريحة لمنعه. (وفشلُ التوقيع نفسه يُحمِر الوظيفة، فالثغرة في التخطّي وحده.)
      - name: Upload the live-PG evidence
        # الدليل الخام يُرفَع **دائماً** وبفشلٍ مغلق على الغياب. لا يدّعي منشأً:
        # `live_pg_evidence.sha256` سلامةٌ داخليّة فقط، والمنشأ في المصنوعة التالية.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-pg-evidence-${{ github.sha }}
          path: |
            live_pg_evidence.json
            live_pg_evidence.xml
            live_pg_role_closure.json
            live_pg_canonical_manifest.json
            live_pg_evidence.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload the signed provenance for the same evidence bytes
        # مصنوعةٌ منفصلة اسمُها يقول ما تحمله: وجودُها إثباتُ منشأ، وغيابُها غيابُه —
        # ولا يُقرأ غيابُها فقداناً للدليل. وهذا ما يجعل شرط التوقيع صادقاً بلا ثمن.
        if: always() && steps.live_pg_copy_attestation.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-pg-evidence-attestation-${{ github.sha }}
          path: live_pg_evidence.attestation.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload the verified evidence archive
        if: always() && steps.live_pg_copy_attestation.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-pg-verified-evidence-${{ github.sha }}
          path: |
            live_pg_evidence.json
            live_pg_evidence.xml
            live_pg_role_closure.json
            live_pg_canonical_manifest.json
            live_pg_evidence.sha256
            live_pg_evidence.attestation.json
            live_pg_trusted_root.jsonl
            live_pg_verification_record.json
          if-no-files-found: error
          retention-days: 90

  raster-service-tests:
    name: Raster Service Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/raster-service/requirements.txt
      # C7 is service-local: root pytest.ini only collects tests_v9, so without
      # an explicit raster job the scene-bound latest/cache contract is dormant.
      # Pillow تبعيّةُ **اختبارٍ** لا تشغيل: ثلاثة اختبارات تصيير (soil/terrain/truecolor)
      # تفكّ ترميز PNG الناتج للتحقّق منه، ولا يستوردها أيّ ملفّ إنتاجيّ في الخدمة —
      # فموضعها هنا لا في requirements.txt كي لا تُثقَل صورة الإنتاج بما لا تستعمله.
      - name: Install raster test dependencies
        run: pip install -r services/raster-service/requirements.txt pytest pytest-asyncio Pillow
      - name: Raster service unit/runtime contracts
        working-directory: services/raster-service
        env:
          PYTHONPATH: .
        run: pytest -q -p no:cacheprovider test_*.py

  security-scan:
    name: Security Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements_real.txt
            services/actuator-service/requirements.txt
            services/agriai-engine/requirements.txt
            services/auth/requirements.txt
            services/edge-inference/requirements.txt
            services/guardrails-engine/requirements.txt
            services/indicators-service/requirements.txt
            services/local-ai-rag/requirements.txt
            services/mcp_servers/requirements.txt
            services/odoo-bridge/requirements.txt
            services/qdrant-seed/requirements.txt
            services/raster-service/requirements.txt
            services/sahool-platform/api/requirements.txt
            services/soil-service/requirements.txt
            services/supervisor-agent/requirements.txt
            services/tts-service/requirements.txt
            services/vegetation-analysis-service/requirements.txt
            services/video-processor/requirements.txt
            services/weather-service/requirements.txt
      - run: pip install bandit pip-audit pytest python-jose httpx pytest-asyncio "pydantic[email]" bcrypt redis asyncpg PyJWT
      # بوّابة أمان: تفشل على HIGH severity (تنفيذ كود/تشفير ضعيف/حقن) — صُحّحت إلى 0.
      - run: bandit -r services/ bots/ agents/ --severity-level high
      # فحص MEDIUM إرشادي (يُعرَض للمراجعة، لا يحجب): timeouts/bind-all/random… غالباً مقبولة بالسياق.
      - name: bandit medium (advisory)
        run: bandit -r services/ bots/ agents/ --severity-level medium -q || true
        continue-on-error: true
      # بوّابة سلسلة الإمداد (supply chain): pip-audit يفشل CI على تبعيّة بثغرة
      # معروفة في المسار الحرج (المصادقة/الصلاحيات/وقت التشغيل). كانت safety
      # تُثبَّت ولا تُشغَّل أبداً ⇒ لا فحص تبعيّات مفروض (الفجوة المعياريّة #٧).
      # هذه الملفّات مُتحقَّقة نظافتها؛ فشلها لاحقاً = تبعيّة جديدة ضعيفة دخلت.
      # توسعة C1: البوّابة كانت تفحص ٤ مسارات فقط فتفلت خدمات كاملة. وُسِّعت لتشمل
      # كلّ ملفات requirements الحقيقيّة، بما فيها local-ai-rag بعد نقل تكاملات
      # LangChain إلى خط 1.x الآمن؛ لا يجوز إعادة الخدمة إلى المسح الإرشادي فقط.
      # استثناء موثّق واحد (PYSEC-2026-1325 في ecdsa 0.19.2): تبعيّة عبوريّة أساسيّة
      # لـpython-jose. ثغرة قناة-جانبيّة (Minerva timing) صنّفها صانعو ecdsa WONTFIX
      # صراحةً (لا نسخة إصلاح — 0.19.2 هي الأحدث 2026-03-26؛ README يوصي بـpyca/
      # cryptography بديلاً). مسارنا يستعمل python-jose[cryptography] ⇒ توقيع/تحقّق JWT
      # عبر خلفيّة cryptography/OpenSSL لا خلفيّة ecdsa، فالمسار المُصاب غير مُستخدَم.
      # يبقى ecdsa مرئيّاً في المسح الإرشاديّ أدناه (غير حاجب) للشفافيّة.
      - name: pip-audit (gating — critical path)
        run: >-
          pip-audit
          --ignore-vuln PYSEC-2026-1325
          -r services/sahool-platform/api/requirements.txt
          -r services/auth/requirements.txt
          -r services/guardrails-engine/requirements.txt
          -r requirements_real.txt
          -r services/actuator-service/requirements.txt
          -r services/agriai-engine/requirements.txt
          -r services/edge-inference/requirements.txt
          -r services/indicators-service/requirements.txt
          -r services/local-ai-rag/requirements.txt
          -r services/mcp_servers/requirements.txt
          -r services/odoo-bridge/requirements.txt
          -r services/qdrant-seed/requirements.txt
          -r services/raster-service/requirements.txt
          -r services/soil-service/requirements.txt
          -r services/supervisor-agent/requirements.txt
          -r services/tts-service/requirements.txt
          -r services/vegetation-analysis-service/requirements.txt
          -r services/video-processor/requirements.txt
          -r services/weather-service/requirements.txt
          --progress-spinner off
      # مسح إرشادي شامل: يكشف ثغرات بقيّة الخدمات (مثلاً RAG: pypdf/langchain —
      # إصلاحها خارج سقوف توافق langchain، يحتاج ترقية متعمّدة) دون حجب الدمج.
      - name: pip-audit (advisory — all services)
        run: |
          for f in $(find services bots agents -name 'requirements*.txt'); do
            echo "── $f ──"; pip-audit -r "$f" --progress-spinner off || true
          done
        continue-on-error: true
      # M12 FIX: الملف اسمه requirements_real.txt — السابق (requirements.txt)
      # غير موجود فكان || true يبتلعه دائماً وتبقى تبعيّات وقت التشغيل ناقصة.
      - run: pip install -r requirements_real.txt
        continue-on-error: true
      - run: pytest -v -m security tests_v9/test_security.py tests_v9/test_auth_service.py -k "security"
      # بوّابة مسار الكتابة في RLS (المرحلة 22): تحرس أنّ كلّ سياسة كتابة tenant
      # تحمل WITH CHECK، وتمنع أيّ ترحيل لاحق (>v122) من إعادة إدخال سياسة كتابة
      # tenant بـUSING-only أو باستخدام app.tenant_id دون app.current_tenant القانونيّ.
      - name: RLS write-policy gate (Phase 22)
        run: |
          python3 scripts/security/validate_rls_write_policies.py --root .
          pytest -q tests/security/test_phase22_rls_with_check_backfill.py
      # FII Safety Increment 1C: fail-closed tenant-write ratchet on NEW migrations
      # (>v191 + the forward fail-closed migrations) + the FII security-gate tests.
      # The historical migrations are superseded at runtime by v192/v194; their live
      # posture is proven by the integration test, not this static ratchet.
      - name: FII RLS safety gates (Increment 1C)
        run: |
          python3 scripts/ci/fii_rls_write_policy_gate.py --root .
          pytest -q tests/security/test_fii_rls_role_gate.py tests/security/test_fii_chemical_chain_rls_gate.py

  flutter-analyze:
    name: Flutter Analyze & Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.27.4"  # Dart 3.6.2 — تتطلّبه flutter_map_mbtiles ^1.0.4 (≥3.6.0)
          channel: stable
          cache: true
      # بوّابة فحص الموبايل: كانت غائبة تماماً (Dart يُشحَن بلا أيّ فحص — لا analyze
      # ولا test في CI). تحجب على الأخطاء الحقيقيّة (errors) وفشل الاختبارات فقط؛
      # infos/warnings الأسلوبيّة لا تحجب (--no-fatal-*) كي لا يُعطَّل الدمج على لينت
      # أسلوبيّ. هذا يجعل كلّ عمل Flutter لاحق مفحوصاً قبل الدمج.
      - run: flutter pub get
        working-directory: mobile/sahool_app
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: mobile/sahool_app
      - run: flutter test
        working-directory: mobile/sahool_app

