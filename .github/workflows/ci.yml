name: SAHOOL v9.1.0 CI

on: [push, pull_request]

jobs:
  structural-lint:
    name: Repository Structural Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: service-feature-ui-contract-gate
        run: python scripts/ci/service_feature_ui_contract_gate.py

      # عقد backend⇒frontend بالاتّجاهين (core⇒دليل + لا مسار مواجِه فالت/إعفاء بائت)
      - name: endpoint-ui-coverage-gate
        run: python scripts/ci/endpoint_ui_coverage_gate.py

      - name: indicators-registry-gate
        run: python scripts/ci/indicators_registry_gate.py

      - name: indicators-frontend-manifest-sync
        run: python scripts/ci/generate_indicators_frontend_manifest.py --check

      # RIV: السجلّ القانونيّ ⇒ كتالوج المنصّة + قدرات vegetation المولَّدان
      - name: indicators-generated-artifacts-sync
        run: python scripts/ci/generate_indicator_artifacts.py --check

      - name: raster-indicators-vegetation-boundary-gate
        run: |
          python scripts/ci/riv_boundary_gate.py
          python scripts/ci/vegetation_runtime_truth_guard.py
          python scripts/ci/raster_production_truth_guard.py

      # الدماغ لا يحسب طيفيّاً ولا يجلب من المزوّد مباشرة ولا يصل فيزيائيّاً إلا عبر Decision-Service
      - name: intelligence-governance-brain-gate
        run: python scripts/ci/intelligence_governance_gate.py

      - name: weather-engine-formula-guard
        run: python scripts/ci/weather_engine_formula_guard.py

      - name: crop-intelligence-boundary-gate
        run: python scripts/ci/crop_intelligence_boundary_gate.py

      # WX-10.6: crop→decision candidate path stays a reviewable candidate, never execution
      - name: decision-candidate-boundary-gate
        run: python scripts/ci/decision_candidate_boundary_gate.py

      # WAIVER-EXPIRY-GUARD: fail once any time-boxed governance waiver has expired
      - name: waiver-expiry-guard
        run: python scripts/ci/waiver_expiry_guard.py

      # WX-10.7: reviewer/decision path stays a state transition, never execution
      - name: decision-review-boundary-gate
        run: python scripts/ci/decision_review_boundary_gate.py

      # WX-10.7: while decision_record is interim-bridge (mirror), the review must fail closed
      - name: decision-review-ownership-consistency-gate
        run: python scripts/ci/decision_review_ownership_consistency_gate.py

      # WX-10.7 SoR-promotion cutover-prep: the cutover toolkit/docs must stay review-aware
      - name: decision-sor-review-cutover-gate
        run: python scripts/ci/decision_sor_review_cutover_gate.py

      # WS-E: canonical-product consumers must delegate to the Views + carry lineage (no recompute)
      - name: consumer-contract-gate
        run: python scripts/ci/consumer_contract_gate.py

      # WX-10.9..10.12: the post-approval execution chain stays a state transition, never execution
      - name: WX-10.10 dispatch authorization boundary guard
        run: python scripts/ci/dispatch_authorization_boundary_gate.py
      - name: WX-10.11a execution request boundary guard
        run: python scripts/ci/execution_request_boundary_gate.py
      - name: WX-10.11b execution delivery receipt boundary guard
        run: python scripts/ci/execution_delivery_receipt_boundary_gate.py
      - name: WX-10.12 execution outcome boundary guard
        run: python scripts/ci/execution_outcome_boundary_gate.py

      # WX-10.13..11.6 model/MLOps governance chain stays a state transition, never execution
      - name: WX-10.13 learning attribution boundary guard
        run: python scripts/ci/learning_attribution_boundary_gate.py
      - name: WX-11.1 calibration dataset boundary guard
        run: python scripts/ci/calibration_dataset_boundary_gate.py
      - name: WX-11.2 model evaluation boundary guard
        run: python scripts/ci/model_evaluation_boundary_gate.py
      - name: WX-11.3 model promotion decision boundary guard
        run: python scripts/ci/model_promotion_decision_boundary_gate.py
      - name: WX-11.4 model activation request boundary guard
        run: python scripts/ci/model_activation_request_boundary_gate.py
      - name: WX-11.5 model activation approval boundary guard
        run: python scripts/ci/model_activation_approval_boundary_gate.py
      - name: WX-11.6 model registry activation boundary guard
        run: python scripts/ci/model_registry_activation_boundary_gate.py

      # WX-11.7..11.12 closed-loop completion: rollback receipt/verify/rollout/monitor/retrain stay
      # append-only evidence transitions — never train/activate/actuate.
      - name: WX-11.7..11.12 closed-loop completion guard
        run: python scripts/ci/wx11_closed_loop_completion_gate.py

      # WX-12 runtime adapter: the model-registry-adapter is a governed runtime consumer
      # (compare-and-swap active state, verify, rollout, monitor, dispatch retraining) — it
      # must never train/actuate/publish; required files + Dockerfile must exist.
      - name: WX-12 runtime completion guard
        run: python scripts/ci/wx12_runtime_completion_gate.py
      - name: WX-12 runtime certification guard
        run: python scripts/ci/wx12_runtime_certification_gate.py
      # WX-12.3: monitoring/reconcile scheduling must stay durable + actually emitted by the feed
      - name: WX-12.3 runtime scheduler guard
        run: python scripts/ci/wx12_runtime_scheduler_gate.py
      # WX-12 multitenancy: worker→tenant partitioning stays server-authorized (no free header)
      - name: WX-12 runtime multitenancy guard
        run: python scripts/ci/wx12_runtime_multitenancy_gate.py
      # AC-1: agronomic context contracts stay canonical + point-in-time fail-closed
      - name: AC-1 agronomic context gate
        run: python scripts/ci/agronomic_context_gate.py
      - name: canonical soil profile contract gate
        run: python scripts/ci/soil_profile_contract_guard.py
      - name: canonical soil evidence store gate
        run: python scripts/ci/soil_canonical_store_guard.py
      - name: canonical soil full-chain gate
        run: python scripts/ci/soil_full_chain_guard.py
      - name: durable soil lab projection gate
        run: python scripts/ci/soil_lab_projection_guard.py
      - name: soil runtime certification guard
        run: python scripts/ci/soil_runtime_certification_guard.py
      - name: soil projection and reconciliation guard
        run: python scripts/ci/soil_projection_reconciliation_guard.py
      - name: soil projection observability guard
        run: python scripts/ci/soil_projection_observability_guard.py
      - name: soil supersession and current pointer guard
        run: python scripts/ci/soil_supersession_current_pointer_guard.py
      - name: soil lab supersession lineage guard
        run: python scripts/ci/soil_lab_supersession_lineage_guard.py
      - name: soil P1 governed products guard
        run: python scripts/ci/soil_p1_products_guard.py
      - name: soil P2 spatial products guard
        run: python scripts/ci/soil_p2_products_guard.py
      - name: soil P3 assessment products guard
        run: python scripts/ci/soil_p3_products_guard.py
      - name: soil P4 closed-loop guard
        run: python scripts/ci/soil_p4_closed_loop_guard.py
      - name: soil P5 certification guard
        run: python scripts/ci/soil_p5_certification_guard.py
      - name: soil P6 runtime certification guard
        run: python scripts/ci/soil_p6_runtime_certification_guard.py
      - name: no unresolved merge-conflict markers (repo-wide)
        run: python scripts/ci/no_merge_conflict_markers_guard.py
      - name: irrigation MPC — Ky no-economic-coupling guard
        run: python scripts/ci/ky_no_economic_coupling_guard.py
      - name: irrigation MPC — bridge lineage-propagation guard
        run: python scripts/ci/mpc_lineage_propagation_guard.py
      # V21 irrigation engineering program (M2.1–M5): additive domain-contract ratchets. These are
      # static presence/shape guards over the canonical irrigation kernels + migrations v168–v181
      # (renumbered +1; v167 taken by MPC content_digest). Kernels are NOT yet mounted into runtime
      # routes (bridge/execution stay default-off) — the guards pin the contracts, not live wiring.
      - name: irrigation M2.1 engineering foundation guard
        run: python scripts/ci/irrigation_engineering_m2_1_guard.py
      - name: irrigation M2.2 root-zone hydraulic guard
        run: python scripts/ci/irrigation_root_zone_m2_2_guard.py
      - name: irrigation M2.3 well digital-twin guard
        run: python scripts/ci/irrigation_well_digital_twin_m2_3_guard.py
      - name: irrigation M2.4 hydraulic capability guard
        run: python scripts/ci/irrigation_hydraulic_m2_4_guard.py
      - name: irrigation M2.5 machine capability guard
        run: python scripts/ci/irrigation_machine_m2_5_guard.py
      - name: irrigation M2.6 sprinkler/runoff guard
        run: python scripts/ci/irrigation_sprinkler_m2_6_guard.py
      - name: irrigation M2.7 energy microgrid guard
        run: python scripts/ci/irrigation_energy_m2_7_guard.py
      - name: irrigation M2.8 capability graph guard
        run: python scripts/ci/irrigation_capability_graph_m2_8_guard.py
      - name: irrigation M2.9 controller-edge guard
        run: python scripts/ci/irrigation_controller_edge_m2_9_guard.py
      - name: irrigation M2.10 commissioning guard
        run: python scripts/ci/irrigation_commissioning_m2_10_guard.py
      - name: irrigation M2.11 as-applied guard
        run: python scripts/ci/irrigation_as_applied_m2_11_guard.py
      - name: irrigation M3 hourly MPC guard
        run: python scripts/ci/irrigation_hourly_mpc_m3_guard.py
      - name: irrigation M4 VRI prescription guard
        run: python scripts/ci/irrigation_vri_m4_guard.py
      - name: irrigation M5 closed-loop certification guard
        run: python scripts/ci/irrigation_closed_loop_m5_guard.py
      - name: IRR-X1 vendor-neutral engineering workspace guard
        run: python scripts/ci/irrx1_vendor_neutral_guard.py
      - name: IRR-X1.1 digital commissioning runtime guard
        run: python scripts/ci/irrx1_commissioning_runtime_guard.py
      - name: IRR-X1.2 manual execution lifecycle guard
        run: python scripts/ci/irrx1_manual_execution_guard.py
      - name: IRR-X1.3 verified manual as-applied ledger guard
        run: python scripts/ci/irrx1_verified_manual_ledger_guard.py
      - name: IRR-X1.4 farmer manual operations UI guard
        run: python scripts/ci/irrx1_farmer_manual_operations_ui_guard.py
      - name: IRR-PCERT database truth guard
        run: python scripts/ci/irrx1_pcert_guard.py
      - name: IRR-X1.5 authoritative recommendation provenance guard
        run: python scripts/ci/irrx1_authoritative_provenance_guard.py
      - name: IRR-X1.6 operator-declared manual volume guard
        run: python scripts/ci/irrx1_6_manual_volume_guard.py
      # WX-I1 runtime: server-owned hourly MPC orchestrator (recommendation-only) + the durable
      # measured-as-applied → water-ledger reconciliation return path (v184) must stay wired.
      - name: irrigation runtime orchestrator guard
        run: python scripts/ci/irrigation_runtime_orchestrator_guard.py
      - name: irrigation closed-loop runtime guard
        run: python scripts/ci/irrigation_closed_loop_runtime_guard.py
      # Forensic 2026-07-14 (F-01/F-02/F-08): irrigation migrations must use canonical fail-closed
      # RLS — no fail-open WITH CHECK, no non-canonical app.current_tenant_id, idempotent policies.
      - name: irrigation RLS canonical (fail-closed) guard
        run: python scripts/ci/irrigation_rls_canonical_guard.py
      # P0-fix bundle: DB-owned immutable recommendation content-lineage (v182/v183) + JWT/secret
      # configuration hardening (RSA keypair validation + fallback full-tree secret scan).
      - name: decision content-lineage v183 hardening guard
        run: python scripts/ci/decision_lineage_v183_guard.py
      - name: JWT and secret configuration guard
        run: python scripts/ci/jwt_secret_configuration_guard.py
      # VEG-AGRIAI completion: vegetation stays real-source-honest and agriai-engine stays
      # context-bound (delivered increment; its dedicated workflow only runs on main/PR paths,
      # so enforce the structural contract on every push here too).
      - name: vegetation-agriai completion gate
        run: python scripts/ci/vegetation_agriai_completion_gate.py
      - name: vegetation-agriai production gate
        run: python scripts/ci/vegetation_agriai_production_gate.py
      - name: vegetation-agriai full closure gate
        run: python scripts/ci/vegetation_agriai_full_closure_gate.py
      # AC-6/AC-6.1: direct agronomic lineage + tenant-safe DB-level evidence integrity
      - name: AC-6 agronomic decision lineage gate
        run: python scripts/ci/agronomic_decision_lineage_gate.py
      - name: AC-6.1 agronomic lineage integrity gate
        run: python scripts/ci/agronomic_lineage_integrity_gate.py
      # AC-9→terminal: the agronomic evidence/cohort lineage must keep propagating through
      # learning → calibration → evaluation → promotion → activation → runtime → terminal
      # receipts, and no synthetic vegetation value may reach a serving path.
      - name: AC-9 agronomic learning lineage gate
        run: python scripts/ci/agronomic_learning_lineage_gate.py
      - name: agronomic model lifecycle lineage gate
        run: python scripts/ci/agronomic_model_lifecycle_lineage_gate.py
      - name: agronomic runtime lineage gate
        run: python scripts/ci/agronomic_runtime_lineage_gate.py
      - name: agronomic runtime terminal lineage gate
        run: python scripts/ci/agronomic_runtime_terminal_lineage_gate.py
      - name: production truth readiness gate
        run: python scripts/ci/production_truth_readiness_gate.py
      # Phase C: the no-leakage certification surface (randomized PIT property sweep +
      # composer-independent DB row invariants + fail-closed staging runner) stays intact.
      - name: no-leakage certification gate
        run: python scripts/ci/no_leakage_certification_gate.py

      - name: design-token-contrast-gate
        run: python scripts/ci/design_token_contrast_gate.py

      - name: nginx-compose-dns-gate
        run: python scripts/ci/nginx_compose_dns_gate.py

      - name: service-port-gate
        run: python scripts/ci/service_port_gate.py

      - name: minio-s3-contract-gate
        run: python scripts/ci/minio_s3_contract_gate.py

      - name: compose-env-contract-gate
        run: python scripts/ci/compose_env_contract_gate.py

      - name: backfill-ui-sync-gate
        run: python scripts/ci/backfill_ui_sync_gate.py

      - name: runtime-contract-gate
        run: python scripts/ci/runtime_contract_gate.py

      - name: runtime-readiness-contract-gate
        run: python scripts/ci/runtime_readiness_contract_gate.py

      - name: raster-main-decomposition-gate
        run: python scripts/ci/raster_main_decomposition_gate.py

      - name: raster-import-graph-gate
        run: python scripts/ci/raster_import_graph_gate.py

      # يُشغَّل هنا ضمن فحص الفرع (لا في push إلى main فقط) كي يُلتقَط انحراف
      # المخزون قبل الدمج/التقديم، لا بعده — مرآة لبوّابة service-inventory-drift.yml.
      - name: service-inventory-drift-gate
        run: python scripts/ci/generate_service_inventory.py --check

      # المخزونان المُولَّدان لـmain.py المنصّة/تركيب الراوترات كانا يُفحَصان في مسارَي
      # main فقط (platform-main-subinventory.yml · runtime_real_smoke) فينحرفان بعد الـFF
      # لا قبله. نُدرِجهما هنا في فحص الفرع (pre-FF) اتّساقاً مع «المخزون ضمن الفحص لا بعده».
      - name: platform-main-subinventory-drift-gate
        run: python scripts/ci/platform_main_subinventory_guard.py --check
      - name: route-mount-inventory-drift-gate
        run: python scripts/ci/route_mount_contract_guard.py --check

      # يمنع رجوع خطّافات FastAPI المهجورة (@app.on_event) — يُلزِم lifespan واحداً
      # مُرتَّباً (بدء/إيقاف صريحان) فتبقى تحذيرات الإهمال غائبة. يُشغَّل في فحص الفرع (pre-FF).
      - name: fastapi-lifespan-guard
        run: python scripts/ci/fastapi_lifespan_guard.py

      # WX-I1: يُلزِم منتج ETc الساعيّ القانونيّ (ET0 مُزوَّد-أصليّ من المحرّك، Kc مُحقَن،
      # مطر فعّال، بصمة محتوى) موصولاً end-to-end (منتج · جلب · مسار · عميل · مستهلِك M3)
      # بلا نواة ET0 محلّيّة ولا تفكيك زمنيّ يوميّ. يُشغَّل في فحص الفرع (pre-FF).
      - name: weather-hourly-etc-wx-i1-guard
        run: python scripts/ci/weather_hourly_etc_wx_i1_guard.py

      - name: v9-feature-transfer-gate
        run: python scripts/ci/v9_feature_transfer_gate.py

      - name: v9-gpu-contract-gate
        run: python scripts/ci/v9_gpu_contract_gate.py

      - name: Detect bash glob artifacts in paths
        run: |
          # المراجعة الخارجيّة كشفت ١٤ مجلد بأسماء {bots, {services, {migrations,services...}
          # كان السبب: mkdir -p '{a,b}' بدون quoting صحيح
          # هذا الـcheck يمنع التكرار
          set -e
          ARTIFACTS=$(find . -name '*{*' -o -name '*}*' 2>/dev/null | grep -v node_modules | grep -v '.git/' || true)
          if [ -n "$ARTIFACTS" ]; then
            echo "❌ Bash glob artifacts detected (likely from unquoted mkdir):"
            echo "$ARTIFACTS"
            echo ""
            echo "Fix: rm -rf the offending paths, ensure mkdir uses quotes: mkdir -p \"a/b\""
            exit 1
          fi
          echo "✓ No bash glob artifacts found"
      - name: Detect empty directories (potential scaffold leftovers)
        run: |
          # تحذير (ليس fatal) للـempty dirs
          EMPTY=$(find . -type d -empty 2>/dev/null | grep -v node_modules | grep -v '.git/' | grep -v __pycache__ || true)
          if [ -n "$EMPTY" ]; then
            echo "⚠ Empty directories found (consider removing):"
            echo "$EMPTY"
          else
            echo "✓ No empty directories"
          fi

  platform-structure-inspector:
    name: Platform Structure Inspector
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      # PyYAML مطلوب لفحص عقد ناشري الأحداث (event_publish_contracts.yaml): H2 publisher
      # coverage + waiver «منشور بلا مشترِك». بدونه يفشل الفحص بـModuleNotFoundError.
      - run: pip install PyYAML
      - run: python3 tools/sahool_inspector.py

  compose-validate:
    name: Validate Docker Compose
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate all compose files
        run: |
          set -e
          # env وهمي حتى لا تفشل قراءة متغيّرات ${VAR:?required} أثناء التحقّق فقط
          python3 - <<'EOF'
          import glob, re
          vs = set()
          for f in glob.glob("docker-compose*.yml"):
              vs |= set(re.findall(r'\$\{([A-Z0-9_]+)', open(f).read()))
          open(".ci.env", "w").write("\n".join(f"{v}=dummy_{v.lower()}_0123456789abcdef" for v in sorted(vs)) + "\n")
          EOF
          for f in docker-compose*.yml; do
            echo "─── Validating $f ───"
            # odoo-snippet مقتطف (fragment) يُلصق داخل compose آخر، وليس ملفّاً مستقلاً.
            # rag-kg-mcp تراكُب (overlay) يُشغَّل مع v9 (يعتمد qdrant/ollama/الشبكة من الأساس)
            # فلا يصحّ التحقّق منه مستقلّاً.
            # soil-strict تراكُب إنتاجيّ (overlay) يحمل environment فقط لخدمات مُعرَّفة في
            # الأساس (v9)، فلا image/build فيه ⇒ لا يصحّ standalone؛ يُطبَّق فوق v9 بعد الشهادة.
            if [ "$f" = "docker-compose.odoo-snippet.yml" ] || [ "$f" = "docker-compose.rag-kg-mcp.yml" ] || [ "$f" = "docker-compose.v9.gpu.yml" ] || [ "$f" = "docker-compose.soil-strict.yml" ]; then echo "↷ skip (fragment/overlay)"; continue; fi
            # 1. YAML syntax
            python3 -c "import yaml; yaml.safe_load(open('$f'))"
            # 2. Compose schema (docker compose config) مع env وهمي
            docker compose --env-file .ci.env -f "$f" config --quiet || {
              echo "❌ $f failed compose schema validation"
              exit 1
            }
            echo "✓ $f valid"
          done
          echo "─── Validating docker-compose.v9.yml + docker-compose.v9.gpu.yml overlay ───"
          python3 -c "import yaml; yaml.safe_load(open('docker-compose.v9.gpu.yml'))"
          docker compose --env-file .ci.env -f docker-compose.v9.yml -f docker-compose.v9.gpu.yml --profile gpu config --quiet || {
            echo "❌ v9 GPU overlay failed compose schema validation"
            exit 1
          }
          echo "✓ v9 GPU overlay valid"
      - name: Check for orphaned depends_on blocks
        run: |
          # Defensive: catch the "nats: { condition... }" outside services pattern
          # that broke v9.yml previously.
          if grep -E '^  [a-z_-]+:\s*\{ condition:' docker-compose*.yml | \
             grep -v "depends_on" > /tmp/orphaned.txt; then
            if [ -s /tmp/orphaned.txt ]; then
              echo "❌ Orphaned depends_on entries detected:"
              cat /tmp/orphaned.txt
              exit 1
            fi
          fi
          echo "✓ No orphaned depends_on entries"

  lint:
    name: Lint & Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      # المشروع موحّد على ruff (ruff.toml): يغطّي lint + تنسيق + ترتيب الاستيراد،
      # فاستُبدل black/isort بـ`ruff format --check` لتطابق التنسيق المعتمد.
      # ثبّت إصدار ruff: `pip install ruff` (طليق) يجلب أحدث إصدار، وقواعد التنسيق
      # تتغيّر بين الإصدارات ⇒ تنسيق محلّيّ سليم يفشل في CI لا لشيء سوى انجراف الإصدار
      # (حدث فعلاً: ملفّ «already formatted» محلّيّاً صار «would reformat» في CI).
      # التثبيت يجعل التنسيق حتميّاً وقابلاً لإعادة الإنتاج محلّيّاً. حدّثه عمداً عند الرغبة.
      - run: pip install ruff==0.15.8 mypy
      - run: ruff check services/ bots/ agents/ tests_v9/
      - run: ruff format --check services/ bots/ agents/ tests_v9/
      # بوّابة مانيفست الإصدار على الفرع أيضاً (لا main-only فقط): تعديل ملفّ مشمول
      # بالمانيفست دون إعادة بناء checksums كان يمرّ على الفرع ثمّ يفشل على main في
      # «Sahool Production Gates». تشغيلها هنا يلتقط الانحراف قبل الدمج لا بعده.
      - name: Release manifest checksum gate (mirror of main-only production gate)
        run: python3 scripts/release/validate_release_package.py --root .
      # mypy إرشادي: أسماء مجلّدات الخدمات مُشرطَنة (services/guardrails-engine)
      # ليست أسماء حزم بايثون صالحة، والتغطية النوعيّة الكاملة ليست بوّابة إلزاميّة بعد.
      - name: mypy (advisory)
        run: mypy services/auth/main.py --ignore-missing-imports --explicit-package-bases
        continue-on-error: true

  frontend-typecheck:
    name: Frontend Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: "20"}
      # بوّابة فحص نوعيّ للواجهة: كانت غائبة تماماً، فتراكمت أخطاء TS صامتة (مثل
      # ضياع user_id في login). tsc --noEmit يكشفها قبل الدمج. لا يبني الإنتاج
      # (vite build لا يفحص الأنواع) — هذا الفحص مكمّل له.
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend

  frontend-e2e:
    name: Frontend E2E (Playwright · MapLibre/WebGL QA)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: "20"}
      # بوّابة QA الوظيفيّة لمحرّك MapLibre/WebGL على Chromium حقيقيّ (SwiftShader).
      # هرمسيّة: لا خلفيّة — التركيبات تُعترَض في طبقة Playwright (e2e/support/seed.ts).
      # الـconfig يبني الواجهة بـVITE_MAP_ENGINE=maplibre ويُشغّل preview على :4173.
      # الخطوتان البصريّتان الصرفتان (٧ إزاحة المؤشّر، ٩ تطابق leaflet↔maplibre)
      # مُعلَّمتان @visual ومُخطّاتان (test.fixme) ⇒ تُتخطّى تلقائيّاً، فلا تحجب.
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -r tests_v9/requirements-test.txt
      - run: pytest -v -m unit --cov=services --cov-report=xml --cov-report=term
      # بوّابة تغطية حقيقيّة (A1): في بيئة الوحدة الدنيا (بلا fastapi/خدمات) تبلغ
      # تغطية اختبارات الوحدة لـservices ~44.55% فعليّاً (قياس 2026-07 بنفس أمر CI
      # وبنفس التبعيّات الدنيا؛ نَمَت من ~24% السابقة). الأرضيّة 40% (هامش ~4.5 نقطة
      # دون المقيس) — راتشِت غير-كاسر يمنع الانحدار ويصعد فقط.
      # ratchet: 20→40 (2026-07)؛ ارفعها نحو 55 مع نموّ التغطية. راجع
      # docs/testing/coverage_ratchet.md للخطّة المرحليّة والتفصيل حسب النطاق.
      - name: Coverage gate (fail-under)
        run: pytest -m unit --cov=services --cov-fail-under=40 -q || (echo "التغطية انهارت دون الأرضيّة 40%" && exit 1)
      - uses: codecov/codecov-action@v4
        with: {files: coverage.xml}

  platform-unit-tests:
    name: Platform Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      # اختبارات منطق المنصّة (services/sahool-platform/tests) كانت خارج نطاق CI
      # كلّيّاً: pytest.ini يحصر testpaths في tests_v9، فلم تُجمَع هذه الاختبارات
      # (~١٢٨٢، منطق صرف بلا قاعدة/خدمات) ولم تُشغَّل قطّ رغم نجاحها. هذه الوظيفة
      # تشغّلها فعليّاً من جذر المنصّة (PYTHONPATH=.) لتغطية حقيقيّة في CI.
      # Pillow: ملفّان (test_bivariate_raster/test_raster_export) يستوردان PIL
      # عبر core.spatial.raster_export — تبعيّة خفيفة (بلا GDAL) للإبقاء عليهما.
      - run: pip install -r tests_v9/requirements-test.txt -r services/sahool-platform/api/requirements.txt pillow
      # بوّابة تغطية "ratchet" غير-كاسرة: تُقاس حزمتا api/core، والأرضيّة في
      # .coveragerc مضبوطة عند المقيس الحاليّ (٦١٫٩٢٪) ناقص هامش ⇒ fail_under=60.
      # لا تُفشل CI اليوم؛ يمكنها الصعود فقط (تُرفع الأرضيّة مع نموّ التغطية).
      - name: Run platform pure-logic tests (no DB/services) + coverage ratchet
        working-directory: services/sahool-platform
        run: >-
          PYTHONPATH=. pytest tests -q -p no:cacheprovider
          --cov=api --cov=core --cov-config=.coveragerc
          --cov-report=term --cov-report=xml

  weather-service-unit-tests:
    name: Weather Service Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      # اختبارات محرّك الطقس (services/weather-service/tests) كانت خارج نطاق CI:
      # الوظيفة الجذر «Unit Tests» تحصر testpaths في tests_v9، و«Platform Unit Tests»
      # تشغّل sahool-platform فقط — فلم تُجمَع اختبارات ET0/VPD/vapor_pressure الكنسيّة
      # (C.1a/C.1b) قطّ رغم نجاحها محليّاً. هذه الوظيفة تُشغّلها فعليّاً (TestClient،
      # بلا شبكة/قاعدة) لتصبح عقود الجودة الكنسيّة (fao56-pm/vpd) مُحكَّمة في CI.
      - run: pip install -r services/weather-service/requirements.txt pytest pytest-asyncio
      - name: Run weather-service pure-logic + route tests (no network/DB)
        working-directory: services/weather-service
        run: PYTHONPATH=. pytest tests -q -p no:cacheprovider

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-24.04
    # ملاحظة: لا نستخدم `services:` لـPostgres/Redis لأنّ GitHub يسحب صورها عند
    # بدء المهمّة بثلاث محاولات سريعة فقط ⇒ فشل متكرّر حين يتباطأ/يُقيّد Docker Hub
    # (registry-1.docker.io: context deadline exceeded). بدلاً منها نُدير الحاويات
    # يدويّاً بإعادة سحب مرنة (٦ محاولات backoff) — نفس الصور والمنافذ تماماً.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      # مرآة سجلّ Docker Hub (Google mirror.gcr.io تعكس Hub كاملاً بما فيه postgis/postgis):
      # أوثق بكثير من Hub المباشر — تُنهي رفرفة «registry-1.docker.io: timeout» التي تُعطّل السحب.
      # تبقى الـ٦ محاولات أدناه خطّ دفاع ثانٍ. (إعادة إصلاح #538 الذي ضاع في إعادة كتابة main.)
      - name: Configure Docker registry mirror (avoid Docker Hub flakes)
        run: |
          echo '{"registry-mirrors":["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: Start Postgres+PostGIS and Redis (resilient pull)
        run: |
          set -e
          pull() {
            for i in 1 2 3 4 5 6; do
              docker pull "$1" && return 0
              echo "pull $1 فشل (محاولة $i) — backoff"; sleep $((i * 10))
            done
            echo "::error::تعذّر سحب $1 بعد ٦ محاولات"; return 1
          }
          pull postgis/postgis:15-3.4
          pull redis:7-alpine
          docker run -d --name sahool-pg \
            -e POSTGRES_DB=sahool_test -e POSTGRES_USER=sahool_test \
            -e POSTGRES_PASSWORD=test_password -p 5433:5432 postgis/postgis:15-3.4
          docker run -d --name sahool-redis -p 6380:6379 redis:7-alpine
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5433 -U sahool_test && break
            echo "بانتظار Postgres ($i)"; sleep 2
          done
          pg_isready -h localhost -p 5433 -U sahool_test
      - run: pip install -r tests_v9/requirements-test.txt
      # تطبيق مخطّط الترحيلات على قاعدة الاختبار قبل اختبارات التكامل (RLS/DB)،
      # وإلّا تفشل الاختبارات التي تُدرج في field_boundaries/ndvi_timeseries… (الجداول غير موجودة).
      - name: Apply migrations to test DB
        env:
          PGPASSWORD: test_password
        run: |
          while read -r f; do
            case "$f" in ''|\#*) continue;; esac
            psql -h localhost -p 5433 -U sahool_test -d sahool_test -v ON_ERROR_STOP=1 -f "migrations/$f"
          done < <(grep -vE '^\s*#|^\s*$' migrations/MANIFEST.txt)
      - env:
          TEST_DATABASE_URL: postgresql://sahool_test:test_password@localhost:5433/sahool_test
          TEST_REDIS_URL: redis://localhost:6380/0
          JWT_SECRET: test_secret_min_32_chars_for_sahool_v9
        run: pytest -v -m integration --tb=short

  decision-service-tests:
    name: Decision Service Tests
    runs-on: ubuntu-24.04
    # WX-10.7: decision-service owns the authoritative review transition (state machine + append
    # -only audit + concurrency). Its tests need a real Postgres (the concurrency race + DB-level
    # append-only cannot be faked) — this job is their CI home. Same resilient-pull pattern as
    # Integration Tests (manual docker run + backoff instead of `services:`).
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Configure Docker registry mirror (avoid Docker Hub flakes)
        run: |
          echo '{"registry-mirrors":["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: Start Postgres (resilient pull)
        run: |
          set -e
          pull() {
            for i in 1 2 3 4 5 6; do
              docker pull "$1" && return 0
              echo "pull $1 فشل (محاولة $i) — backoff"; sleep $((i * 10))
            done
            echo "::error::تعذّر سحب $1 بعد ٦ محاولات"; return 1
          }
          pull postgres:15
          docker run -d --name ds-pg \
            -e POSTGRES_DB=decision_test -e POSTGRES_USER=decision_test \
            -e POSTGRES_PASSWORD=test_password -p 5434:5432 postgres:15
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5434 -U decision_test && break
            echo "بانتظار Postgres ($i)"; sleep 2
          done
          pg_isready -h localhost -p 5434 -U decision_test
      # PyJWT + prometheus-client: required by vegetation_runtime, imported by the
      # vegetation-agriai contract step below (pure logic, but module-level imports).
      - run: pip install -r services/decision-service/requirements.txt asyncpg pytest pytest-asyncio httpx PyJWT prometheus-client
      - name: Apply decision-service migrations (custom runner — 001 through 026)
        env:
          DATABASE_URL: postgresql://decision_test:test_password@localhost:5434/decision_test
          DECISION_SERVICE_ALLOW_SCHEMA_CHANGE: "true"
        run: python services/decision-service/migration_runner.py --apply
      - name: Migration idempotency (re-apply is a no-op / --check clean)
        env:
          DATABASE_URL: postgresql://decision_test:test_password@localhost:5434/decision_test
          DECISION_SERVICE_ALLOW_SCHEMA_CHANGE: "true"
        run: python services/decision-service/migration_runner.py --check
      # Mirror-mode contract (SoR OFF): the interim mirror sink must never claim persistence.
      # No DATABASE_URL / flag on this step ⇒ sor_enabled() is false ⇒ honest mirror behaviour.
      - name: Decision-service mirror-mode contract (SoR off)
        working-directory: services/decision-service
        run: pytest tests/test_p4_decision_service_runtime.py -q -p no:cacheprovider
      # WX-10.7 review transition (SoR ON + real Postgres): state machine + concurrency race +
      # append-only + idempotency. Separate step so SoR env never leaks into the mirror contract.
      - name: WX-10.7 review tests (real Postgres, SoR on)
        working-directory: services/decision-service
        env:
          DATABASE_URL: postgresql://decision_test:test_password@localhost:5434/decision_test
          DECISION_SERVICE_SOR_ENABLED: "true"
        run: pytest tests/test_wx10_7_decision_review.py -q -p no:cacheprovider
      # WX-10.8 review-queue endpoint (monkeypatched: authoritative + tenant-scoped + fail-closed
      # 503 in mirror). No DB needed — runs here because this job has fastapi + pytest-asyncio.
      - name: WX-10.8 review-queue endpoint tests
        working-directory: services/decision-service
        run: pytest tests/test_wx10_8_review_queue.py -q -p no:cacheprovider
      # WX-10.9..10.12 post-approval execution chain (real Postgres, SoR on): each stage is an
      # authoritative append-only transition (plan -> authorize -> execute request -> delivery
      # receipt -> outcome verify), concurrency + idempotency proven on real Postgres.
      - name: WX-10.9 execution-plan tests (real Postgres, SoR on)
        working-directory: services/decision-service
        env:
          DATABASE_URL: postgresql://decision_test:test_password@localhost:5434/decision_test
          DECISION_SERVICE_SOR_ENABLED: "true"
        run: pytest tests/test_wx10_9_execution_plan.py -q -p no:cacheprovider
      - name: WX-10.10 dispatch-authorization tests (real Postgres, SoR on)
        working-directory: services/decision-service
        env:
          DATABASE_URL: postgresql://decision_test:test_password@localhost:5434/decision_test
          DECISION_SERVICE_SOR_ENABLED: "true"
        run: pytest tests/test_wx10_10_dispatch_authorization.py -q -p no:cacheprovider
      - name: WX-10.11 execution-request and delivery-receipt tests (real Postgres, SoR on)
        working-directory: services/decision-service
        env:
          DATABASE_URL: postgresql://decision_test:test_password@localhost:5434/decision_test
          DECISION_SERVICE_SOR_ENABLED: "true"
        run: pytest tests/test_wx10_11_execution_request.py tests/test_wx10_11b_execution_delivery_receipt.py -q -p no:cacheprovider
      - name: WX-10.12 execution outcome tests (real Postgres, SoR on)
        working-directory: services/decision-service
        env:
          DATABASE_URL: postgresql://decision_test:test_password@localhost:5434/decision_test
          DECISION_SERVICE_SOR_ENABLED: "true"
        run: pytest tests/test_wx10_12_execution_outcome.py -q -p no:cacheprovider
      # WX-10.13..11.6 model/MLOps governance chain (real Postgres, SoR on): each stage is an
      # authoritative append-only transition (learning-attribution -> calibration-dataset ->
      # model-evaluation -> promotion-decision -> activation-request -> activation-approval ->
      # registry-activation/receipt/rollback), concurrency + idempotency proven on real Postgres.
