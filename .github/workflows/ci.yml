          DECISION_SERVICE_SOR_ENABLED: "true"
        run: pytest tests/test_wx12_3_runtime_schedules.py -q -p no:cacheprovider
      # AC-1 agronomic context (real Postgres, SoR on): composer determinism + PIT rejection +
      # mandatory decision binding + append-only.
      - name: AC-1 agronomic context tests (real Postgres, SoR on)
        working-directory: services/decision-service
        env:
