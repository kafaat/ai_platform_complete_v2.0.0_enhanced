        working-directory: services/decision-service
        run: pytest ../agriai-engine/tests/test_agronomic_context_contract.py ../agriai-engine/tests/test_agronomic_adapters.py ../agriai-engine/tests/test_production_readiness_truth.py ../vegetation-analysis-service/test_vegetation_production_contract.py ../vegetation-analysis-service/test_timeseries_honesty.py ../vegetation-analysis-service/test_indicator_registry.py ../vegetation-analysis-service/test_production_truth_closure.py ../vegetation-analysis-service/test_evidence_producer_contract.py -q -p no:cacheprovider
      # WX-12 model-registry-adapter runtime is stdlib-only pure logic (drift classification,
      # bounded backoff, compare-and-swap decision). The contract test additionally imports the
      # decision-service app (fastapi is installed in this job) and replays every request the
      # runtime/worker emit, so URL/header/body drift fails here every push.
      # actuator dispatch-consumer pure logic (plan/risk/tenants + wiring guard) — was
      # previously never exercised by CI (latent break after the P2 decomposition).
      - name: actuator dispatch-consumer pure tests
        working-directory: services/actuator-service
        run: pytest test_dispatch_bridge.py -q -p no:cacheprovider
      - name: WX-12 model-registry-adapter runtime + contract tests
        working-directory: services/decision-service
        env:
          DATABASE_URL: postgresql://decision_test:test_password@localhost:5434/decision_test
        run: pytest ../model-registry-adapter/tests -q -p no:cacheprovider

  security-scan:
    name: Security Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install bandit pip-audit pytest python-jose httpx pytest-asyncio "pydantic[email]" bcrypt redis asyncpg PyJWT
      # بوّابة أمان: تفشل على HIGH severity (تنفيذ كود/تشفير ضعيف/حقن) — صُحّحت إلى 0.
      - run: bandit -r services/ bots/ agents/ --severity-level high
      # فحص MEDIUM إرشادي (يُعرَض للمراجعة، لا يحجب): timeouts/bind-all/random… غالباً مقبولة بالسياق.
      - name: bandit medium (advisory)
        run: bandit -r services/ bots/ agents/ --severity-level medium -q || true
        continue-on-error: true
      # بوّابة سلسلة الإمداد (supply chain): pip-audit يفشل CI على تبعيّة بثغرة
      # معروفة في المسار الحرج (المصادقة/الصلاحيات/وقت التشغيل). كانت safety
      # تُثبَّت ولا تُشغَّل أبداً ⇒ لا فحص تبعيّات مفروض (الفجوة المعياريّة #٧).
      # هذه الملفّات مُتحقَّقة نظافتها؛ فشلها لاحقاً = تبعيّة جديدة ضعيفة دخلت.
      # توسعة C1: البوّابة كانت تفحص ٤ مسارات فقط فتفلت خدمات كاملة. وُسِّعت لتشمل
      # كلّ ملفّات requirements الحقيقيّة المُتحقَّق خلوّها من ثغرات معروفة (فُحصت
      # فعليّاً بـpip-audit، كلّها نظيفة). يُستثنى services/local-ai-rag/requirements.txt
      # عمداً: يحمل ثغرة out-of-range (PYSEC-2026-77 في langchain-text-splitters،
      # وقيود langchain 0.3.x/pypdf) — يبقى تحت المسح الإرشاديّ أدناه لا البوّابة.
      # استثناء موثّق واحد (PYSEC-2026-1325 في ecdsa 0.19.2): تبعيّة عبوريّة أساسيّة
      # لـpython-jose. ثغرة قناة-جانبيّة (Minerva timing) صنّفها صانعو ecdsa WONTFIX
      # صراحةً (لا نسخة إصلاح — 0.19.2 هي الأحدث 2026-03-26؛ README يوصي بـpyca/
      # cryptography بديلاً). مسارنا يستعمل python-jose[cryptography] ⇒ توقيع/تحقّق JWT
      # عبر خلفيّة cryptography/OpenSSL لا خلفيّة ecdsa، فالمسار المُصاب غير مُستخدَم.
      # يبقى ecdsa مرئيّاً في المسح الإرشاديّ أدناه (غير حاجب) للشفافيّة.
      - name: pip-audit (gating — critical path)
        run: >-
          pip-audit
          --ignore-vuln PYSEC-2026-1325
          -r services/sahool-platform/api/requirements.txt
          -r services/auth/requirements.txt
          -r services/guardrails-engine/requirements.txt
          -r requirements_real.txt
          -r services/actuator-service/requirements.txt
          -r services/agriai-engine/requirements.txt
          -r services/edge-inference/requirements.txt
          -r services/indicators-service/requirements.txt
          -r services/mcp_servers/requirements.txt
          -r services/odoo-bridge/requirements.txt
          -r services/qdrant-seed/requirements.txt
          -r services/raster-service/requirements.txt
          -r services/soil-service/requirements.txt
          -r services/supervisor-agent/requirements.txt
          -r services/tts-service/requirements.txt
          -r services/vegetation-analysis-service/requirements.txt
          -r services/video-processor/requirements.txt
          -r services/weather-service/requirements.txt
          --progress-spinner off
      # مسح إرشادي شامل: يكشف ثغرات بقيّة الخدمات (مثلاً RAG: pypdf/langchain —
      # إصلاحها خارج سقوف توافق langchain، يحتاج ترقية متعمّدة) دون حجب الدمج.
      - name: pip-audit (advisory — all services)
        run: |
          for f in $(find services bots agents -name 'requirements*.txt'); do
            echo "── $f ──"; pip-audit -r "$f" --progress-spinner off || true
          done
        continue-on-error: true
      # M12 FIX: الملف اسمه requirements_real.txt — السابق (requirements.txt)
      # غير موجود فكان || true يبتلعه دائماً وتبقى تبعيّات وقت التشغيل ناقصة.
      - run: pip install -r requirements_real.txt
        continue-on-error: true
      - run: pytest -v -m security tests_v9/test_security.py tests_v9/test_auth_service.py -k "security"
      # بوّابة مسار الكتابة في RLS (المرحلة 22): تحرس أنّ كلّ سياسة كتابة tenant
      # تحمل WITH CHECK، وتمنع أيّ ترحيل لاحق (>v122) من إعادة إدخال سياسة كتابة
      # tenant بـUSING-only أو باستخدام app.tenant_id دون app.current_tenant القانونيّ.
      - name: RLS write-policy gate (Phase 22)
        run: |
          python3 scripts/security/validate_rls_write_policies.py --root .
          pytest -q tests/security/test_phase22_rls_with_check_backfill.py

  flutter-analyze:
    name: Flutter Analyze & Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"  # Dart 3.6.2 — تتطلّبه flutter_map_mbtiles ^1.0.4 (≥3.6.0)
          channel: stable
          cache: true
      # بوّابة فحص الموبايل: كانت غائبة تماماً (Dart يُشحَن بلا أيّ فحص — لا analyze
      # ولا test في CI). تحجب على الأخطاء الحقيقيّة (errors) وفشل الاختبارات فقط؛
      # infos/warnings الأسلوبيّة لا تحجب (--no-fatal-*) كي لا يُعطَّل الدمج على لينت
      # أسلوبيّ. هذا يجعل كلّ عمل Flutter لاحق مفحوصاً قبل الدمج.
      - run: flutter pub get
        working-directory: mobile/sahool_app
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: mobile/sahool_app
      - run: flutter test
        working-directory: mobile/sahool_app

