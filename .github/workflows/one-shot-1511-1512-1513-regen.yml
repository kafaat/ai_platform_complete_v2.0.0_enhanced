# One-shot consolidation regeneration. Self-removes before final artifact verification.
name: One-shot consolidation artifact regeneration 1511-1512-1513
on:
  push:
    branches:
      - consolidate/pr-1511-1512-1513-20261117
permissions:
  contents: write
jobs:
  regenerate:
    if: github.ref == 'refs/heads/consolidate/pr-1511-1512-1513-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install repository test tooling
        run: pip install -r tests_v9/requirements-test.txt
      - name: Reconcile tracked generated outputs, remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm '.github/workflows/one-shot-1511-1512-1513-regen.yml'
          git add -A
          python scripts/ci/verify_all_generated.py --fix
          git add -A
          python scripts/ci/verify_all_generated.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(generated): reconcile PR 1511, 1512, 1513 [regen]'
          git push origin HEAD:'consolidate/pr-1511-1512-1513-20261117'
