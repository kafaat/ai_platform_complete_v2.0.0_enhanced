name: auth-main-decomposition

on:
  pull_request:
  push:
    branches: [ main, develop ]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Auth main decomposition guard
        run: python scripts/ci/auth_main_decomposition_guard.py
