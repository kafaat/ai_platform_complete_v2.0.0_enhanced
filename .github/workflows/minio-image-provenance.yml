name: MinIO Image Provenance

# MINIO-MIRROR-PROVENANCE-UNVERIFIED-01. The MinIO image pinned in `.env.example` and the
# compose files is not MinIO's: an unsigned SLSA record inside the pinned index claims that
# coollabsio's CI cloned github.com/minio/minio at the release tag and ran `go build` with a
# recipe unlike MinIO's own (no kqueue tag, one -X value instead of seven). So MinIO's
# published checksum is not expected to match, and a mismatch there would prove nothing.
# What tests the bytes is rebuilding the authenticated source with the same pinned toolchain
# and flags and comparing byte for byte — whoever built the pinned image. The pinned binary
# is only the artifact under test, never an input to the rebuild.
#
# Scope of a positive result, and nothing wider: "The independently rebuilt linux/amd64 MinIO
# server matches the server extracted from the specified pinned image." Not arm64, not mc,
# not the rest of the image. Embedded build info is recorded as a supplement; the sha256
# comparison is the test.
#
# Every stage records itself, and the result is one of three: match, mismatch, or
# not_measured (a pull, download or compile failure is not a binary mismatch, and missing
# output is never read as success). The evidence is uploaded whatever the result.
#
# This is evidence, not a gate: contents:read only, it builds and publishes no image, changes
# no pin, and is not a required check on `main` (docs/architecture/
# required_status_checks_contract.json, the live rules) nor a needs-dependency of any job. A
# red run blocks nothing by itself; making it required would be a separate governance change.
# Whether to use a self-built image is also separate, and would prove a new artifact, not
# this one.
#
# Inputs come from the measurement in certification/evidence/minio_mirror_provenance_20261011.json.

on:
  pull_request:
    paths:
      - .github/workflows/minio-image-provenance.yml
      - certification/evidence/minio_mirror_provenance_*.json
      - scripts/ci/minio_s3_contract_gate.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}-{2}', github.workflow, github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  minio-rebuild:
    name: MinIO server rebuild vs pinned image (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PINNED_IMAGE: coollabsio/minio:2025-04-22T22-12-26Z@sha256:a4938f37f1be1841b8e7b627ad0207b265345fd0d063e42d7410c78af0e63e68
      PINNED_AMD64_MANIFEST: sha256:d8cfccee3f7bf0182d89c223b2ff53b94c9a88237bc0dd5733dd49fa0f4dab4c
      PINNED_SHA256: fc3c2ecce583d33ef14485495f91d816492abad564cc3268139a90720775bb64
      BUILDER_IMAGE: golang:1.24-alpine@sha256:8f8959f38530d159bf71d0b3eb0c547dc61e7959d8225d1599cf762477384923
      MINIO_REPO: https://github.com/minio/minio.git
      MINIO_TAG: RELEASE.2025-04-22T22-12-26Z
      MINIO_COMMIT: 0d7408fc9969caf07de6a8c3a84f9fbb10a6739e
      BUILD_FLAGS: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/minio/minio/cmd.ReleaseTag=$MINIO_TAG"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Start the evidence record
        run: |
          set -euo pipefail
          mkdir -p out
          echo not_measured > out/verdict.txt
          echo pin-check > out/stage.txt
          git rev-parse HEAD > out/sahool_checkout_sha.txt

      - name: "Stage pin-check: the image under test is the image the repository pins"
        run: |
          set -euo pipefail
          pinned="$(sed -n 's/^MINIO_IMAGE=//p' .env.example)"
          if [ "$pinned" != "$PINNED_IMAGE" ]; then
            echo "::error::.env.example pins '$pinned' but this job verifies '$PINNED_IMAGE'. A new pin needs its own attestation read and its own commit, toolchain and expected hash here."
            exit 1
          fi

      - name: "Stage pull: the pinned index, its linux/amd64 manifest, and the recorded builder"
        run: |
          set -euo pipefail
          echo pull > out/stage.txt
          docker buildx imagetools inspect --raw "$PINNED_IMAGE" > out/index.json
          python3 - <<'INDEX'
          import hashlib
          import json
          import os

          raw = open("out/index.json", "rb").read()
          want = os.environ["PINNED_IMAGE"].rsplit("@", 1)[1]
          # the digest is over the registry's exact bytes; a printer may add one newline
          candidates = {raw, raw[:-1] if raw.endswith(b"\n") else raw}
          got = sorted("sha256:" + hashlib.sha256(c).hexdigest() for c in candidates)
          if want not in got:
              raise SystemExit(f"::error::index bytes hash to {got}, the pin says {want} (an error body from the registry, e.g. a 429, also lands here)")
          amd64 = [m["digest"] for m in json.loads(raw)["manifests"]
                   if m.get("platform", {}).get("os") == "linux" and m.get("platform", {}).get("architecture") == "amd64"]
          if amd64 != [os.environ["PINNED_AMD64_MANIFEST"]]:
              raise SystemExit(f"::error::linux/amd64 entries in the pinned index: {amd64}")
          print("index", got, "linux/amd64", amd64[0])
          INDEX
          bash scripts/ci/resilient_docker_pull.sh "coollabsio/minio@$PINNED_AMD64_MANIFEST" 2>&1 | tee out/pull.log
          bash scripts/ci/resilient_docker_pull.sh "$BUILDER_IMAGE" 2>&1 | tee -a out/pull.log

      - name: "Stage extract: the server binary from the pinned linux/amd64 manifest"
        run: |
          set -euo pipefail
          echo extract > out/stage.txt
          cid="$(docker create "coollabsio/minio@$PINNED_AMD64_MANIFEST")"
          docker cp "$cid:/usr/bin/minio" out/minio.pinned
          docker rm "$cid" >/dev/null
          sha256sum out/minio.pinned | cut -d' ' -f1 > out/pinned_sha256.txt
          if [ "$(cat out/pinned_sha256.txt)" != "$PINNED_SHA256" ]; then
            echo "::error::the extracted binary is $(cat out/pinned_sha256.txt), not the $PINNED_SHA256 measured on 2026-10-11 — the comparison would test something else"
            exit 1
          fi

      - name: "Stage rebuild: the release commit with the recorded toolchain and flags"
        run: |
          set -euo pipefail
          echo rebuild > out/stage.txt
          docker run --rm -i --platform linux/amd64 \
            -e MINIO_REPO -e MINIO_TAG -e MINIO_COMMIT \
            -v "$PWD/out:/out" "$BUILDER_IMAGE" sh -eu <<'BUILD' 2>&1 | tee out/build.log
          apk add -U --no-cache git >/dev/null
          git --version > /out/git_version.txt
          go version > /out/go_version.txt
          go env GOVERSION GOOS GOARCH GOAMD64 CGO_ENABLED GOFLAGS GOPROXY GOSUMDB GONOSUMDB GOPRIVATE GOTOOLCHAIN > /out/go_env.txt
          git clone -q --depth 1 --branch "$MINIO_TAG" "$MINIO_REPO" /workspace
          cd /workspace
          git rev-parse HEAD > /out/upstream_commit.txt
          test "$(cat /out/upstream_commit.txt)" = "$MINIO_COMMIT"
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/minio/minio/cmd.ReleaseTag=$MINIO_TAG" -o /out/minio.rebuilt .
          go mod verify > /out/go_mod_verify.txt 2>&1
          go version -m /out/minio.rebuilt > /out/buildinfo.rebuilt.txt
          go version -m /out/minio.pinned > /out/buildinfo.pinned.txt
          BUILD

      - name: "Stage compare: byte for byte"
        run: |
          set -euo pipefail
          echo compare > out/stage.txt
          sha256sum out/minio.rebuilt | cut -d' ' -f1 > out/rebuilt_sha256.txt
          if [ "$(cat out/rebuilt_sha256.txt)" = "$(cat out/pinned_sha256.txt)" ]; then
            echo match > out/verdict.txt
          else
            echo mismatch > out/verdict.txt
          fi

      - name: Record the result
        if: ${{ !cancelled() }}
        env:
          RUN_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_EVENT: ${{ github.event_name }}
          RUN_WORKFLOW_REF: ${{ github.workflow_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'RECORD'
          import json
          import os
          from pathlib import Path

          out = Path("out")

          def text(name):
              p = out / name
              return p.read_text(encoding="utf-8").strip() if p.is_file() else None

          def info(name):
              t = text(name)
              return t.splitlines()[1:] if t else None  # the first line only names the file

          verdict = text("verdict.txt") or "not_measured"
          stage = text("stage.txt")
          compared = ("pinned_sha256.txt", "rebuilt_sha256.txt", "buildinfo.pinned.txt", "buildinfo.rebuilt.txt",
                      "build.log", "go_version.txt", "go_env.txt", "git_version.txt", "upstream_commit.txt",
                      "go_mod_verify.txt", "index.json", "pull.log", "sahool_checkout_sha.txt")
          missing = [n for n in compared if not (out / n).is_file()]
          reason = None
          if verdict in ("match", "mismatch") and missing:
              reason = f"comparison reported {verdict} but evidence is incomplete: missing {missing}"
              verdict = "not_measured"
          if verdict == "not_measured" and reason is None:
              reason = f"no comparison was made; the last stage started was {stage!r}"
          claims = {
              "match": "The independently rebuilt linux/amd64 MinIO server matches the server extracted from the specified pinned image.",
              "mismatch": "The independently rebuilt linux/amd64 MinIO server differs from the server extracted from the specified pinned image; provenance stays unproven. A difference is not by itself evidence of tampering — compare the build infos and inputs.",
              "not_measured": "No comparison was made; nothing is claimed about the pinned server binary.",
          }
          bi_p, bi_r = info("buildinfo.pinned.txt"), info("buildinfo.rebuilt.txt")
          record = {
              "evidence_id": "MINIO-REBUILD-COMPARISON",
              "gap_id": "MINIO-MIRROR-PROVENANCE-UNVERIFIED-01",
              "verdict": verdict,
              "claim": claims[verdict],
              "scope": "linux/amd64 /usr/bin/minio only — not arm64, not mc, not the rest of the image",
              "reason": reason,
              "failed_stage": stage if verdict == "not_measured" else None,
              "sahool": {
                  "checked_out_sha": text("sahool_checkout_sha.txt"),
                  "pr_head_sha": os.environ.get("PR_HEAD_SHA") or None,
                  "event": os.environ["RUN_EVENT"],
                  "workflow_ref": os.environ["RUN_WORKFLOW_REF"],
                  "repository": os.environ["RUN_REPOSITORY"],
                  "run_id": os.environ["RUN_ID"],
                  "run_attempt": os.environ["RUN_ATTEMPT"],
              },
              "artifact_under_test": {
                  "pinned_image": os.environ["PINNED_IMAGE"],
                  "linux_amd64_manifest": os.environ["PINNED_AMD64_MANIFEST"],
                  "path": "/usr/bin/minio",
                  "sha256": text("pinned_sha256.txt"),
                  "expected_sha256": os.environ["PINNED_SHA256"],
              },
              "rebuild_inputs": {
                  "source": os.environ["MINIO_REPO"],
                  "tag": os.environ["MINIO_TAG"],
                  "expected_commit": os.environ["MINIO_COMMIT"],
                  "checked_out_commit": text("upstream_commit.txt"),
                  "builder_image": os.environ["BUILDER_IMAGE"],
                  "platform": "linux/amd64",
                  "build": os.environ["BUILD_FLAGS"],
                  "go_version": text("go_version.txt"),
                  "go_env": text("go_env.txt"),
                  "git_version": text("git_version.txt"),
                  "go_mod_verify": text("go_mod_verify.txt"),
                  "network_provisioned": "git via apk (affects no output: build info records only the commit), Go modules from proxy.golang.org checked against the source's go.sum and sum.golang.org",
              },
              "rebuilt_sha256": text("rebuilt_sha256.txt"),
              "buildinfo_equal": (bi_p == bi_r) if bi_p is not None and bi_r is not None else None,
              "buildinfo_only_in_pinned": [x for x in (bi_p or []) if x not in (bi_r or [])],
              "buildinfo_only_in_rebuilt": [x for x in (bi_r or []) if x not in (bi_p or [])],
              "evidence_files_missing": missing,
          }
          (out / "verdict.txt").write_text(verdict + "\n", encoding="utf-8")
          (out / "minio_rebuild_result.json").write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"### MinIO server rebuild: `{verdict}`\n\n{record['claim']}\n\n")
              summary.write(f"- artifact under test `{record['artifact_under_test']['sha256']}`\n")
              summary.write(f"- rebuilt `{record['rebuilt_sha256']}`\n")
              summary.write(f"- build info equal: `{record['buildinfo_equal']}`\n")
              if reason:
                  summary.write(f"- {reason}\n")
          print(json.dumps(record, indent=2))
          RECORD

      - name: Keep the evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minio-rebuild-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/*.json
            out/*.txt
            out/*.log
          if-no-files-found: error
          retention-days: 90

      - name: Verdict
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if [ ! -f out/minio_rebuild_result.json ]; then
            echo "::error::NOT MEASURED — the result record was not written; nothing is claimed."
            exit 1
          fi
          verdict="$(cat out/verdict.txt 2>/dev/null || echo not_measured)"
          case "$verdict" in
            match)
              echo "MATCH — the independently rebuilt linux/amd64 MinIO server matches the server extracted from the specified pinned image."
              ;;
            mismatch)
              echo "::error::MISMATCH — the rebuilt linux/amd64 server differs from the pinned one; provenance stays unproven (not by itself evidence of tampering — see minio_rebuild_result.json)."
              exit 1
              ;;
            *)
              echo "::error::NOT MEASURED — no comparison was made (see failed_stage in minio_rebuild_result.json); nothing is claimed."
              exit 1
              ;;
          esac
