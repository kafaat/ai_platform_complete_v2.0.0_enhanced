name: raster-pixel-qa-indicator

on:
  pull_request:
    paths:
      - 'services/raster-service/**'
      - 'scripts/ci/raster_pixel_qa_indicator_guard.py'
      - 'tests_v9/test_raster_pixel_qa_indicator_guard.py'
      - '.github/workflows/raster-pixel-qa-indicator.yml'
  push:
    branches: [ main ]
    paths:
      - 'services/raster-service/**'
      - 'scripts/ci/raster_pixel_qa_indicator_guard.py'
      - 'tests_v9/test_raster_pixel_qa_indicator_guard.py'
      - '.github/workflows/raster-pixel-qa-indicator.yml'

# عبءُ أجهزة التشغيل: دفعٌ جديد إلى الـPR نفسه يلغي تشغيلَه الأقدم لهذا المسار (كـci.yml)؛ وأحداثُ
# غير الـPR مجموعتُها فريدة (run_id) فلا تُلغى ولا تُسلسَل — كلُّ دمجٍ إلى main يُفحص كاملاً.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}-{2}', github.workflow, github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    name: raster-pixel-qa-indicator / guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      # الاختبار يمرّ عبر conftest tests_v9 (httpx/pydantic/numpy) — بيئة الاختبار
      # القانونيّة إلزاميّة، لا مفسّراً عارياً (درس fresh-runner المُوثَّق).
      - name: Install test dependencies
        run: python -m pip install -r tests_v9/requirements-test.txt
      - name: Run raster pixel QA indicator guard
        run: |
          python scripts/ci/raster_pixel_qa_indicator_guard.py
          python -m pytest -q tests_v9/test_raster_pixel_qa_indicator_guard.py
