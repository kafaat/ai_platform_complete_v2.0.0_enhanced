name: raster-pixel-qa-indicator

on:
  pull_request:
    paths:
      - 'services/raster-service/**'
      - 'scripts/ci/raster_pixel_qa_indicator_guard.py'
      - 'tests_v9/test_raster_pixel_qa_indicator_guard.py'
      - '.github/workflows/raster-pixel-qa-indicator.yml'
  push:
    branches: [ main ]
    paths:
      - 'services/raster-service/**'
      - 'scripts/ci/raster_pixel_qa_indicator_guard.py'
      - 'tests_v9/test_raster_pixel_qa_indicator_guard.py'
      - '.github/workflows/raster-pixel-qa-indicator.yml'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # الاختبار يمرّ عبر conftest tests_v9 (httpx/pydantic/numpy) — بيئة الاختبار
      # القانونيّة إلزاميّة، لا مفسّراً عارياً (درس fresh-runner المُوثَّق).
      - name: Install test dependencies
        run: python -m pip install -r tests_v9/requirements-test.txt
      - name: Run raster pixel QA indicator guard
        run: |
          python scripts/ci/raster_pixel_qa_indicator_guard.py
          python -m pytest -q tests_v9/test_raster_pixel_qa_indicator_guard.py
