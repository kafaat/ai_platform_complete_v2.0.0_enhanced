name: GIS Workflow Service Gates

on:
  pull_request:
    paths:
      - 'services/gis-workflow-service/**'
      - '.github/workflows/gis-workflow-service-gates.yml'
  push:
    branches: [main]
    paths:
      - 'services/gis-workflow-service/**'
      - '.github/workflows/gis-workflow-service-gates.yml'

permissions:
  contents: read

# عبءُ أجهزة التشغيل: دفعٌ جديد إلى الـPR نفسه يلغي تشغيلَه الأقدم لهذا المسار (كـci.yml)؛ وأحداثُ
# غير الـPR مجموعتُها فريدة (run_id) فلا تُلغى ولا تُسلسَل — كلُّ دمجٍ إلى main يُفحص كاملاً.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}-{2}', github.workflow, github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gis-workflow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install gis-workflow-service dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/gis-workflow-service/requirements.txt pytest
      - name: pip-audit (gate — no known vulnerabilities on graphics deps)
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r services/gis-workflow-service/requirements.txt
      - name: Run gis-workflow-service tests
        run: PYTHONPATH=services/gis-workflow-service pytest services/gis-workflow-service/tests -q
