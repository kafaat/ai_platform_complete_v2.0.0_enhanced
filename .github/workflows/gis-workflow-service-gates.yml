name: GIS Workflow Service Gates

on:
  pull_request:
    paths:
      - 'services/gis-workflow-service/**'
      - '.github/workflows/gis-workflow-service-gates.yml'
  push:
    branches: [main]
    paths:
      - 'services/gis-workflow-service/**'
      - '.github/workflows/gis-workflow-service-gates.yml'

permissions:
  contents: read

jobs:
  gis-workflow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install gis-workflow-service dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/gis-workflow-service/requirements.txt pytest
      - name: pip-audit (gate — no known vulnerabilities on graphics deps)
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r services/gis-workflow-service/requirements.txt
      - name: Run gis-workflow-service tests
        run: PYTHONPATH=services/gis-workflow-service pytest services/gis-workflow-service/tests -q
