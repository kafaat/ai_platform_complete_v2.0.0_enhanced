name: runtime-container-deep-contract

on:
  pull_request:
    paths:
      - 'docker-compose.v9.yml'
      - 'agents/notification/**'
      - 'services/raster-service/**'
      - 'services/sahool-platform/api/requirements.txt'
      - 'scripts/ci/runtime_container_deep_contract_guard.py'
      - 'tests_v9/test_runtime_container_deep_contract_guard.py'
  push:
    branches: [ main ]
    paths:
      - 'docker-compose.v9.yml'
      - 'agents/notification/**'
      - 'services/raster-service/**'
      - 'services/sahool-platform/api/requirements.txt'
      - 'scripts/ci/runtime_container_deep_contract_guard.py'
      - 'tests_v9/test_runtime_container_deep_contract_guard.py'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      # conftest tests_v9 يستورد httpx ⇒ بيئة الاختبار الكاملة إلزاميّة (درس conftest).
      - run: python -m pip install -r tests_v9/requirements-test.txt
      - run: python scripts/ci/runtime_container_deep_contract_guard.py --check
      - run: pytest -q tests_v9/test_runtime_container_deep_contract_guard.py
