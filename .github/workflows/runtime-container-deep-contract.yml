name: runtime-container-deep-contract

on:
  pull_request:
    paths:
      - 'docker-compose.v9.yml'
      - 'agents/notification/**'
      - 'services/raster-service/**'
      - 'services/sahool-platform/api/requirements.txt'
      - 'scripts/ci/runtime_container_deep_contract_guard.py'
      - 'tests_v9/test_runtime_container_deep_contract_guard.py'
  push:
    branches: [ main ]
    paths:
      - 'docker-compose.v9.yml'
      - 'agents/notification/**'
      - 'services/raster-service/**'
      - 'services/sahool-platform/api/requirements.txt'
      - 'scripts/ci/runtime_container_deep_contract_guard.py'
      - 'tests_v9/test_runtime_container_deep_contract_guard.py'

# عبءُ أجهزة التشغيل: دفعٌ جديد إلى الـPR نفسه يلغي تشغيلَه الأقدم لهذا المسار (كـci.yml)؛ وأحداثُ
# غير الـPR مجموعتُها فريدة (run_id) فلا تُلغى ولا تُسلسَل — كلُّ دمجٍ إلى main يُفحص كاملاً.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}-{2}', github.workflow, github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    name: runtime-container-deep-contract / guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      # conftest tests_v9 يستورد httpx ⇒ بيئة الاختبار الكاملة إلزاميّة (درس conftest).
      - run: python -m pip install -r tests_v9/requirements-test.txt
      - run: python scripts/ci/runtime_container_deep_contract_guard.py --check
      - run: pytest -q tests_v9/test_runtime_container_deep_contract_guard.py
