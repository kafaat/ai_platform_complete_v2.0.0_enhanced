name: Build and verify recovered inspection delivery
on:
  push:
    branches: [ci/field-inspection-build-0d601b-db79cf6d]
permissions:
  contents: write
concurrency:
  group: field-inspection-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-preflight-retain:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BASE: db79cf6d33fb8adb900f049d742de229f8616d4b
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      REDIS_ACL_LIVE_REQUIRED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.14"
      - name: Verify exact recovered tree, merge pinned main and apply reviewed corrections
        shell: bash
        run: python build_candidate.py prepare
      - name: Verify scoped CSV whitespace policy with actual Git controls
        shell: bash
        run: python csv_whitespace_controls.py --receipt "$RUNNER_TEMP/inspection-build-evidence/csv-whitespace-controls-receipt.json"
      - name: Install project requirements and isolate temporary outputs
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/inspection-preflight-venv"
          "$RUNNER_TEMP/inspection-preflight-venv/bin/python" -m pip install \
            -r "$RUNNER_TEMP/inspection-source/tests_v9/requirements-test.txt" \
            -r "$RUNNER_TEMP/inspection-source/services/sahool-platform/api/requirements.txt"
          "$RUNNER_TEMP/inspection-preflight-venv/bin/python" -m pip check
          "$RUNNER_TEMP/inspection-preflight-venv/bin/python" -m pip freeze > "$RUNNER_TEMP/inspection-build-evidence/environment.txt"
          echo "$RUNNER_TEMP/inspection-preflight-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/inspection-preflight-venv" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/inspection-tmp" >> "$GITHUB_ENV"
          echo "PYTEST_DEBUG_TEMPROOT=$RUNNER_TEMP/inspection-pytest-tmp" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/inspection-cache" >> "$GITHUB_ENV"
          echo "RUFF_CACHE_DIR=$RUNNER_TEMP/inspection-cache/ruff" >> "$GITHUB_ENV"
          echo "COVERAGE_FILE=$RUNNER_TEMP/inspection-coverage" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/inspection-tmp" "$RUNNER_TEMP/inspection-pytest-tmp" "$RUNNER_TEMP/inspection-cache"
          free -m > "$RUNNER_TEMP/inspection-build-evidence/memory.txt"
          df -h "$RUNNER_TEMP" > "$RUNNER_TEMP/inspection-build-evidence/disk.txt"
      - name: Install Redis with the project's CI service isolation
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/inspection-source"
          bash scripts/ci/resilient_apt_install.sh redis-server
          sudo systemctl stop redis-server
          sudo systemctl disable redis-server
          redis-server --version | tee "$RUNNER_TEMP/inspection-build-evidence/redis-version.txt"
      - name: Regenerate officially and freeze the new candidate
        shell: bash
        run: python build_candidate.py generate
      - name: Preserve frozen candidate objects before the long preflight
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: inspection-source-freeze-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/inspection-build-evidence/candidate-recovery.pack
            ${{ runner.temp }}/inspection-build-evidence/build-state.json
            ${{ runner.temp }}/inspection-build-evidence/build-manifest.json
            ${{ runner.temp }}/inspection-build-evidence/brain-updates.json
            ${{ runner.temp }}/inspection-build-evidence/build_candidate.py
            ${{ runner.temp }}/inspection-build-evidence/generation-receipt.json
            ${{ runner.temp }}/inspection-build-evidence/functional-review-final.json
            ${{ runner.temp }}/inspection-build-evidence/exact-reconstruction.json
            ${{ runner.temp }}/inspection-build-evidence/merge-review.json
            ${{ runner.temp }}/inspection-build-evidence/source-pr-body.md
            ${{ runner.temp }}/inspection-build-evidence/source-corrections.json
            ${{ runner.temp }}/inspection-build-evidence/source-corrections-receipt.json
            ${{ runner.temp }}/inspection-build-evidence/functional-review-original.json
          if-no-files-found: error
          retention-days: 14
      - name: Run contiguous default complete preflight and PR-body gates
        shell: bash
        run: python build_candidate.py preflight
      - name: Retain verified objects on this temporary CI branch
        shell: bash
        run: python build_candidate.py retain
      - name: Preserve evidence including retention outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: inspection-build-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inspection-build-evidence
          if-no-files-found: error
          retention-days: 14
