name: Docker Build Matrix Verifier

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "critical, extended, or all"
        required: true
        default: "critical"
        type: choice
        options:
          - critical
          - extended
          - all
      skip_security:
        description: "Skip Trivy scan"
        required: false
        default: true
        type: boolean
  pull_request:
    paths:
      - "scripts/build-immutable.ps1"
      - "tests/architecture/test_immutable_build_wrapper_behaviour.py"
      - "services/raster-service/**"
      - "services/weather-service/**"
      - "services/edge-inference/**"
      - "services/sam2-inference/**"
      - "services/auth/**"
      - "services/sahool-platform/**"
      - "services/odoo-bridge/**"
      - ".github/workflows/docker-build-matrix-verifier.yml"
      - ".github/workflows/runtime-image-provenance.yml"
      - "scripts/ci/install_pinned_trivy.sh"
      - "scripts/ci/runtime_image_supply_chain_guard.py"
      - "scripts/ci/docker_build_matrix_verifier.py"
      - "docs/runbooks/DOCKER_BUILD_CHECKLIST_CRITICAL_AND_EXTENDED_SERVICES_20260710.md"
      - "tests_v9/test_docker_build_matrix_verifier_static.py"
      - "tests_v9/test_runtime_image_supply_chain_guard.py"

# أقلّ صلاحيّة (I5): قراءة المستودع فقط؛ أيّ وظيفة تحتاج أكثر تُعلنه على مستواها.
permissions:
  contents: read

# عبءُ أجهزة التشغيل: دفعٌ جديد إلى الـPR نفسه يلغي تشغيلَه الأقدم لهذا المسار (كـci.yml)؛ وأحداثُ
# غير الـPR مجموعتُها فريدة (run_id) فلا تُلغى ولا تُسلسَل — كلُّ دمجٍ إلى main يُفحص كاملاً.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}-{2}', github.workflow, github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-wrapper:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Exercise the Windows build wrapper with a recording Docker CLI
        run: python -m pytest -q tests/architecture/test_immutable_build_wrapper_behaviour.py -k powershell

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      # conftest tests_v9 يستورد httpx/pydantic دائماً ⇒ بيئة الاختبار الكاملة
      # إلزاميّة لا pytest وحده (درس fresh-runner + conftest المُوثَّق).
      - run: python -m pip install -r tests_v9/requirements-test.txt
      - name: Static verifier tests
        run: |
          python -m py_compile scripts/ci/docker_build_matrix_verifier.py
          python scripts/ci/runtime_image_supply_chain_guard.py
          python -m pytest -q \
            tests_v9/test_docker_build_matrix_verifier_static.py \
            tests_v9/test_runtime_image_supply_chain_guard.py

  docker-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Select mode
        id: mode
        env:
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "$INPUT_MODE" in
            all) args=--all ;;
            extended) args=--extended ;;
            critical) args=--critical ;;
            *) echo "::error::invalid mode"; exit 2 ;;
          esac
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - name: Install pinned Trivy for the requested scan
        if: ${{ !inputs.skip_security }}
        run: scripts/ci/install_pinned_trivy.sh
      - name: Docker build matrix verifier
        env:
          MODE_ARG: ${{ steps.mode.outputs.args }}
          SKIP_SECURITY: ${{ inputs.skip_security }}
          COMPOSE_ENV_FILES: ${{ runner.temp }}/matrix-compose.env
        run: |
          set -euo pipefail
          # Synthetic inputs for Compose's schema check only. Keep optional defaults
          # (including ports and image references) and Docker build arguments intact.
          python - <<'PY'
          import os, re
          from pathlib import Path
          compose = Path("docker-compose.v9.yml").read_text(encoding="utf-8")
          names = set(re.findall(r"(?<!\$)\$\{([A-Z0-9_]+)(?::?\?|\})", compose))
          Path(os.environ["COMPOSE_ENV_FILES"]).write_text(
              "".join(f"{name}=compose-probe\n" for name in sorted(names)), encoding="utf-8"
          )
          PY
          case "$MODE_ARG" in
            --all|--extended|--critical) ;;
            *) echo "::error::invalid mode argument"; exit 2 ;;
          esac
          case "$SKIP_SECURITY" in
            true) security_args=(--skip-security) ;;
            false) security_args=() ;;
            *) echo "::error::invalid skip_security value"; exit 2 ;;
          esac
          python scripts/ci/docker_build_matrix_verifier.py \
            "$MODE_ARG" \
            "${security_args[@]}" \
            --write
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-build-matrix-evidence
          path: certification/evidence/
