name: PR1521 mutation anchor proof and release refresh (one shot)
on:
  push:
    branches: [fix/prod-pest-ack-hotfix-20261117]
    paths: [.github/workflows/pr1521-mutation-proof-once.yml]
permissions:
  contents: write
concurrency:
  group: pr1521-mutation-proof-once
  cancel-in-progress: false
jobs:
  proof:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate mutation specification and regenerate bounded release receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/fix/prod-pest-ack-hotfix-20261117"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/pr1521-mutation-proof-once.yml
          python scripts/ci/guard_mutation_guard.py
          python scripts/ci/decision_lineage_graph.py --check
          python scripts/ci/execution_dependency_audit.py --check
          python scripts/release/build_release_bundle.py
          python scripts/release/validate_release_package.py
          git add -- release/FILE_CHECKSUMS.sha256 release/SAHOOL_RELEASE_MANIFEST_20260626.json release/SBOM_MINIMAL.json
          python - <<'PY'
          import subprocess
          allowed={".github/workflows/pr1521-mutation-proof-once.yml","release/FILE_CHECKSUMS.sha256","release/SAHOOL_RELEASE_MANIFEST_20260626.json","release/SBOM_MINIMAL.json"}
          changed=set(subprocess.check_output(["git","diff","--cached","--name-only"],text=True).splitlines())
          assert changed<=allowed,changed-allowed
          assert not subprocess.check_output(["git","diff","--name-only"],text=True).strip()
          print("bounded",sorted(changed))
          PY
          git diff --cached --check
          git commit -m "build(pest): attest restored governance mutation anchor"
          git push origin HEAD:refs/heads/fix/prod-pest-ack-hotfix-20261117
