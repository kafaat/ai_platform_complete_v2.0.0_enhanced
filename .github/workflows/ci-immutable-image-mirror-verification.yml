name: Immutable CI mirror verification

on:
  push:
    branches: [codex/ecr-ghcr-immutable-mirror-20261015]
    paths:
      - .github/workflows/ci-immutable-image-mirror-verification.yml
      - scripts/ci/pull_verified_ci_image.sh
      - scripts/ci/build_postgis_test_image.sh
      - tests_v9/test_ci_image_mirror.py
  pull_request:
    paths:
      - .github/workflows/ci-immutable-image-mirror-verification.yml
      - scripts/ci/pull_verified_ci_image.sh
      - scripts/ci/build_postgis_test_image.sh
      - .github/workflows/ci.yml
      - .github/workflows/notification-rollout.yml
      - .github/workflows/wx12-runtime-certification.yml
      - tests_v9/test_ci_image_mirror.py
      - tests_v9/test_resilient_docker_pull.py
      - tests/architecture/test_notification_rollout_postgres_image.py

permissions:
  contents: read
  packages: read

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number)
        || format('{0}-{1}-{2}', github.workflow, github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    name: Immutable Image Mirror Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install pytest PyYAML httpx 'PyJWT>=2.13.0'
      - name: Bash parse guards
        run: bash -n scripts/ci/resilient_docker_pull.sh scripts/ci/pull_verified_ci_image.sh scripts/ci/build_postgis_test_image.sh
      - name: Real workflow contracts with mocked Docker failures
        run: pytest -q tests_v9/test_ci_image_mirror.py tests_v9/test_resilient_docker_pull.py tests/architecture/test_notification_rollout_postgres_image.py

  live-mirror:
    name: Immutable Mirror Live Pull Proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Authenticate and require each of five exact-index mirrors
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mirror-proofs"
          images=(
            public.ecr.aws/docker/library/postgres@sha256:d4a8e1f88f475ee3e0137fa89d21ebc59f6c6ab16bf369ee92907607cc3455ae
            public.ecr.aws/docker/library/postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
            public.ecr.aws/docker/library/postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
            public.ecr.aws/docker/library/redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
            public.ecr.aws/docker/library/nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          )
          n=0
          for source in "${images[@]}"; do
            n=$((n + 1))
            id_file="$RUNNER_TEMP/mirror-proofs/$n.id"
            bash scripts/ci/pull_verified_ci_image.sh "$source" "$id_file" 2> "$RUNNER_TEMP/mirror-proofs/$n.log"
            grep -Fq 'CI_IMAGE_SOURCE=GHCR_VERIFIED_INDEX' "$RUNNER_TEMP/mirror-proofs/$n.log" || {
              echo "::error::GHCR proof not established for pin $n (ECR fallback does not count)" >&2
              exit 1
            }
            grep -Eq '^sha256:[a-f0-9]{64}$' "$id_file"
            echo "CI pinned mirror #$n: verified source OCI index, executable image ID"
          done
