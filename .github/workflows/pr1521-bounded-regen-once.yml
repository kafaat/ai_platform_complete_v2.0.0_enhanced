name: PR1521 bounded dependency and release regeneration (one shot)
on:
  push:
    branches:
      - fix/prod-pest-ack-hotfix-20261117
    paths:
      - .github/workflows/pr1521-bounded-regen-once.yml
permissions:
  contents: write
concurrency:
  group: pr1521-bounded-regeneration
  cancel-in-progress: false
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Regenerate only tracked dependency and release artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/fix/prod-pest-ack-hotfix-20261117"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/pr1521-bounded-regen-once.yml
          python scripts/ci/build_service_dependency_bundle.py
          python scripts/ci/service_dependency_conflict_guard.py
          python scripts/release/generate_dependency_sbom.py
          python scripts/release/build_release_bundle.py
          python scripts/ci/build_service_dependency_bundle.py --check
          python scripts/ci/service_dependency_conflict_guard.py --check
          python scripts/ci/decision_lineage_graph.py --check
          python scripts/ci/execution_dependency_audit.py --check
          python scripts/release/validate_release_package.py
          git add -- requirements.services.direct.lock dependency_conflicts.generated.json dependency_conflicts.csv release/SBOM_DEPENDENCIES.cdx.json release/FILE_CHECKSUMS.sha256 release/SAHOOL_RELEASE_MANIFEST_20260626.json release/SBOM_MINIMAL.json
          python - <<'PY'
          import subprocess
          allowed = {
              ".github/workflows/pr1521-bounded-regen-once.yml",
              "requirements.services.direct.lock",
              "dependency_conflicts.generated.json",
              "dependency_conflicts.csv",
              "release/SBOM_DEPENDENCIES.cdx.json",
              "release/FILE_CHECKSUMS.sha256",
              "release/SAHOOL_RELEASE_MANIFEST_20260626.json",
              "release/SBOM_MINIMAL.json",
          }
          changed = set(subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit("Unsafe generated paths: " + ", ".join(sorted(unexpected)))
          unstaged = subprocess.check_output(["git", "diff", "--name-only"], text=True).strip()
          if unstaged:
              raise SystemExit("Unstaged generator changes: " + unstaged)
          print("bounded paths:", ", ".join(sorted(changed)))
          PY
          git diff --cached --check
          git diff --cached --stat
          git commit -m "build(pest): regenerate dependency bundle and release receipts on updated tests"
          git push origin HEAD:refs/heads/fix/prod-pest-ack-hotfix-20261117
