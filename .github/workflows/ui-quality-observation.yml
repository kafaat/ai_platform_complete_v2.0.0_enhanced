name: SAHOOL four-surface Impeccable source observation
on:
  pull_request:
    paths:
      - 'experiments/ui-quality-observation/**'
      - '.github/workflows/ui-quality-observation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-source-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Print deterministic Ruff formatting diff
        run: |
          python -m pip install -c constraints-ci-tools.txt ruff
          ruff format --diff experiments/ui-quality-observation/verify_targets.py experiments/ui-quality-observation/test_verify_targets.py || true
      - name: Synthetic parser and evidence rejection tests
        run: python -m unittest discover -s experiments/ui-quality-observation -p 'test_*.py' -v
      - name: Install exact non-executing UI detector in disposable Docker
        run: |
          docker build --pull --tag sahool-ui-observer:4.8.0 \
            -f experiments/ui-quality-observation/Dockerfile \
            experiments/ui-quality-observation
      - name: Scan four actual SAHOOL components without mounting other files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sahool-ui"
          name="sahool-observer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || :' EXIT
          targets=(
            "maphub:frontend/src/sections/maphub/MapHubShell.tsx"
            "field-workspace:frontend/src/sections/FieldWorkspaceRouteShell.tsx"
            "irrigation:frontend/src/sections/FieldWorkspaceIrrigationPanel.tsx"
            "remote-sensing:frontend/src/sections/SatellitePage.tsx"
          )
          for entry in "${targets[@]}"; do
            IFS=: read -r short relative <<< "$entry"
            test -f "$relative"
            set +e
            timeout -k 10s 75s docker run --rm --pull=never --name "$name" \
              --network=none --read-only --cap-drop=ALL \
              --security-opt=no-new-privileges --pids-limit=64 \
              --memory=512m --cpus=1 --user=65534:65534 \
              --tmpfs=/tmp:rw,nosuid,nodev,size=32m --env=HOME=/tmp \
              --mount "type=bind,source=$PWD/$relative,target=/work/$short.tsx,readonly" \
              sahool-ui-observer:4.8.0 detect --json --no-config --no-advisory "/work/$short.tsx" \
              > "$RUNNER_TEMP/sahool-ui/$short.json" \
              2> "$RUNNER_TEMP/sahool-ui/$short.stderr"
            status=$?
            set -e
            printf '%s\n' "$status" > "$RUNNER_TEMP/sahool-ui/$short.exit"
            if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
              echo "Detector operational failure for $short: exit $status"
              head -c 800 "$RUNNER_TEMP/sahool-ui/$short.stderr"
              exit 1
            fi
          done
          IMAGE_ID=$(docker image inspect --format '{{.Id}}' sahool-ui-observer:4.8.0)
          python experiments/ui-quality-observation/verify_targets.py \
            --root . --reports "$RUNNER_TEMP/sahool-ui" \
            --source-sha "$(git rev-parse HEAD)" \
            --image-sha256 "$IMAGE_ID" \
            --out "$RUNNER_TEMP/sahool-ui/review.json"
      - name: Preserve review-only source observation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sahool-impeccable-static-observation
          path: ${{ runner.temp }}/sahool-ui/
          if-no-files-found: warn
          retention-days: 7
