name: Notification Queue Rollout

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

# عبءُ أجهزة التشغيل: دفعٌ جديد إلى الـPR نفسه يلغي تشغيلَه الأقدم لهذا المسار (كـci.yml)؛ وأحداثُ
# غير الـPR مجموعتُها فريدة (run_id) فلا تُلغى ولا تُسلسَل — كلُّ دمجٍ إلى main يُفحص كاملاً.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}-{2}', github.workflow, github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  notification-rollout:
    name: Notification queue and receipt certification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      # GitHub services are pulled before checkout/auth and cannot use our
      # digest-verified GHCR fallback. Start the same real PG15/16 fixture by
      # checked-in code so a source-registry 429 does not bypass tests.
      - name: Start isolated digest-locked notification PostgreSQL
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source_image=public.ecr.aws/docker/library/postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          bash scripts/ci/pull_verified_ci_image.sh "$source_image" "$RUNNER_TEMP/notification-pg-id"
          postgres_image="$(cat "$RUNNER_TEMP/notification-pg-id")"
          docker run -d --name notification-ci-pg --pull=never \
            -e POSTGRES_DB=notification_rollout_test \
            -e POSTGRES_USER=notification_test \
            -e POSTGRES_PASSWORD=disposable_test_password \
            -p 127.0.0.1:5438:5432 "$postgres_image"
          ready=0
          for attempt in $(seq 1 20); do
            if docker exec notification-ci-pg pg_isready -U notification_test -d notification_rollout_test; then
              ready=1
              break
            fi
            echo "Waiting for notification PostgreSQL (attempt $attempt)"
            sleep 2
          done
          test "$ready" = 1

      - name: Install notification dependencies and pinned test broker
        run: |
          pip install -r agents/notification/requirements.txt pytest pytest-asyncio
          curl --fail --location --retry 3 --max-time 90 \
            https://github.com/nats-io/nats-server/releases/download/v2.15.0/nats-server-v2.15.0-linux-amd64.tar.gz \
            -o "$RUNNER_TEMP/nats-server.tar.gz"
          echo "5d2c51caca950333aba84911df7d377f826f3a59ec36061c6539105084f65c92  $RUNNER_TEMP/nats-server.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/nats-server.tar.gz" -C "$RUNNER_TEMP"
      - name: Require real broker overlap, message replay and restricted Postgres receipts
        env:
          NOTIFICATION_ROLLOUT_CERTIFICATION_REQUIRED: "1"
          NOTIFICATION_TEST_NATS_SERVER: ${{ runner.temp }}/nats-server-v2.15.0-linux-amd64/nats-server
          NOTIFICATION_TEST_DATABASE_URL: postgresql://notification_test:disposable_test_password@localhost:5438/notification_rollout_test
        run: pytest -v -rs tests_v9/test_notification_queue_rollout.py tests_v9/test_notification_delivery_reliability.py tests_v9/test_notification_subjects_prefix.py tests/architecture/test_notification_rollout_postgres_image.py
      # NATS-BROKER-HAS-NO-AUTHENTICATION-SO-ACTUATOR-COMMANDS-ARE-UNGUARDED-01: nats/nats.conf نفسُه على الوسيط المثبَّت أعلاه (2.15.0، إصدارُ
      # Railway) وبعميل الوكيل (nats-py 2.16.0): هويّةٌ لكلّ خدمة بمِسبارٍ موجبٍ وسالب، ورفضُ المجهول
      # والنصّ الصريح والعميلِ الذي لا يثق بـCA، ومسارُ JetStream الحقيقيّ. `_REQUIRED=1`: غيابُ
      # الوسيط فشلٌ لا تخطٍّ صامت.
      - name: Least-privilege broker — per-service identities, subject ACLs and TLS on a real nats-server
        env:
          NATS_LEAST_PRIVILEGE_LIVE_REQUIRED: "1"
          NATS_SERVER_BIN: ${{ runner.temp }}/nats-server-v2.15.0-linux-amd64/nats-server
        run: pytest -v -rs tests_v9/test_nats_least_privilege.py
