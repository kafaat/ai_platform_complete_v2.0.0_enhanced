name: Prepare the SAHOOL integration carrier
on:
  push:
    branches: [ci/prepare-sahool-carrier-1647-1652]
permissions:
  contents: read
env:
  BASE: db79cf6d33fb8adb900f049d742de229f8616d4b
  SEED: 01b9789a43aaee6ce00bdc938dad9959ae4ebd53
  SOURCES: '6fb83dcf7c7b5f23e11f545bb650ab72250964a0 c161582d56887313762b6ad479354e7de805d2f9 9222e256591e9f8e707640eefd91832c264ddad6 9c26ed06da244b48c1618e00972b98c619a570bc 8ee18eb88945139a2e549e13b5c09ec09316873c 2ec05a23ac0af33d1163be1e2748d0d54880be05 cbea9de304691b2b5345fc904b225ff052a83c61 5708276f9dc7ff597ad5412f0e9acb53466516f0'
  TARGET: refs/heads/integration/sahool-1647-1649-1650-1652
jobs:
  retire-obsolete-preparations:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Release runners for superseded attempts of this preparation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run in 46058477653 46058688155 46058856842 46059426399; do
            info=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run")
            test "$(jq -r .head_branch <<< "$info")" = "ci/prepare-sahool-carrier-1647-1652"
            test "$(jq -r .path <<< "$info")" = ".github/workflows/prepare-sahool-integration-carrier.yml"
            test "$(jq -r .head_sha <<< "$info")" != "$GITHUB_SHA"
            if test "$(jq -r .status <<< "$info")" != completed; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/cancel" || test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status)" = completed
            fi
          done
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 01b9789a43aaee6ce00bdc938dad9959ae4ebd53
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify all eight source commits on the reviewed candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SEED"
          test "$(git rev-parse 'HEAD^{tree}')" = "4f268dde2f361ef028bb38f56d0830dc1a51363c"
          for source in "$BASE" $SOURCES; do git merge-base --is-ancestor "$source" "$SEED"; done
          git switch -c measured
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run pinned formatting and the repository generation and verification commands
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -m pip install -c constraints-ci-tools.txt ruff
          python -m pip install pytest==9.1.1 PyYAML==6.0.2 jsonschema==4.26.0
          ruff check .
          ruff format --check .
          python scripts/ci/guard_mutation_guard.py
          python scripts/ci/capability_traceability_report.py
          git add -- capabilities/generated
          bash scripts/ci/regenerate_all_generated.sh
          git add -u
          python scripts/ci/capability_traceability_report.py
          if ! git diff --quiet -- capabilities/generated; then
            git add -- capabilities/generated
            bash scripts/ci/regenerate_all_generated.sh
          fi
          python -m pytest -q -o addopts= -p no:cacheprovider tests/architecture/test_capability_traceability.py
          test -z "$(git ls-files --others --exclude-standard)"
          git add -u
          git -c core.whitespace=cr-at-eol diff --cached --check
          if ! git diff --cached --quiet; then git commit -m "Regenerate and verify artifacts for the combined source"; fi
          mkdir "$RUNNER_TEMP/verified"
          if test "$(git rev-parse HEAD)" = "$SEED"; then
            git commit --allow-empty -m "Verify the combined source and release artifacts"
          fi
          git bundle create "$RUNNER_TEMP/verified/carrier.bundle" refs/heads/measured "^$SEED"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/verified/identity"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verified-sahool-carrier
          path: ${{ runner.temp }}/verified/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: db79cf6d33fb8adb900f049d742de229f8616d4b
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: verified-sahool-carrier
          path: ${{ runner.temp }}/verified
      - name: Verify identities and advance the reserved carrier branch
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "$TARGET" | cut -f1)" = "$SEED"
          git bundle verify "$RUNNER_TEMP/verified/carrier.bundle"
          git fetch "$RUNNER_TEMP/verified/carrier.bundle" refs/heads/measured
          candidate=$(git rev-parse FETCH_HEAD)
          git rev-parse "$candidate" "$candidate^{tree}" | diff - "$RUNNER_TEMP/verified/identity"
          for source in "$BASE" "$SEED" $SOURCES; do git merge-base --is-ancestor "$source" "$candidate"; done
          test "$(git show -s --format=%P "$candidate")" = "$SEED"
          git diff --exit-code "$SEED" "$candidate" -- .github/workflows services shared tests tests_v9 mobile frontend/src/sections frontend/e2e
          git push origin "$candidate:$TARGET"
          test "$(git ls-remote origin "$TARGET" | cut -f1)" = "$candidate"
