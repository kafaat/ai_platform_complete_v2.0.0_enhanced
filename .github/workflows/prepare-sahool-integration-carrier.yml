name: Prepare the SAHOOL integration carrier
on:
  push:
    branches: [ci/prepare-sahool-carrier-1647-1652]
permissions:
  contents: read
env:
  BASE: db79cf6d33fb8adb900f049d742de229f8616d4b
  SEED: 09076a837d618fb2e08b9e385b230b96db240374
  SOURCES: '6fb83dcf7c7b5f23e11f545bb650ab72250964a0 2d4ddb45506443495f1b4587fe73bdcb737a5a68 9222e256591e9f8e707640eefd91832c264ddad6 9c26ed06da244b48c1618e00972b98c619a570bc'
  TARGET: refs/heads/integration/sahool-1647-1649-1650-1652
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 09076a837d618fb2e08b9e385b230b96db240374
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Combine the four reviewed source heads
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SEED"
          git switch -c measured
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > "$RUNNER_TEMP/regenerated-paths" <<'PATHS'
          SERVICE_REGISTRY.md
          docs/capability-registry/generated/impact/impact_index_summary.json
          docs/capability-registry/generated/management/management_manifest.json
          docs/capability-registry/generated/mapping/capability_mapping.json
          docs/capability-registry/generated/mapping/mapping_manifest.json
          execution-audit/generated/.audit.sha256
          execution-audit/generated/EXECUTION_DEPENDENCY_AUDIT_REPORT.md
          execution-audit/generated/execution_audit_summary.json
          execution-audit/generated/execution_dependency_audit.json
          governance/generated/STATIC_GOVERNANCE_ARTIFACTS.sha256
          release/FILE_CHECKSUMS.sha256
          release/SAHOOL_RELEASE_MANIFEST_20260626.json
          release/SBOM_MINIMAL.json
          service_inventory.csv
          service_inventory.generated.json
          api_versioning_inventory.csv
          api_versioning_inventory.generated.json
          capabilities/generated/capability_link_candidates.csv
          decision-lineage/generated/DECISION_LINEAGE_REPORT.md
          decision-lineage/generated/decision_lineage_graph.json
          decision-lineage/generated/decision_lineage_nodes.csv
          docs/capability-registry/generated/mapping/CAPABILITY_MAPPING_REPORT.md
          docs/capability-registry/generated/mapping/unmapped_artifacts.json
          event-audit/generated/EVENT_CONTRACT_REPORT.md
          event-audit/generated/event_contract_graph.json
          event-audit/generated/event_contract_summary.json
          execution-audit/generated/dead_code_candidates.csv
          execution-audit/generated/duplicate_definitions.json
          execution-audit/generated/route_conflicts.json
          execution-audit/generated/route_handlers.csv
          execution-audit/generated/router_reachability.json
          governance/path2-generated/INTEGRATION_RUNTIME_GOVERNANCE_ARTIFACTS.sha256
          route_inventory.csv
          route_inventory.generated.json
          docs/architecture/fake_connection_debt.json
          docs/architecture/generated/platform_route_budget_inventory.json
          docs/architecture/generated/platform_route_governance_attestation.json
          docs/architecture/generated/platform_route_ownership_inventory.json
          docs/architecture/platform_extraction_map.json
          release/PLATFORM_ROUTE_GOVERNANCE_BINDING.json
          database-audit/generated/database_contract_graph.json
          database-audit/generated/database_tables.csv
          dependency_graph.generated.json
          docs/architecture/PLATFORM_CATALOG.generated.md
          docs/capability-registry/generated/evidence/capability_evidence_matrix.json
          docs/capability-registry/generated/evidence/evidence_manifest.json
          docs/capability-registry/generated/mapping/capability_mapping.csv
          frontend/src/lib/platformCatalog.generated.ts
          platform_catalog.generated.json
          runtime_capability_manifest.generated.json
          PATHS
          for source in $SOURCES; do
            git cat-file -e "$source^{commit}"
            if ! git merge --no-edit --no-ff "$source"; then
              git rev-parse --verify MERGE_HEAD
              git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts"
              test -s "$RUNNER_TEMP/conflicts"
              while IFS= read -r path; do
                grep -Fxq "$path" "$RUNNER_TEMP/regenerated-paths" || { echo "Manual source conflict in $path"; exit 1; }
                git checkout --ours -- "$path"
                git add -- "$path"
              done < "$RUNNER_TEMP/conflicts"
              git commit --no-edit
            fi
          done
          for source in $SOURCES; do git merge-base --is-ancestor "$source" HEAD; done
          git diff --check "$BASE" HEAD
      - name: Run pinned formatting and the repository generation and verification commands
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -m pip install -c constraints-ci-tools.txt ruff
          python -m pip install pytest==9.1.1 PyYAML==6.0.2 jsonschema==4.26.0
          ruff check .
          ruff format --check .
          python scripts/ci/guard_mutation_guard.py
          bash scripts/ci/regenerate_all_generated.sh
          test -z "$(git ls-files --others --exclude-standard)"
          git add -u
          git -c core.whitespace=cr-at-eol diff --cached --check
          if ! git diff --cached --quiet; then git commit -m "Regenerate and verify artifacts for the combined source"; fi
          mkdir "$RUNNER_TEMP/verified"
          git bundle create "$RUNNER_TEMP/verified/carrier.bundle" refs/heads/measured "^$SEED" "^6fb83dcf7c7b5f23e11f545bb650ab72250964a0" "^2d4ddb45506443495f1b4587fe73bdcb737a5a68" "^9222e256591e9f8e707640eefd91832c264ddad6" "^9c26ed06da244b48c1618e00972b98c619a570bc"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/verified/identity"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verified-sahool-carrier
          path: ${{ runner.temp }}/verified/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: db79cf6d33fb8adb900f049d742de229f8616d4b
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: verified-sahool-carrier
          path: ${{ runner.temp }}/verified
      - name: Verify identities and advance the reserved carrier branch
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "$TARGET" | cut -f1)" = "$SEED"
          git bundle verify "$RUNNER_TEMP/verified/carrier.bundle"
          git fetch "$RUNNER_TEMP/verified/carrier.bundle" refs/heads/measured
          candidate=$(git rev-parse FETCH_HEAD)
          git rev-parse "$candidate" "$candidate^{tree}" | diff - "$RUNNER_TEMP/verified/identity"
          for source in "$BASE" "$SEED" $SOURCES; do git merge-base --is-ancestor "$source" "$candidate"; done
          git diff --exit-code "$SEED" "$candidate" -- .github/workflows
          git push origin "$candidate:$TARGET"
          test "$(git ls-remote origin "$TARGET" | cut -f1)" = "$candidate"
