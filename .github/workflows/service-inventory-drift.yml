name: Service Inventory Drift

on:
  pull_request:
    paths:
      - 'services/**'
      - 'SERVICE_REGISTRY.md'
      - 'service_inventory.generated.json'
      - 'route_inventory.generated.json'
      - 'scripts/ci/generate_service_inventory.py'
  push:
    branches: [ main ]
    paths:
      - 'services/**'
      - 'SERVICE_REGISTRY.md'
      - 'service_inventory.generated.json'
      - 'route_inventory.generated.json'
      - 'scripts/ci/generate_service_inventory.py'

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify generated service inventory is current
        run: python scripts/ci/generate_service_inventory.py --check
