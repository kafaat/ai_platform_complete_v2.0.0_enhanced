name: Service Inventory Drift

on:
  pull_request:
    paths:
      - 'services/**'
      - 'SERVICE_REGISTRY.md'
      - 'service_inventory.generated.json'
      - 'route_inventory.generated.json'
      - 'scripts/ci/generate_service_inventory.py'
  push:
    branches: [ main ]
    paths:
      - 'services/**'
      - 'SERVICE_REGISTRY.md'
      - 'service_inventory.generated.json'
      - 'route_inventory.generated.json'
      - 'scripts/ci/generate_service_inventory.py'

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify generated service inventory is current
        run: python scripts/ci/generate_service_inventory.py --check
