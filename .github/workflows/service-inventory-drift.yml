name: Service Inventory Drift

on:
  pull_request:
    paths:
      - 'services/**'
      - 'SERVICE_REGISTRY.md'
      - 'service_inventory.generated.json'
      - 'route_inventory.generated.json'
      - 'scripts/ci/generate_service_inventory.py'
      - 'scripts/ci/export_explorer_routes.py'
      - 'tests_v9/test_explorer_route_export_contract.py'
      - '.github/workflows/service-inventory-drift.yml'
  push:
    branches: [ main ]
    paths:
      - 'services/**'
      - 'SERVICE_REGISTRY.md'
      - 'service_inventory.generated.json'
      - 'route_inventory.generated.json'
      - 'scripts/ci/generate_service_inventory.py'
      - 'scripts/ci/export_explorer_routes.py'
      - 'tests_v9/test_explorer_route_export_contract.py'
      - '.github/workflows/service-inventory-drift.yml'

# أقلّ صلاحيّة (I5): قراءة المستودع فقط؛ أيّ وظيفة تحتاج أكثر تُعلنه على مستواها.
permissions:
  contents: read

# عبءُ أجهزة التشغيل: دفعٌ جديد إلى الـPR نفسه يلغي تشغيلَه الأقدم لهذا المسار (كـci.yml)؛ وأحداثُ
# غير الـPR مجموعتُها فريدة (run_id) فلا تُلغى ولا تُسلسَل — كلُّ دمجٍ إلى main يُفحص كاملاً.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}-{2}', github.workflow, github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify generated service inventory is current
        run: python scripts/ci/generate_service_inventory.py --check
      - name: Export code-declared routes for offline explorer
        run: |
          python scripts/ci/export_explorer_routes.py \
            --route-inventory route_inventory.generated.json \
            --service-inventory service_inventory.generated.json \
            --repo-root . \
            --out-dir artifacts/explorer-route-catalog
      - name: Check exact reproducibility from the same source tree
        run: |
          python scripts/ci/export_explorer_routes.py \
            --route-inventory route_inventory.generated.json \
            --service-inventory service_inventory.generated.json \
            --repo-root . \
            --out-dir artifacts/explorer-route-catalog-rerun
          diff -r artifacts/explorer-route-catalog artifacts/explorer-route-catalog-rerun
      - name: Upload source-bound route inventory (code evidence only)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sahool-explorer-code-routes
          path: artifacts/explorer-route-catalog
          if-no-files-found: error
          retention-days: 14
