name: PR1521 one-shot pest regression proof
on:
  push:
    paths:
      - .github/workflows/pr1521-pest-proof-once.yml
permissions:
  contents: write
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prod-pest-ack-hotfix-20261117
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests_v9/requirements-test.txt
          python -m pip install -r services/sahool-platform/api/requirements.txt
      - name: Execute targeted pest workflow and API regressions
        run: |
          set -euo pipefail
          python -m pytest -q services/sahool-platform/tests/test_pest_escalation_flow.py tests_v9/test_field_intelligence_endpoints.py -k 'pest or escalation' -rs
      - name: Check release package integrity
        run: python scripts/release/validate_release_package.py
      - name: Remove temporary workflow on success
        run: |
          set -euo pipefail
          rm .github/workflows/pr1521-pest-proof-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/pr1521-pest-proof-once.yml
          git commit -m 'ci: remove successful PR1521 one-shot pest regression proof'
          git push origin HEAD:fix/prod-pest-ack-hotfix-20261117
