name: PR1252 One-shot Deterministic Repair
on:
  push:
    branches:
      - chatgpt/livekit-readiness-security-20261020
permissions:
  contents: write
concurrency:
  group: pr1252-one-shot-repair
  cancel-in-progress: false
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install CI dependencies
        run: python -m pip install -r tests_v9/requirements-test.txt
      - name: Format, regenerate and verify on trusted PR branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/chatgpt/livekit-readiness-security-20261020'
          git rm -- .github/workflows/pr1252-finalize-repair.yml
          ruff format tests_v9/test_ai_policy_envelope_v52.py tests_v9/test_realtime_permissions_header_contract.py tests_v9/test_video_processor_features_20260702.py
          ruff check .
          ruff format --check .
          python scripts/ci/capability_mapping_engine.py --generate
          stable=0
          for pass in 1 2 3; do
            echo "Canonical generation pass $pass"
            python scripts/release/build_release_bundle.py
            if python scripts/ci/verify_all_generated.py --fix; then
              stable=1
              break
            fi
          done
          test "$stable" -eq 1
          python scripts/release/build_release_bundle.py
          python scripts/ci/verify_all_generated.py --check
          python scripts/release/validate_release_package.py
          python scripts/ci/capability_mapping_engine.py --check
          git add -A
          python scripts/ci/capability_mapping_engine.py --generate
          python scripts/ci/verify_all_generated.py --check
          python scripts/release/validate_release_package.py
          git diff --exit-code
          test ! -e .github/workflows/pr1252-finalize-repair.yml
      - name: Commit only to PR branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/chatgpt/livekit-readiness-security-20261020'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet && { echo 'No changes'; exit 0; }
          git commit -m 'fix(ci): format realtime tests and regenerate verified source artifacts'
          git push origin HEAD:refs/heads/chatgpt/livekit-readiness-security-20261020
