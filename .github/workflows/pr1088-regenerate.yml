name: PR1088 Regenerate Candidate

on:
  push:
    branches:
      - codex/bcd8-inventory-cert-20260928
    paths:
      - '.github/workflows/pr1088-regenerate.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: 44f162b240bf38937f2ba2ac023cb3e868b76411
      BASE_SHA: bcd8ad8ad64fff83941c8f386a7a993bb489972f
      TARGET_BRANCH: codex/main-inventory-rebind-bcd8-20260928
      EVIDENCE_DIR: /tmp/pr1088-regenerate
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 44f162b240bf38937f2ba2ac023cb3e868b76411
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install declared test dependencies
        run: python -m pip install -r tests_v9/requirements-test.txt

      - name: Prove source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$EVIDENCE_DIR"
          git rev-parse HEAD^{tree} > "$EVIDENCE_DIR/source-tree.txt"

      - name: Regenerate canonical artifacts
        run: |
          set -euo pipefail
          bash scripts/ci/regenerate_all_generated.sh
          git diff --name-only > "$EVIDENCE_DIR/generated-paths.txt"
          git diff --stat > "$EVIDENCE_DIR/generated-stat.txt"
          git diff --binary > "$EVIDENCE_DIR/generated.patch"

      - name: Validate generated fixed point
        run: |
          set -euo pipefail
          python scripts/ci/verify_all_generated.py --check
          python scripts/release/validate_release_package.py
          python scripts/ops/pre_push_stability_guard.py --allow-dirty

      - name: Validate report-only classification on full PR diff
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA"...HEAD | python scripts/ci/no_report_only_change_guard.py --stdin

      - name: Validate capability mapping test
        run: python -m pytest -q tests/architecture/test_capability_mapping_engine.py

      - name: Commit regenerated candidate locally
        run: |
          set -euo pipefail
          git config user.name "PR1088 Regeneration"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(generated): refresh bcd8 evidence-dependent artifacts"
          {
            echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
            echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
          } | tee "$EVIDENCE_DIR/candidate.env"
          test -z "$(git status --porcelain)"

      - name: Publish candidate Git objects only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, subprocess, urllib.request, pathlib
          repo = "kafaat/ai_platform_complete_v2.0.0_enhanced"
          source = os.environ["SOURCE_SHA"]
          out = pathlib.Path(os.environ["EVIDENCE_DIR"])
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          def api(endpoint, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/{endpoint}",
                  data=data,
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
                  method="POST" if data is not None else "GET",
              )
              with urllib.request.urlopen(req, timeout=120) as r:
                  return json.load(r)
          current = api(f"git/ref/heads/{os.environ['TARGET_BRANCH']}")["object"]["sha"]
          if current != source:
              raise RuntimeError(f"target_head_changed:{current}")
          paths = [p for p in (out/"generated-paths.txt").read_text().splitlines() if p]
          entries = []
          for p in paths:
              data = pathlib.Path(p).read_bytes()
              blob = api("git/blobs", {"content": base64.b64encode(data).decode(), "encoding": "base64"})
              mode = git("ls-files", "-s", "--", p).split()[0]
              entries.append({"path":p,"mode":mode,"type":"blob","sha":blob["sha"]})
          base_tree = git("rev-parse", f"{source}^{{tree}}")
          tree = api("git/trees", {"base_tree": base_tree, "tree": entries})
          expected_tree = git("rev-parse", "HEAD^{tree}")
          if tree["sha"] != expected_tree:
              raise RuntimeError(f"tree_mismatch:{tree['sha']}:{expected_tree}")
          commit = api("git/commits", {
              "message": "chore(generated): refresh bcd8 evidence-dependent artifacts",
              "tree": tree["sha"],
              "parents": [source],
          })
          receipt={"source":source,"paths":paths,"tree":tree["sha"],"commit":commit["sha"],"ref_updated":False}
          (out/"publication.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt,indent=2))
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr1088-regenerate-candidate
          path: /tmp/pr1088-regenerate
          retention-days: 30
