name: BCD8 Inventory Baseline Certification

on:
  push:
    branches:
      - codex/bcd8-inventory-cert-20260928

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: bcd8ad8ad64fff83941c8f386a7a993bb489972f
      EVIDENCE_DIR: /tmp/bcd8-inventory-cert
    steps:
      - name: Checkout exact main merge tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: bcd8ad8ad64fff83941c8f386a7a993bb489972f
          path: repo
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install declared test dependencies
        working-directory: repo
        run: python -m pip install -r tests_v9/requirements-test.txt

      - name: Prove checkout identity
        working-directory: repo
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$EVIDENCE_DIR"
          git rev-parse HEAD > "$EVIDENCE_DIR/source-sha.txt"
          git rev-parse HEAD^{tree} > "$EVIDENCE_DIR/source-tree.txt"

      - name: Run diagnostic inventory twice
        working-directory: repo
        run: |
          set -euo pipefail
          python scripts/diagnostics/build_main_inventory.py --out "$EVIDENCE_DIR/inventory"
          python scripts/diagnostics/build_main_inventory.py --out "$EVIDENCE_DIR/inventory-rerun"
          diff -r "$EVIDENCE_DIR/inventory" "$EVIDENCE_DIR/inventory-rerun"
          python scripts/ci/gap_registry_claim_guard.py --inventory-manifest "$EVIDENCE_DIR/inventory/inventory_manifest.json"
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["EVIDENCE_DIR"])
          m = json.load(open(root / "inventory" / "inventory_manifest.json", encoding="utf-8"))
          e = m["edge_resolution"]
          summary = {
              "source_sha": m["source_sha"],
              "counts": m["counts"],
              "edge_resolution": {
                  "resolved": e["resolved"],
                  "resolved_count_unit": e["resolved_count_unit"],
                  "literal_call_sites": e["literal_call_sites"],
                  "unproven_client_bindings": len(e["unproven_client_bindings"]),
                  "unsupported_call_sites": len(e["unsupported_call_sites"]),
                  "scanner_blind_spots": e["scanner_blind_spots"],
                  "unparsed_source_files": len(e["unparsed_source_files"]),
                  "lexical_scan_complete": e["lexical_scan_complete"],
              },
          }
          (root / "inventory-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(summary, indent=2))
          PY

      - name: Regenerate canonical generated artifacts
        working-directory: repo
        run: |
          set -euo pipefail
          bash scripts/ci/regenerate_all_generated.sh
          git diff --name-status > "$EVIDENCE_DIR/generated-name-status.txt"
          git diff --stat > "$EVIDENCE_DIR/generated-stat.txt"
          git diff --binary > "$EVIDENCE_DIR/generated.patch"
          git diff --name-only > "$EVIDENCE_DIR/generated-paths.txt"
          mkdir -p "$EVIDENCE_DIR/changed-files"
          while IFS= read -r p; do
            test -z "$p" && continue
            mkdir -p "$EVIDENCE_DIR/changed-files/$(dirname "$p")"
            cp "$p" "$EVIDENCE_DIR/changed-files/$p"
          done < "$EVIDENCE_DIR/generated-paths.txt"

      - name: Commit candidate locally only
        working-directory: repo
        run: |
          set -euo pipefail
          git config user.name "BCD8 Inventory Certification"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "NO_GENERATED_DIFF=1" | tee "$EVIDENCE_DIR/candidate.env"
          else
            git commit -m "chore(generated): rebind inventory baseline to main merge"
            {
              echo "NO_GENERATED_DIFF=0"
              echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
              echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
            } | tee "$EVIDENCE_DIR/candidate.env"
          fi

      - name: Verify all generated artifacts
        working-directory: repo
        run: python scripts/ci/verify_all_generated.py --check

      - name: Validate release package
        working-directory: repo
        run: python scripts/release/validate_release_package.py

      - name: Run stability guard
        working-directory: repo
        run: python scripts/ops/pre_push_stability_guard.py

      - name: Final clean-tree proof
        working-directory: repo
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          sha256sum "$EVIDENCE_DIR/inventory"/*.json > "$EVIDENCE_DIR/inventory-sha256.txt"
          python - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ["EVIDENCE_DIR"])
          repo = pathlib.Path.cwd()
          paths = [p for p in (root / "generated-paths.txt").read_text().splitlines() if p]
          receipt = {
              "source_sha": os.environ["SOURCE_SHA"],
              "source_tree": (root / "source-tree.txt").read_text().strip(),
              "generated_paths": paths,
              "candidate_env": (root / "candidate.env").read_text().splitlines(),
              "final_head": subprocess.check_output(["git","rev-parse","HEAD"], text=True).strip(),
              "final_tree": subprocess.check_output(["git","rev-parse","HEAD^{tree}"], text=True).strip(),
              "working_tree_clean": True,
          }
          (root / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(receipt, indent=2))
          PY

      - name: Upload certification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bcd8-inventory-certification
          path: /tmp/bcd8-inventory-cert
          retention-days: 30
