name: raw-weather-processing-contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  raw-weather-processing-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python scripts/ci/raw_weather_processing_contract_guard.py
