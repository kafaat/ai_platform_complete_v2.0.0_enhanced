name: raw-weather-processing-contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  raw-weather-processing-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/ci/raw_weather_processing_contract_guard.py
