name: raw-weather-processing-contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  raw-weather-processing-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/ci/raw_weather_processing_contract_guard.py
