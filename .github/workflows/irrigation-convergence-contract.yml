name: Irrigation convergence contract
on:
  pull_request:
    paths:
      - 'migrations/**'
      - 'services/sahool-platform/api/irrigation_*'
      - 'docs/architecture/ADR-IRR-F01-OWNERSHIP.md'
      - 'docs/architecture/irrigation_convergence_mapping.yml'
      - 'scripts/ci/irrigation_convergence_guard.py'
      - 'tests/irrigation/**'
  push:
    paths:
      - 'migrations/**'
      - 'services/sahool-platform/api/irrigation_*'
      - 'docs/architecture/ADR-IRR-F01-OWNERSHIP.md'
      - 'docs/architecture/irrigation_convergence_mapping.yml'
      - 'scripts/ci/irrigation_convergence_guard.py'
      - 'tests/irrigation/**'
# عبءُ أجهزة التشغيل: دفعٌ جديد إلى الـPR نفسه يلغي تشغيلَه الأقدم لهذا المسار (كـci.yml)؛ وأحداثُ
# غير الـPR مجموعتُها فريدة (run_id) فلا تُلغى ولا تُسلسَل — كلُّ دمجٍ إلى main يُفحص كاملاً.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}-{2}', github.workflow, github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    name: irrigation-convergence-contract / contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # pytest-asyncio is required: tests/irrigation carries async tests (the Gate B dispatch-relay
      # worker) that pytest.ini runs under asyncio_mode=auto. Bare pytest cannot collect them.
      # httpx is required: the platform irrigation_activation_gate restricted adapter (open-ledger
      # #1) uses httpx to reach the decision-service enforce endpoint, and its unit test imports it.
      - run: python -m pip install --upgrade pip pytest pytest-asyncio httpx
      - run: python scripts/ci/irrigation_convergence_guard.py
      - run: python -m pytest -q tests/irrigation
