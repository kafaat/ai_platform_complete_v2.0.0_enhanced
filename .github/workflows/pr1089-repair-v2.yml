name: PR1089 Attempt-Aware Certification Repair V4

on:
  push:
    branches:
      - codex/bcd8-inventory-cert-20260928
    paths:
      - '.github/workflows/pr1089-repair-v2.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: d2fc39b3c2ffd03d74b2dd7e4251d06d3746d561
      OUT: /tmp/pr1089-repair
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: d2fc39b3c2ffd03d74b2dd7e4251d06d3746d561
          path: repo
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install declared test dependencies
        working-directory: repo
        run: python -m pip install -r tests_v9/requirements-test.txt
      - name: Prove source identity
        working-directory: repo
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/source-sha.txt"
          git rev-parse HEAD^{tree} > "$OUT/source-tree.txt"
      - name: Install pinned formatter
        working-directory: repo
        run: python -m pip install -c constraints-ci-tools.txt ruff
      - name: Apply canonical Ruff formatting
        working-directory: repo
        run: |
          ruff format scripts/ci/certify_artifact_contract.py tests_v9/test_certify_artifact_contract.py
          ruff format --check scripts/ci/certify_artifact_contract.py tests_v9/test_certify_artifact_contract.py
      - name: Contract regression tests before regeneration
        working-directory: repo
        run: |
          python -m pytest -q             tests_v9/test_certify_artifact_contract.py             tests_v9/test_sot_provenance_guard.py
      - name: Regenerate full canonical fixed point
        working-directory: repo
        run: |
          set -euo pipefail
          bash scripts/ci/regenerate_all_generated.sh
          git diff --name-status > "$OUT/changed-name-status.txt"
          git diff --name-only > "$OUT/changed-paths.txt"
          git diff --stat > "$OUT/changed-stat.txt"
          git diff --binary > "$OUT/repair.patch"
          mkdir -p "$OUT/changed-files"
          while IFS= read -r p; do
            test -z "$p" && continue
            mkdir -p "$OUT/changed-files/$(dirname "$p")"
            cp "$p" "$OUT/changed-files/$p"
          done < "$OUT/changed-paths.txt"
      - name: Commit candidate locally
        working-directory: repo
        run: |
          set -euo pipefail
          git config user.name "PR1089 Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "NO_DIFF=1" | tee "$OUT/candidate.env"
          else
            git commit -m "chore(release): refresh attempt-aware certification fingerprints"
            {
              echo "NO_DIFF=0"
              echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
              echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
            } | tee "$OUT/candidate.env"
          fi
      - name: Verify generated fixed point
        working-directory: repo
        run: python scripts/ci/verify_all_generated.py --check
      - name: Validate release package
        working-directory: repo
        run: python scripts/release/validate_release_package.py --root .
      - name: Re-run certification contract regressions
        working-directory: repo
        run: |
          python -m pytest -q             tests_v9/test_certify_artifact_contract.py             tests_v9/test_sot_provenance_guard.py             tests/release/test_phase14_release_packaging_contracts.py
      - name: Capability impact
        working-directory: repo
        run: |
          mapfile -t paths < "$OUT/changed-paths.txt"
          if [ "${#paths[@]}" -gt 0 ]; then
            python scripts/ci/capability_impact.py --json "${paths[@]}" | tee "$OUT/capability-impact.json"
          else
            printf '{"changed_paths":[],"direct":[],"transitive":[],"affected":[],"governance_wide":false}\n' | tee "$OUT/capability-impact.json"
          fi
      - name: Stability guard
        working-directory: repo
        run: python scripts/ops/pre_push_stability_guard.py
      - name: Final receipt
        working-directory: repo
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          python - <<'PY'
          import json, os, pathlib, subprocess
          out=pathlib.Path(os.environ["OUT"])
          receipt={
            "source_sha":os.environ["SOURCE_SHA"],
            "source_tree":(out/"source-tree.txt").read_text().strip(),
            "changed_paths":[x for x in (out/"changed-paths.txt").read_text().splitlines() if x],
            "candidate_env":(out/"candidate.env").read_text().splitlines(),
            "final_head":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
            "final_tree":subprocess.check_output(["git","rev-parse","HEAD^{tree}"],text=True).strip(),
            "clean":True,
          }
          (out/"receipt.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr1089-repair-v4
          path: /tmp/pr1089-repair
          retention-days: 30
