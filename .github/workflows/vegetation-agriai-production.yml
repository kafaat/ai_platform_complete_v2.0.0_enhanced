name: vegetation-agriai-production
on:
  pull_request:
    paths:
      - 'services/vegetation-analysis-service/**'
      - 'services/agriai-engine/**'
      - 'services/decision-service/**'
      - 'scripts/ci/vegetation_agriai_production_gate.py'
      - 'scripts/ci/agronomic_*'
  push:
    branches: [main, develop]
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - run: python scripts/ci/vegetation_agriai_production_gate.py
      - run: python -m compileall -q services/vegetation-analysis-service services/agriai-engine
      - run: pip install -r services/decision-service/requirements.txt pytest pytest-asyncio
      - run: pytest -q services/vegetation-analysis-service/test_vegetation_production_contract.py services/agriai-engine/tests/test_agronomic_context_contract.py
      - name: AC-6 agronomic decision lineage gate
        run: python scripts/ci/agronomic_decision_lineage_gate.py
      - name: AC-6.1 agronomic lineage integrity gate
        run: python scripts/ci/agronomic_lineage_integrity_gate.py
      # No DATABASE_URL here: the evidence contract runs fully; the integrity file runs its
      # static assertions and honestly skips the real-Postgres proof (covered in the main CI
      # decision-service job and by scripts/certification/certify_agronomic_lineage.py).
      - name: Decision-service lineage contract tests
        run: pytest -q services/decision-service/tests/test_agronomic_evidence_contract.py services/decision-service/tests/test_agronomic_lineage_integrity.py services/decision-service/tests/test_agronomic_learning_lineage.py services/decision-service/tests/test_agronomic_model_lifecycle_lineage.py services/decision-service/tests/test_agronomic_runtime_lineage.py services/decision-service/tests/test_agronomic_runtime_terminal_lineage.py
      - name: AC-9 agronomic learning lineage gate
        run: python scripts/ci/agronomic_learning_lineage_gate.py
      - name: agronomic model lifecycle lineage gate
        run: python scripts/ci/agronomic_model_lifecycle_lineage_gate.py
      - name: agronomic runtime lineage gate
        run: python scripts/ci/agronomic_runtime_lineage_gate.py
      - name: agronomic runtime terminal lineage gate
        run: python scripts/ci/agronomic_runtime_terminal_lineage_gate.py
      - name: production truth readiness gate
        run: python scripts/ci/production_truth_readiness_gate.py
