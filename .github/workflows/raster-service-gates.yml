name: Raster Service Gates

on:
  pull_request:
    paths:
      - 'services/raster-service/**'
      - 'scripts/ci/raster_*_gate.py'
      - 'scripts/ci/raster_quality_gate.sh'
      - '.github/workflows/raster-service-gates.yml'
  push:
    branches: [main]
    paths:
      - 'services/raster-service/**'
      - 'scripts/ci/raster_*_gate.py'
      - 'scripts/ci/raster_quality_gate.sh'
      - '.github/workflows/raster-service-gates.yml'

permissions:
  contents: read

# عبءُ أجهزة التشغيل: دفعٌ جديد إلى الـPR نفسه يلغي تشغيلَه الأقدم لهذا المسار (كـci.yml)؛ وأحداثُ
# غير الـPR مجموعتُها فريدة (run_id) فلا تُلغى ولا تُسلسَل — كلُّ دمجٍ إلى main يُفحص كاملاً.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}-{2}', github.workflow, github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  raster-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install raster-service test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f services/raster-service/requirements.txt ]; then
            python -m pip install -r services/raster-service/requirements.txt
          fi
          # Pillow is TEST-only (test_soil_render/test_terrain_render decode PNGs) —
          # not a runtime dep, so it is installed here, not in requirements.txt.
          python -m pip install pytest pytest-asyncio Pillow
      - name: Run raster service quality gate
        run: bash scripts/ci/raster_quality_gate.sh
