name: Raster Service Gates

on:
  pull_request:
    paths:
      - 'services/raster-service/**'
      - 'scripts/ci/raster_*_gate.py'
      - 'scripts/ci/raster_quality_gate.sh'
      - '.github/workflows/raster-service-gates.yml'
  push:
    branches: [main]
    paths:
      - 'services/raster-service/**'
      - 'scripts/ci/raster_*_gate.py'
      - 'scripts/ci/raster_quality_gate.sh'
      - '.github/workflows/raster-service-gates.yml'

permissions:
  contents: read

jobs:
  raster-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install raster-service test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f services/raster-service/requirements.txt ]; then
            python -m pip install -r services/raster-service/requirements.txt
          fi
          # Pillow is TEST-only (test_soil_render/test_terrain_render decode PNGs) —
          # not a runtime dep, so it is installed here, not in requirements.txt.
          python -m pip install pytest pytest-asyncio Pillow
      - name: Run raster service quality gate
        run: bash scripts/ci/raster_quality_gate.sh
