# One-shot branch-only reconciliation for SHARE-REVOKE-UNKNOWN-RESULT-01.
# Does not deploy Railway services or mutate databases.
name: One-shot sharing revoke integration regeneration
on:
  push:
    branches:
      - integrate/open-drafts-selective-20261117
permissions:
  contents: write
concurrency:
  group: sharing-revoke-regen-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regenerate:
    if: github.ref == 'refs/heads/integrate/open-drafts-selective-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify lost-acknowledgment regression and TypeScript contracts
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npm ci --ignore-scripts --no-audit --no-fund
          npx vitest run src/lib/sharingRevocation.test.ts --no-file-parallelism --maxWorkers=1
          npm run typecheck
      - name: Install Python CI dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install -r tests_v9/requirements-test.txt
          pip install -c constraints-ci-tools.txt ruff
      - name: Remove temporary workflow and regenerate all derived evidence
        shell: bash
        run: |
          set -euo pipefail
          git rm '.github/workflows/one-shot-open-drafts-sharing-revoke-regen-20261117.yml'
          git add -A
          python scripts/ci/verify_all_generated.py --fix
          git add -A
          python scripts/ci/verify_all_generated.py --check
          python scripts/ci/capability_registry_guard.py --check
          python scripts/release/validate_release_package.py --root .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(generated): reconcile sharing revoke outcome proof [regen]'
          git push origin HEAD:'integrate/open-drafts-selective-20261117'
