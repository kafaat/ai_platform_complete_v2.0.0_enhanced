name: Railway Dockerfile PR build

# DOCKER-BUILD-VERIFIED-ONLY-ON-MANUAL-DISPATCH-SKIP-READS-GREEN-01:
# Railway يبني ملفّات Dockerfile هذه في الإنتاج فور الدمج (checkSuites:false)، ووظيفةُ
# docker-build في المصفوفة يدويّةٌ فتظهر «skipped» وتُقرأ نجاحاً. هنا تُبنى في الـPR
# **حين يتغيّر الـDockerfile أو ما ينسخه**، من سياقٍ نظيف، بوسائط هويّةٍ من CI.
# ووظيفةُ الحكم تعمل دائماً: «لا شيءَ يُبنى» نتيجةٌ مُعلَنة من المُخطِّط، لا تخطٍّ صامت.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      services:
        description: "Railway services to build regardless of changes (comma list, or all)"
        required: true
        default: "all"

permissions:
  contents: read

concurrency:
  group: railway-dockerfile-pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Plan Railway Dockerfile builds touched by this PR
        id: plan
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          FORCE_SERVICES: ${{ inputs.services }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          python scripts/ci/railway_dockerfile_pr_build_plan.py \
            --base "origin/$BASE_REF" \
            --force-services "${FORCE_SERVICES:-}" \
            --github-output "$GITHUB_OUTPUT"

  build:
    permissions:
      contents: read
      packages: read
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build ${{ matrix.service }}
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          SERVICE: ${{ matrix.service }}
          GIT_SHA: ${{ github.sha }}
          BUILD_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Use the identical OCI digest from GHCR for this CI build only.
          # The production Railway Dockerfile and its upstream pin stay untouched.
          dockerfile_for_build="$DOCKERFILE"
          if [[ "$SERVICE" == "sahool-frontend" ]]; then
            nginx_source="public.ecr.aws/docker/library/nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10"
            bash scripts/ci/pull_verified_ci_image.sh \
              "$nginx_source" \
              "$RUNNER_TEMP/railway-nginx-image-id" \
              "$RUNNER_TEMP/railway-nginx-from-ref"
            nginx_ref="$(cat "$RUNNER_TEMP/railway-nginx-from-ref")"
            case "$nginx_ref" in
              "ghcr.io/kafaat/sahool-ci-nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10"|"$nginx_source") ;;
              *) echo "::error::Unverified nginx build image" >&2; exit 1 ;;
            esac
            dockerfile_for_build="$RUNNER_TEMP/Dockerfile.frontend.ci"
            python3 - "$DOCKERFILE" "$dockerfile_for_build" "$nginx_source" "$nginx_ref" <<'PY'
          from pathlib import Path
          import sys
          original, temporary, pinned, verified = sys.argv[1:]
          source = Path(original).read_text(encoding="utf-8")
          expected = f"FROM {pinned}\n"
          if source.count(expected) != 1:
              raise SystemExit("Expected exactly one original pinned nginx FROM")
          Path(temporary).write_text(
              source.replace(expected, f"FROM {verified}\n", 1),
              encoding="utf-8",
          )
          PY
          fi
          docker build \
            -f "$dockerfile_for_build" \
            --build-arg "SAHOOL_GIT_SHA=$GIT_SHA" \
            --build-arg "SAHOOL_BUILD_ID=$BUILD_ID" \
            --build-arg "SAHOOL_SOURCE_REPOSITORY=$SOURCE_REPOSITORY" \
            --build-arg "SAHOOL_SOURCE_REF=$SOURCE_REF" \
            -t "pr-build/$SERVICE:$GIT_SHA" \
            .

  verdict:
    needs: [plan, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Planned builds all succeeded (or none were planned)
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          COUNT: ${{ needs.plan.outputs.count }}
        run: |
          set -euo pipefail
          echo "plan=$PLAN_RESULT build=$BUILD_RESULT planned=$COUNT"
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::the build plan did not run successfully - no verdict"; exit 1
          fi
          if [ "$COUNT" = "0" ]; then
            echo "no Railway Dockerfile or its COPY context is touched by this PR"; exit 0
          fi
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "::error::$COUNT planned Railway Dockerfile build(s) did not all succeed ($BUILD_RESULT)"; exit 1
          fi
