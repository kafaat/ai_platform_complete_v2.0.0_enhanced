# Branch-only verification for source fixes. Self-removes; cannot publish Railway.
name: One-shot PR1525 R13 unit and generated evidence certification
on:
  push:
    branches: [fix/pr1525-r13-unit-contracts-20261117]
permissions:
  contents: write
concurrency:
  group: pr1525-r13-unit-regenerate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  certify-and-regenerate:
    if: github.ref == 'refs/heads/fix/pr1525-r13-unit-contracts-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Remove temporary workflow before all source/tree checks
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-pr1525-r13-ci-regenerate-20261117.yml
      - name: Install checked-in Python test and generation tools
        shell: bash
        run: |
          set -euo pipefail
          pip install -r tests_v9/requirements-test.txt
          pip install -c constraints-ci-tools.txt ruff
      - name: Targeted R13 and semantic convergence regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests_v9/test_text_encoding_locale.py::test_no_new_file_decodes_text_with_the_machines_locale             tests_v9/test_explorer_route_export_contract.py             tests_v9/test_semantic_convergence_01.py             tests_v9/test_blocking_surface_freeze.py
      - name: Certify exporter mutation is killed by its named test
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/guard_mutation_guard.py --run --only scripts/ci/export_explorer_routes.py
      - name: Regenerate evidence on the exact combined source tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          python scripts/ci/verify_all_generated.py --fix
          python scripts/ci/verify_all_generated.py --check
          python scripts/ci/capability_mapping_engine.py --check
          python scripts/ci/guard_catalogue.py --check
          python scripts/release/validate_release_package.py --root .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(generated): reconcile R13 CI with owned source and guard evidence'
          git push origin HEAD:fix/pr1525-r13-unit-contracts-20261117
