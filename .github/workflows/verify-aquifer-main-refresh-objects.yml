name: Verify aquifer-main-refresh source objects
on:
  push:
    branches: [ci/verify-aquifer-main-refresh-c161582d]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify the candidate parents and content and retain only on the transfer branch
        shell: bash
        run: |
          set -euo pipefail
          echo 'c08788cfc771eebc3eb9f24520872a162e25e9dfc4b6cf6d0cbf6fdb2aee8fd8  candidate.pack' | sha256sum --check --strict
          git fetch --no-tags --depth=1 origin 2d4ddb45506443495f1b4587fe73bdcb737a5a68
          git fetch --no-tags --depth=1 origin db79cf6d33fb8adb900f049d742de229f8616d4b
          git index-pack --stdin --fix-thin < candidate.pack
          test "$(git show -s --format=%P c161582d56887313762b6ad479354e7de805d2f9)" = "2d4ddb45506443495f1b4587fe73bdcb737a5a68 db79cf6d33fb8adb900f049d742de229f8616d4b"
          test "$(git rev-parse c161582d56887313762b6ad479354e7de805d2f9^{tree})" = "6b18756748d09082457dec0e66ea803ca3a8e520"
          git ls-tree -r c161582d56887313762b6ad479354e7de805d2f9 >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          retained=$(git commit-tree "$GITHUB_SHA^{tree}" -p "$GITHUB_SHA" -p c161582d56887313762b6ad479354e7de805d2f9 -m "Retain verified source [skip ci]")
          git push origin "$retained:refs/heads/ci/verify-aquifer-main-refresh-c161582d"
