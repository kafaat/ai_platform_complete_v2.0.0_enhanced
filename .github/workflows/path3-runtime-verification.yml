name: PATH-3 Runtime Verification

on:
  workflow_dispatch:
    inputs:
      environment_id:
        description: Protected environment identifier
        required: true
        default: staging-pg16
      image_build_run_id:
        description: Successful Runtime Image Provenance workflow run ID
        required: true
      allow_partial:
        description: Probe only compose-resolved services and retain unresolved contracts as blockers
        required: true
        type: boolean
        default: false
      keep_stack:
        description: Keep compose stack running after verification
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: path3-runtime-staging-pg16
  cancel-in-progress: false

jobs:
  verify-images:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Download externally built image manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ inputs.image_build_run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name "runtime-image-manifest-${GITHUB_SHA}" \
            --dir verified-images
      - name: Verify every OCI image attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/ci/prepare_attested_runtime_images.py \
            --manifest verified-images/runtime-image-manifest.json \
            --tested-sha "$GITHUB_SHA" \
            --output verified-images/docker-compose.attested-images.yml
          python - <<'PY' > verified-images/image-refs.txt
          import json
          o=json.load(open('verified-images/runtime-image-manifest.json'))
          for service,row in sorted(o['images'].items()): print(service, row['image'])
          PY
          while read -r service image; do
            gh attestation verify "oci://${image}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/runtime-image-provenance.yml" \
              --source-digest "$GITHUB_SHA" \
              --format json > "verified-images/${service}.image-attestation.json"
          done < verified-images/image-refs.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: path3-verified-images-${{ github.sha }}
          path: verified-images
          if-no-files-found: error
          retention-days: 30

  runtime-producer:
    needs: verify-images
    runs-on: [self-hosted, linux, docker, sahool-path3-trusted]
    environment: staging-pg16
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      TESTED_SHA: ${{ github.sha }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      NATS_USER: ${{ secrets.NATS_USER }}
      NATS_PASSWORD: ${{ secrets.NATS_PASSWORD }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
      MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
      PATH3_ATTESTATION_KEY: ${{ secrets.PATH3_ATTESTATION_KEY }}
      SAHOOL_RUNTIME_EVIDENCE_HMAC_KEY: ${{ secrets.SAHOOL_RUNTIME_EVIDENCE_HMAC_KEY }}
      SAHOOL_AGENT_TOKEN: ${{ secrets.SAHOOL_AGENT_TOKEN }}
      SAHOOL_PLATFORM_PROBE_JWT: ${{ secrets.SAHOOL_PLATFORM_PROBE_JWT }}
      SAHOOL_BUILD_ID: gha-path3-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: path3-verified-images-${{ github.sha }}
          path: verified-images
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check PyYAML pytest
      - name: Assert protected runner and immutable image policy
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.environment_id }}" = "staging-pg16"
          python scripts/ci/prepare_attested_runtime_images.py \
            --manifest verified-images/runtime-image-manifest.json \
            --tested-sha "$GITHUB_SHA" \
            --output verified-images/docker-compose.attested-images.yml
      - name: Pull attested images by digest
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.v9.yml -f verified-images/docker-compose.attested-images.yml pull \
            sahool-weather-service sahool-soil-service sahool-platform
      - name: Activate exact images and produce unsigned transport bundle
        shell: bash
        run: |
          set -euo pipefail
          args=(--compose-file docker-compose.v9.yml --compose-file verified-images/docker-compose.attested-images.yml --image-manifest verified-images/runtime-image-manifest.json --environment-id "${{ inputs.environment_id }}")
          [[ "${{ inputs.allow_partial }}" == "true" ]] && args+=(--allow-partial)
          [[ "${{ inputs.keep_stack }}" == "true" ]] && args+=(--keep-stack)
          python scripts/ci/path3_runtime_activation.py "${args[@]}"
          mkdir -p runtime-verification/transport
          find runtime-verification/functional_evidence -maxdepth 1 -type f -name '*.json' -print0 | sort -z | xargs -0 sha256sum > runtime-verification/transport/FUNCTIONAL_EVIDENCE_CHECKSUMS.sha256
          cp verified-images/runtime-image-manifest.json runtime-verification/transport/
          cp runtime-verification/generated/functional_deployment_manifest.json runtime-verification/transport/
          cp runtime-verification/transport/FUNCTIONAL_EVIDENCE_CHECKSUMS.sha256 runtime-verification/functional_evidence/
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf runtime-verification/transport/functional-evidence-${GITHUB_SHA}.tar.gz \
            runtime-verification/functional_evidence \
            runtime-verification/generated/functional_deployment_manifest.json \
            runtime-verification/transport/runtime-image-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: path3-unsigned-evidence-${{ github.sha }}
          path: runtime-verification/transport/functional-evidence-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  trusted-signer:
    needs: runtime-producer
    runs-on: ubuntu-24.04
    environment: staging-pg16-attestation
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: path3-unsigned-evidence-${{ github.sha }}
          path: signer-input
      - name: Independently validate bundle and image provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bundle="signer-input/functional-evidence-${GITHUB_SHA}.tar.gz"
          rm -rf signer-verify && mkdir signer-verify
          tar -xzf "$bundle" -C signer-verify
          (cd signer-verify && sha256sum --check runtime-verification/functional_evidence/FUNCTIONAL_EVIDENCE_CHECKSUMS.sha256)
          python scripts/ci/prepare_attested_runtime_images.py \
            --manifest signer-verify/runtime-verification/transport/runtime-image-manifest.json \
            --tested-sha "$GITHUB_SHA" \
            --output signer-verify/attested-images.yml
          python - <<'PY' > signer-verify/image-refs.txt
          import json
          o=json.load(open('signer-verify/runtime-verification/transport/runtime-image-manifest.json'))
          for service,row in sorted(o['images'].items()): print(service,row['image'])
          PY
          while read -r service image; do
            gh attestation verify "oci://${image}" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/runtime-image-provenance.yml" \
              --source-digest "$GITHUB_SHA" --format json > "signer-verify/${service}.json"
          done < signer-verify/image-refs.txt
      - name: Attest evidence bundle in trusted signer boundary
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: signer-input/functional-evidence-${{ github.sha }}.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: path3-attested-evidence-${{ github.sha }}
          path: signer-input/functional-evidence-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  verify-and-evaluate:
    needs: trusted-signer
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: write
      id-token: write
      actions: write
    env:
      SAHOOL_RUNTIME_EVIDENCE_HMAC_KEY: ${{ secrets.SAHOOL_RUNTIME_EVIDENCE_HMAC_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: path3-attested-evidence-${{ github.sha }}
          path: verified-evidence
      - name: Verify evidence attestation and issue bridge receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bundle="verified-evidence/functional-evidence-${GITHUB_SHA}.tar.gz"
          gh attestation verify "$bundle" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/path3-runtime-verification.yml" \
            --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" --format json \
            > github-attestation-verification.json
          python scripts/ci/provenance_receipt.py --create \
            --bundle "$bundle" --attestation-json github-attestation-verification.json \
            --output provenance-verification-receipt.json --repository "$GITHUB_REPOSITORY" \
            --source-sha "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/path3-runtime-verification.yml" \
            --verification-run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Reject replay before evaluation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          digest="$(python -c 'import json;print(json.load(open("provenance-verification-receipt.json"))["bundle_sha256"])')"
          python scripts/ci/runtime_replay_guard.py --bundle-sha256 "$digest" --repository "$GITHUB_REPOSITORY"
          echo "BUNDLE_SHA256=$digest" >> "$GITHUB_ENV"
      - name: Extract and evaluate only attested evidence
        shell: bash
        run: |
          set -euo pipefail
          bundle="verified-evidence/functional-evidence-${GITHUB_SHA}.tar.gz"
          rm -rf runtime-verification/functional_evidence
          tar -xzf "$bundle"
          sha256sum --check runtime-verification/functional_evidence/FUNCTIONAL_EVIDENCE_CHECKSUMS.sha256
          rm runtime-verification/functional_evidence/FUNCTIONAL_EVIDENCE_CHECKSUMS.sha256
          output="$(python scripts/ci/runtime_identity_bridge.py --dry-run --target-sha "$GITHUB_SHA" --provenance-receipt provenance-verification-receipt.json --evidence-bundle "$bundle")"
          printf '%s\n' "$output"
          grep -F 'runtime_verified written by this tool: 0' <<<"$output"
          grep -F 'production_certified: 0' <<<"$output"
          python scripts/ci/runtime_verification_apply.py prepare \
            --target-sha "$GITHUB_SHA" --provenance-receipt provenance-verification-receipt.json \
            --evidence-bundle "$bundle" --output runtime-verification-candidate.json
      - name: Attest immutable Step-4 candidate
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: runtime-verification-candidate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: path3-runtime-candidate-${{ github.sha }}
          path: runtime-verification-candidate.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish append-only replay marker
        shell: bash
        run: |
          mkdir -p replay-marker
          cp provenance-verification-receipt.json "replay-marker/${BUNDLE_SHA256}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: path3-consumed-${{ env.BUNDLE_SHA256 }}
          path: replay-marker/${{ env.BUNDLE_SHA256 }}.json
          if-no-files-found: error
          retention-days: 90
