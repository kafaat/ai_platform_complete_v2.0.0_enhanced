name: Indicators Container Contract

on:
  pull_request:
  push:
    branches: [ main, develop ]

jobs:
  indicators-container-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check indicators-service container contract
        run: python scripts/ci/indicators_container_contract_guard.py
