name: Indicators Container Contract

on:
  pull_request:
  push:
    branches: [ main, develop ]

jobs:
  indicators-container-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check indicators-service container contract
        run: python scripts/ci/indicators_container_contract_guard.py
