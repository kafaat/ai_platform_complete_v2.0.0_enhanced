name: R11 contracts one-shot governed evidence regeneration

on:
  push:
    branches:
      - fix/contracts-r9-tenant-provision-response-20261113

permissions:
  contents: write

jobs:
  regenerate-evidence:
    if: startsWith(github.event.head_commit.message, 'r11-run-generator')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the R11 branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/contracts-r9-tenant-provision-response-20261113
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install governance dependencies
        run: python -m pip install pytest==9.1.1 PyYAML==6.0.2 jsonschema==4.26.0
      - name: Regenerate and prove the FM-001 evidence is not promoted
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/r11-contracts-regenerate-once.yml
          git add -A
          python scripts/ci/capability_linker.py --apply
          python scripts/ci/capability_mapping_engine.py --generate
          python scripts/ci/capability_evidence_maturity_engine.py --generate
          python scripts/ci/capability_shadow_reconciliation.py --generate
          python scripts/ci/capability_parity_investment_engine.py --generate
          python scripts/ci/capability_management_engine.py --generate
          python scripts/ci/pr_capability_impact_gate.py --generate-index
          python scripts/ci/static_governance_closure.py --generate
          python scripts/ci/capability_shadow_reconciliation.py --check
          python - <<'PY'
          import json
          from pathlib import Path
          source = Path("docs/capability-registry/generated/evidence/capability_evidence_matrix.json")
          rows = json.loads(source.read_text(encoding="utf-8"))["capabilities"]
          row = next(x for x in rows if x["capability_id"] == "FM-001")
          new_test = "tests_v9/test_tenant_provision_response_shape.py"
          old_test = "tests_v9/test_tenant_provision_response_contract.py"
          assert row["assessed_maturity"] == 2, row
          assert row["maturity_alignment"] == "declared_above_evidence", row
          assert row["runtime_verified"] is False, row
          assert row["evidence"]["integration_tests"] is False, row
          assert new_test in row["unit_test_paths"], row["unit_test_paths"]
          assert old_test not in row["integration_test_paths"], row["integration_test_paths"]
          assert new_test not in row["integration_test_paths"], row["integration_test_paths"]
          print("R11 maturity guard PASS: FM-001 source-test is UNIT, no false integration promotion")
          PY
          python -m pytest -q --noconftest tests_v9/test_tenant_provision_response_shape.py
          # The source checksum bundle must be regenerated after all other artifacts,
          # but BEFORE the sweep: the sweep itself validates release checksums.
          python scripts/release/build_release_bundle.py
          git add -A
          python scripts/ci/verify_all_generated.py --check
          python scripts/release/validate_release_package.py
          python -m pytest -q --noconftest tests/architecture/test_capability_mapping_engine.py tests/architecture/test_capability_compatibility_roundtrip_guard.py
          python - <<'PY'
          import subprocess
          paths = subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines()
          expected = {
              ".github/workflows/r11-contracts-regenerate-once.yml",
              "capabilities/registry/capabilities.json",
          }
          prefixes = ("docs/capability-registry/generated/", "capabilities/generated/", "governance/generated/", "release/")
          rejected = [p for p in paths if p not in expected and not p.startswith(prefixes)]
          if rejected:
              raise SystemExit(f"Unapproved generated file paths; refuse commit: {rejected}")
          print("R11 generated file list:", *paths, sep="\n")
          PY
          git diff --cached --quiet && { echo 'No generated changes; refusing empty commit'; exit 1; }
          git commit -m 'chore(contracts): regenerate governed FM-001 evidence without false integration promotion'
          git push origin HEAD:refs/heads/fix/contracts-r9-tenant-provision-response-20261113
