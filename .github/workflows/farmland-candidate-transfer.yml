name: Verify Farmland candidate objects
on:
  push:
    branches: [ci/farmland-verified-objects-e6c583]
permissions:
  contents: write
jobs:
  retain-verified-objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check immutable source identities and retain them on this transport branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          echo 'ebcca7e3f1541ef4474c9be96117ba49468d5f0ad8e926eaaf4041f48b06a55e  candidates.pack' | sha256sum --check --strict
          git fetch --no-tags --depth=1 origin edde616977d74e67d05838e2d8182e0a23758a12
          git index-pack --stdin --fix-thin < candidates.pack
          test "$(git show -s --format=%P cabd6dd12089491a391998ef52526a99d54e9a6f)" = "edde616977d74e67d05838e2d8182e0a23758a12"
          test "$(git rev-parse cabd6dd12089491a391998ef52526a99d54e9a6f^{tree})" = "d20a50a623e8ec228614aff52a384de05a466aa9"
          git ls-tree -r cabd6dd12089491a391998ef52526a99d54e9a6f >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tip=$(git commit-tree "$GITHUB_SHA^{tree}" -p "$GITHUB_SHA" -p cabd6dd12089491a391998ef52526a99d54e9a6f -m "Retain the source verified by this run [skip ci]")
          git push origin "$tip:refs/heads/ci/farmland-verified-objects-e6c583"
