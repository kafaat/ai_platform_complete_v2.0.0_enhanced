name: Verify and transfer Farmland integration candidate
on:
  push:
    branches: [ci/farmland-1639-1641-candidate-transfer]
permissions:
  contents: write
jobs:
  publish-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Verify pack, exact parents and tree before creating the candidate ref
        shell: bash
        run: |
          set -euo pipefail
          candidate=4b492f9146d4ec025b86e908613673674ad8ad8a
          parent=90b25683070dda97b543420d04cc6a2a689cc352
          tree=760e25b1006dd14bea6ebfb826e7deef1b18f5b4
          destination=refs/heads/integration/farmland-1639-1641-qualified
          cat qualification-transfer/pack-* > "$RUNNER_TEMP/candidate.pack"
          echo '8a97012aa8500a40e18b31f6e73e06c5c20879b3190b715a3cae52e43e8dc658  candidate.pack' | (cd "$RUNNER_TEMP" && sha256sum --check --strict)
          git fetch --no-tags --depth=1 origin "$parent"
          git index-pack --stdin < "$RUNNER_TEMP/candidate.pack"
          test "$(git show -s --format=%P "$candidate")" = "$parent"
          test "$(git rev-parse "$candidate^{tree}")" = "$tree"
          git ls-tree -r "$candidate" >/dev/null
          git push origin "$candidate:$destination"
          test "$(git ls-remote origin "$destination" | cut -f1)" = "$candidate"
