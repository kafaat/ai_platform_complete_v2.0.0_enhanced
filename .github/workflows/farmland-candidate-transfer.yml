name: Recheck full aquifer preflight unit suite
'on':
  push:
    branches:
    - ci/farmland-verified-objects-e6c583
permissions:
  contents: read
jobs:
  preflight-unit:
    name: Full pytest unit gate on the measured aquifer candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        fetch-depth: 0
        ref: 94456164654f43b408edd82f86265fdaee19849b
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: tests_v9/requirements-test.txt
    - run: pip install -r tests_v9/requirements-test.txt
    - name: redis-server binary for the live Redis ACL proofs (service stopped, 6379
        empty)
      run: 'bash scripts/ci/resilient_apt_install.sh redis-server

        sudo systemctl stop redis-server

        sudo systemctl disable redis-server

        redis-server --version

        '
    - name: Verify source and run the unit command from preflight
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "94456164654f43b408edd82f86265fdaee19849b"

        test "$(git rev-parse HEAD^{tree})" = "59e0cdb6d9fb45c5184b59ffc9f9458a30e8eaec"

        python -m pytest -q -m unit'
