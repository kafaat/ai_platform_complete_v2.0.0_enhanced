name: Verify Farmland candidate objects
on:
  push:
    branches: [ci/farmland-verified-objects-e6c583]
permissions:
  contents: write
jobs:
  retain-verified-objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check immutable source identities and retain them on this transport branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          echo '17b2cf932c02f7775d919983af743875b3c5aad394fab73e06d0573752334b41  candidates.pack' | sha256sum --check --strict
          git fetch --no-tags --depth=1 origin 2d4ddb45506443495f1b4587fe73bdcb737a5a68
          git index-pack --stdin --fix-thin < candidates.pack
          test "$(git show -s --format=%P fbdd03477504d07d1021e6b3434b987dad88c662)" = "2d4ddb45506443495f1b4587fe73bdcb737a5a68"
          test "$(git rev-parse fbdd03477504d07d1021e6b3434b987dad88c662^{tree})" = "1a22e602f3165ecf060ae0837b1aa2a6b6b0a1ad"
          git ls-tree -r fbdd03477504d07d1021e6b3434b987dad88c662 >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tip=$(git commit-tree "$GITHUB_SHA^{tree}" -p "$GITHUB_SHA" -p fbdd03477504d07d1021e6b3434b987dad88c662 -m "Retain the source verified by this run [skip ci]")
          git push origin "$tip:refs/heads/ci/farmland-verified-objects-e6c583"
