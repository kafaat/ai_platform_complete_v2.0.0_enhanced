name: Verify Farmland candidate objects
on:
  push:
    branches: [ci/farmland-spatial-verified-e6c583]
permissions:
  contents: write
jobs:
  retain-verified-objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check immutable source identities and retain them on this transport branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          echo '57782fdacc261e4af9bb605da9379e679e37ee55f7c5694eededac12f5a6cbb0  candidates.pack' | sha256sum --check --strict
          git fetch --no-tags --depth=1 origin 6c9f43476686863cadfbe82d9a5f48e8aaf4ab8b
          git index-pack --stdin --fix-thin < candidates.pack
          test "$(git show -s --format=%P 9222e256591e9f8e707640eefd91832c264ddad6)" = "6c9f43476686863cadfbe82d9a5f48e8aaf4ab8b"
          test "$(git rev-parse 9222e256591e9f8e707640eefd91832c264ddad6^{tree})" = "317ad2810340ca7ae6d068faf2787ebd2d3c3ac5"
          git ls-tree -r 9222e256591e9f8e707640eefd91832c264ddad6 >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tip=$(git commit-tree "$GITHUB_SHA^{tree}" -p "$GITHUB_SHA" -p 9222e256591e9f8e707640eefd91832c264ddad6 -m "Retain the source verified by this run [skip ci]")
          git push origin "$tip:refs/heads/ci/farmland-spatial-verified-e6c583"
