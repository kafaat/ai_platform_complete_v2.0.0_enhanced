name: Verify Farmland candidate objects
on:
  push:
    branches: [ci/farmland-spatial-verified-e6c583]
permissions:
  contents: write
jobs:
  retain-verified-objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check immutable source identities and retain them on this transport branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          echo 'ac51b763a1da815d6968fb2bda4b675cc7998971d399081c9ce9291645223fce  candidates.pack' | sha256sum --check --strict
          git fetch --no-tags --depth=1 origin 38bbd51941be469533987c51e4f5cd231da67510
          git index-pack --stdin --fix-thin < candidates.pack
          test "$(git show -s --format=%P 6c9f43476686863cadfbe82d9a5f48e8aaf4ab8b)" = "38bbd51941be469533987c51e4f5cd231da67510"
          test "$(git rev-parse 6c9f43476686863cadfbe82d9a5f48e8aaf4ab8b^{tree})" = "a90af103dd9981cc1ff9b925901f789d96a70f5d"
          git ls-tree -r 6c9f43476686863cadfbe82d9a5f48e8aaf4ab8b >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tip=$(git commit-tree "$GITHUB_SHA^{tree}" -p "$GITHUB_SHA" -p 6c9f43476686863cadfbe82d9a5f48e8aaf4ab8b -m "Retain the source verified by this run [skip ci]")
          git push origin "$tip:refs/heads/ci/farmland-spatial-verified-e6c583"
