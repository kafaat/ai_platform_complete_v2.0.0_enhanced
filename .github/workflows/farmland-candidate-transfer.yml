name: Verify Farmland candidate objects
on:
  push:
    branches: [ci/farmland-spatial-verified-e6c583]
permissions:
  contents: write
jobs:
  retain-verified-objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check immutable source identities and retain them on this transport branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          echo 'f9cedcaa824df172d31581d3a386702442b05e6a4cb89bdef9470e68e3866220  candidates.pack' | sha256sum --check --strict
          git fetch --no-tags --depth=1 origin 38bbd51941be469533987c51e4f5cd231da67510
          git index-pack --stdin --fix-thin < candidates.pack
          test "$(git show -s --format=%P c0d5d2bc09928c773d344f5632cd9a0ab5ae7a28)" = "38bbd51941be469533987c51e4f5cd231da67510"
          test "$(git rev-parse c0d5d2bc09928c773d344f5632cd9a0ab5ae7a28^{tree})" = "21af2b4cd95d9fe51627c75a36bf1d4469f4fddd"
          git ls-tree -r c0d5d2bc09928c773d344f5632cd9a0ab5ae7a28 >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tip=$(git commit-tree "$GITHUB_SHA^{tree}" -p "$GITHUB_SHA" -p c0d5d2bc09928c773d344f5632cd9a0ab5ae7a28 -m "Retain the source verified by this run [skip ci]")
          git push origin "$tip:refs/heads/ci/farmland-spatial-verified-e6c583"
