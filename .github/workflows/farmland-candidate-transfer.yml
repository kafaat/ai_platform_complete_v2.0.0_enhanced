name: Verify and transfer Farmland integration candidate
on:
  push:
    branches: [ci/farmland-1639-1641-candidate-transfer]
permissions:
  contents: write
jobs:
  publish-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Verify pack, exact parents and tree before creating the candidate ref
        shell: bash
        run: |
          set -euo pipefail
          candidate=219ec87f7e0008da2597d544bcb6f8f50474cdea
          parent=4b492f9146d4ec025b86e908613673674ad8ad8a
          second=1865a1496da87ee385488cfe00b1d34eb3f9397c
          tree=b25efb632ed362be13185e7cba7d2af3d41c8e9d
          destination=refs/heads/integration/farmland-1639-1641-qualified
          cat qualification-transfer/pack-* > "$RUNNER_TEMP/candidate.pack"
          echo '952db51ee40962a91aef159537607bcd4ec16a27562ba7bb04773194ef908253  candidate.pack' | (cd "$RUNNER_TEMP" && sha256sum --check --strict)
          git fetch --no-tags --depth=1 origin "$parent" "$second"
          git index-pack --stdin < "$RUNNER_TEMP/candidate.pack"
          test "$(git show -s --format=%P "$candidate")" = "$parent $second"
          test "$(git rev-parse "$candidate^{tree}")" = "$tree"
          git ls-tree -r "$candidate" >/dev/null
          git push origin "$candidate:$destination"
          test "$(git ls-remote origin "$destination" | cut -f1)" = "$candidate"
