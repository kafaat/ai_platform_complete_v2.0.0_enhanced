name: Verify Farmland candidate objects
on:
  push:
    branches: [ci/farmland-verified-objects-e6c583]
permissions:
  contents: write
jobs:
  retain-verified-objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check immutable source identities and retain them on this transport branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          echo '17f4713f0e043e4f91d492f9054a3b0c2de49c893166a1696a61e85dbfb14f58  candidates.pack' | sha256sum --check --strict
          git fetch --no-tags --depth=1 origin 7bd8b4ca0d23bd54892f713e3856935a7d322a91
          git index-pack --stdin --fix-thin < candidates.pack
          test "$(git show -s --format=%P 2d4ddb45506443495f1b4587fe73bdcb737a5a68)" = "7bd8b4ca0d23bd54892f713e3856935a7d322a91"
          test "$(git rev-parse 2d4ddb45506443495f1b4587fe73bdcb737a5a68^{tree})" = "c155ba4ce3bb7cb2b7cc8d534e72d2cf6f347cd7"
          git ls-tree -r 2d4ddb45506443495f1b4587fe73bdcb737a5a68 >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tip=$(git commit-tree "$GITHUB_SHA^{tree}" -p "$GITHUB_SHA" -p 2d4ddb45506443495f1b4587fe73bdcb737a5a68 -m "Retain the source verified by this run [skip ci]")
          git push origin "$tip:refs/heads/ci/farmland-verified-objects-e6c583"
