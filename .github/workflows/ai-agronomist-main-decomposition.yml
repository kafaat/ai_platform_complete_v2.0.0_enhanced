name: ai-agronomist-main-decomposition

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check ai-agronomist main.py decomposition
        run: python scripts/ci/ai_agronomist_main_decomposition_guard.py
