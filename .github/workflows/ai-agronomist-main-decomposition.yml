name: ai-agronomist-main-decomposition

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check ai-agronomist main.py decomposition
        run: python scripts/ci/ai_agronomist_main_decomposition_guard.py
