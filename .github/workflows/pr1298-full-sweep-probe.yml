name: PR1298 isolated generated sweep convergence (one shot)
on:
  push:
    branches:
      - codex/pr1298-regenerated-artifacts-20261028
permissions:
  contents: write
jobs:
  sweep:
    if: github.repository == 'kafaat/ai_platform_complete_v2.0.0_enhanced'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Regenerate with repository-native sweep and demonstrate convergence
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/codex/pr1298-regenerated-artifacts-20261028"
          mkdir -p "$RUNNER_TEMP/full-sweep"
          git rev-parse HEAD > "$RUNNER_TEMP/full-sweep/input-sha.txt"
          git rm .github/workflows/pr1298-full-sweep-probe.yml
          git add -A
          python -m pip install pytest==9.1.1 PyYAML==6.0.2 jsonschema==4.26.0 > "$RUNNER_TEMP/full-sweep/bootstrap.log" 2>&1
          if ! python scripts/ci/verify_all_generated.py --fix > "$RUNNER_TEMP/full-sweep/fix.log" 2>&1; then
            tail -n 100 "$RUNNER_TEMP/full-sweep/fix.log"
            exit 1
          fi
          if ! python scripts/ci/verify_all_generated.py --check > "$RUNNER_TEMP/full-sweep/check.log" 2>&1; then
            tail -n 100 "$RUNNER_TEMP/full-sweep/check.log"
            exit 1
          fi
          git add -A
          git diff --cached --check
          git diff --cached --name-only > "$RUNNER_TEMP/full-sweep/changed-paths.txt"
          cat "$RUNNER_TEMP/full-sweep/changed-paths.txt"
          if grep -E '^(services/|shared/|migrations/|tests/|tests_v9/)' "$RUNNER_TEMP/full-sweep/changed-paths.txt"; then
            echo "REFUSING_UNEXPECTED_SOURCE_WRITE" >&2
            exit 3
          fi
          git config user.name "SAHOOL Source-Scoped Regen"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: converge generated governance artifacts on PR source"
          git rev-parse HEAD > "$RUNNER_TEMP/full-sweep/output-sha.txt"
          git push origin HEAD:refs/heads/codex/pr1298-regenerated-artifacts-20261028
      - name: Preserve full-sweep logs for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr1298-full-sweep-probe
          path: ${{ runner.temp }}/full-sweep
          if-no-files-found: warn
          retention-days: 7
