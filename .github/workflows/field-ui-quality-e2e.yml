name: SAHOOL field UI quality E2E
on:
  pull_request:
    paths:
      - 'frontend/e2e/ui-quality-field-accessibility.spec.ts'
      - '.github/workflows/field-ui-quality-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-accessibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium with bounded retries
        working-directory: frontend
        run: bash ../scripts/ci/resilient_playwright_install.sh chromium
      - name: Run three actual browser accessibility workflows
        working-directory: frontend
        run: npx playwright test e2e/ui-quality-field-accessibility.spec.ts --project=chromium --workers=1

  capability-generated-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Regenerate mapping on exact PR tree without committing
        run: python scripts/ci/capability_mapping_engine.py --generate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: field-ui-capability-mapping-candidate
          path: |
            docs/capability-registry/generated/mapping/capability_mapping.json
            docs/capability-registry/generated/mapping/capability_mapping.csv
            docs/capability-registry/generated/mapping/unmapped_artifacts.json
            docs/capability-registry/generated/mapping/ambiguous_artifacts.json
            docs/capability-registry/generated/mapping/CAPABILITY_MAPPING_REPORT.md
            docs/capability-registry/generated/mapping/mapping_manifest.json
          if-no-files-found: error
          retention-days: 2
