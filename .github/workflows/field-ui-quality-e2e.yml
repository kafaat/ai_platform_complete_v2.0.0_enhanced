name: SAHOOL field UI quality E2E
on:
  pull_request:
    paths:
      - 'frontend/e2e/ui-quality-field-accessibility.spec.ts'
      - '.github/workflows/field-ui-quality-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-accessibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium with bounded retries
        working-directory: frontend
        run: bash ../scripts/ci/resilient_playwright_install.sh chromium
      - name: Run three actual browser accessibility workflows
        working-directory: frontend
        run: npx playwright test e2e/ui-quality-field-accessibility.spec.ts --project=chromium --workers=1
