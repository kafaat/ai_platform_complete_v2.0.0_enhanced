server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    server_tokens off;

    # حدّ جسم الطلب — مرآة بوّابة الإنتاج (nginx.v9.conf: 50M). الافتراضيّ (1m) كسر
    # «تحديد حد الحقل تلقائيّ»: لقطة الخريطة لـSAM2 (~1.3MB) على POST
    # /api/segmentation/segment رُفضت 413 (بلاغ مستخدم 2026-07-04). يشمل أيضاً
    # رفع صور الآفات وأيّ multipart يمرّ من هذه الحاوية.
    client_max_body_size 50M;

    # مصدر توكن auth_request الافتراضيّ (ترويسة Authorization)؛ تتجاوزه بوّابة الراستر
    # أدناه إلى Bearer من كوكي sahool_at / access_token. (نمط بوّابة الإنتاج nginx.v9.conf.)
    set $fwd_auth $http_authorization;

    # ── Health check endpoint (للـHEALTHCHECK + k8s probes) ──
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── Raster service proxy (8001) — يجب أن يسبق /api/ العامّ ──────────
    # الواجهة تنادي قاعدة '/api/raster' (api.ts) لبلاطات/tilejson الراستر. بلا هذا
    # الموقع تسقط '/api/raster/…' إلى '/api/' العامّ ⇒ المنصّة (توجيه خاطئ ⇒ 404/خطأ).
    # الشرطة الذيليّة في proxy_pass تُجرّد البادئة: '/api/raster/v1/fields/…' ⇒ الخدمة
    # تتلقّى '/v1/fields/…'.
    #
    # نموذج المصادقة (Dev Gateway): يحاكي بوّابة الإنتاج (nginx.v9.conf) بنفس عقد الهوية.
    # سابقاً كانت بوّابة «خفيفة» تشتقّ المستأجِر من query (tid/tenant_id) أو ترويسة
    # X-Tenant-Id مباشرةً من العميل. لكن حزمة Vite الإنتاجية تُجرّد tid/access_token من
    # روابط البلاطات (import.meta.env.PROD)، وبلاطة Leaflet <img> لا تُرسل ترويسات ⇒
    # مستأجِر فارغ ⇒ خدمة الراستر تردّ 403. الإصلاح: عقد الإنتاج نفسه — كوكي HttpOnly
    # sahool_at (تُرسَل تلقائيّاً مع <img> نفس‌المصدر حين AUTH_COOKIE_SECURE=0 على HTTP)
    # ⇒ auth_request ⇒ /auth/verify يتحقّق من JWT ⇒ نحقن X-Tenant-Id **الموثّق فقط**؛
    # لا نثق بأيّ X-Tenant-Id/tid من العميل (منع انتحال المستأجِر). (npm run dev يبقى
    # خياراً محلّيّاً سريعاً بلا بوّابة — لا بديلاً معماريّاً لهذا المسار على :3003.)
    #
    # موقع داخليّ بحت: يتحقّق من JWT لدى خدمة auth ويعيد X-Tenant-ID موثّقاً في رأس الردّ.
    location = /_auth_verify {
        internal;
        proxy_pass         http://sahool-auth:8000/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header   Content-Length  "";
        proxy_set_header   Authorization   $fwd_auth;   # التوكن فقط — auth تشتقّ المستأجِر من JWT
        proxy_set_header   X-Tenant-Id     "";          # لا ثقة برؤوس العميل
        proxy_set_header   X-User-Id       "";
        proxy_set_header   X-Agent-Token   "";
    }

    # ^~ ضروريّ: بدونه يعترض regex الأصول الساكنة (`~* \.png$` أدناه) بلاطات
    # `/api/raster/.../{z}/{x}/{y}.png` فتُعامَل كملفّ ساكن مفقود ⇒ 404. البادئة ^~
    # تمنع تقييم أيّ regex لاحق لهذا المسار (أسبقيّة موقع البادئة في nginx).
    location ^~ /api/raster/ {
        # مصدر توكن auth_request: Authorization، أو access_token query (تطوير)، أو كوكي
        # sahool_at (بلاطات <img> للحزمة الإنتاجية). فارغ ⇒ /auth/verify يرفض (fail-closed).
        if ($arg_access_token) { set $fwd_auth "Bearer $arg_access_token"; }
        if ($cookie_sahool_at) { set $fwd_auth "Bearer $cookie_sahool_at"; }
        auth_request /_auth_verify;                                  # فشله ⇒ رفض، لا تمرير
        auth_request_set $raster_tenant $upstream_http_x_tenant_id;  # المستأجِر الموثّق من ردّ التحقّق
        proxy_pass         http://sahool-raster-service:8001/;
        proxy_set_header   Authorization     $http_authorization;   # JWT المستخدم كما هو (إن وُجد)
        # نحقن المستأجِر الموثّق **فقط** — يتجاوز أيّ X-Tenant-Id/tid يرسله العميل (لا انتحال).
        proxy_set_header   X-Tenant-Id       $raster_tenant;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }

    # ── وكلاء خدمات الواجهة المباشرة (بوّابة تطوير 3003) — تُحاكي توجيه nginx.v9.conf ──
    # الواجهة (api.ts) تنادي قواعد خاصّة لبعض الخدمات (vegetationApi/indicatorsApi/
    # weatherApi + kongApi لـ/api/agent//api/guardrails). بلا هذه الكتل تسقط إلى
    # catch-all '/api/' ⇒ المنصّة لا تملك هذه المسارات (vegetation/agent/guardrails غير
    # موجودة، indicators/weather تحت /api/v1/) ⇒ 404 (يكسر الدردشة/الغطاء/المؤشّرات/الطقس).
    # **يجب أن تسبق `location /api/`** (وإلّا اعترضها catch-all). نموذج تطوير: بلا
    # auth_request (لا نكرّر بوّابة الإنتاج)، نُمرّر Authorization + X-Tenant-Id فتتحقّق
    # كلّ خدمة بنفسها. الأهداف/تجريد البادئة مطابقة لـnginx.v9.conf (مصدر الحقيقة للإنتاج).

    # vegetation-analysis (مؤشّرات الغطاء النباتيّ الحقيقيّة)
    location ^~ /api/vegetation/ {
        proxy_pass         http://sahool-vegetation-analysis:8000/;
        proxy_set_header   Authorization     $http_authorization;
        proxy_set_header   X-Tenant-Id       $http_x_tenant_id;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # indicators — المنصّة تُخدّمها تحت /api/v1/indicators/ (تحويل البادئة)
    location ^~ /api/indicators/ {
        proxy_pass         http://sahool-platform:8000/api/v1/indicators/;
        proxy_set_header   Authorization     $http_authorization;
        proxy_set_header   X-Tenant-Id       $http_x_tenant_id;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # weather — المنصّة تُخدّمها تحت /api/v1/weather/ (تحويل البادئة)
    location ^~ /api/weather/ {
        proxy_pass         http://sahool-platform:8000/api/v1/weather/;
        proxy_set_header   Authorization     $http_authorization;
        proxy_set_header   X-Tenant-Id       $http_x_tenant_id;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # supervisor-agent — يُخدّم تحت بادئة /agent/ (لا الجذر). الصحّة على /health.
    location = /api/agent/health {
        proxy_pass         http://sahool-supervisor-agent:8000/health;
        proxy_set_header   Authorization     $http_authorization;
        proxy_set_header   X-Tenant-Id       $http_x_tenant_id;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location ^~ /api/agent/ {
        proxy_pass         http://sahool-supervisor-agent:8000/agent/;
        proxy_set_header   Authorization     $http_authorization;
        proxy_set_header   X-Tenant-Id       $http_x_tenant_id;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    120s;
    }

    # guardrails-engine (بوّابة الحَوكمة /validate)
    location ^~ /api/guardrails/ {
        proxy_pass         http://sahool-guardrails-engine:8000/;
        proxy_set_header   Authorization     $http_authorization;
        proxy_set_header   X-Tenant-Id       $http_x_tenant_id;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # field-segmentation — **عبر المنصّة** (لا مباشرةً كالراستر/الغطاء). خدمة التقطيع
    # تتطلّب X-Agent-Token (توكن خدمة-لخدمة، `_require_service_token`) الذي تحقنه المنصّة
    # فقط بعد تحقّق JWT — فالتوجيه المباشر إلى sahool-field-segmentation يُرفَض (لا توكن).
    # المنصّة تُخدّم المسار بلا تحويل بادئة (`/api/segmentation/…` كما هو، عبر service_proxy)،
    # فـcatch-all `/api/` يوجّهه صحيحاً أصلاً؛ هذه الكتلة الصريحة تمنحه مهلة قراءة 120s
    # (كـnginx.v9.conf) لأنّ التقطيع الآليّ/الهجين على SAM2-GPU قد يتجاوز مهلة 60s العامّة.
    location ^~ /api/segmentation/ {
        proxy_pass         http://sahool-platform:8000/api/segmentation/;
        proxy_set_header   Authorization     $http_authorization;
        proxy_set_header   X-Tenant-Id       $http_x_tenant_id;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    120s;                                    # تقطيع آليّ قد يطول.
    }

    # ── API proxy → platform backend (مباشر؛ أُزيل Kong من compose) ──
    location /api/ {
        proxy_pass         http://sahool-platform:8000/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }

    # ── Auth proxy → خدمة المصادقة (مباشر؛ أُزيل Kong) ──
    # الواجهة تنادي AUTH_URL='/auth' ثمّ تُلحِق '/auth/register' ⇒ '/auth/auth/register'؛
    # نُسوّي البادئة المُضاعَفة '/auth/auth/' → '/auth/' لتطابق مسارات خدمة auth.
    # (مطابق لِما في nginx/nginx.fixed.conf على بوّابة sahool-nginx.)
    location /auth/ {
        rewrite ^/auth/auth/(.*)$ /auth/$1 break;
        proxy_pass         http://sahool-auth:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }

    # ── WebSocket proxy → notification-agent (مباشر؛ أُزيل Kong) ──
    # وكيل الإشعارات يستمع على 8123 ومساره /ws/notifications.
    location /ws/ {
        proxy_pass          http://sahool-notification-agent:8123/ws/;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_read_timeout  3600s;
    }

    # ── SPA shell caching ──
    # index.html يجب ألا يُخزَّن طويلاً كي لا يبقى المتصفح على bundle قديم بعد النشر.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files /index.html =404;
    }

    # ── Static assets caching ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # ── SPA routing (كل المسارات غير الملفّات → index.html) ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security headers ──
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;

    # ── Gzip ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;
}
