server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # ── Health check endpoint (للـHEALTHCHECK + k8s probes) ──
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── Raster service proxy (8001) — يجب أن يسبق /api/ العامّ ──────────
    # الواجهة تنادي قاعدة '/api/raster' (api.ts) لبلاطات/tilejson الراستر. بلا هذا
    # الموقع تسقط '/api/raster/…' إلى '/api/' العامّ ⇒ المنصّة (توجيه خاطئ ⇒ 404/خطأ).
    # الشرطة الذيليّة في proxy_pass تُجرّد البادئة: '/api/raster/v1/fields/…' ⇒ الخدمة
    # تتلقّى '/v1/fields/…'.
    #
    # نموذج المصادقة (تطوير/واجهة، خفيف عمداً — بلا auth_request): نُمرّر JWT المستخدم
    # (Authorization) + X-Tenant-Id صراحةً فتتحقّق خدمة الراستر بنفسها (ملكيّة الحقل/المستأجِر).
    # **لا** نُكرّر منطق بوّابة الإنتاج: التحقّق الكامل (auth_request /_auth_verify + حقن
    # X-Tenant-Id الموثّق + X-Agent-Token) يبقى في nginx.v9.conf للمدخل العامّ. هذه بوّابة
    # تطويريّة لا مدخلاً عامّاً للإنتاج؛ تكرار auth_request هنا يزيد الانجراف بلا فائدة.
    # ^~ ضروريّ: بدونه يعترض regex الأصول الساكنة (`~* \.png$` أدناه) بلاطات
    # `/api/raster/.../{z}/{x}/{y}.png` فتُعامَل كملفّ ساكن مفقود ⇒ 404. البادئة ^~
    # تمنع تقييم أيّ regex لاحق لهذا المسار (أسبقيّة موقع البادئة في nginx).
    location ^~ /api/raster/ {
        proxy_pass         http://sahool-raster-service:8001/;
        proxy_set_header   Authorization     $http_authorization;   # JWT المستخدم كما هو
        # المستأجِر: بلاطات Leaflet <img> لا تحمل ترويسات، فنقرأ tenant_id من query
        # param حين يتوفّر، وإلّا نرتدّ لترويسة X-Tenant-Id (طلبات fetch مثل tilejson).
        set $raster_tenant $http_x_tenant_id;
        if ($arg_tenant_id) { set $raster_tenant $arg_tenant_id; }
        proxy_set_header   X-Tenant-Id       $raster_tenant;        # query-param أو ترويسة
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }

    # ── API proxy → platform backend (مباشر؛ أُزيل Kong من compose) ──
    location /api/ {
        proxy_pass         http://sahool-platform:8000/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }

    # ── Auth proxy → خدمة المصادقة (مباشر؛ أُزيل Kong) ──
    # الواجهة تنادي AUTH_URL='/auth' ثمّ تُلحِق '/auth/register' ⇒ '/auth/auth/register'؛
    # نُسوّي البادئة المُضاعَفة '/auth/auth/' → '/auth/' لتطابق مسارات خدمة auth.
    # (مطابق لِما في nginx/nginx.fixed.conf على بوّابة sahool-nginx.)
    location /auth/ {
        rewrite ^/auth/auth/(.*)$ /auth/$1 break;
        proxy_pass         http://sahool-auth:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }

    # ── WebSocket proxy → notification-agent (مباشر؛ أُزيل Kong) ──
    # وكيل الإشعارات يستمع على 8123 ومساره /ws/notifications.
    location /ws/ {
        proxy_pass          http://sahool-notification-agent:8123/ws/;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_read_timeout  3600s;
    }

    # ── Static assets caching ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SPA routing (كل المسارات غير الملفّات → index.html) ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security headers ──
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # ── Gzip ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;
}
