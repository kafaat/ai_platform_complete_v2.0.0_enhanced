server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # ── Health check endpoint (للـHEALTHCHECK + k8s probes) ──
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── Raster service proxy (8001) — يجب أن يسبق /api/ العامّ ──────────
    # الواجهة تنادي قاعدة '/api/raster' (api.ts) لبلاطات/tilejson الراستر. بلا هذا
    # الموقع تسقط '/api/raster/…' إلى '/api/' العامّ ⇒ المنصّة (توجيه خاطئ ⇒ 404/خطأ).
    # الشرطة الذيليّة في proxy_pass تُجرّد البادئة: '/api/raster/v1/fields/…' ⇒ الخدمة
    # تتلقّى '/v1/fields/…'. تُمرَّر ترويسة Authorization (JWT المستخدم) تلقائيّاً فتُفوّض
    # خدمة الراستر الطلب (ملكيّة الحقل/المستأجِر) — مطابقةً لـnginx.v9.conf/nginx.fixed.conf.
    location /api/raster/ {
        proxy_pass         http://sahool-raster-service:8001/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }

    # ── API proxy → platform backend (مباشر؛ أُزيل Kong من compose) ──
    location /api/ {
        proxy_pass         http://sahool-platform:8000/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }

    # ── Auth proxy → خدمة المصادقة (مباشر؛ أُزيل Kong) ──
    # الواجهة تنادي AUTH_URL='/auth' ثمّ تُلحِق '/auth/register' ⇒ '/auth/auth/register'؛
    # نُسوّي البادئة المُضاعَفة '/auth/auth/' → '/auth/' لتطابق مسارات خدمة auth.
    # (مطابق لِما في nginx/nginx.fixed.conf على بوّابة sahool-nginx.)
    location /auth/ {
        rewrite ^/auth/auth/(.*)$ /auth/$1 break;
        proxy_pass         http://sahool-auth:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }

    # ── WebSocket proxy → notification-agent (مباشر؛ أُزيل Kong) ──
    # وكيل الإشعارات يستمع على 8123 ومساره /ws/notifications.
    location /ws/ {
        proxy_pass          http://sahool-notification-agent:8123/ws/;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_read_timeout  3600s;
    }

    # ── Static assets caching ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SPA routing (كل المسارات غير الملفّات → index.html) ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security headers ──
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # ── Gzip ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;
}
