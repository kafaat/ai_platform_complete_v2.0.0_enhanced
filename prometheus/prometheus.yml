global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    environment: 'production'
    project:     'sahool-v9'

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['sahool-alertmanager:9093']

scrape_configs:
  # ── Backend Services ──────────────────────────────────────────
  - job_name: 'auth-service'
    static_configs:
      - targets: ['sahool-auth:8000']
    metrics_path: '/metrics'

  # FIX: أسماء الخدمات الصحيحة كما في docker-compose (fixed.yml و v9.yml كلاهما
  # يستخدم الأسماء الطويلة -service/-agent/-engine). الأسماء القصيرة السابقة
  # (sahool-indicators/…) لا تُحَلّ عبر DNS داخل الشبكة ⇒ فقدان صامت للمقاييس (up=0).
  - job_name: 'indicators-service'
    static_configs:
      - targets: ['sahool-indicators-service:8000']

  - job_name: 'vegetation-service'
    static_configs:
      - targets: ['sahool-vegetation-analysis:8000']

  - job_name: 'weather-service'
    static_configs:
      - targets: ['sahool-weather-service:8000']

  # Canonical v9 includes the standalone soil service on port 8000. The target is
  # the Compose service name (`sahool-soil-service`, docker-compose.v9.yml); there is
  # no `sahool-soil` network alias, so the short name never resolved and the scrape
  # stayed down (Copilot on #997).
  - job_name: 'soil-service'
    static_configs:
      - targets: ['sahool-soil-service:8000']

  # ── v9 New Services ───────────────────────────────────────────
  - job_name: 'supervisor-agent'
    static_configs:
      - targets: ['sahool-supervisor-agent:8000']
    metrics_path: '/metrics'

  - job_name: 'guardrails-engine'
    static_configs:
      - targets: ['sahool-guardrails-engine:8000']

  - job_name: 'edge-inference'
    static_configs:
      - targets: ['sahool-edge:8000']

  - job_name: 'notification-agent'
    static_configs:
      - targets: ['sahool-notification-agent:8123']
    metrics_path: '/metrics'



  - job_name: 'sahool-platform'
    static_configs:
      - targets: ['sahool-platform:8000']
    metrics_path: '/metrics'

  - job_name: 'raster-service'
    static_configs:
      - targets: ['sahool-raster-service:8001']
    metrics_path: '/metrics'

  - job_name: 'ai-agronomist'
    static_configs:
      - targets: ['sahool-ai-agronomist:8000']
    metrics_path: '/metrics'

  - job_name: 'rag-retrieval'
    static_configs:
      - targets: ['sahool-rag-retrieval:8000']
    metrics_path: '/metrics'

  - job_name: 'knowledge-graph'
    static_configs:
      - targets: ['sahool-knowledge-graph:8000']
    metrics_path: '/metrics'

  # ── Infrastructure ────────────────────────────────────────────
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['sahool-pg-exporter:9187']

  - job_name: 'nats-exporter'
    static_configs:
      - targets: ['sahool-nats-exporter:7777']
    metrics_path: '/metrics'

  - job_name: 'nginx'
    static_configs:
      - targets: ['sahool-nginx-exporter:9113']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['sahool-otel-collector:8889']
