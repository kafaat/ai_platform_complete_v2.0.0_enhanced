[pytest]
asyncio_mode = auto
testpaths = tests_v9
markers =
    unit: fast unit tests (no services)
    integration: requires running services
    security: security-focused tests
    slow: long-running tests
    mcp: MCP server tests
addopts =
    -v
    --tb=short
    --cov=services
    --cov=agents
    --cov=bots
    --cov-fail-under=40
    --cov-report=term-missing
