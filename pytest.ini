[pytest]
asyncio_mode = auto
# جذر المستودع على sys.path في كلّ تشغيل (أيّ cwd، محليّ/CI) — يحمي اختبارات
# shared.* من ترتيب الأدلة (تصادم اسم الحزمة shared: repo-root + services/mcp_servers/shared).
# ملاحظة: الحُرّاس التي تستورد shared.* عالية-الاصطدام تُحمَّل عبر المسار المطلق (نمط aquacrop).
pythonpath = .
testpaths = tests_v9
markers =
    unit: fast unit tests (no services)
    integration: requires running services
    security: security-focused tests
    slow: long-running tests
    mcp: MCP server tests
# التغطية لا تُفرض في addopts (كانت --cov-fail-under=40 تُفشل كلّ تشغيل pytest،
# بما فيه وظيفتا integration/security في CI). تُطلب التغطية صراحةً في وظيفة
# الوحدات بـ--cov، والأرضيّة هناك. هذا يُبقي التشغيلات الأخرى نظيفة.
addopts =
    -v
    --tb=short
