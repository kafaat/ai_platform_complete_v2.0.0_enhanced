# nats/nats.conf — إعداد NATS JetStream لـSAHOOL v9 (PR #394).
#
# الغرض: تحديد حدود تخزين JetStream لمنع امتلاء القرص (الافتراضيّ غير محدود).
# نستخدم ملفّ إعداد بدل أعلام CLI لأنّ أسماء الأعلام (max_file_store/max_memory_store)
# غير مؤكَّدة عبر إصدارات nats-server — صياغة الملفّ مستقرّة وموثَّقة.
#
# قيم محافظة (متوافقة مع mem_limit: 384m للحاوية في docker-compose.v9.yml):
#   max_memory_store: 256MB — سقف رسائل JetStream في الذاكرة (دون mem_limit الحاوية).
#   max_file_store:   2GB   — سقف التخزين الدائم على القرص (mount: nats-js:/data/jetstream).
#
# المنفذ والمراقبة:
#   http: 8222  — منفذ المراقبة (healthz/varz) — يطابق الـhealthcheck في compose.
#   store_dir   — مجلّد التخزين الدائم (يطابق الـvolume mount).
#
# ═══ المصادقة — NATS-BROKER-HAS-NO-AUTHENTICATION-…-01 ════════════════════
#
# **الملاحظةُ التي كانت هنا صادقةٌ عن المنفذ وصامتةٌ عن المصادقة**، وهذا هو العطل:
# كانت تقول «منفذ العميل 4222 افتراضيّ ولا يحتاج تصريحاً هنا» — وهو صحيحٌ حرفيّاً،
# فيُقرأ إقراراً بأنّ لا شيءَ ناقصاً. والملفُّ لم يحمل `authorization` ولا `accounts`
# ولا `users`، فكان الوسيطُ **مفتوحاً لكلّ من بلغ شبكةَ `sahool-internal`**: أيُّ
# حاويةٍ مخترَقة في المكدّس تنشر وتشترك على أيّ موضوع بلا اعتماد.
#
# **وما يمرّ به فعلاً هو ما يُقاس هنا** — أحداثُ الصندوق الصادر وJetStream والإشعارات.
# ولا يُدَّعى أنّ هذا مسارٌ إلى الأجهزة: الأثرُ الفيزيائيّ لا يمرّ بـNATS أصلاً
# (`actuator-service` فيه صفرُ ذكرٍ لـNATS، يعمل بحلقة طابور ويوقّع HMAC وينشر على
# MQTT المُصادَق)، وقد نُقِضت دعوى العكس مرّتين وسُجّل نقضُها في صفّ الفجوة.
#
# **والاعتمادُ يُورَث من البيئة ولا يُكتَب هنا:** `$NATS_USER` و`$NATS_PASSWORD`
# يستوفيهما nats-server من بيئة العمليّة، وcompose يُلزِمهما بـ`:?` فلا يُقلِع
# المكدّس بسرٍّ افتراضيّ منشور — وهو الصنفُ الذي يفرضه
# `compose_no_default_secrets_guard`.
#
# **حدُّ صدقٍ مُعلَن:** هذا اعتمادٌ **واحد** لكلّ العملاء، لا عزلَ بين الخدمات ولا
# تحديدَ مواضيع لكلٍّ منها (`accounts`/`permissions`)، ولا TLS على 4222. فهو يقطع
# «أيُّ حاويةٍ على الشبكة تنشر» ولا يقطع «خدمةٌ معتمَدةٌ تنشر على موضوع غيرها».
# والتوسيعُ إلى حساباتٍ بصلاحيّاتٍ لكلّ خدمة عملٌ تالٍ مُسجَّل، لا مُدَّعًى هنا.
#
# ولا يُصادَق منفذُ المراقبة 8222: `healthcheck` في compose يقرأ `/healthz` منه،
# وهو داخل الشبكة نفسِها ولا يُنشَر إلى المضيف. تغييرُ ذلك يكسر فحصَ الصحّة.

http: 8222

authorization {
  user: $NATS_USER
  password: $NATS_PASSWORD
  timeout: 5
}

jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 256MB
  max_file_store: 2GB
}
