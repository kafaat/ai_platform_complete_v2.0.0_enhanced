# nats/nats.conf — إعداد NATS JetStream لـSAHOOL v9 (PR #394).
#
# الغرض الأصليّ: تحديد حدود تخزين JetStream لمنع امتلاء القرص (الافتراضيّ غير محدود).
# نستخدم ملفّ إعداد بدل أعلام CLI لأنّ أسماء الأعلام (max_file_store/max_memory_store)
# غير مؤكَّدة عبر إصدارات nats-server — صياغة الملفّ مستقرّة وموثَّقة.
#
# قيم محافظة (متوافقة مع mem_limit: 384m للحاوية في docker-compose.v9.yml):
#   max_memory_store: 256MB — سقف رسائل JetStream في الذاكرة (دون mem_limit الحاوية).
#   max_file_store:   2GB   — سقف التخزين الدائم على القرص (mount: nats-js:/data/jetstream).
#
# المراقبة: `http: 8222` (healthz/varz) — يقرؤه healthcheck في compose وsahool-nats-exporter.
# يبقى HTTP بلا مصادقة ولا TLS: داخل الشبكة نفسِها، لا يُنشَر إلى المضيف، ولا يحمل رسائل.
#
# ═══ الهويّات — NATS-BROKER-HAS-NO-AUTHENTICATION-…-01 ثمّ NATS-AUTHORIZATION-NOT-ENFORCED ═══
#
# **ما كان (مقيس على main@1cb6cd6c):** اعتمادٌ **واحد** (`$NATS_USER`/`$NATS_PASSWORD`) تحمله
# ثلاثَ عشرةَ خدمة في `NATS_URL`، بلا `permissions`. فكلُّ خدمةٍ معتمَدة تنشر وتشترك على
# **أيّ** موضوع: عاملُ النبات ينشر `sahool.events.*` باسم المنصّة، وأيُّ عاملٍ يشترك في
# `_INBOX.>` فيقرأ ما يُسلِّمه JetStream لوكيل الإشعارات، أو يحذف الدفقَ `sahool` كلَّه.
# وثلاثٌ من الثلاثَ عشرة (`sahool-soil-service` · `sahool-weather-service` ·
# `sahool-telegram-bot`) **لا عميلَ NATS فيها أصلاً** — تحمل كلمةَ مرورٍ لا تستعملها.
#
# **وما صار:** لكلّ خدمةٍ تتّصل فعلاً هويّةٌ باسم خدمتها في compose، وكلمةُ مرورٍ من بيئة
# الوسيط (`$NATS_<…>_PASSWORD`، يُلزِمها compose بـ`:?` — لا سرَّ افتراضيّاً)، ومواضيعُ
# **مُشتقّةٌ من شيفرتها** لا من تخمين. واختبارُ `tests_v9/test_nats_least_privilege.py`
# يُطابِقها بالشيفرة، ويُثبِتها حيّةً على nats-server حقيقيّ حين يتوفّر.
#
# **قواعدُ التصميم:**
#   * لا `no_auth_user`: المجهولُ يُرفَض. و`default_permissions` ترفض كلَّ شيء، فهويّةٌ
#     تُضاف بلا `permissions` لا ترث «كلَّ شيء» بصمت.
#   * لا هويّةَ تنشر `>` ولا تشترك `>`.
#   * صندوقُ الردّ (`_INBOX`) لكلّ هويّةٍ باسمها: `_INBOX_<الهويّة>.>` — والعميلُ يمرّر
#     `inbox_prefix` المطابق. `_INBOX.>` لا يطابق `_INBOX_x.…` (الرمزُ الأوّل مختلف)، فلا
#     تقرأ خدمةٌ ردودَ غيرها. **الاستثناءُ الوحيد وكيلُ الإشعارات**: مستهلكوه الدائمون في
#     وضع `legacy` أُنشئوا بموضوعِ تسليمٍ `_INBOX.<nuid>` محفوظٍ في الدفق، و`queue_v1`
#     يُسلِّم إلى `_INBOX.sahool.notification.*` (`shared/notification_consumers.py`)؛
#     فيبقى له `_INBOX.>` وحده — ولا يشاركه فيه أحد.
#   * عمّالُ phase-runtime الأربعة **مجمَّدون** خلف GATE-01 (`phase_runtime_workers.py`)
#     وينشرون Core NATS بلا إقرار: رفضُ الإذن عندهم لا يرفع استثناءً (مقيسٌ حيّاً)، فيُوسَم
#     الصفُّ `published`. لذلك مواضيعُهم **بالتمام** كما تُشتقّ من الشيفرة، والاختبارُ
#     يُسقِط CI إن أضافت الشيفرةُ موضوعاً لا تُغطّيه هذه القائمة.
#   * مالكُ الدفق اليوم وكيلُ الإشعارات (JETSTREAM-STREAM-TOPOLOGY-OWNED-BY-A-CONSUMER-01):
#     **يُحصَر امتيازُه ولا يُنزَع** — `STREAM.CREATE.sahool` وحدَه، بلا تعديلٍ ولا حذفٍ ولا
#     تفريغ، ومستهلكوه بأسمائهم التسعة (legacy + queue_v1).
#   * إنشاءُ مستهلكٍ على الدفق يعني قراءتَه: nats-py (2.10 و2.16) يُنشئ المستهلكَ الدائم بـ
#     `CONSUMER.DURABLE.CREATE.<stream>.<name>` — **لا يحمل موضوعَ التصفية**، فالإذنُ يُحصَر
#     بالاسم لا بالموضوع. حدٌّ مُعلَن: حاملُ اسمٍ مسموحٍ يستطيع إنشاءه بتصفيةٍ أوسع.
#
# **والأثرُ الفيزيائيّ لا يمرّ بهذا الوسيط** — `actuator-service` يستهلك طابور القاعدة ويوقّع
# HMAC وينشر على MQTT المُصادَق. و`sahool.actuator.dispatch.requested` إشعارُ تسليمٍ
# (`request_adapter_dispatch` مُعلَنٌ `physical_effect=False`) لا أمرُ تشغيل، ولا مستهلكَ له.
#
# ═══ TLS ═══
#
# كان 4222 نصّاً صريحاً: كلماتُ المرور والرسائل تعبر `sahool-internal` مقروءة. صار TLS
# **مُلزَماً** (وجودُ كتلة `tls` يجعل الوسيطَ يُعلن `tls_required` ويرفض من لا يُرقّي).
# الشهادةُ **لا تُلتزَم** (`nats/tls/` في .gitignore): `sahool-nats-tls-init` يفحصها قبل
# الإقلاع، ويولّد CA تطويرٍ وشهادةَ خادمٍ **فقط** حين تغيب و`SAHOOL_ENV` صريحةٌ غيرُ
# إنتاجيّة — سياسةُ `sahool-nginx-tls-init` نفسُها (scripts/nats/ensure_nats_tls.sh).
# والعملاءُ يتحقّقون بالسياق الافتراضيّ لـnats-py (`CERT_REQUIRED` + فحصُ اسم المضيف)،
# ويصلهم CA الوسيط عبر `SSL_CERT_DIR` — إضافةٌ إلى مخزن النظام لا استبدالٌ له.

http: 8222

tls {
  cert_file: "/etc/nats/tls/server.pem"
  key_file: "/etc/nats/tls/server-key.pem"
  timeout: 5
}

authorization {
  timeout: 5

  # هويّةٌ بلا `permissions` لا ترث «كلَّ شيء».
  default_permissions: {
    publish: { deny: [">"] }
    subscribe: { deny: [">"] }
  }

  users: [
    # ── المنصّة: OutboxWorker ⇐ make_jetstream_publisher (js.publish ينتظر PubAck) ──
    # الموضوعُ `'sahool.events.' || p_event_type` (migrations/v11 · v18). ولا يتّصل أصلاً
    # ما دامت `FEATURE_NATS_PUBLISHERS=false` (الافتراض، ولا يغيّره هذا الملفّ).
    {
      user: "sahool-platform"
      password: $NATS_PLATFORM_PASSWORD
      permissions: {
        publish: { allow: ["sahool.events.>"] }
        subscribe: { allow: ["_INBOX_sahool-platform.>"] }
      }
    }

    # ── عمّالُ phase-runtime: Core NATS، نشرٌ فقط، ولا اشتراكَ ولا صندوقَ ردّ ──
    {
      # `persist_runtime_event(event_type=…)` ⇐ `sahool.<event_type بنقاطٍ بدل _>`
      user: "sahool-phase-runtime-outbox-worker"
      password: $NATS_OUTBOX_WORKER_PASSWORD
      permissions: {
        publish: {
          allow: [
            "sahool.phase9.execution.plan.created"
            "sahool.phase9.autonomy.cycle.completed"
          ]
        }
        subscribe: { deny: [">"] }
      }
    }
    {
      # طلبُ التنفيذ + أحداثُ الخطافات (`KNOWN_HOOKS` بتحويل العامل نفسِه — والتباعدُ عن
      # `sahool.events.*` مفتوحٌ باسمه: NATS-SUBJECT-NAMESPACE-CONTRACT-DIVERGENCE).
      user: "sahool-plugin-runtime-worker"
      password: $NATS_PLUGIN_WORKER_PASSWORD
      permissions: {
        publish: {
          allow: [
            "sahool.plugin.execution.requested"
            "sahool.field.updated"
            "sahool.recommendation.before"
            "sahool.recommendation.after"
            "sahool.recommendation.created"
            "sahool.alert.created"
            "sahool.operation.completed"
            "sahool.model.promoted"
            "sahool.billing.usage.recorded"
            "sahool.digital.twin.snapshot.created"
          ]
        }
        subscribe: { deny: [">"] }
      }
    }
    {
      user: "sahool-model-registry-worker"
      password: $NATS_MODEL_WORKER_PASSWORD
      permissions: {
        publish: {
          allow: ["sahool.model.promotion.requested", "sahool.model.rollback.requested"]
        }
        subscribe: { deny: [">"] }
      }
    }
    {
      user: "sahool-actuator-dispatch-worker"
      password: $NATS_ACTUATOR_WORKER_PASSWORD
      permissions: {
        publish: { allow: ["sahool.actuator.dispatch.requested"] }
        subscribe: { deny: [">"] }
      }
    }

    # ── مُرحِّلُ إرساليّات الحجز (profile `relay`): اشتراكُ Core على موضوعين، ولا نشر ──
    {
      user: "sahool-reservation-dispatch-relay-worker"
      password: $NATS_RELAY_WORKER_PASSWORD
      permissions: {
        publish: { deny: [">"] }
        subscribe: {
          allow: [
            "sahool.events.irrigation.reservation.dispatch_requested"
            "sahool.events.irrigation.reservation.dispatch_failed"
          ]
        }
      }
    }

    # ── عاملُ الإسقاط الكنسيّ والتعلّم: مستهلكٌ دائمٌ لكلّ موضوعٍ من ثلاثة ──
    # الأسماءُ `durable_for_subject(CANONICAL_LEARNING_DURABLE, subject)` بالقاعدة الافتراضيّة
    # في compose؛ تغييرُ القاعدة يستوجب تعديلَ هذه الأسطر (والوسيطُ يرفض الإنشاءَ بصخب).
    # `$JS.API.INFO` لـ`--preflight` (healthcheck).
    {
      user: "sahool-canonical-execution-learning-worker"
      password: $NATS_LEARNING_WORKER_PASSWORD
      permissions: {
        publish: {
          allow: [
            "$JS.API.INFO"
            "$JS.API.STREAM.NAMES"
            "$JS.API.CONSUMER.INFO.sahool.canonical-execution-learning-v1-irrigation-execution-completed"
            "$JS.API.CONSUMER.INFO.sahool.canonical-execution-learning-v1-season-closed"
            "$JS.API.CONSUMER.INFO.sahool.canonical-execution-learning-v1-agronomy-projection-requested"
            "$JS.API.CONSUMER.DURABLE.CREATE.sahool.canonical-execution-learning-v1-irrigation-execution-completed"
            "$JS.API.CONSUMER.DURABLE.CREATE.sahool.canonical-execution-learning-v1-season-closed"
            "$JS.API.CONSUMER.DURABLE.CREATE.sahool.canonical-execution-learning-v1-agronomy-projection-requested"
            "$JS.ACK.sahool.canonical-execution-learning-v1-irrigation-execution-completed.>"
            "$JS.ACK.sahool.canonical-execution-learning-v1-season-closed.>"
            "$JS.ACK.sahool.canonical-execution-learning-v1-agronomy-projection-requested.>"
          ]
        }
        subscribe: { allow: ["_INBOX_sahool-canonical-execution-learning-worker.>"] }
      }
    }

    # ── وكيلُ الإشعارات: مالكُ الدفق `sahool` ومستهلكوه التسعة ──
    # `legacy` (افتراضُ compose) يُنشئ الدفقَ والمستهلكين؛ `queue_v1` يربط ما زوّده المشغِّلُ
    # بـ`shared.notification_consumers --apply` (`CONSUMER.CREATE` بأسماء `_queue_v1`).
    # ونقطةُ `/notification/test` لا تبلغ الوسيطَ (`shared.helpers.get_nats()` فارغٌ في هذه
    # العمليّة)، فلا إذنَ لها.
    {
      user: "sahool-notification-agent"
      password: $NATS_NOTIFICATION_PASSWORD
      permissions: {
        publish: {
          allow: [
            "sahool.notification.dead_letter"
            "$JS.API.STREAM.INFO.sahool"
            "$JS.API.STREAM.CREATE.sahool"
            "$JS.API.STREAM.NAMES"
            "$JS.API.CONSUMER.INFO.sahool.*"
            "$JS.API.CONSUMER.DURABLE.CREATE.sahool.notif_satellite"
            "$JS.API.CONSUMER.DURABLE.CREATE.sahool.notif_weather"
            "$JS.API.CONSUMER.DURABLE.CREATE.sahool.notif_pest"
            "$JS.API.CONSUMER.DURABLE.CREATE.sahool.notif_irrigation"
            "$JS.API.CONSUMER.DURABLE.CREATE.sahool.notif_fertilizer"
            "$JS.API.CONSUMER.DURABLE.CREATE.sahool.notif_stock"
            "$JS.API.CONSUMER.DURABLE.CREATE.sahool.notif_task"
            "$JS.API.CONSUMER.DURABLE.CREATE.sahool.notif_economic"
            "$JS.API.CONSUMER.DURABLE.CREATE.sahool.notif_domain_events"
            "$JS.API.CONSUMER.CREATE.sahool.notif_satellite_queue_v1"
            "$JS.API.CONSUMER.CREATE.sahool.notif_weather_queue_v1"
            "$JS.API.CONSUMER.CREATE.sahool.notif_pest_queue_v1"
            "$JS.API.CONSUMER.CREATE.sahool.notif_irrigation_queue_v1"
            "$JS.API.CONSUMER.CREATE.sahool.notif_fertilizer_queue_v1"
            "$JS.API.CONSUMER.CREATE.sahool.notif_stock_queue_v1"
            "$JS.API.CONSUMER.CREATE.sahool.notif_task_queue_v1"
            "$JS.API.CONSUMER.CREATE.sahool.notif_economic_queue_v1"
            "$JS.API.CONSUMER.CREATE.sahool.notif_domain_events_queue_v1"
            "$JS.ACK.sahool.notif_satellite.>"
            "$JS.ACK.sahool.notif_weather.>"
            "$JS.ACK.sahool.notif_pest.>"
            "$JS.ACK.sahool.notif_irrigation.>"
            "$JS.ACK.sahool.notif_fertilizer.>"
            "$JS.ACK.sahool.notif_stock.>"
            "$JS.ACK.sahool.notif_task.>"
            "$JS.ACK.sahool.notif_economic.>"
            "$JS.ACK.sahool.notif_domain_events.>"
            "$JS.ACK.sahool.notif_satellite_queue_v1.>"
            "$JS.ACK.sahool.notif_weather_queue_v1.>"
            "$JS.ACK.sahool.notif_pest_queue_v1.>"
            "$JS.ACK.sahool.notif_irrigation_queue_v1.>"
            "$JS.ACK.sahool.notif_fertilizer_queue_v1.>"
            "$JS.ACK.sahool.notif_stock_queue_v1.>"
            "$JS.ACK.sahool.notif_task_queue_v1.>"
            "$JS.ACK.sahool.notif_economic_queue_v1.>"
            "$JS.ACK.sahool.notif_domain_events_queue_v1.>"
          ]
        }
        subscribe: { allow: ["_INBOX.>"] }
      }
    }

    # ── عاملُ تراكب الطقس: سقالةٌ خلف `WEATHER_GRID_PIPELINE_ENABLED` (افتراضُها OFF) ──
    # nats-py فيه غيرُ مثبَّت (`>=2.3.0`)، فتُسمَح صيغتا الإنشاء للمستهلك نفسِه.
    {
      user: "sahool-weather-polygon-worker"
      password: $NATS_WEATHER_POLYGON_PASSWORD
      permissions: {
        publish: {
          allow: [
            "sahool.weather.field.overlay.completed"
            "$JS.API.STREAM.NAMES"
            "$JS.API.CONSUMER.INFO.sahool.polygon-worker"
            "$JS.API.CONSUMER.DURABLE.CREATE.sahool.polygon-worker"
            "$JS.API.CONSUMER.CREATE.sahool.polygon-worker"
            "$JS.API.CONSUMER.CREATE.sahool.polygon-worker.>"
            "$JS.ACK.sahool.polygon-worker.>"
          ]
        }
        subscribe: { allow: ["_INBOX_sahool-weather-polygon-worker.>"] }
      }
    }

    # ── النبات: نتيجةُ التحليل best-effort (`VEGETATION_NATS_PUBLISH_MODE`) ──
    {
      user: "sahool-vegetation-analysis"
      password: $NATS_VEGETATION_PASSWORD
      permissions: {
        publish: { allow: ["sahool.tenant.*.satellite.*.computed"] }
        subscribe: { allow: ["_INBOX_sahool-vegetation-analysis.>"] }
      }
    }
  ]
}

jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 256MB
  max_file_store: 2GB
}
