# nats/nats.conf — إعداد NATS JetStream لـSAHOOL v9 (PR #394).
#
# الغرض: تحديد حدود تخزين JetStream لمنع امتلاء القرص (الافتراضيّ غير محدود).
# نستخدم ملفّ إعداد بدل أعلام CLI لأنّ أسماء الأعلام (max_file_store/max_memory_store)
# غير مؤكَّدة عبر إصدارات nats-server — صياغة الملفّ مستقرّة وموثَّقة.
#
# قيم محافظة (متوافقة مع mem_limit: 384m للحاوية في docker-compose.v9.yml):
#   max_memory_store: 256MB — سقف رسائل JetStream في الذاكرة (دون mem_limit الحاوية).
#   max_file_store:   2GB   — سقف التخزين الدائم على القرص (mount: nats-js:/data/jetstream).
#
# المنفذ والمراقبة:
#   http: 8222  — منفذ المراقبة (healthz/varz) — يطابق الـhealthcheck في compose.
#   store_dir   — مجلّد التخزين الدائم (يطابق الـvolume mount).
#
# ملاحظة: منفذ العميل 4222 افتراضيّ في nats-server ولا يحتاج تصريحاً هنا.

http: 8222

jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 256MB
  max_file_store: 2GB
}
