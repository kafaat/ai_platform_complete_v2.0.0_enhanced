services:
  production-preflight:
    image: busybox:1.37.0
    restart: "no"
    environment:
      SAHOOL_ENV: ${SAHOOL_ENV:?SAHOOL_ENV required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD required}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      SAHOOL_AGENT_TOKEN: ${SAHOOL_AGENT_TOKEN:?SAHOOL_AGENT_TOKEN required}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY required}
      FIELD_SERVICE_TENANT_ASSERTION_KEY: ${FIELD_SERVICE_TENANT_ASSERTION_KEY:?FIELD_SERVICE_TENANT_ASSERTION_KEY required}
      SCOUT_INGEST_S3_ACCESS_KEY: ${SCOUT_INGEST_S3_ACCESS_KEY:?SCOUT_INGEST_S3_ACCESS_KEY required}
      SCOUT_INGEST_S3_SECRET_KEY: ${SCOUT_INGEST_S3_SECRET_KEY:?SCOUT_INGEST_S3_SECRET_KEY required}
      RASTER_S3_ACCESS_KEY: ${RASTER_S3_ACCESS_KEY:?RASTER_S3_ACCESS_KEY required}
      RASTER_S3_SECRET_KEY: ${RASTER_S3_SECRET_KEY:?RASTER_S3_SECRET_KEY required}
      ZLMEDIAKIT_IMAGE: ${ZLMEDIAKIT_IMAGE:?ZLMEDIAKIT_IMAGE sha256 digest required}
      # W3-12: service tokens whose absence only shows up at request time, as a 503 from the
      # endpoint that needs them (field-task verification callback, scouting media, edge sync).
      # In production the stack refuses to start instead.
      TASK_SERVICE_CALLBACK_TOKEN: ${TASK_SERVICE_CALLBACK_TOKEN:?TASK_SERVICE_CALLBACK_TOKEN required}
      SCOUT_MEDIA_SERVICE_TOKEN: ${SCOUT_MEDIA_SERVICE_TOKEN:?SCOUT_MEDIA_SERVICE_TOKEN required}
      EDGE_SYNC_TOKEN: ${EDGE_SYNC_TOKEN:?EDGE_SYNC_TOKEN required}
      # nginx injects it as X-Field-Tasks-Token on /api/v1/field-tasks/; field-management's
      # fm_gateway compares it; unset, every field-task route answers 503
      # field_tasks_token_unconfigured (fm_gateway.authorize).
      FIELD_TASKS_SERVICE_TOKEN: ${FIELD_TASKS_SERVICE_TOKEN:?FIELD_TASKS_SERVICE_TOKEN required}
    command: ["sh", "-ec", "test \"$$SAHOOL_ENV\" = production; test $${#FIELD_SERVICE_TENANT_ASSERTION_KEY} -ge 32; case \"$$ZLMEDIAKIT_IMAGE\" in *@sha256:*) ;; *) echo ZLMEDIAKIT_IMAGE-must-use-sha256 >&2; exit 1;; esac; echo production-preflight-ok"]

  # W2-02 (routes-3/decision-9): AC-1 is always required in production; the composer is pinned
  # on here (not left to an env default) and the platform refuses to boot without it.
  sahool-platform:
    environment:
      AGRONOMIC_CONTEXT_COMPOSE_ENABLED: "true"
  sahool-field-management:
    depends_on:
      production-preflight: {condition: service_completed_successfully}
  # COMPOSE-ALTERNATES-UNGUARDED-AND-NAME-INCOMPATIBLE-01 (2026-10-17): كانا
  # `vegetation-analysis-service` و`sahool-raster` — اسمان لا وجود لهما في v9، فكان
  # `docker compose -f v9 -f production config` يرفض المشروع كلّه («neither an image nor
  # a build context») والأمرُ الإنتاجيّ القانونيّ أدناه لا يُقلِع. وصار يحرسه
  # scripts/ci/compose_roster_guard.py (خدمةُ التراكب موجودةٌ في v9 أو تحمل image/build).
  sahool-vegetation-analysis:
    depends_on:
      production-preflight: {condition: service_completed_successfully}
  sahool-raster-service:
    depends_on:
      production-preflight: {condition: service_completed_successfully}
  # W0-08 (scout-2): a production edge has a device identity, or none of its observations can be
  # attributed and synced. Without it the edge still answers (sync_status not_synced_identity),
  # but production refuses to start that way.
  sahool-edge:
    environment:
      EDGE_DEVICE_ID: ${EDGE_DEVICE_ID:?EDGE_DEVICE_ID required in production (one per edge device)}

# Canonical production command:
# docker compose -f docker-compose.v9.yml -f docker-compose.production.yml up -d
