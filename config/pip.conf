# مرآة pip صينيّة لـSAHOOL (PyPI الافتراضي محجوب/بطيء في اليمن)
# الاستخدام على المضيف:
#   نسخ هذا الملفّ إلى ~/.config/pip/pip.conf (لينكس)
#   أو ~/.pip/pip.conf  أو  %APPDATA%\pip\pip.ini (ويندوز)
[global]
index-url = https://pypi.tuna.tsinghua.edu.cn/simple
trusted-host = pypi.tuna.tsinghua.edu.cn
# مرايا بديلة (فعّل واحدة لو تعطّلت تسينغهوا):
