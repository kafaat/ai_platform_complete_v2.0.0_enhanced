version: 2
requirement: IRR-F01
note: >-
  Sliced adoption of the IRR-FOUNDATION-01 reference. Only gap-closing entities
  are built now (capacity/reservation + target binding). Topology versioning and
  path closure are deferred; the hydraulic path is answered by a query over the
  existing v171 graph, not by new projection/version tables.
entities:
  hydraulic_capacity_evaluations:
    classification: NEW
    owner: sahool-platform/irrigation
    status: adopt
    sources:
      - canonical_hydraulic_capabilities
      - canonical_irrigation_capability_graphs
      - irrigation_hydraulic_nodes
      - irrigation_resource_reservations
  irrigation_resource_reservations:
    classification: NEW
    owner: sahool-platform/irrigation
    status: adopt
    references:
      - irrigation_hydraulic_nodes
  irrigation_resource_reservation_events:
    classification: NEW
    owner: sahool-platform/irrigation
    status: adopt
  irrigation_target_bindings:
    classification: NEW
    owner: sahool-platform/irrigation
    status: adopt
    references:
      - fields
      - management_zones
      - irrigation_hydraulic_nodes
  irrigation_hydraulic_path:
    classification: QUERY_OVER_EXISTING
    owner: sahool-platform/irrigation
    status: adopt
    sources:
      - irrigation_hydraulic_nodes
      - irrigation_hydraulic_segments
  irrigation_physical_graph_versions:
    classification: DEFERRED
    owner: sahool-platform/irrigation
    reason: content-hash versioning already exists (capability_digest); a version-chain is a separate ADR
  irrigation_physical_path_closure:
    classification: DEFERRED
    owner: sahool-platform/irrigation
    reason: reachability is answered by a recursive query over v171; a projection table + rebuild worker is an optimization, not the gap
  canonical_irrigation_execution_api:
    classification: PROJECTION_OF
    owner: sahool-platform/irrigation
    sources:
      - irrigation_manual_executions
      - as_applied_irrigation_runs
      - canonical_as_applied_irrigation_truths
      - execution_requests
  canonical_irrigation_evidence_api:
    classification: PROJECTION_OF
    owner: sahool-platform/irrigation
    sources:
      - as_applied_irrigation_receipts
      - as_applied_irrigation_observations
      - irrigation_manual_execution_events
  irrigation_water_allocations:
    classification: REFERENCE_ONLY
    owner: sahool-platform/irrigation
    reason: v170 daily-volume quota ledger; not mutated to carry per-field flow entitlement
  device_identity:
    classification: REFERENCE_ONLY
    owner: actuator-iot-registry
forbidden_parallel_tables:
  - irrigation_assets
  - irrigation_executions
  - irrigation_execution_evidence
forbidden_alter_add:
  - irrigation_water_allocations
