    # WX-10.7 append-only reviewer/policy audit. Materializes ONLY under a deployed SoR
    # (services/decision-service/migrations/002_decision_review.sql, applied via migration_runner,
    # never at startup). decision-service is the sole writer (append-only; DB trigger blocks
    # UPDATE/DELETE); there is no platform mirror for a state transition. In the current
    # interim-bridge deployment the review endpoint fails closed (503) so nothing is written yet.
    owner: decision-service
    writers: [decision-service]
    status: interim-bridge
    readers: [decision-service]
    source: "services/decision-service/migrations/002_decision_review.sql"
  decision_execution_plans:
    # WX-10.9 append-only planned projection of an approved decision. No dispatch side effect.
    owner: decision-service
    writers: [decision-service]
    status: interim-bridge
    readers: [decision-service]
    source: "services/decision-service/migrations/003_execution_plan.sql"
  decision_dispatch_authorizations:
    # WX-10.10 append-only authorization record. It authorizes a later dispatch increment but
