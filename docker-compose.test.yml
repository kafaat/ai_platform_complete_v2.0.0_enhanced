# SAHOOL v9.1.0 — Test Infrastructure
services:
  test-postgres:
    image: postgis/postgis:15-3.4
    container_name: sahool-test-postgres
    environment:
      POSTGRES_DB: sahool_test
      POSTGRES_USER: sahool_test
      POSTGRES_PASSWORD: test_password
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sahool_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  test-redis:
    image: redis:7-alpine
    container_name: sahool-test-redis
    command: redis-server --requirepass test_redis_pass
    ports: ["127.0.0.1:6380:6379"]

  test-nats:
    image: nats:2.10-alpine
    container_name: sahool-test-nats
    command: ["--js"]
    ports: ["127.0.0.1:4223:4222"]

  test-qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: sahool-test-qdrant
    environment:
      QDRANT__SERVICE__API_KEY: "test_qdrant_key"
    ports: ["127.0.0.1:6334:6333"]
