# alembic.ini — إعداد Alembic لـSAHOOL
#
# ملاحظة: مشروع SAHOOL يستخدم هجرات SQL خام (asyncpg) لا ORM. هذا الإعداد
# يُدير الهجرات المستقبليّة عبر Alembic مع احترام الـ20 هجرة اليدويّة الحاليّة
# (تُعدّ baseline مُطبَّقاً — انظر alembic/versions/0001_baseline.py).
#
# الاستخدام (في بيئتك حيث alembic مثبّت + DB متاحة):
#   pip install alembic
#   alembic stamp 0001_baseline   # وسم الهجرات الحاليّة كمُطبَّقة (مرّة واحدة)
#   alembic revision -m "وصف"      # إنشاء هجرة جديدة
#   alembic upgrade head           # تطبيق الهجرات الجديدة
#   alembic downgrade -1           # تراجع خطوة

[alembic]
script_location = alembic
prepend_sys_path = .

# قالب اسم ملفّ الهجرة: رقم تسلسلي + وصف
file_template = %%(rev)s_%%(slug)s

# المنطقة الزمنيّة للطوابع
timezone = UTC

# sqlalchemy.url يُقرأ من متغيّر البيئة DATABASE_URL في env.py
# (لا نضع كلمة سرّ هنا — أمان)
sqlalchemy.url =

[post_write_hooks]
# (اختياري) صياغة الهجرات تلقائيّاً

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
