      retries: 6
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════
  # 14b. Decision Service (INTERIM non-authoritative mirror, dual-path d201527)
  # ═══════════════════════════════════════════════════════════════
  # sahool-platform is the authoritative Source-of-Record and performs the real DB write,
  # then best-effort mirrors here. SoR-promotion code-prep: DB env is an OPT-IN passthrough that
  # DEFAULTS EMPTY — unset DECISION_SERVICE_DATABASE_URL ⇒ DATABASE_URL="" ⇒ sor_enabled() false ⇒
  # honest mirror (persisted:false). Cutover is env-only (supply a restricted DB role + set
  # DECISION_SERVICE_SOR_ENABLED=true) after the explicit scripts/deploy/decision_service_migrate.sh
  # step; schema is never auto-applied at startup.
  # Platform does NOT depend on this service's health — a dead mirror never blocks the write.
  sahool-decision-service:
    build:
      context: .
      dockerfile: services/decision-service/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DECISION_SERVICE_DATABASE_URL:-}
      DECISION_SERVICE_SOR_ENABLED: ${DECISION_SERVICE_SOR_ENABLED:-false}
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8160/healthz"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ═══════════════════════════════════════════════════════════════
  # 15. Actuator Service
  # ═══════════════════════════════════════════════════════════════
  sahool-actuator-service:
    build:
      context: .
      dockerfile: services/actuator-service/Dockerfile
    restart: unless-stopped
    environment:
      # v8-F9: يتّصل التطبيق بدور sahool_app المقيّد (NOBYPASSRLS) الذي يُنشئه sahool-migrate
      # (apply_in_compose.sh) — لا sahool_user المُمتاز. RLS يبقى مفروضاً (بلا تعطيل حارس FINDING-001).
      DATABASE_URL: ${DATABASE_URL:-postgresql://sahool_app:${APP_DB_PASSWORD:-sahool_app_pw}@sahool-postgres:5432/sahool}
      REDIS_URL: redis://:${REDIS_PASSWORD}@sahool-redis:6379/0
      # لا وسيط MQTT (sahool-fastbee) في هذا الـcompose ⇒ نُعطّل مستمع MQTT صراحةً
      # كي يقلع actuator نظيفاً (_mqtt_disabled) بدل حلقة "MQTT listener crashed" كلّ
      # 10ث على مضيف وهميّ. للإنتاج بوسيط حقيقيّ اضبط MQTT_BROKER_URL=mqtt://host:1883.
      MQTT_BROKER_URL: disabled
      JWT_SECRET: ${JWT_SECRET}
      # مستهلك التوزيع المحكوم (default-off): يسحب execution-requests من decision-service
      # ويسلّمها عبر MQTT. يبقى معطَّلاً هنا (لا وسيط MQTT في هذا الـcompose) — التفعيل
      # الفعليّ في v9/الإنتاج فقط بعد بوّابات staging.
      FEATURE_DISPATCH_ACTUATOR: ${FEATURE_DISPATCH_ACTUATOR:-false}
      DECISION_SERVICE_URL: ${DECISION_SERVICE_URL:-http://sahool-decision-service:8160}
      DECISION_SERVICE_TOKEN: ${DECISION_SERVICE_AUTH_TOKEN:-}
      ACTUATOR_DISPATCH_TENANT_IDS: ${ACTUATOR_DISPATCH_TENANT_IDS:-}
      ACTUATOR_DISPATCH_POLL_SECONDS: ${ACTUATOR_DISPATCH_POLL_SECONDS:-30}
      ACTUATOR_DISPATCH_RISK_ALLOWLIST: ${ACTUATOR_DISPATCH_RISK_ALLOWLIST:-low}
      ACTUATOR_DEVICE_STALE_SECONDS: ${ACTUATOR_DEVICE_STALE_SECONDS:-900}
      ACTUATOR_DELIVERY_TOKEN_KEY: ${ACTUATOR_DELIVERY_TOKEN_KEY:-}
    depends_on:
      sahool-postgres:
        condition: service_healthy
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════
  # 16. Edge Inference (FIX: صورة عامة → build)
  # FIX-10: build context بدل image عامة
  # ═══════════════════════════════════════════════════════════════
  sahool-edge:
    build:
      context: .
      dockerfile: services/edge-inference/Dockerfile.arm64
    restart: unless-stopped
    environment:
      SAHOOL_CLOUD_URL: https://api.sahool.local
      EDGE_SYNC_TOKEN: ${EDGE_SYNC_TOKEN:-}
      EDGE_DEVICE: ${EDGE_DEVICE:-rpi5}
      OFFLINE_MODE: ${OFFLINE_MODE:-false}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-3600}
      MODEL_CACHE: /models
    volumes:
      - edge-models:/models
      - edge-sync:/data/sync_queue
    networks:
      - sahool-internal
    healthcheck:
      # صورة edge (arm64) لا تثبّت curl — نستخدم python (متوفّر) لطلب /healthz على 8100.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8100/healthz', timeout=3).read()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════
  # 17. Video Processor (FIX: ملف مقطوع → مُعلق حتى الإصلاح)
  # FIX-11: مُعلق — أكمل services/video-processor/main.py أولاً
  # ═══════════════════════════════════════════════════════════════
  # sahool-video-processor:
  #   build:
  #     context: .
  #     dockerfile: services/video-processor/Dockerfile
  #   container_name: sahool-video-processor
  #   restart: unless-stopped
  #   environment:
  #     MQTT_BROKER_URL: mqtt://sahool-fastbee:1883
  #     EDGE_INFERENCE_URL: http://sahool-edge:8100
  #     ZLMEDIA_API_URL: http://sahool-zlmediakit:8080
  #   networks:
  #     - sahool-internal

  # ═══════════════════════════════════════════════════════════════
  # 18. Local AI RAG (FIX: Ollama URL داخل Docker)
  # FIX-12: EMBEDDING_URL و LLM_URL يشيران إلى sahool-ollama
  # ═══════════════════════════════════════════════════════════════
  sahool-local-ai-rag:
    build:
      context: .
      dockerfile: services/local-ai-rag/Dockerfile
    restart: unless-stopped
    environment:
      QDRANT_HOST: sahool-qdrant
      QDRANT_PORT: 6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      EMBEDDING_URL: http://sahool-ollama:11434/api/embeddings
      LLM_URL: http://sahool-ollama:11434/api/generate
      EMBEDDING_MODEL: nomic-embed-text
      LLM_MODEL: llama3.2:3b
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      sahool-qdrant:
        condition: service_started  # FIX: qdrant image is distroless, no healthcheck
      sahool-ollama:
        condition: service_healthy
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════
  # 19. Qdrant Seed (FIX: restart دائم → "no")
  # FIX-13: لا يُعاد تشغيله تلقائيًا
  # ═══════════════════════════════════════════════════════════════
  sahool-qdrant-seed:
    build:
      context: .
      dockerfile: services/qdrant-seed/Dockerfile
    restart: "no"
    environment:
      QDRANT_HOST: sahool-qdrant
      QDRANT_PORT: 6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      EMBEDDING_URL: http://sahool-ollama:11434/api/embeddings
      EMBEDDING_MODEL: nomic-embed-text
    depends_on:
      sahool-qdrant:
        condition: service_started  # FIX: qdrant image is distroless, no healthcheck
      sahool-ollama:
        condition: service_healthy
    networks:
      - sahool-internal

  # ═══════════════════════════════════════════════════════════════
  # 20. Odoo Bridge (FIX: ODOO_PASSWORD فارغ → required)
  # FIX-14: ODOO_PASSWORD مطلوب
  # ═══════════════════════════════════════════════════════════════
  sahool-erp-bridge:
    build:
      context: .
      dockerfile: services/odoo-bridge/Dockerfile
    restart: unless-stopped
    environment:
      # v8-F9: يتّصل التطبيق بدور sahool_app المقيّد (NOBYPASSRLS) الذي يُنشئه sahool-migrate
      # (apply_in_compose.sh) — لا sahool_user المُمتاز. RLS يبقى مفروضاً (بلا تعطيل حارس FINDING-001).
      DATABASE_URL: ${DATABASE_URL:-postgresql://sahool_app:${APP_DB_PASSWORD:-sahool_app_pw}@sahool-postgres:5432/sahool}
      ERP_PROVIDER: ${ERP_PROVIDER:-erpnext}
      ERPNEXT_URL: ${ERPNEXT_URL:-http://sahool-erpnext:8000}
      ERPNEXT_API_KEY: ${ERPNEXT_API_KEY:-}
      ERPNEXT_API_SECRET: ${ERPNEXT_API_SECRET:-}
      ODOO_URL: ${ODOO_URL:-http://sahool-odoo:8069}
      ODOO_DB: ${ODOO_DB:-sahool_erp}  # قاعدة Odoo المنفصلة (لا قاعدة المنصّة sahool)
      ODOO_USER: ${ODOO_USER:-admin}
      ODOO_PASSWORD: ${ODOO_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      sahool-postgres:
        condition: service_healthy
    networks:
      sahool-internal:
        aliases:
          - sahool-odoo-bridge
          - odoo-bridge
          - erp-bridge
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8126/healthz"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════
  # 21. Odoo ERP (FIX: مفقود في unified.yml → أضفه)
  # FIX-15: Odoo service مُضاف
  # ═══════════════════════════════════════════════════════════════
  sahool-odoo:
    image: odoo:17.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8069:8069"
    # FIX (تشغيليّ): كان Odoo بلا command فلا يُهيّئ قاعدته (entrypoint الافتراضي لا
    # يُثبّت base)، وكان ODOO_DB يُطمَس إلى «sahool» = قاعدة المنصّة (RLS) نفسها.
    # العَرَض: relation "ir_module_module" does not exist / KeyError 'ir.http'.
    # الحلّ (مطابق docker-compose.v9.yml): قاعدة Odoo منفصلة (sahool_erp) + تهيئة
    # base أوّل تشغيل + db-filter يحصر Odoo على قاعدته فلا يمسّ قاعدة المنصّة.
    # (يتطلّب أن يملك sahool_user صلاحيّة CREATEDB — وهو POSTGRES_USER المُمتاز هنا.)
    # FIX (ذاتيّ‑التعافي): entrypoint مخصّص (scripts/odoo-init.sh) يُنشئ القاعدة إن
    # غابت ويُثبّت base مرّة واحدة فقط (كشف عبر to_regclass) ثمّ يُقلع العمليّة الطويلة
    # بلا -i — فلا إعادة تثبيت كلّ إقلاع ولا حلقة فشل من تهيئة جزئيّة. entrypoint الصورة
    # الافتراضي يبقى (يولّد odoo.conf من البيئة HOST/USER/PASSWORD).
    command: ["bash", "/opt/odoo-init.sh"]
    environment:
      HOST: sahool-postgres
      USER: sahool_user
      PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${ODOO_DB:-sahool_erp}  # منفصلة عن قاعدة المنصّة sahool
    volumes:
      - ./scripts/odoo-init.sh:/opt/odoo-init.sh:ro
      - odoo-web-data:/var/lib/odoo
      - odoo-config:/etc/odoo
      - odoo-addons:/mnt/extra-addons
      # FIX: لا تُركّب filestore كـvolume متداخل منفصل. كان volume مستقلّ مُركَّب على
      # /var/lib/odoo/filestore يُنشأ بملكية root (volume فارغ والصورة لا تورّث ملكية
      # المسار المتداخل)، فيمنع مستخدم odoo (uid 101) من إنشاء
      # /var/lib/odoo/filestore/<db> ⇒ PermissionError [Errno 13] أثناء تثبيت base
      # (تظهر كأخطاء res_lang_data.xml / lang_ar / ir_module_module — أعراض لاحقة).
      # filestore الآن داخل odoo-web-data الذي يرث ملكية odoo من /var/lib/odoo في الصورة.
    depends_on:
      sahool-postgres:
        condition: service_healthy
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ═══════════════════════════════════════════════════════════════
  # 22. Telegram Bot (FIX: TELEGRAM_BOT_TOKEN فارغ → required)
  # FIX-16: TELEGRAM_BOT_TOKEN مطلوب
  # ═══════════════════════════════════════════════════════════════
  sahool-telegram-bot:
    build:
      context: .
      dockerfile: bots/telegram/Dockerfile
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN required}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?TELEGRAM_WEBHOOK_SECRET required}
      # v8-F9: يتّصل التطبيق بدور sahool_app المقيّد (NOBYPASSRLS) الذي يُنشئه sahool-migrate
      # (apply_in_compose.sh) — لا sahool_user المُمتاز. RLS يبقى مفروضاً (بلا تعطيل حارس FINDING-001).
      DATABASE_URL: ${DATABASE_URL:-postgresql://sahool_app:${APP_DB_PASSWORD:-sahool_app_pw}@sahool-postgres:5432/sahool}
      REDIS_URL: redis://:${REDIS_PASSWORD}@sahool-redis:6379/0
      NATS_URL: nats://sahool-nats:4222
      EDGE_INFERENCE_URL: http://sahool-edge:8100
      SUPERVISOR_AGENT_URL: http://sahool-supervisor-agent:8000
      SAHOOL_API_URL: http://sahool-auth:8000
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      sahool-postgres:
        condition: service_healthy
      sahool-migrate:
        condition: service_completed_successfully
      sahool-redis:
        condition: service_healthy
      sahool-nats:
        condition: service_healthy
    networks:
      - sahool-internal
    healthcheck:
      # البوت polling بلا خادم HTTP، ولا curl/pgrep في الصورة (python فقط).
      # نفحص أمر PID 1 عبر /proc للتأكّد أنّ main.py يعمل.
      test: ["CMD-SHELL", "python -c \"import sys; sys.exit(0 if b'main.py' in open('/proc/1/cmdline','rb').read() else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════
  # 23. Notification Agent
  # ═══════════════════════════════════════════════════════════════
  sahool-notification-agent:
    build:
      context: .
      dockerfile: agents/notification/Dockerfile
    restart: unless-stopped
    environment:
      # v8-F9: يتّصل التطبيق بدور sahool_app المقيّد (NOBYPASSRLS) الذي يُنشئه sahool-migrate
      # (apply_in_compose.sh) — لا sahool_user المُمتاز. RLS يبقى مفروضاً (بلا تعطيل حارس FINDING-001).
      DATABASE_URL: ${DATABASE_URL:-postgresql://sahool_app:${APP_DB_PASSWORD:-sahool_app_pw}@sahool-postgres:5432/sahool}
      REDIS_URL: redis://:${REDIS_PASSWORD}@sahool-redis:6379/0
      NATS_URL: nats://sahool-nats:4222
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      sahool-postgres:
        condition: service_healthy
      sahool-migrate:
        condition: service_completed_successfully
      sahool-redis:
        condition: service_healthy
      sahool-nats:
        condition: service_healthy
    networks:
      - sahool-internal
    healthcheck:
      # وكيل الإشعارات يستمع على 8123، ولا curl في الصورة (python فقط) — نطلب /readyz.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8123/readyz', timeout=3).read()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════
  # 24. Frontend React (FIX: npm install كـ root)
  # FIX-17: build multi-stage مع user node
  # ═══════════════════════════════════════════════════════════════
  sahool-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    # FIX: حاوية الواجهة تستمع 8080 (frontend/Dockerfile EXPOSE 8080) لا 3000 ⇒
    # كان ربط 3000:3000 وفحص :3000 يفشلان (لا شيء على 3000). صُحِّحا إلى 8080.
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-https://api.sahool.ye}
      REACT_APP_WS_URL: ${REACT_APP_WS_URL:-wss://api.sahool.ye/ws}
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════
  # 25. Prometheus + Grafana (Observability)
  # ═══════════════════════════════════════════════════════════════
  sahool-prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # FIX: تحميل ملف قواعد التنبيهات. prometheus.yml يعلن rule_files: [alerts.yml]
      # ويُحلّ نسبةً لمجلّد ملف الإعداد (/etc/prometheus) ⇒ لزم ربط alerts.yml هنا.
      # كان مفقوداً ⇒ rule_files يفشل بصمت ولا تُحمَّل أيّ قاعدة تنبيه.
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - sahool-internal

  # FIX: AlertManager كان غائباً تماماً رغم أنّ prometheus.yml يدفع التنبيهات إلى
  # sahool-alertmanager:9093 ⇒ التنبيهات كانت تُطلَق للعدم (مضيف غير موجود).
  # الاسم هنا يجب أن يطابق هدف alerting بالضبط ليُحلّ عبر DNS داخل الشبكة.
  # المُستقبِل null في monitoring/alertmanager.yml مقصود (مكافحة الإزعاج)؛ المُستقبِلات
  # الحقيقيّة تأتي عبر render-alertmanager.sh + alertmanager.overlay.example.yml.
  sahool-alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - sahool-internal

  sahool-grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:?must be set in .env}"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - sahool-internal

  # ═══════════════════════════════════════════════════════════════
  # 26. Jaeger (Tracing)
  # ═══════════════════════════════════════════════════════════════
  sahool-jaeger:
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    volumes:
      - jaeger-data:/badger
    networks:
      - sahool-internal

  # ═══════════════════════════════════════════════════════════════
  # 27. Soil Service (FIX: ملف فارغ → مُعلق)
  # FIX-18: مُعلق حتى تُكمل services/soil-service/main.py
  # ═══════════════════════════════════════════════════════════════
  # sahool-soil-service:
  #   build:
  #     context: .
  #     dockerfile: services/soil-service/Dockerfile
  #   container_name: sahool-soil-service
  #   restart: unless-stopped
  #   environment:
  #     DATABASE_URL: ${DATABASE_URL}
  #     NATS_URL: nats://sahool-nats:4222
  #   networks:
  #     - sahool-internal

  # ═══════════════════════════════════════════════════════════════
  # 27c. SAM2 Inference (استدلال SAM2 على GPU/CUDA) — OPT-IN خلف profile=gpu.
  #   يفعّل auto/hybrid في field-segmentation. الحزمة الافتراضيّة (CPU فقط) لا
  #   تشغّله ولا تعتمد عليه — field-segmentation تردّ 503 صادقاً بدونه.
  #   يتطلّب NVIDIA Container Toolkit + GPU على المضيف. الأوزان تُركَّب على /models
  #   (volume sam2-models:ro). راجع docs/SAM2_DEPLOYMENT.md.
  #   التشغيل: docker compose -f docker-compose.fixed.yml --profile gpu up -d \
  #            sahool-sam2-inference
  #   ولتفعيل المسار من field-segmentation اضبط في .env:
  #     SEGMENTATION_BACKEND=sam2
  #     SEGMENTATION_INFERENCE_URL=http://sahool-sam2-inference:8080/predict
  # ═══════════════════════════════════════════════════════════════
  sahool-sam2-inference:
    build:
      context: .
      dockerfile: services/sam2-inference/Dockerfile
    container_name: sahool-sam2-inference
    profiles: ["gpu"]
    mem_limit: 12g
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # تمرير GPU عبر Compose v2 (deploy.resources). للإعداد الأقدم استبدلها
    # بـ`runtime: nvidia` على مستوى الخدمة.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      # توكن خدمة-لخدمة (نفس عقد field-segmentation/X-Agent-Token).
      SAHOOL_AGENT_TOKEN: ${SAHOOL_AGENT_TOKEN:-}
      # مسار الأوزان داخل volume sam2-models (للقراءة فقط).
      SAM2_CHECKPOINT: ${SAM2_CHECKPOINT:-/models/sam2_hiera_large.pt}
      SAM2_MODEL_CFG: ${SAM2_MODEL_CFG:-sam2_hiera_l.yaml}
    volumes:
      # أوزان SAM2 (للقراءة فقط) — املأها قبل التشغيل (انظر الـrunbook).
      - sam2-models:/models:ro
    networks:
      - sahool-internal
    healthcheck:
      # python-urllib (لا curl في صورة CUDA). /readyz يعكس model_loaded بالمنطق.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/readyz', timeout=4).status==200 else 1)"
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s

  # ═══════════════════════════════════════════════════════════════
  # 28. AgriAI Engine (FIX: لا يوجد كود → مُعلق)
  # FIX-19: مُعلق حتى تُكمل services/agriai-engine/main.py
