      start_period: 30s

  sahool-market-mcp:
    build:
      context: .
      dockerfile: services/mcp_servers/Dockerfile
    restart: unless-stopped
    environment:
      # v8-F9: يتّصل التطبيق بدور sahool_app المقيّد (NOBYPASSRLS) الذي يُنشئه sahool-migrate
      # (apply_in_compose.sh) — لا sahool_user المُمتاز. RLS يبقى مفروضاً (بلا تعطيل حارس FINDING-001).
      DATABASE_URL: ${DATABASE_URL:-postgresql://sahool_app:${APP_DB_PASSWORD:-sahool_app_pw}@sahool-postgres:5432/sahool}
      JWT_SECRET: ${JWT_SECRET}
      ERP_BRIDGE_URL: http://sahool-erp-bridge:8126
      ODOO_BRIDGE_URL: http://sahool-erp-bridge:8126  # legacy env alias
      SAHOOL_API_URL: http://sahool-auth:8000
    depends_on:
      sahool-postgres:
        condition: service_healthy
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════
  # 12. Vegetation Analysis
  # ═══════════════════════════════════════════════════════════════
  sahool-vegetation-analysis:
    build:
      context: .
      dockerfile: services/vegetation-analysis-service/Dockerfile
    restart: unless-stopped
    environment:
      # عزل الثقة (مثل بقيّة الخدمات): التحقّق من توقيع JWT للمتّصِل. HS256 عبر JWT_SECRET
      # أو RS256 عبر JWT_PUBLIC_KEY. غيابهما ⇒ الخدمة fail-closed 503 «JWT_SECRET غير مضبوط».
      JWT_SECRET: ${JWT_SECRET}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      NATS_URL: nats://sahool-nats:4222
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SH_CLIENT_ID: ${SH_CLIENT_ID}
      SH_CLIENT_SECRET: ${SH_CLIENT_SECRET}
      COPERNICUS_USER: ${COPERNICUS_USER:-}
      COPERNICUS_PASSWORD: ${COPERNICUS_PASSWORD:-}
    depends_on:
      sahool-nats:
        condition: service_healthy
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════
  # 12b. Raster Service (الصور الجوّية + المؤشّرات + البلاطات) — port 8001
  #      يخدم تطبيق الجوال (imagery.ts + raster.ts) عبر Element84 Earth Search
  # ═══════════════════════════════════════════════════════════════
  sahool-raster-service:
    build:
      context: .
      dockerfile: services/raster-service/Dockerfile
    restart: unless-stopped
    # MEDIUM (تدقيق): خدمة داخليّة خلف nginx — لا تُكشَف على 0.0.0.0. حصر على loopback.
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      EARTH_SEARCH_URL: ${EARTH_SEARCH_URL:-https://earth-search.aws.element84.com/v1}
      HISTORICAL_SEARCH_PROVIDER: ${HISTORICAL_SEARCH_PROVIDER:-element84}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RASTER_UPLOAD_DIR: /data/rasters
      S3_ENDPOINT: ${S3_ENDPOINT:-http://sahool-minio:9000}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-sahool-admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_ALLOW_FILE_FALLBACK: ${S3_ALLOW_FILE_FALLBACK:-false}
      # v154: المطالبة الدائمة تحتاج PostgreSQL + Redis؛ يتّصل بدور sahool_app المقيّد (RLS).
      DATABASE_URL: ${DATABASE_URL:-postgresql://sahool_app:${APP_DB_PASSWORD:-sahool_app_pw}@sahool-postgres:5432/sahool}
      REDIS_URL: redis://:${REDIS_PASSWORD}@sahool-redis:6379/0
      RASTER_BATCH_CLAIM_TTL_SECONDS: ${RASTER_BATCH_CLAIM_TTL_SECONDS:-86400}
      RASTER_BATCH_LEASE_SECONDS: ${RASTER_BATCH_LEASE_SECONDS:-300}
      RASTER_WORKER_ID: ${RASTER_WORKER_ID:-raster-api}
    depends_on:
      sahool-postgres:
        condition: service_healthy
      sahool-migrate:
        condition: service_completed_successfully
      sahool-redis:
        condition: service_healthy
    volumes:
      - raster-data:/data/rasters
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/healthz')"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════
  # 13. Indicators Service
  # ═══════════════════════════════════════════════════════════════
  sahool-indicators-service:
    build:
      context: .
      dockerfile: services/indicators-service/Dockerfile
    restart: unless-stopped
    environment:
