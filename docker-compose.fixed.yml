      timeout: 5s
      retries: 6
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════
  # 14. Weather Service
  # ═══════════════════════════════════════════════════════════════
  sahool-weather-service:
    build:
      context: .
      dockerfile: services/weather-service/Dockerfile
    restart: unless-stopped
    environment:
      NATS_URL: nats://sahool-nats:4222
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      sahool-nats:
        condition: service_healthy
    networks:
      - sahool-internal
