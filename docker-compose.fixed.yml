volumes:
  postgres-data:
  redis-data:
  raster-data:
  nats-js:
  minio-data:
  qdrant-storage:
  ollama-models:
  edge-models:
  edge-sync:
  odoo-web-data:
  odoo-config:
  odoo-addons:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  jaeger-data:
  nginx-cache:
  # أوزان SAM2 (يملؤها المستخدم قبل رفع profile gpu) — راجع docs/SAM2_DEPLOYMENT.md.
  sam2-models:
