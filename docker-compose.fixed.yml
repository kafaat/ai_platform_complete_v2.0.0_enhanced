# ═══════════════════════════════════════════════════════════════════
# SAHOOL v9.1.0 — docker-compose.fixed.yml  (متغيّر/أصل تاريخيّ — ليس القانونيّ)
# القانونيّ للإنتاج هو docker-compose.v9.yml (يعتمده Makefile). هذا الملفّ يُشار إليه
# في بعض الوثائق التشغيليّة ويختلف عنه (config drift — راجع docs/ARCHITECTURE_AUDIT_2026-06-14.md).
# التاريخ: 2026-05-20
# ═══════════════════════════════════════════════════════════════════

# ── المتطلبات البيئية (ضعها في .env) ─────────────────────────────
# JWT_SECRET=your-min-32-char-secret-here
# SAHOOL_AGENT_TOKEN=your-agent-token-here
# أمان RLS: التطبيق يتّصل بدور مقيّد sahool_app (NOSUPERUSER NOBYPASSRLS) لا بـsahool_user
# (مالك الجداول يتجاوز RLS ما لم يُفرَض FORCE) — مطابقةً لـlight/unified/odoo. أنشئ الدور:
#   CREATE ROLE sahool_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD '...'; GRANT … على الجداول.
# DATABASE_URL=postgresql://sahool_app:${APP_DB_PASSWORD}@sahool-postgres:5432/sahool
# REDIS_PASSWORD=your-redis-password-here
# MINIO_ROOT_PASSWORD=your-minio-password-here
# ODOO_PASSWORD=your-odoo-password-here
# TELEGRAM_BOT_TOKEN=your-telegram-token-here
# QDRANT_API_KEY=your-qdrant-api-key-here
# SMTP_PASSWORD=your-smtp-password-here
# SH_CLIENT_ID=your-sentinel-hub-id
# SH_CLIENT_SECRET=your-sentinel-hub-secret
# COPERNICUS_USER=your-copernicus-user
# COPERNICUS_PASSWORD=your-copernicus-password
# ═══════════════════════════════════════════════════════════════════

services:

  raster-tiler-service:
    build: ./services/raster-tiler-service
    environment:
      - PORT=8088
    ports:
      - "127.0.0.1:8088:8088"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ═══════════════════════════════════════════════════════════════
  # 1. REVERSE PROXY (Nginx)
  # ═══════════════════════════════════════════════════════════════
  sahool-nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # FIX: كان ./nginx/nginx.conf (غير موجود) ⇒ nginx يفشل بالإقلاع. استُبدل
      # بـnginx.fixed.conf (HTTP-فقط، بلا شهادات) لإقلاع محلّيّ نظيف. أُزيل ربط
      # :443 وتركيب ./nginx/ssl (لا TLS هنا). للإنتاج بـTLS: docker-compose.v9.yml.
      - ./nginx/nginx.fixed.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      sahool-auth:
        condition: service_healthy
      sahool-supervisor-agent:
        condition: service_healthy
      sahool-guardrails-engine:
        condition: service_healthy
      sahool-vegetation-analysis:
        condition: service_healthy
      sahool-indicators-service:
        condition: service_healthy
      sahool-weather-service:
        condition: service_healthy
      # خدمات اختياريّة ثقيلة (سوق/Odoo/RAG): service_started بدل service_healthy كي لا
      # تُعلِّق إقلاع البوّابة للتطوير الأساسيّ — اسم الحاوية يُسجَّل في الشبكة فيُحلّ
      # upstream دون «host not found»، بلا انتظار صحّتها (نفس نمط frontend/notification).
      sahool-market-mcp:
        condition: service_started
      sahool-erp-bridge:
        condition: service_started
      sahool-local-ai-rag:
        condition: service_started
      # FIX: nginx.fixed.conf يوجّه إليهما، وnginx يحلّ أسماء upstream عند الإقلاع
      # ⇒ يجب وجود الحاويتين وإلّا "host not found in upstream". service_started
      # يكفي لتسجيل اسم الشبكة (بلا انتظار صحّتهما).
      sahool-frontend:
        condition: service_started
      sahool-notification-agent:
        condition: service_started
    networks:
      - sahool-public
      - sahool-internal
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════
  # 2. PostgreSQL + PostGIS (FIX: was postgres:15, now postgis)
  # FIX-01: استبدل postgres:15 بـ postgis/postgis:15-3.4
  # FIX-02: منفذ مكشوف 0.0.0.0 → 127.0.0.1 فقط (أو أزل ports)
  # ═══════════════════════════════════════════════════════════════
  sahool-postgres:
    image: postgis/postgis:15-3.4
    restart: unless-stopped
    # منفذ مكشوف للمضيف فقط — إذا لم تحتاجه من الخارج، أزل السطر التالي
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: sahool
      POSTGRES_USER: sahool_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      # أُزيل تركيب /docker-entrypoint-initdb.d: كان يُطبّق migrations/*.sql **أبجديّاً**
      # (لا بترتيب MANIFEST) ومرّةً واحدةً على volume فارغ فقط ⇒ v9_foundation (users/
      # fields) يعمل بعد v13/v14… التي تعتمد عليه ⇒ فشل/سباق. الآن يطبّقها sahool-migrate
      # بترتيب MANIFEST (انظر أدناه).
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahool_user -d sahool"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ═══════════════════════════════════════════════════════════════
  # 2.5 مُطبّق الهجرات (لمرّة واحدة) — يطبّق migrations بترتيب MANIFEST ثمّ يُنشئ
  #     دورَي sahool_app/sahool_jobs. يسدّ فجوة fixed.yml: بلا هذا كانت الهجرات
  #     تُطبَّق أبجديّاً عبر initdb (ترتيب خاطئ) ولا تُنشأ الأدوار. الخدمات التي
  #     تحتاج المخطّط تنتظره (service_completed_successfully) لا مجرّد postgres صحّيّاً.
  # ═══════════════════════════════════════════════════════════════
  sahool-migrate:
    image: postgis/postgis:15-3.4
    restart: "no"
    environment:
      PGHOST: sahool-postgres
      PGPORT: "5432"
      PGUSER: sahool_user
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      PGDATABASE: sahool
      APP_DB_ROLE: ${APP_DB_ROLE:-sahool_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-sahool_app_pw}
      JOBS_DB_ROLE: ${JOBS_DB_ROLE:-sahool_jobs}
      JOBS_DB_PASSWORD: ${JOBS_DB_PASSWORD:-sahool_jobs_pw}
    volumes:
      - ./migrations:/migrations:ro
    command: ["bash", "/migrations/apply_in_compose.sh"]
    depends_on:
      sahool-postgres:
        condition: service_healthy
    networks:
      - sahool-internal

  # ═══════════════════════════════════════════════════════════════
  # 3. Redis (FIX: بدون كلمة سر → requirepass)
  # FIX-03: Redis محمي بكلمة سر
  # ═══════════════════════════════════════════════════════════════
  sahool-redis:
    image: redis:7-alpine
    restart: unless-stopped
    # FIX: لا تكشف Redis للمضيف إلا إذا احتجت debugging
    # ports:
    #   - "127.0.0.1:6379:6379"
    environment:
      # expose the password inside the container so the healthcheck can
      # authenticate (redis-cli -a) and avoid NOAUTH failures.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    # FIX: redis:7-alpine لا يُنشئ /usr/local/etc/redis/، فالكتابة إليه تفشل
    # ("No such file or directory") فينكسر سلسلة && ولا يبدأ redis ⇒ unhealthy ⇒
    # تتالي فشل المعتمدين. الحلّ (مطابق لـunified/light العاملَين): تمرير الإعدادات
    # كوسائط سطر أمر مباشرةً — لا ملفّ إعداد ولا مجلّد مفقود.
    command: >
      redis-server --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD required}"
      --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - sahool-internal
    healthcheck:
      # FIX: redis runs with requirepass, so an unauthenticated command returns
      # NOAUTH and the check fails. The old `incr ping` mutated a key AND was
      # unauthenticated. Authenticate with -a and use a read-only PING.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════
  # 4. NATS JetStream (FIX: بدون persistence → JetStream store)
  # FIX-04: JetStream store دائم
  # ═══════════════════════════════════════════════════════════════
  sahool-nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: >
      --js
      --store_dir /data/jetstream
      --http_port 8222
    volumes:
      - nats-js:/data/jetstream
    networks:
      - sahool-internal
    healthcheck:
      # FIX: nats:2-alpine ships BusyBox wget whose --spider is unreliable; use
      # -qO- and hit the monitoring port 8222 (--http_port 8222), not 4222.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 60s

  # ═══════════════════════════════════════════════════════════════
  # 5. MinIO (FIX: كلمة سر جذرية مكشوفة → env var)
  # FIX-05: MINIO_ROOT_PASSWORD من .env
  # ═══════════════════════════════════════════════════════════════
  sahool-minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    restart: unless-stopped
    # MEDIUM (تدقيق): تخزين داخليّ — لا يُكشَف على 0.0.0.0. حصر على loopback (المضيف فقط).
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sahool-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 60s

  # ═══════════════════════════════════════════════════════════════
  # 6. Qdrant (FIX: بدون API key → مُحمي)
  # FIX-06: Qdrant API Key
  # ═══════════════════════════════════════════════════════════════
  sahool-qdrant:
    image: qdrant/qdrant:v1.17.1
    restart: unless-stopped
    # لا تكشف Qdrant للمضيف إلا إذا احتجت debugging
    # ports:
    #   - "127.0.0.1:6333:6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY required}
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - sahool-internal
    # FIX: the official qdrant/qdrant image is DISTROLESS — it has NO curl, wget
    # or shell, so the previous `curl ... /healthz` test could NEVER run and the
    # container was always marked "unhealthy", which then cascaded to every
    # service that waits on it via `condition: service_healthy`
    # (local-ai-rag, qdrant-seed). There is no usable HTTP client inside the
    # image, so we drop the in-container healthcheck and gate dependents on
    # service_started instead. (For a true readiness gate, build a wrapper image
    # that adds a static healthcheck binary — see report.)

  # ═══════════════════════════════════════════════════════════════
  # 7. Ollama (FIX: مفقود للـ RAG)
  # FIX-07: أضف Ollama لخدمة local-ai-rag
  # ═══════════════════════════════════════════════════════════════
  sahool-ollama:
    image: ollama/ollama:0.30.8
    restart: unless-stopped
    # GPU اختياري ومُعطَّل افتراضيّاً: حجز جهاز nvidia يُفشِل `up` على مضيف بلا
    # NVIDIA runtime ("could not select device driver nvidia"). إن توفّر GPU
    # أزل التعليق عن البلوك التالي.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - sahool-internal
    healthcheck:
      # FIX: the ollama/ollama image does NOT ship curl — the old curl test
      # could never run, so ollama was always "unhealthy" and dependents
      # (local-ai-rag, qdrant-seed) waiting on service_healthy failed to start.
      # The image bundles the `ollama` CLI; `ollama list` hits the local API.
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ═══════════════════════════════════════════════════════════════
  # 8. Auth Service (FIX: JWT_SECRET فارغ → required)
  # FIX-08: JWT_SECRET مطلوب
  # ═══════════════════════════════════════════════════════════════
  sahool-auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    restart: unless-stopped
    # تطوير محلّيّ: تُنشَر على loopback ليصلها المتصفّح مباشرةً (frontend/.env.local:
    # VITE_AUTH_URL=http://localhost:8120). الإنتاج (v9.yml) خلف nginx فقط.
    ports:
      - "127.0.0.1:8120:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      REDIS_URL: redis://:${REDIS_PASSWORD}@sahool-redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required — min 32 chars}
      JWT_EXPIRE_MINUTES: 60
      REFRESH_EXPIRE_DAYS: 30
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD required}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@sahool.ye}
      FRONTEND_URL: ${FRONTEND_URL:-https://app.sahool.ye}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      sahool-postgres:
        condition: service_healthy
      sahool-migrate:
        condition: service_completed_successfully
      sahool-redis:
        condition: service_healthy
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════
  # 9. Supervisor Agent (FIX: SAHOOL_AGENT_TOKEN فارغ → required)
  # FIX-09: SAHOOL_AGENT_TOKEN مطلوب
  # ═══════════════════════════════════════════════════════════════
  sahool-supervisor-agent:
    build:
      context: .
      dockerfile: services/supervisor-agent/Dockerfile
    restart: unless-stopped
    environment:
      # v8-F9: يتّصل التطبيق بدور sahool_app المقيّد (NOBYPASSRLS) الذي يُنشئه sahool-migrate
      # (apply_in_compose.sh) — لا sahool_user المُمتاز. RLS يبقى مفروضاً (بلا تعطيل حارس FINDING-001).
      DATABASE_URL: ${DATABASE_URL:-postgresql://sahool_app:${APP_DB_PASSWORD:-sahool_app_pw}@sahool-postgres:5432/sahool}
      MCP_SENTINEL_HUB_URL: http://sahool-sentinel-hub-mcp:8000/mcp/v1
      MCP_WEATHER_URL: http://sahool-weather-mcp:8000/mcp/v1
      MCP_WOFOST_URL: http://sahool-wofost-mcp:8000/mcp/v1
      MCP_MARKET_URL: http://sahool-market-mcp:8000/mcp/v1
      SAHOOL_AGENT_TOKEN: ${SAHOOL_AGENT_TOKEN:?SAHOOL_AGENT_TOKEN required}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      sahool-auth:
        condition: service_healthy
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════
  # 9b. SAHOOL Platform — المنطق الأساسي (الحقول/الحصاد/TrueUp/الأنشطة)
  # FINDING-002 (تدقيق): كانت مفقودة هنا ⇒ نداءات supervisor-agent إليها تفشل
  # صامتاً (PLATFORM_URL=http://sahool-platform:8000). أُضيفت من تعريف v9.yml
  # (بلا اعتماد sahool-migrate غير الموجود هنا — fixed.yml يُهيّئ عبر initdb).
  # ═══════════════════════════════════════════════════════════════
  sahool-platform:
    build:
      context: .
      dockerfile: services/sahool-platform/Dockerfile
    restart: unless-stopped
    # تطوير محلّيّ: تُنشَر على loopback ليصلها المتصفّح مباشرةً (frontend/.env.local:
    # VITE_API_URL=http://localhost:8000). بدونها كلّ نداءات /api/v1/* تفشل (الواجهة
    # على :3000 لا تصل المنصّة). الإنتاج (v9.yml) خلف nginx فقط (لا منفذ مضيف).
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SAHOOL_JWT_SECRET: ${JWT_SECRET}
      # SEC-1: fixed.yml is dev-only (RLS bypass allowlisted below) ⇒ default a DEV env
      # so a careless run never gets production-env + RLS-bypass together. Override via env.
      SAHOOL_ENV: ${SAHOOL_ENV:-development}
      JWT_SECRET: ${JWT_SECRET}
      # v8-F9: يتّصل التطبيق بدور sahool_app المقيّد (NOBYPASSRLS) الذي يُنشئه sahool-migrate
      # (apply_in_compose.sh) — لا sahool_user المُمتاز. RLS يبقى مفروضاً (بلا تعطيل حارس FINDING-001).
      DATABASE_URL: ${DATABASE_URL:-postgresql://sahool_app:${APP_DB_PASSWORD:-sahool_app_pw}@sahool-postgres:5432/sahool}
      REDIS_URL: redis://:${REDIS_PASSWORD}@sahool-redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RASTER_SERVICE_URL: ${RASTER_SERVICE_URL:-http://sahool-raster-service:8001}
      WEATHER_SERVICE_URL: ${WEATHER_SERVICE_URL:-http://sahool-weather-service:8000}
      SOIL_SERVICE_URL: ${SOIL_SERVICE_URL:-http://sahool-soil-service:8000}
      # Best-effort mirror target (dual-path): platform writes are authoritative; mirror failures are swallowed.
      DECISION_SERVICE_URL: ${DECISION_SERVICE_URL:-http://sahool-decision-service:8160}
      # أعلام الميزات المتقدّمة (تحرس راوترات؛ مُطفأة افتراضاً ⇒ 404 والواجهة تعرض حالة
      # «معطّلة» صادقة). فعّل ما تريد عبر .env (1/true). انظر RUNBOOK.md +
      # services/sahool-platform/api/feature_registry.py + frontend featureFlags.ts.
      FEATURE_PORTFOLIO_COMMAND: ${FEATURE_PORTFOLIO_COMMAND:-0}
      FEATURE_DEVICE_TWIN: ${FEATURE_DEVICE_TWIN:-0}
      FEATURE_DELTA_SYNC: ${FEATURE_DELTA_SYNC:-0}
      FEATURE_NATURAL_LANGUAGE_GIS: ${FEATURE_NATURAL_LANGUAGE_GIS:-0}
      FEATURE_DECISION_STUDIO: ${FEATURE_DECISION_STUDIO:-0}
      FEATURE_OPERATIONS_WALL: ${FEATURE_OPERATIONS_WALL:-0}
      FEATURE_REPLAY_MAP: ${FEATURE_REPLAY_MAP:-0}
      FEATURE_EVIDENCE_MAP: ${FEATURE_EVIDENCE_MAP:-0}
      FEATURE_LEARNING_DASHBOARD: ${FEATURE_LEARNING_DASHBOARD:-0}
      FEATURE_DECISION_CONFIDENCE: ${FEATURE_DECISION_CONFIDENCE:-0}
      FEATURE_UNIFIED_LINEAGE: ${FEATURE_UNIFIED_LINEAGE:-0}
      FEATURE_GIS_KERNEL: ${FEATURE_GIS_KERNEL:-0}
      FEATURE_IRRIGATION_NETWORK: ${FEATURE_IRRIGATION_NETWORK:-0}
      FEATURE_EXECUTION_FEEDBACK: ${FEATURE_EXECUTION_FEEDBACK:-0}
    depends_on:
      sahool-postgres:
        condition: service_healthy
      sahool-migrate:
        condition: service_completed_successfully
      sahool-redis:
        condition: service_healthy
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════
  # 10. Guardrails Engine
  # ═══════════════════════════════════════════════════════════════
  sahool-guardrails-engine:
    build:
      context: .
      dockerfile: services/guardrails-engine/Dockerfile
    restart: unless-stopped
    environment:
      # v8-F9: يتّصل التطبيق بدور sahool_app المقيّد (NOBYPASSRLS) الذي يُنشئه sahool-migrate
      # (apply_in_compose.sh) — لا sahool_user المُمتاز. RLS يبقى مفروضاً (بلا تعطيل حارس FINDING-001).
      DATABASE_URL: ${DATABASE_URL:-postgresql://sahool_app:${APP_DB_PASSWORD:-sahool_app_pw}@sahool-postgres:5432/sahool}
      REDIS_URL: redis://:${REDIS_PASSWORD}@sahool-redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      # FINDING-003: /validate يتطلّب X-Agent-Token مطابقاً لـSAHOOL_AGENT_TOKEN؛ بلا حقنه
      # هنا تُرجِع الحَوكمة 503 (مغلقة بأمان لكنّها معطّلة). نفس قيمة supervisor-agent.
      SAHOOL_AGENT_TOKEN: ${SAHOOL_AGENT_TOKEN:?SAHOOL_AGENT_TOKEN required}
    depends_on:
      sahool-postgres:
        condition: service_healthy
      sahool-migrate:
        condition: service_completed_successfully
      sahool-redis:
        condition: service_healthy
    networks:
      - sahool-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════
  # 11. MCP Servers (4 خدمات — منافذ داخلية مختلفة ليست ضرورية)
  # ═══════════════════════════════════════════════════════════════
  sahool-sentinel-hub-mcp:
