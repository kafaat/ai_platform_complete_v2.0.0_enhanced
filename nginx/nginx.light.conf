# SAHOOL v9.1 — nginx.light.conf (FIXED)
# FIXED: envsubst for DOMAIN, rate limiting added, upstream ports corrected

worker_processes auto;
error_log /var/log/nginx/error.log warn;

events { worker_connections 2048; }

http {
    server_tokens off;
    # ══ Real IP Detection ════════════════════════════════════════
    # ضروريّ قبل allow/deny: خلف بروكسي/ingress يصبح $remote_addr عنوان البروكسي
    # الخاصّ، فتمرّ كلّ الحركة الخارجيّة عبر «الداخليّ فقط». نثق XFF من الخاصّ فقط
    # (مطابقة nginx.v9.conf) ليُقيَّم العنوان الحقيقي للعميل.
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  192.168.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip on;
    client_max_body_size 50M;
    gzip_types text/plain application/json text/css application/javascript;

    # ── DNS المنبع (Finding #1 في مراجعة v25) ─────────────────────────
    # بلا resolver يحلّ nginx أسماء الخدمات **مرّة** عند الإقلاع ويُثبّت IP الحاوية؛ فإذا
    # استُبدِلت حاوية (إعادة إنشاء/ترقية) صار /auth وغيره 502 حتى إعادة تحميل nginx —
    # العطلُ الذي قاسه التدقيق. وغياب اسمٍ عند الإقلاع كان يُسقط nginx كلّه (host not found).
    # نفس نمط nginx.v9.conf: DNS دوكر المضمَّن + `resolve` على كلّ server + zone مشتركة
    # (شرطها). `resolve` يتطلّب nginx ≥ 1.27.3 ⇒ الصورة مُثبَّتة في compose على 1.27.5.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # ── Rate limiting (FIXED: added) ─────────────────────────
    limit_req_zone $binary_remote_addr zone=auth_limit:10m    rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m     rate=60r/m;
    limit_req_zone $binary_remote_addr zone=agent_limit:10m   rate=20r/m;

    # ── Upstreams (FIXED: all internal ports = 8000) ────────
    upstream auth_backend       { server sahool-auth:8000 resolve;            zone auth_backend 64k;       keepalive 10; }
    upstream supervisor_backend { server sahool-supervisor:8000 resolve;      zone supervisor_backend 64k; keepalive 5; }
    upstream video_backend      { server sahool-video-processor:8000 resolve; zone video_backend 64k;      keepalive 5; }
    upstream actuator_backend   { server sahool-actuator:8000 resolve;        zone actuator_backend 64k;   keepalive 5; }
    upstream edge_backend       { server sahool-edge:8100 resolve;            zone edge_backend 64k;       keepalive 5; }
    # الواجهة تستمع 8080 لا 80: صورةُ frontend/Dockerfile غيرُ جذريّة (`listen 8080;` في
    # frontend/nginx.conf و`EXPOSE 8080`)، وسطرُ `sed 's/listen 80;/…/'` في بنائها لا يطابق شيئاً.
    # مقيسٌ بـnginx 1.27.5 وإعدادِ الصورة الحقيقيّ: بـ:80 كان كلُّ مسار SPA عبر البوّابة 502
    # («connect() failed (111: Connection refused) … upstream "…:80/"»). مرآة fixed وv9.
    upstream frontend_backend   { server sahool-frontend:8080 resolve;        zone frontend_backend 64k;   keepalive 10; }
    upstream zlmedia_backend    { server sahool-zlmediakit:8080 resolve;      zone zlmedia_backend 64k;    keepalive 5; }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    server {
        listen 80;
        server_name _;
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl http2;
        server_name ${DOMAIN};

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options           "SAMEORIGIN"                          always;
        add_header X-Content-Type-Options    "nosniff"                             always;

        location /auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            # CRITICAL-002 (+ API-VERSIONING-GUARD-IS-A-MIRROR-01): يدعم اصطلاحَي العميل معاً
            # بلا كسر أحدهما، ويترجم كليهما إلى مسار backend المُرقَّى /v1/auth/*:
            #  • الواجهة (base=VITE_AUTH_URL=/auth + post('/auth/login')) ⇒ /auth/auth/login.
            #  • عميل REST مباشر ⇒ /auth/login.
            # القاعدة الأولى تطبّع المزدوج ثمّ break؛ الثانية تطبّع المفرد. كلاهما ينتهي
            # بـ/v1/auth/login على الخدمة. (سابقاً trailing-slash proxy_pass كان يدعم
            # الاصطلاح المزدوج فقط بالمصادفة — لا المباشر؛ هذا يدعم كليهما صراحةً.)
            rewrite ^/auth/auth/(.*)$ /v1/auth/$1 break;
            rewrite ^/auth/(.*)$ /v1/auth/$1 break;
            proxy_pass http://auth_backend;
        }
        location /api/agent/ {
            limit_req zone=agent_limit burst=10 nodelay;
            proxy_pass http://supervisor_backend/;
            proxy_read_timeout 120s;
        }
        # ── خدمات داخليّة فقط (الواجهة لا تنادها؛ تُستهلَك server-to-server) ──
        # تحكّم الأجهزة/الاستدلال/المعالجة لا يجوز أن يصل من المتصفّح مباشرةً —
        # يمرّ عبر المنصّة (authz + guardrails). نقصر الوصول على الشبكات الخاصّة.
        location /api/video/ {
            allow 127.0.0.1; allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; deny all;
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://video_backend/;
            proxy_read_timeout 300s;
        }
        location /api/actuator/ {  # 🔴 تحكّم IoT — داخليّ فقط (لا من المتصفّح)
            allow 127.0.0.1; allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; deny all;
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://actuator_backend/;
        }
        location /api/edge/ {
            allow 127.0.0.1; allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; deny all;
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://edge_backend/;
            proxy_read_timeout 120s;
        }
        location /live/ {
            proxy_pass http://zlmedia_backend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }
        location / {
            proxy_pass http://frontend_backend/;
            proxy_intercept_errors on;
            error_page 404 = @spa_fallback;
        }
        # nginx يرفض proxy_pass بمقطع URI داخل موقعٍ مُسمّى — مقيس بـ`nginx -t` (1.24 و1.27.5)
        # على نسخة HEAD مع كلّ الأسماء محلولة: «"proxy_pass" cannot have URI part … inside named
        # location» ⇒ هذه الحزمة لم تُقلِع قطّ. الصيغة الصالحة هي صيغة nginx.v9.conf: rewrite ثمّ
        # proxy_pass بلا URI.
        location @spa_fallback {
            rewrite ^(.*)$ /index.html break;
            proxy_pass http://frontend_backend;
        }
    }
}
