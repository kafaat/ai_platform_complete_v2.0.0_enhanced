# SAHOOL — nginx/nginx.fixed.conf
# تهيئة HTTP-فقط لإقلاع محلّيّ نظيف عبر docker-compose.fixed.yml (بلا TLS/شهادات).
# الإصلاح: docker-compose.fixed.yml كان يركّب ./nginx/nginx.conf (غير موجود) ⇒
# nginx يفشل بالإقلاع. هذا الملفّ يوفّر بديلاً صالحاً: /healthz على :80 + توجيه
# للخدمات الموجودة فعلاً في fixed.yml بأسمائها/منافذها الصحيحة.
# للإنتاج بـTLS استخدم docker-compose.v9.yml + nginx.v9.conf مع شهادات في nginx/ssl.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;
    client_max_body_size 50M;

    # ── upstreams: أسماء/منافذ خدمات docker-compose.fixed.yml ──
    upstream auth_backend        { server sahool-auth:8000; }
    upstream supervisor_backend  { server sahool-supervisor-agent:8000; }
    upstream guardrails_backend  { server sahool-guardrails-engine:8000; }
    upstream vegetation_backend  { server sahool-vegetation-analysis:8000; }
    upstream indicators_backend  { server sahool-indicators-service:8000; }
    upstream weather_backend     { server sahool-weather-service:8000; }
    upstream raster_backend      { server sahool-raster-service:8001; }
    upstream market_backend      { server sahool-market-mcp:8000; }
    upstream notification_ws     { server sahool-notification-agent:8123; }
    upstream frontend_backend    { server sahool-frontend:8080; }  # الواجهة تستمع 8080
    upstream platform_backend    { server sahool-platform:8000; }  # FINDING-002: المنطق الأساسي

    server {
        listen 80;
        server_name _;

        # MEDIUM (تدقيق): رؤوس أمان أساسيّة (كانت مفقودة هنا؛ موجودة في nginx.v9.conf
        # الإنتاجيّ). تُطبَّق على كلّ الاستجابات (always). HSTS مُسقَط عمداً (HTTP-only dev).
        add_header X-Frame-Options        "SAMEORIGIN"                      always;
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header X-XSS-Protection       "1; mode=block"                   always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        # فحص صحّة الحاوية (healthcheck يطلب http://localhost/healthz)
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # CRITICAL-002: يدعم اصطلاحَي العميل معاً بلا كسر أحدهما:
        #  • الواجهة (base=/auth + post('/auth/login')) ⇒ /auth/auth/login.
        #  • عميل REST مباشر ⇒ /auth/login.
        # rewrite يطبّع المزدوج إلى مفرد، وproxy_pass بلا مسار يمرّر الـURI كما هو ⇒
        # كلاهما يصل /auth/login للخدمة (التي تركّب تحت /auth/*).
        location /auth/ {
            rewrite ^/auth/auth/(.*)$ /auth/$1 break;
            proxy_pass http://auth_backend;
        }
        location /api/agent/       { proxy_pass http://supervisor_backend/agent/; }
        location /api/guardrails/  { proxy_pass http://guardrails_backend/; }
        location /api/vegetation/  { proxy_pass http://vegetation_backend/; }
        location /api/raster/      { proxy_pass http://raster_backend/; }
        location /api/indicators/  { proxy_pass http://indicators_backend/api/v1/indicators/; }
        # منطق الطقس الحيّ (Open-Meteo) في sahool-platform عبر /api/v1/weather؛ خدمة
        # weather-service جذعيّة تردّ 501. نوجّه للمنصّة (مطابقة nginx.v9.conf) بدل الجذع.
        location /api/weather/     { proxy_pass http://platform_backend/api/v1/weather/; }
        location /api/market/      { proxy_pass http://market_backend/; }
        # FINDING-002: توجيه المنطق الأساسي (الحقول/الحصاد/TrueUp/الأنشطة) للمنصّة.
        location /api/v1/          { proxy_pass http://platform_backend/api/v1/; }

        location /ws/ {
            proxy_pass         http://notification_ws/ws/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        # حارس: أيّ /api/* غير مُعرَّف يُرجِع JSON 404 لا index.html (تفادي انهيار .map)
        location /api/ {
            default_type application/json;
            return 404 '{"detail":"Not Found"}';
        }

        # الواجهة (SPA) — الباقي
        location / {
            proxy_pass http://frontend_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
