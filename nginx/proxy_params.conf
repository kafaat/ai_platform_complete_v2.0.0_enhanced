# SAHOOL v9 — nginx/proxy_params.conf
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
# دفاع في العمق: امسح رؤوس الثقة الداخليّة التي قد يحقنها عميل عبر البوّابة العامّة.
# الخلفية تشتقّ الهويّة من JWT لا من هذه الرؤوس، لكنّ المسح يُغلق احتمال انتحال
# مستقبليّ إن قرأ أحد المسارات رأساً منها بالخطأ. (X-Agent-Token سرّ خدمة‑لخدمة
# على الشبكة الداخليّة فقط — لا يمرّ عبر هذا البروكسي العامّ.)
proxy_set_header X-Tenant-Id "";
proxy_set_header X-User-Id "";
proxy_set_header X-User-Role "";
proxy_set_header X-Agent-Token "";
proxy_buffering off;
proxy_http_version 1.1;
# proxy_set_header Connection "";  # N09 FIX: moved to per-location (breaks WebSocket if set globally)
proxy_connect_timeout 10s;
proxy_send_timeout    60s;
# proxy_read_timeout مقصود حذفه عالميّاً — يُضبط لكلّ location (WebSocket/RAG يحتاجان أطول).
