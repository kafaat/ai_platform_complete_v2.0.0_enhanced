# SAHOOL v9.1 — nginx.v9.conf (FIXED)
# FIXED: envsubst for DOMAIN, rate limiting restored, upstream ports corrected

worker_processes auto;
error_log /var/log/nginx/error.log warn;

events { worker_connections 2048; }

http {
# ══ Real IP Detection (N01/N02 fix) ════════════════════════════
set_real_ip_from  172.16.0.0/12;
set_real_ip_from  10.0.0.0/8;
set_real_ip_from  192.168.0.0/16;
real_ip_header    X-Forwarded-For;
real_ip_recursive on;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;  # HIGH-NGINX-01 FIX
    gzip on;
    gzip_static     on;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/x-font-ttf image/svg+xml;
    gzip_proxied    any;
    gzip_vary       on;
    client_max_body_size 50M;
    gzip_types text/plain application/json text/css application/javascript;

    # ── Rate limiting ────────────────────────────────────────

    # ── Whitelist internal healthchecks from rate limiting ──────
    geo $limit_req_exempt {
        default          0;
        172.16.0.0/12    1;
        10.0.0.0/8       1;
        127.0.0.1        1;
    }
    # المفتاح: IP العميل الحقيقيّ (بعد real_ip_header X-Forwarded-For ⇒ $binary_remote_addr)،
    # و"" للمعفيّين (داخليّ/healthcheck) فيُلغى الحدّ لهم. كان $real_remote_addr غير مُعرَّف
    # ⇒ كلّ العملاء يتشاركون دلواً فارغاً واحداً (تحديد المعدّل معطَّل فعليّاً) — مُصحَّح.
    map $limit_req_exempt $rate_limit_key {
        1   "";
        0   $binary_remote_addr;
    }
    limit_req_status 429;
    limit_conn_zone $rate_limit_key zone=conn_limit:10m;
    limit_conn_status 429;
    limit_req_zone $rate_limit_key zone=auth_limit:10m    rate=5r/m;
    limit_req_zone $rate_limit_key zone=api_limit:10m     rate=60r/m;
    limit_req_zone $rate_limit_key zone=agent_limit:10m   rate=20r/m;
    # FIX: كتلة /tts/ تشير إلى zone=general_limit غير المُعرَّفة ⇒ كان nginx يفشل في
    # التحميل (unknown limit_req_zone). نُعرّفها هنا (معدّل عامّ معتدل) لإبقاء الكونف صالحاً.
    limit_req_zone $rate_limit_key zone=general_limit:10m rate=120r/m;

    # ── تنظيف access_token من سجلّات الوصول (يحمل JWT) ─────────────────
    # بلاطات <img> تمرّر JWT كـ`access_token` في الرابط (لا تحمل ترويسات)؛ نُخفيه من
    # السطر المُسجَّل كي لا يبقى التوكن في access.log (تخفيف OWASP لتسريب التوكن في URL).
    map $request $request_no_token {
        default                                                     $request;
        "~^(?<pre>.*[?&])access_token=[^&\s]*(?<post>.*)$"          "${pre}access_token=REDACTED${post}";
    }
    log_format main_redacted '$remote_addr - $remote_user [$time_local] "$request_no_token" '
                             '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

    # ── Upstream services (FIXED: ports match internal listen ports) ──
    upstream auth_backend        { server sahool-auth:8000;         keepalive 10; }
    upstream platform_backend    { server sahool-platform:8000;     keepalive 10; }
    # FIX: أسماء upstream كانت قصيرة لا تطابق container_name في docker-compose.v9.yml
    # (sahool-indicators ↛ sahool-indicators-service …) ⇒ host not found ⇒ nginx لا يُقلِع.
    upstream indicators_backend  { server sahool-indicators-service:8000;  keepalive 10; }
    upstream vegetation_backend  { server sahool-vegetation-analysis:8000; keepalive 10; }
    upstream weather_backend     { server sahool-weather-service:8000;     keepalive 10; }
    # raster (COG/مؤشّرات بكسليّة): كان بلا مسار بوّابة ⇒ rasterApi لا يصل في الإنتاج.
    upstream raster_backend      { server sahool-raster-service:8001;      keepalive 10; }
    # edge/soil: لا upstream مباشر في البوّابة — يُمرَّران عبر المنصّة (service_proxy) التي
    # تتحقّق JWT وتحقن X-Agent-Token خادميّاً ثمّ تتّصل بـedge/soil عبر *_SERVICE_URL.
    # upstream soil_backend     { server sahool-soil:8000;            keepalive 10; }
    upstream supervisor_backend  { server sahool-supervisor-agent:8000;    keepalive 5;  }
    upstream guardrails_backend  { server sahool-guardrails-engine:8000;   keepalive 5;  }
    upstream rag_backend         { server sahool-rag-retrieval:8000;        keepalive 5;  }
    upstream kg_backend          { server sahool-knowledge-graph:8000;      keepalive 5;  }
    upstream ai_agronomist_backend { server sahool-ai-agronomist:8000;      keepalive 5;  }
    upstream notification_ws     { server sahool-notification-agent:8123; }
    # FIX: الواجهة تستمع 8080 (Dockerfile/compose)، لا 80.
    upstream frontend_backend    { server sahool-frontend:8080;     keepalive 10; }

    include /etc/nginx/proxy_params.conf;

    # ── HTTP → HTTPS redirect ─────────────────────────────────
    server {
        listen 80;
        listen [::]:80;          # IPv6: healthcheck يحلّ localhost إلى ::1 في alpine
        server_name _;
        location /.well-known/ { root /var/www/html; }
        # فحص صحّة على HTTP السهل (healthcheck الحاوية يطلب http://localhost/healthz)
        # قبل التحويل لـHTTPS — يردّ 200 مباشرةً بلا 301.
        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
        location / { return 301 https://$host$request_uri; }
    }

    # ── Main server ───────────────────────────────────────────
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name ${DOMAIN};

        # المسار يطابق تركيب compose: ./nginx/ssl:/etc/nginx/ssl. كان /etc/nginx/certs
        # (مجلّد غير مُركَّب) ⇒ nginx يفشل بالإقلاع على :443. وفّر fullchain.pem/privkey.pem
        # في nginx/ssl/ قبل النشر (شهادات الإنتاج خارج المستودع).
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

        add_header X-RateLimit-Limit 60 always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' cdnjs.cloudflare.com cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss:;" always;  # HIGH-NGINX-02
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options           "SAMEORIGIN"                          always;
        add_header X-Content-Type-Options    "nosniff"                             always;
        add_header X-XSS-Protection          "1; mode=block"                       always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

        # سجلّ وصول بلا توكن (يُخفي access_token من بلاطات <img>).
        access_log /var/log/nginx/access.log main_redacted;

        # مصدر التوكن لطلب التحقّق الفرعيّ (auth_request): افتراضيّاً ترويسة Authorization.
        # مواقع البلاطات (<img> بلا ترويسات) تتجاوزه إلى Bearer من `access_token` query أدناه.
        set $fwd_auth $http_authorization;

        # TTS service (Yemeni Arabic — Edge TTS)
        location /tts/ {
            # FIX: لا خدمة sahool-tts في v9 (كان الاسم يُفشِل إقلاع nginx). 503 حتى تُنشر.
            return 503;
        }

        # ══ نموذج الثقة لرأس X-Tenant-Id (R6) ══════════════════════════════
        # المشكلة: الخدمات المصغّرة (raster/soil/vegetation) تثق برأس X-Tenant-Id لاشتقاق
        # المستأجِر. لو مرّ كما يرسله العميل لأمكن انتحال مستأجِر آخر (تجاوز عزل RLS).
        # الدفاع المتعدّد الطبقات:
        #   1) proxy_params.conf يمسح أيّ X-Tenant-Id يحقنه العميل (الافتراض الآمن: فارغ).
        #   2) auth_request ⇒ طلب فرعيّ داخليّ لـ/auth/verify يتحقّق من JWT لدى خدمة auth.
        #      فشله (401/403/توكن غير صالح) ⇒ nginx يرفض الطلب الأصليّ ولا يمرّره أبداً.
        #   3) عند نجاحه فقط، نلتقط tenant **الموثّق** من رأس الردّ X-Tenant-ID ونعيد حقنه.
        #   4) الخدمة المصغّرة تبقي حارس ملكيّة القاعدة (DB-ownership authz) سليماً — fail-closed
        #      احتياطيّ لا يُلمَس هنا.
        # موقع داخليّ بحت (internal) ⇒ لا يصله العميل مباشرةً، فقط الطلب الفرعيّ.
        location = /_auth_verify {
            internal;
            proxy_pass http://auth_backend/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            # نمرّر Authorization فقط — خدمة auth تشتقّ المستأجِر من JWT لا من رؤوس الثقة.
            # المصدر $fwd_auth: ترويسة Authorization عادةً، أو Bearer من access_token query
            # لبلاطات <img> (تُضبط في مواقع البلاطات قبل auth_request). فارغ ⇒ /auth/verify يرفض.
            proxy_set_header Authorization $fwd_auth;
            proxy_set_header X-Tenant-Id "";
            proxy_set_header X-User-Id "";
            proxy_set_header X-Agent-Token "";
        }

        location /auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            # CRITICAL-002: يدعم اصطلاحَي العميل معاً بلا كسر أحدهما:
            #  • الواجهة (base=/auth + post('/auth/login')) ⇒ /auth/auth/login.
            #  • عميل REST مباشر ⇒ /auth/login.
            # rewrite يطبّع المزدوج إلى مفرد؛ proxy_pass بلا مسار يمرّر الـURI كما هو ⇒
            # كلاهما يصل /auth/login للخدمة. (سابقاً: شرطة لاحقة تُجرّد /auth/ فيُكسَر
            # العميل المباشر — /auth/login ⇒ /login ⇒ 404.)
            rewrite ^/auth/auth/(.*)$ /auth/$1 break;
            proxy_pass http://auth_backend;
            include    /etc/nginx/proxy_params.conf;
        }

        # ── المنطق الموحّد (143 endpoint) → sahool-platform ──
        # الخيار (ج): البوّابة توجّه السطح الموحّد للمنصّة الأساسيّة.
        location /api/v1/ {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://platform_backend/api/v1/;
            include    /etc/nginx/proxy_params.conf;
            proxy_read_timeout 60s;
        }

        # indicators/weather: المنطق فعليّاً في sahool-platform (الخدمات stub).
        # نوجّهها للمنصّة بدل الـstub الفارغ — جوهر الخيار (ج).
        # FIX (مطابقة المسارات): تُخدَّم على المنصّة تحت بادئة /api/v1/. كان proxy_pass …/
        # يُسقِط البادئة (⇒ /dashboard و/current = 404). الآن …/api/v1/indicators/ و
        # …/api/v1/weather/ تُبقيها: /api/weather/current → /api/v1/weather/current،
        # /api/indicators/dashboard → /api/v1/indicators/dashboard.

        # P3: exact health aliases used by the web shell; keep probes from hitting wrong upstream/prefix.
        location = /api/indicators/readyz { proxy_pass http://indicators_backend/readyz; include /etc/nginx/proxy_params.conf; }
        location = /api/weather/readyz    { proxy_pass http://weather_backend/readyz;    include /etc/nginx/proxy_params.conf; }
        location = /api/vegetation/readyz { proxy_pass http://vegetation_backend/readyz; include /etc/nginx/proxy_params.conf; }

        location /api/indicators/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://platform_backend/api/v1/indicators/;
            include    /etc/nginx/proxy_params.conf;
        }
        location /api/vegetation/ {
            limit_req zone=api_limit burst=30 nodelay;
            # بلاطات المؤشّر تُحمَّل كـ<img> بلا Authorization ⇒ نشتقّ التوكن من access_token
            # query ليُتحقَّق منه عبر auth_request (نفس بوّابة JWT، لا إعفاء أمنيّ).
            if ($arg_access_token) { set $fwd_auth "Bearer $arg_access_token"; }
            # R6: تحقّق JWT ثمّ احقن المستأجِر الموثّق (انظر نموذج الثقة أعلى /auth/).
            auth_request /_auth_verify;                                  # فشله ⇒ رفض، لا تمرير.
            proxy_pass http://vegetation_backend/;
            include    /etc/nginx/proxy_params.conf;                     # أوّلاً: مسح X-Tenant-Id من العميل (افتراض آمن).
            auth_request_set $tenant $upstream_http_x_tenant_id;         # المستأجِر من ردّ التحقّق الموثّق.
            proxy_set_header X-Tenant-Id $tenant;                        # ثمّ: حقن القيمة الموثّقة (تتجاوز المسح).
        }
        # raster-service (8001): /api/raster/v1/fields/... → raster /v1/fields/... (تجريد البادئة)
        location /api/raster/ {
            limit_req zone=api_limit burst=30 nodelay;
            # بلاطات المؤشّر/الراستر تُحمَّل كـ<img> بلا Authorization ⇒ نشتقّ التوكن من
            # access_token query ليُتحقَّق منه عبر auth_request (نفس بوّابة JWT، لا إعفاء أمنيّ).
            if ($arg_access_token) { set $fwd_auth "Bearer $arg_access_token"; }
            # R6: تحقّق JWT ثمّ احقن المستأجِر الموثّق (انظر نموذج الثقة أعلى /auth/).
            auth_request /_auth_verify;                                  # فشله ⇒ رفض، لا تمرير.
            proxy_pass http://raster_backend/;
            include    /etc/nginx/proxy_params.conf;                     # أوّلاً: مسح X-Tenant-Id من العميل (افتراض آمن).
            auth_request_set $tenant $upstream_http_x_tenant_id;         # المستأجِر من ردّ التحقّق الموثّق.
            proxy_set_header X-Tenant-Id $tenant;                        # ثمّ: حقن القيمة الموثّقة (تتجاوز المسح).
            proxy_read_timeout 60s;
        }
        # استدلال الحافة (edge-inference): نقطة pest-detect محميّة بتوكن خدمة (X-Agent-Token)
        # لا بـJWT. التطبيق يستدعيها بـJWT المستخدم؛ فنتحقّق JWT عبر auth_request ثمّ نحقن
        # توكن الخدمة خادميّاً (السرّ لا يصل العميل). نفس نموذج ثقة raster/vegetation أعلاه.
        # est_edge: عبر service_proxy في المنصّة — المستخدم بـJWT، والمنصّة تتحقّق ثمّ تحقن
        # X-Agent-Token + X-Tenant-Id خادميّاً قبل تمريره إلى edge-inference. nginx لا يحقن
        # السرّ (السرّ في المنصّة فقط). proxy_params يمسح أيّ توكن يرسله العميل (دفاع مضاعف).
        location /api/edge/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://platform_backend/api/edge/;
            include    /etc/nginx/proxy_params.conf;
            client_max_body_size 12m;                                    # رفع صورة آفة (multipart).
            proxy_read_timeout 120s;                                     # الاستدلال على الصورة قد يطول.
        }
        location /api/weather/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://platform_backend/api/v1/weather/;
            include    /etc/nginx/proxy_params.conf;
        }
        # soil: عبر service_proxy في المنصّة (مثل edge) — المنصّة تتحقّق JWT وتحقن
        # X-Agent-Token + X-Tenant-Id قبل تمريره إلى soil-service. إن لم تُنشَر خدمة
        # soil ترُدّ المنصّة 502/503 بصدق (لا جذع، لا تلفيق).
        location /api/soil/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://platform_backend/api/soil/;
            include    /etc/nginx/proxy_params.conf;
        }
        # segmentation: عبر service_proxy في المنصّة (مثل edge/soil) — المنصّة تتحقّق
        # JWT وتحقن X-Agent-Token + X-Tenant-Id قبل تمريره إلى field-segmentation.
        # المسار اليدويّ حقيقيّ؛ auto/hybrid ترُدّ 503 صادقاً إن لم يُهيّأ نموذج.
        location /api/segmentation/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://platform_backend/api/segmentation/;
            include    /etc/nginx/proxy_params.conf;
            proxy_read_timeout 120s;                                     # تقطيع آليّ قد يطول.
        }
        # ── supervisor-agent ──
        # FIX (مطابقة المسارات): الواجهة تستدعي /api/agent/query و/api/agent/optimize،
        # والخدمة تُخدّمها تحت بادئة /agent/ (لا الجذر). كان proxy_pass …/ يُسقِط البادئة
        # ⇒ /query و/optimize (404). الآن …/agent/ تُبقيها: /api/agent/query → /agent/query.
        # فحص الصحّة /api/agent/health يُخدَّم من /health (لا /agent/health) فنُفرده exact-match
        # قبل بادئة /api/agent/ كي لا ينكسر مسبار الصحّة.
        location = /api/agent/health {
            limit_req zone=agent_limit burst=10 nodelay;
            proxy_pass http://supervisor_backend/health;
            include    /etc/nginx/proxy_params.conf;
        }
        location /api/agent/ {
            limit_req zone=agent_limit burst=10 nodelay;
            proxy_pass http://supervisor_backend/agent/;
            include    /etc/nginx/proxy_params.conf;
            proxy_read_timeout 120s;
        }
        location /api/guardrails/ {
            limit_req zone=agent_limit burst=10 nodelay;
            proxy_pass http://guardrails_backend/;
            include    /etc/nginx/proxy_params.conf;
        }
        location /api/rag/ {
            limit_req zone=agent_limit burst=10 nodelay;
            auth_request /_auth_verify;
            proxy_pass http://rag_backend/;
            include    /etc/nginx/proxy_params.conf;
            auth_request_set $tenant $upstream_http_x_tenant_id;
            proxy_set_header X-Tenant-Id $tenant;
            proxy_read_timeout 60s;
        }
        location /api/knowledge-graph/ {
            limit_req zone=agent_limit burst=10 nodelay;
            auth_request /_auth_verify;
            proxy_pass http://kg_backend/;
            include    /etc/nginx/proxy_params.conf;
            auth_request_set $tenant $upstream_http_x_tenant_id;
            proxy_set_header X-Tenant-Id $tenant;
            proxy_read_timeout 60s;
        }
        location /api/ai-agronomist/ {
            limit_req zone=agent_limit burst=10 nodelay;
            auth_request /_auth_verify;
            proxy_pass http://ai_agronomist_backend/;
            include    /etc/nginx/proxy_params.conf;
            auth_request_set $tenant $upstream_http_x_tenant_id;
            proxy_set_header X-Tenant-Id $tenant;
            proxy_read_timeout 120s;
        }
        location /ws/ {
            proxy_buffering    off;  # MED-NGINX-02: WebSocket
            proxy_pass         http://notification_ws/ws/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "Upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location /metrics {
            allow 127.0.0.1; allow 172.20.0.0/16;
            deny all;
            proxy_pass http://indicators_backend/metrics;
        }
        # حارس API: أيّ مسار /api/* لم تلتقطه الكتل الأخصّ أعلاه يجب أن يُرجِع JSON 404
        # لا index.html. بدونه يسقط إلى location / ثمّ @spa_fallback فيُعيد HTML بحالة 200،
        # فتحاول الواجهة تحليله كـJSON ⇒ انهيار 'x.map is not a function' (السبب الجذريّ
        # الخادميّ لـ#92/#96). الكتل الأطول بادئةً (/api/v1/…) تسبقه بمطابقة nginx الأطول.
        location /api/ {
            default_type application/json;
            return 404 '{"detail":"Not Found"}';
        }
        location / {
            proxy_pass http://frontend_backend/;
            include    /etc/nginx/proxy_params.conf;
            proxy_intercept_errors on;
            error_page 404 = @spa_fallback;
        }
        location @spa_fallback {
            rewrite ^(.*)$ /index.html break;
            proxy_pass http://frontend_backend;
        }
    }
}
