# SAHOOL v9.1 — nginx.v9.conf (FIXED)
# FIXED: envsubst for DOMAIN, rate limiting restored, upstream ports corrected

worker_processes auto;
error_log /var/log/nginx/error.log warn;

events { worker_connections 2048; }

http {
# ══ Real IP Detection (N01/N02 fix) ════════════════════════════
set_real_ip_from  172.16.0.0/12;
set_real_ip_from  10.0.0.0/8;
set_real_ip_from  192.168.0.0/16;
real_ip_header    X-Forwarded-For;
real_ip_recursive on;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;  # HIGH-NGINX-01 FIX
    gzip on;
    gzip_static     on;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/x-font-ttf image/svg+xml;
    gzip_proxied    any;
    gzip_vary       on;
    client_max_body_size 50M;
    gzip_types text/plain application/json text/css application/javascript;

    # ── Rate limiting ────────────────────────────────────────

    # ── Whitelist internal healthchecks from rate limiting ──────
    geo $limit_req_exempt {
        default          0;
        172.16.0.0/12    1;
        10.0.0.0/8       1;
        127.0.0.1        1;
    }
    map $limit_req_exempt $rate_limit_key {
        1   "";
        0   $real_remote_addr;
    }
    limit_req_status 429;
    limit_conn_zone $real_remote_addr zone=conn_limit:10m;
    limit_conn_status 429;
    limit_req_zone $real_remote_addr zone=auth_limit:10m    rate=5r/m;
    limit_req_zone $real_remote_addr zone=api_limit:10m     rate=60r/m;
    limit_req_zone $real_remote_addr zone=agent_limit:10m   rate=20r/m;

    # ── Upstream services (FIXED: ports match internal listen ports) ──
    upstream auth_backend        { server sahool-auth:8000;         keepalive 10; }
    upstream platform_backend    { server sahool-platform:8000;     keepalive 10; }
    upstream indicators_backend  { server sahool-indicators:8000;   keepalive 10; }
    upstream vegetation_backend  { server sahool-vegetation:8000;   keepalive 10; }
    upstream weather_backend     { server sahool-weather:8000;      keepalive 10; }
    upstream soil_backend        { server sahool-soil:8000;         keepalive 10; }
    upstream supervisor_backend  { server sahool-supervisor:8000;   keepalive 5;  }
    upstream guardrails_backend  { server sahool-guardrails:8000;   keepalive 5;  }
    upstream notification_ws     { server sahool-notification-agent:8123; }
    upstream frontend_backend    { server sahool-frontend:80;       keepalive 10; }

    include /etc/nginx/proxy_params.conf;

    # ── HTTP → HTTPS redirect ─────────────────────────────────
    server {
        listen 80;
        server_name _;
        location /.well-known/ { root /var/www/html; }
        location / { return 301 https://$host$request_uri; }
    }

    # ── Main server ───────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name ${DOMAIN};

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

        add_header X-RateLimit-Limit 60 always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' cdnjs.cloudflare.com cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss:;" always;  # HIGH-NGINX-02
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options           "SAMEORIGIN"                          always;
        add_header X-Content-Type-Options    "nosniff"                             always;
        add_header X-XSS-Protection          "1; mode=block"                       always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

        
        # TTS service (Yemeni Arabic — Edge TTS)
        location /tts/ {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://sahool-tts:8000;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 60s;
        }

        location /auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://auth_backend/;
            include    /etc/nginx/proxy_params.conf;
        }

        # ── المنطق الموحّد (143 endpoint) → sahool-platform ──
        # الخيار (ج): البوّابة توجّه السطح الموحّد للمنصّة الأساسيّة.
        location /api/v1/ {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://platform_backend/api/v1/;
            include    /etc/nginx/proxy_params.conf;
            proxy_read_timeout 60s;
        }

        # indicators/weather: المنطق فعليّاً في sahool-platform (الخدمات stub).
        # نوجّهها للمنصّة بدل الـstub الفارغ — جوهر الخيار (ج).
        location /api/indicators/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://platform_backend/;
            include    /etc/nginx/proxy_params.conf;
        }
        location /api/vegetation/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://vegetation_backend/;
            include    /etc/nginx/proxy_params.conf;
        }
        location /api/weather/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://platform_backend/;
            include    /etc/nginx/proxy_params.conf;
        }
        location /api/soil/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://soil_backend/;
            include    /etc/nginx/proxy_params.conf;
        }
        location /api/agent/ {
            limit_req zone=agent_limit burst=10 nodelay;
            proxy_pass http://supervisor_backend/;
            include    /etc/nginx/proxy_params.conf;
            proxy_read_timeout 120s;
        }
        location /api/guardrails/ {
            limit_req zone=agent_limit burst=10 nodelay;
            proxy_pass http://guardrails_backend/;
            include    /etc/nginx/proxy_params.conf;
        }
        location /ws/ {
        proxy_buffering off;  # MED-NGINX-02: WebSocket
            proxy_pass         http://notification_ws/ws/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "Upgrade";
            proxy_read_timeout 3600s;
        
        # WebSocket upgrade headers (N09 fix)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        }
        location /metrics {
            allow 127.0.0.1; allow 172.20.0.0/16;
            deny all;
            proxy_pass http://indicators_backend/metrics;
        }
        location / {
            proxy_pass http://frontend_backend/;
            include    /etc/nginx/proxy_params.conf;
            proxy_intercept_errors on;
            error_page 404 = @spa_fallback;
        }
        location @spa_fallback {
            proxy_pass http://frontend_backend/index.html;
        }
    }
}
