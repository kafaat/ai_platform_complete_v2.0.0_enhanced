# الدراسة الحكوميّة لزراعة القمح في الجوف صنّفت المنطقة كأرض استصلاح موصى بها
tenant_id: "001-aljawf-142ha"
location_ar: السنيدار، شرق الحزم، الجوف
study_link_ar: دراسة القمح الحكوميّة (486 هكتار استصلاح موصى به)

# القيم المرجعيّة (متوسّطات الـ22 عيّنة) — لمعايرة نماذج المحاكاة
soil_reference:
  ph: 8.2                    # قلوي عالٍ
  caco3_pct: 31             # كربونات كالسيوم عالية (22-36% بين العيّنات)
  organic_matter_pct: 0.94  # مادة عضوية منخفضة
  phosphorus_ppm: 2.7       # فوسفور منخفض (مثبّت بالكلس)
  texture: sandy_loam       # طمي رملي إلى رملي طميّ

# القيود المرصودة (تتطابق مع توصيات دراسة القمح)
constraints_ar:
  - تثبيت الفوسفور بسبب الكلس العالي (pH>8 + CaCO3 31%)
  - نقص الحديد والزنك (شائع في الترب القلويّة)
  - نقص المادة العضوية (أقلّ من 1%)
  - ملوحة متوسّطة-عالية في بعض القطاعات (تباين مكاني)

# توصيات المعايرة (مطابقة لدراسة القمح الحكوميّة)
recommendations_ar:
  - فوسفور عالي عند بداية الزراعة (لمواجهة التثبيت)
  - ذبل بلدي/سماد عضوي لرفع المادة العضوية
  - ريّ حديث (تنقيط) لتفادي ترسّب الأملاح
  - رشّ حديد/زنك ورقي (chelated) لتجاوز التثبيت القلوي

# ملاحظة منهجيّة حرجة (من تحليل البيانات)
methodology_note_ar: >
  EC غير قابلة للمقارنة المباشرة بين الحملتين: NIP 2022 استخدمت استخلاصاً
  مخفّفاً، والسنيدار 2023 عجينة مشبعة (ECe). حقل extraction_method ضروري
  لتفادي "زيادة ملوحة" وهميّة.

