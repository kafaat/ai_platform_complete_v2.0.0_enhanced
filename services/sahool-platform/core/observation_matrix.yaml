# الحقول: id | group | name_ar | source | unit | error | ground_truth
#         | type (governing/modifying/diagnostic/calibration) | tier | criticality (A/B/C)
# ════════════════════════════════════════════════════════════════
version: "1.0"
total_observables: 62  # 59 logical + R8 split (a/b) + reconciliation
