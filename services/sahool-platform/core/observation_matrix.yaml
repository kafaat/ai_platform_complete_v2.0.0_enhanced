# ════════════════════════════════════════════════════════════════
# SAHOOL — مصفوفة المراصد (Observation Matrix)
# 62 مرصداً فعلياً (59 منطقي + R8 مقسوم درون/Landsat) | 10 مجموعات | المرحلة صفر: Raw Ingestion
