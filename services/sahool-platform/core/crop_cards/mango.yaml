# SAHOOL CORE crop card — Mango (المانجو / العنبة)
# REGION-AGNOSTIC. Physics & physiology ONLY.
# مُعمِّر (شجرة دائمة الخضرة) — كتلة phenology الحوليّة مُغفَلة عمداً.
crop_id: mango
name_ar: المانجو (العنبة)
name_en: Mango
crop_family: tree_C3

kc:
  initial: 0.45
  mid: 0.85
  end: 0.70
  stage_days: [90, 90, 90, 95]   # ≈ سنة (إرشاديّ لمُعمِّر)
  source: "Mango agronomy (indicative Kc; not in FAO-56 Kc table); perennial evergreen"

salinity:
  threshold_ece_ds_m: 1.5        # المانجو متوسّط الحساسيّة (خارج جدول FAO-56 T23)
  slope_pct_per_ds_m: 8.0        # تقدير أدبيّ
  source: "Mango salinity literature (moderately sensitive; not in FAO-56 T23 — indicative)"

thermal:
  gdd_base_c: 12.0
  gdd_to_maturity: 0             # مُعمِّر — إثمار موسميّ
  flowering_safe_max_c: 42.0     # متحمّل للحرارة الشديدة
  chilling_hours_required: 0     # التزهير يحفّزه البرد/الجفاف الموسميّ لا ساعات برودة شجريّة
  source: "Mango agronomy (tropical/subtropical; flowering by cool-dry induction)"

governing:
  ph:        { min: 5.5, max: 7.5, error: 0.1,  source: "ECOCROP mango" }
  ece_ds_m:  { min: 0.0, max: 4.0, error: 0.02, source: "Mango salt tolerance (indicative)" }
  drainage:  { needs: good }

modifying:
  organic_matter_pct:
    min_acceptable: 0.6
    optimal_min: 1.2
    optimal_max: 3.0
    max_acceptable: 6.0
    weight: 0.3
    error: 0.05
    source: "Mango OM thresholds (agronomy)"
  nitrogen_kg_ha_required: 100
  phosphorus_kg_ha_required: 40
  potassium_kg_ha_required: 100

pest_susceptibility:
  pests: [mango_hopper, anthracnose, fruit_fly, powdery_mildew]
  note: "نوافذ الخطر الإقليمية في districts/<region>/pests.yaml"

# لا كتلة phenology (مُعمِّر). لا calibration/yield/zone_factor.
