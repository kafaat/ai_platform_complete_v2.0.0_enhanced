# SAHOOL CORE crop card — Pepper (الفلفل)
# REGION-AGNOSTIC. Physics & physiology ONLY.
crop_id: pepper
name_ar: الفلفل
name_en: Pepper (bell/chili)
crop_family: vegetable_C3

kc:
  initial: 0.60
  mid: 1.05
  end: 0.90
  stage_days: [30, 35, 40, 20]   # ⇒ 125 يوماً (نقل شتلات)
  source: "FAO-56 Table 12 (Pepper)"

salinity:
  threshold_ece_ds_m: 1.5        # الفلفل حسّاس للملوحة (Maas-Hoffman)
  slope_pct_per_ds_m: 14.0
  germination_ece_max: 1.5
  source: "FAO-56 Table 23; Maas & Hoffman 1977 (Pepper)"

thermal:
  gdd_base_c: 12.0
  gdd_to_maturity: 1300
  flowering_safe_max_c: 32.0     # تساقط الأزهار فوق ~32°م
  chilling_hours_required: 0
  source: "Pepper agronomy; base ~12C; flower drop >32C"

governing:
  ph:        { min: 5.5, max: 7.5, error: 0.1,  source: "ECOCROP pepper" }
  ece_ds_m:  { min: 0.0, max: 6.0, error: 0.02, source: "FAO-56 T23" }
  drainage:  { needs: good }

modifying:
  organic_matter_pct:
    min_acceptable: 0.8
    optimal_min: 1.5
    optimal_max: 3.0
    max_acceptable: 5.0
    weight: 0.3
    error: 0.05
    source: "Pepper OM thresholds (agronomy)"
  nitrogen_kg_ha_required: 110
  phosphorus_kg_ha_required: 60
  potassium_kg_ha_required: 130

pest_susceptibility:
  pests: [aphids, whitefly, thrips, anthracnose]
  note: "نوافذ الخطر الإقليمية في districts/<region>/pests.yaml"

# ── مراحل النمو ── الحدود = المجاميع التراكميّة [30,35,40,20] ⇒ [0–30, 30–65, 65–105, 105–125].
phenology:
  source: "FAO-56 Table 12 (Pepper) stage lengths"
  total_cycle_days: 125
  stages:
    - stage: initial
      name_ar: "تأسيس الشتلة"
      day_start: 0
      day_end: 30
      kc: 0.60
      key_action_ar: "ريّ تأسيس بعد الشتل"
    - stage: development
      name_ar: "النموّ الخضري"
      day_start: 30
      day_end: 65
      kc_end: 1.05
      key_action_ar: "تسميد متوازن + تدعيم"
    - stage: mid
      name_ar: "التزهير والعقد والإثمار"
      day_start: 65
      day_end: 105
      kc: 1.05
      key_action_ar: "ذروة الاحتياج — الحرارة فوق 32°م تُسقط الأزهار"
    - stage: late
      name_ar: "النضج والقطاف"
      day_start: 105
      day_end: 125
      kc: 0.90
      key_action_ar: "قطاف متتابع مع انتظام الرطوبة"

# NO calibration block. NO yield. NO zone_factor.
