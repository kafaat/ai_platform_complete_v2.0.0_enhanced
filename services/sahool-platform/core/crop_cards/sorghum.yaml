# SAHOOL CORE crop card — Sorghum (الذرة الرفيعة)
# REGION-AGNOSTIC. Physics & physiology ONLY. Knows no farm, no region.
# Calibration (zone_factor, yield) lives in districts/ and tenants/ — NOT here.
crop_id: sorghum
name_ar: الذرة الرفيعة (السورغم)
name_en: Sorghum
crop_family: cereal_C4

kc:
  initial: 0.30
  mid: 1.05
  end: 0.55
  stage_days: [20, 35, 40, 30]
  source: "FAO-56 Table 11/12 (Sorghum)"

salinity:
  threshold_ece_ds_m: 6.8
  slope_pct_per_ds_m: 16.0
  sar_max: 13.0
  source: "FAO-56 Table 23; Maas & Hoffman 1977"

thermal:
  gdd_base_c: 10.0
  gdd_to_maturity: 1800
  flowering_safe_max_c: 38.0
  chilling_hours_required: 0
  source: "Sorghum agronomy; GDD base 10C standard"

governing:
  ph:        { min: 5.5, max: 8.5, error: 0.1,  source: "FAO crop req." }
  ece_ds_m:  { min: 0.0, max: 12.0, error: 0.02, source: "FAO-56 T23" }
  drainage:  { needs: any }

modifying:
  organic_matter_pct:
    min_acceptable: 0.5
    optimal_min: 1.0
    optimal_max: 1.8
    max_acceptable: 5.0
    weight: 0.3
    error: 0.05
    source: "Sorghum OM thresholds"
  nitrogen_kg_ha_required: 100
  phosphorus_kg_ha_required: 40
  potassium_kg_ha_required: 60

pest_susceptibility:
  pests: [stem_borer, aphids]
  note: "Region-specific risk windows live in districts/<region>/pests.yaml"

# ── مراحل النمو (Phenology) — محايدة الموقع، مُحاذاة لمراحل FAO-56 ──
# الحدود اليوميّة تطابق kc.stage_days التراكميّة [20,35,40,30] ⇒ [0–20, 20–55, 55–95, 95–125].
phenology:
  source: "FAO-56 Table 11/12 (Sorghum) stage lengths"
  total_cycle_days: 125
  # ══ سلسلة اشتقاق كسور الطلب الغذائيّ — قرينة معرفيّة مقرَّبة، لا معايرة محلّيّة ══
  nutrient_demand_provenance:
    primary_reference: "Vanderlip, R.L. (1993), 'How a Sorghum Plant Develops', Kansas State University Cooperative Extension S-3 (توقيت المراحل GS1–GS3) + منحنيات الامتصاص التراكميّ المنشورة في أدلّة إنتاج الذرة الرفيعة (KSU Sorghum Production Handbook) — قرينة معرفيّة"
    supporting_reference: "المراسي النوعيّة المستقرّة: نمط الذرة الرفيعة قريب من الذرة الشاميّة — K مُقدَّم الثقل بشدّة (معظمه قبل الإزهار)، N ~70% بحلول نصف-الإزهار مع استمرار ~15–20% في الامتلاء، P الأكثر توزّعاً حتى الامتلاء"
    derivation: "نصيب كلّ نافذة FAO-56 = فرق المنحنى التراكميّ عند حدَّيها وفق مراحل Vanderlip (GS1 تأسيس · GS2 نموّ خضري سريع حتى البطان · GS3 إزهار–امتلاء)، مقيَّداً بالمراسي النوعيّة أعلاه"
    stage_mapping: "initial(0–20d)≈GS1 (الإنبات–3 أوراق) · development(20–55d)≈GS2 (النموّ السريع–البطان) · mid(55–95d)≈بداية GS3 (طرد السنبلة–الإزهار–بدء الامتلاء) · late(95–125d)≈بقيّة GS3 (الامتلاء–النضج الفسيولوجيّ)"
    normalization: "نصيب النافذة ÷ الإجماليّ الموسميّ لكلّ عنصر، ثمّ تقريب إلى شبكة 0.05 وتسوية مجموع كلّ عنصر إلى 1.00"
    approximation: true
  stages:
    - stage: initial
      name_ar: "الإنبات والتأسيس"
      day_start: 0
      day_end: 20
      kc: 0.30
      key_action_ar: "ريّ تأسيس لضمان إنبات منتظم"
      # ≈ GS1: امتصاص ضئيل — التأسيس قبل إقلاع الطلب
      nutrient_demand:
        n_fraction: 0.05
        p_fraction: 0.05
        k_fraction: 0.10
        source: "Vanderlip 1993 (KSU S-3) staging + KSU sorghum uptake pattern; GS1 minimal uptake, approximate"
    - stage: development
      name_ar: "النموّ الخضري والإشطاء"
      day_start: 20
      day_end: 55
      kc_end: 1.05
      key_action_ar: "تسميد آزوتي + مكافحة الحشائش"
      # ≈ GS2: إقلاع الامتصاص — K الأسرع (نصف موسمه هنا)
      nutrient_demand:
        n_fraction: 0.40
        p_fraction: 0.30
        k_fraction: 0.50
        source: "Vanderlip 1993 (KSU S-3) + KSU sorghum uptake pattern; K front-loaded through GS2, approximate"
    - stage: mid
      name_ar: "الاستطالة والسنبلة والإزهار"
      day_start: 55
      day_end: 95
      kc: 1.05
      key_action_ar: "ذروة الاحتياج المائي عند الإزهار — تجنّب الإجهاد المائي والحراري"
      # ≈ بداية GS3: ذروة N/P حول الإزهار؛ K شبه مكتمل
      nutrient_demand:
        n_fraction: 0.40
        p_fraction: 0.40
        k_fraction: 0.35
        source: "Vanderlip 1993 (KSU S-3) + KSU sorghum uptake pattern; ≈70% N by half-bloom, approximate"
    - stage: late
      name_ar: "امتلاء الحبّ والنضج"
      day_start: 95
      day_end: 125
      kc: 0.55
      key_action_ar: "تقليل الريّ قبل الحصاد"
      # ≈ بقيّة GS3: بقايا N (~15%) وP مستمرّ (~25%) وK شبه معدوم
      nutrient_demand:
        n_fraction: 0.15
        p_fraction: 0.25
        k_fraction: 0.05
        source: "Vanderlip 1993 (KSU S-3) + KSU sorghum uptake pattern; grain-fill N tail and continuing P, approximate"

# NO calibration block. NO yield. NO zone_factor. Those are districts/tenant OUTPUTS.
