# SAHOOL CORE crop card — Melon / muskmelon (الشمّام)
# REGION-AGNOSTIC. Physics & physiology ONLY.
crop_id: melon
name_ar: الشمّام (الكنتالوب)
name_en: Melon (muskmelon)
crop_family: cucurbit_C3

kc:
  initial: 0.50
  mid: 1.05
  end: 0.75
  stage_days: [25, 35, 40, 20]   # ⇒ 120 يوماً
  source: "FAO-56 Table 12 (Melon / cantaloupe)"

salinity:
  threshold_ece_ds_m: 2.2        # الشمّام متوسّط التحمّل (Maas-Hoffman)
  slope_pct_per_ds_m: 7.3
  germination_ece_max: 1.8
  source: "FAO-56 Table 23; Maas & Hoffman 1977 (Muskmelon)"

thermal:
  gdd_base_c: 12.0
  gdd_to_maturity: 900
  flowering_safe_max_c: 35.0
  chilling_hours_required: 0
  source: "Melon agronomy; warm-season cucurbit, base ~12C"

governing:
  ph:        { min: 6.0, max: 7.5, error: 0.1,  source: "ECOCROP melon" }
  ece_ds_m:  { min: 0.0, max: 6.0, error: 0.02, source: "FAO-56 T23" }
  drainage:  { needs: good }

modifying:
  organic_matter_pct:
    min_acceptable: 0.6
    optimal_min: 1.2
    optimal_max: 2.5
    max_acceptable: 5.0
    weight: 0.3
    error: 0.05
    source: "Melon OM thresholds (agronomy)"
  nitrogen_kg_ha_required: 90
  phosphorus_kg_ha_required: 50
  potassium_kg_ha_required: 110

pest_susceptibility:
  pests: [aphids, powdery_mildew, fusarium_wilt, fruit_fly]
  note: "نوافذ الخطر الإقليمية في districts/<region>/pests.yaml"

# ── مراحل النمو ── الحدود = المجاميع التراكميّة [25,35,40,20] ⇒ [0–25, 25–60, 60–100, 100–120].
phenology:
  source: "FAO-56 Table 12 (Melon) stage lengths"
  total_cycle_days: 120
  stages:
    - stage: initial
      name_ar: "الإنبات والتأسيس"
      day_start: 0
      day_end: 25
      kc: 0.50
      key_action_ar: "ريّ تأسيس دافئ"
    - stage: development
      name_ar: "زحف المجموع الخضري"
      day_start: 25
      day_end: 60
      kc_end: 1.05
      key_action_ar: "تسميد متوازن + توجيه العرش"
    - stage: mid
      name_ar: "التزهير وعقد الثمار وتضخّمها"
      day_start: 60
      day_end: 100
      kc: 1.05
      key_action_ar: "ذروة الاحتياج المائي أثناء تضخّم الثمرة"
    - stage: late
      name_ar: "النضج (انزلاق الثمرة)"
      day_start: 100
      day_end: 120
      kc: 0.75
      key_action_ar: "تقليل الريّ قبل الجني لرفع السكّر والنكهة"

# NO calibration block. NO yield. NO zone_factor.
