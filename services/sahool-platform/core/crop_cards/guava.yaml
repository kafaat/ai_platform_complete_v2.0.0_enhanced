# SAHOOL CORE crop card — Guava (الجوافة)
# REGION-AGNOSTIC. Physics & physiology ONLY.
# مُعمِّر (شجرة دائمة الخضرة) — كتلة phenology الحوليّة مُغفَلة عمداً.
crop_id: guava
name_ar: الجوافة
name_en: Guava
crop_family: tree_C3

kc:
  initial: 0.50
  mid: 0.90
  end: 0.70
  stage_days: [90, 90, 90, 95]   # ≈ سنة (إرشاديّ لمُعمِّر دائم الخضرة)
  source: "Guava agronomy (indicative Kc; not in FAO-56 Kc table); perennial evergreen"

salinity:
  threshold_ece_ds_m: 3.0        # الجوافة متحمّلة نسبيّاً للملوحة (خارج جدول FAO-56 T23)
  slope_pct_per_ds_m: 6.0        # تقدير أدبيّ
  source: "Guava salinity literature (moderately tolerant; not in FAO-56 T23 — indicative)"

thermal:
  gdd_base_c: 13.0
  gdd_to_maturity: 0             # مُعمِّر — إثمار موسميّ متكرّر
  flowering_safe_max_c: 40.0
  chilling_hours_required: 0     # تحت-مداريّ — لا يحتاج ساعات برودة (يتضرّر بالصقيع)
  source: "Guava agronomy (subtropical evergreen; hardy; frost-sensitive)"

governing:
  ph:        { min: 5.0, max: 8.0, error: 0.1,  source: "ECOCROP guava (wide tolerance)" }
  ece_ds_m:  { min: 0.0, max: 8.0, error: 0.02, source: "Guava salt tolerance (indicative)" }
  drainage:  { needs: good }

modifying:
  organic_matter_pct:
    min_acceptable: 0.5
    optimal_min: 1.0
    optimal_max: 2.5
    max_acceptable: 5.0
    weight: 0.3
    error: 0.05
    source: "Guava OM thresholds (agronomy)"
  nitrogen_kg_ha_required: 100
  phosphorus_kg_ha_required: 40
  potassium_kg_ha_required: 100

pest_susceptibility:
  pests: [fruit_fly, anthracnose, wilt]
  note: "نوافذ الخطر الإقليمية في districts/<region>/pests.yaml"

# لا كتلة phenology (مُعمِّر). لا calibration/yield/zone_factor.
