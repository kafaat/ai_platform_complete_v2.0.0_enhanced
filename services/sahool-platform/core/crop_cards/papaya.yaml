# SAHOOL CORE crop card — Papaya (البابايا)
# REGION-AGNOSTIC. Physics & physiology ONLY.
# مُعمِّر قصير العمر (شجرة دائمة الخضرة) — كتلة phenology الحوليّة مُغفَلة عمداً.
crop_id: papaya
name_ar: البابايا
name_en: Papaya
crop_family: tree_C3

kc:
  initial: 0.60
  mid: 1.05
  end: 0.90
  stage_days: [90, 90, 90, 95]   # ≈ سنة (إرشاديّ لمُعمِّر دائم الإثمار)
  source: "Papaya agronomy (indicative Kc; not in FAO-56 Kc table); perennial evergreen"

salinity:
  threshold_ece_ds_m: 1.0        # البابايا حسّاسة للملوحة (خارج جدول FAO-56 T23)
  slope_pct_per_ds_m: 10.0       # تقدير أدبيّ
  source: "Papaya salinity literature (sensitive; not in FAO-56 T23 — indicative)"

thermal:
  gdd_base_c: 15.0
  gdd_to_maturity: 0             # مُعمِّر — إثمار مستمرّ
  flowering_safe_max_c: 38.0
  chilling_hours_required: 0     # مداريّ — يتضرّر بالبرد
  source: "Papaya agronomy (tropical; base ~15C; chilling-injured below ~12C)"

governing:
  ph:        { min: 5.5, max: 7.0, error: 0.1,  source: "ECOCROP papaya" }
  ece_ds_m:  { min: 0.0, max: 3.0, error: 0.02, source: "Papaya salt sensitivity (indicative)" }
  drainage:  { needs: good }     # حسّاسة جدّاً للغدق (تعفّن الجذور)

modifying:
  organic_matter_pct:
    min_acceptable: 1.0
    optimal_min: 2.0
    optimal_max: 4.0
    max_acceptable: 7.0
    weight: 0.3
    error: 0.05
    source: "Papaya OM thresholds (agronomy)"
  nitrogen_kg_ha_required: 120
  phosphorus_kg_ha_required: 40
  potassium_kg_ha_required: 150

pest_susceptibility:
  pests: [papaya_ringspot_virus, fruit_fly, mealybug, anthracnose]
  note: "نوافذ الخطر الإقليمية في districts/<region>/pests.yaml"

# لا كتلة phenology (مُعمِّر). لا calibration/yield/zone_factor.
