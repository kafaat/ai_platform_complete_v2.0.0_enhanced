# ════════════════════════════════════════════════════════════════
# قالب بطاقة صنف SAHOOL — VARIETY TEMPLATE
# ════════════════════════════════════════════════════════════════
# مستويان: بطاقة المحصول (النوع: قمح) ← بطاقة الصنف (قمح "بقعة" المحلّي)
# هذا قالب الصنف، يتبع المعايير العالمية:
#   • UPOV (DUS): Distinct/Uniform/Stable — المعيار العالمي منذ 1961
#   • Bioversity/IPGRI descriptors: passport + characterization
#   • UPOV codes: معرّف فريد لكل نوع
#
# مبدأ حاكم: الصنف يرث فيزياء محصوله الأمّ، ويضيف خصائصه المميّزة.
#   • محايد الموقع (لا معايرة، لا إنتاج فعلي — تلك في tenants/)
#   • القيم مرجعية (قرينة معرفية) حتى تجربة الصنف محلّياً (دليل)
#
# مصادر بيانات الأصناف:
#   • NGRC/AREA (هيئة البحوث الزراعية، ذمار) — أصناف يمنية محلّية
#   • ICARDA — أصناف محسّنة للمناطق الجافة
#   • UPOV PLUTO database — الأصناف المسجّلة عالمياً (upov.int/pluto)
#   • جنوب السعودية (عسير) — أصناف نفس البيئة
# ════════════════════════════════════════════════════════════════

variety_id: <معرّف_فريد>              # مثل: wheat_buqaa
parent_crop_id: <محصول_أمّ>           # مثل: wheat (يربط ببطاقة المحصول)
name_ar: <اسم الصنف بالعربية>          # مثل: قمح بقعة
name_en: <variety name>                # مثل: Buqaa wheat

# ── بيانات الجواز (Passport — Bioversity/IPGRI) ──
passport:
  origin_type: <نوع>                  # landrace (محلّي) / improved (محسّن) / introduced
  source_ar: <المصدر>                 # مثل: NGRC اليمن / ICARDA
  upov_code: <كود>                    # كود UPOV للنوع (إن وُجد)، أو null
  collection_note_ar: <ملاحظة>        # سياق الجمع/التطوير (دون موقع مزرعة محدّد)

# ── الخصائص المميّزة (DUS — UPOV) ──
distinctness:                          # ما يميّز الصنف عن غيره
  morphology_ar: <وصف مورفولوجي>      # مثل: سنبلة بيضاء، حبّة كبيرة
  maturity_class: <فئة>               # early / medium / late
  plant_height_cm: <ارتفاع>           # تقريبي
uniformity_note_ar: <التجانس>          # درجة تماثل البذور
stability_note_ar: <الاستقرار>         # ثبات الصفات عبر التكاثر

# ── الصفات الزراعية المميّزة للصنف (فوق فيزياء المحصول) ──
variety_traits:
  drought_tolerance: <مستوى>          # low / medium / high
  salt_tolerance_modifier: <معامل>    # تعديل على عتبة المحصول (مثل: +1.0 dS/m أو -0.5)
  disease_resistance_ar: [<أمراض>]    # مقاومة مميّزة (مثل: مقاوم للصدأ)
  special_quality_ar: <جودة>          # مثل: نسبة بروتين عالية، خبز جيد
  source: "<مصدر الخصائص>"

# ── التوافق المناخي المميّز (إن اختلف عن المحصول الأمّ) ──
adaptation:
  altitude_range_m: [<min>, <max>]    # نطاق الارتفاع المناسب
  agro_ecological_zone_ar: <منطقة>    # مثل: المرتفعات / تهامة / الهضبة الشرقية
  note_ar: <ملاحظة التكيّف>

# ملاحظة: لا معايرة، لا إنتاج فعلي، لا مزرعة. الصنف يرث حاكمات محصوله
# الأمّ (الملوحة/pH من parent_crop_id)، ويعدّلها فقط عبر salt_tolerance_modifier.
