# SAHOOL CORE crop card — Pomegranate (الرمّان)
# REGION-AGNOSTIC. Physics & physiology ONLY.
# مُعمِّر مُتساقط الأوراق — كتلة phenology الحوليّة مُغفَلة عمداً.
crop_id: pomegranate
name_ar: الرمّان
name_en: Pomegranate
crop_family: tree_C3

kc:
  initial: 0.40
  mid: 0.85
  end: 0.65
  stage_days: [60, 60, 90, 45]   # ≈ 255 يوماً موسم نموّ (إرشاديّ لمُعمِّر مُتساقط)
  source: "Pomegranate agronomy (indicative Kc; not in FAO-56 Kc table); perennial deciduous"

salinity:
  threshold_ece_ds_m: 3.0        # الرمّان متحمّل نسبيّاً للملوحة (خارج جدول FAO-56 T23)
  slope_pct_per_ds_m: 5.0        # تقدير أدبيّ
  source: "Pomegranate salinity literature (moderately tolerant; not in FAO-56 T23 — indicative)"

thermal:
  gdd_base_c: 10.0
  gdd_to_maturity: 0             # مُعمِّر — إثمار موسميّ
  flowering_safe_max_c: 40.0     # متحمّل للحرارة والجفاف
  chilling_hours_required: 100   # مُتساقط — يحتاج بردَ سُبات منخفضاً (مرتفعات اليمن)
  source: "Pomegranate agronomy (deciduous; low chill; heat/drought tolerant)"

governing:
  ph:        { min: 5.5, max: 8.0, error: 0.1,  source: "ECOCROP pomegranate" }
  ece_ds_m:  { min: 0.0, max: 8.0, error: 0.02, source: "Pomegranate salt tolerance (indicative)" }
  drainage:  { needs: good }

modifying:
  organic_matter_pct:
    min_acceptable: 0.5
    optimal_min: 1.0
    optimal_max: 2.5
    max_acceptable: 5.0
    weight: 0.3
    error: 0.05
    source: "Pomegranate OM thresholds (agronomy)"
  nitrogen_kg_ha_required: 80
  phosphorus_kg_ha_required: 40
  potassium_kg_ha_required: 100

pest_susceptibility:
  pests: [aphids, fruit_borer, bacterial_blight]
  note: "نوافذ الخطر الإقليمية في districts/<region>/pests.yaml"

# لا كتلة phenology (مُعمِّر). لا calibration/yield/zone_factor.
