# SAHOOL CORE crop card — Pea (البازلاء / محصول العتر / Pisum sativum L.)
# REGION-AGNOSTIC. Physics & physiology ONLY (FAO-56 / FAO-29 / ECOCROP).
# الأصناف اليمنية المحلّية في varieties/ (مصدرها الدليل الزراعي للبقوليات الحبية الغذائية 2023).
# الاسم المحلّي اليمنيّ: «العتر»؛ الاسم المعياريّ: «البازلاء».
crop_id: pea
name_ar: البازلاء
name_en: Pea
crop_family: legume_C3

kc:
  initial: 0.50
  mid: 1.15
  end: 0.30                       # بازلاء جافّة (Dry Pea): end أقلّ من الطازجة (0.30)
  stage_days: [20, 30, 35, 15]   # Lini/Ldev/Lmid/Llate ≈ 100 يوم (حبوب جافّة)
  source: "FAO-56 Table 11/12 (Peas)"

salinity:
  threshold_ece_ds_m: 1.5        # البازلاء الحقليّة حسّاسة للملوحة
  slope_pct_per_ds_m: 12.0       # ~12% نقص لكل dS/m فوق العتبة
  germination_ece_max: 1.5       # الإنبات حسّاس (لا يتجاوز ~1.5)
  source: "FAO-29 / pea salinity literature (sensitive)"

thermal:
  gdd_base_c: 5.0                # بقوليّة باردة الموسم (حرارة أساس ~5°م)
  gdd_to_maturity: 1300
  flowering_safe_max_c: 27.0     # تساقط الأزهار/عقم اللقاح فوق ~27°م
  chilling_hours_required: 0
  source: "Cool-season legume agronomy; GDD base 5C standard; heat-induced flower/pod abortion >27C"

governing:
  ph:        { min: 6.0, max: 7.5, error: 0.1, source: "ECOCROP Pisum sativum" }
  ece_ds_m:  { min: 0.0, max: 5.0, error: 0.02, source: "FAO-29 (Pea, sensitive)" }
  drainage:  { needs: good }     # حسّاسة للإغراق (waterlogging-intolerant)

modifying:
  organic_matter_pct:
    min_acceptable: 0.6
    optimal_min: 1.0
    optimal_max: 2.5
    max_acceptable: 5.0
    weight: 0.3
    error: 0.05
    source: "ECOCROP / legume agronomy (knowledge prior)"
    note_ar: "تقدير طيفي لـ OM يبقى قرينة؛ المختبر يحكم"
  # بقوليّة مثبّتة للنيتروجين (Rhizobium): الاحتياج النيتروجينيّ منخفض (دفعة بادئة فقط).
  nitrogen_kg_ha_required: 20
  phosphorus_kg_ha_required: 45
  potassium_kg_ha_required: 40

pest_susceptibility:
  pests: [powdery_mildew, ascochyta, aphids, pea_weevil, rust]
  note: "نوافذ الخطر الإقليمية في districts/<region>/pests.yaml"

# ── مراحل النمو (Phenology) — محايدة الموقع، مُحاذاة لمراحل FAO-56 ──
# الحدود اليوميّة تطابق kc.stage_days التراكميّة [0–20, 20–50, 50–85, 85–100].
phenology:
  source: "FAO-56 stage lengths (Peas); cool-season legume agronomy"
  total_cycle_days: 100
  stages:
    - stage: initial
      name_ar: "الإنبات والتأسيس"
      day_start: 0
      day_end: 20
      kc: 0.50
      key_action_ar: "ريّ خفيف متكرّر لضمان إنبات منتظم في تربة جيّدة الصرف"
    - stage: development
      name_ar: "النموّ الخضري"
      day_start: 20
      day_end: 50
      kc_end: 1.15
      key_action_ar: "تسميد بادئ + مكافحة الأعشاب + دعامات للأصناف المتسلّقة"
    - stage: mid
      name_ar: "التزهير وتكوين القرون"
      day_start: 50
      day_end: 85
      kc: 1.15
      key_action_ar: "ذروة الاحتياج المائي — تجنّب الإجهاد المائي والحراري (>27°م)"
    - stage: late
      name_ar: "امتلاء البذور والنضج"
      day_start: 85
      day_end: 100
      kc: 0.30
      key_action_ar: "تقليل الريّ تدريجيّاً قبل الحصاد"
