# SAHOOL CORE crop card — Peanut / Groundnut (الفول السوداني / Arachis hypogaea)
# REGION-AGNOSTIC. Physics & physiology ONLY (FAO-56 / Maas-Hoffman / ECOCROP).
# الأصناف اليمنية المحلّية في varieties/ (مصدرها دليل البقوليات الحبية 2023).
crop_id: peanut
name_ar: الفول السوداني
name_en: Peanut/Groundnut
crop_family: legume_C3

kc:
  initial: 0.40
  mid: 1.15
  end: 0.60
  stage_days: [25, 35, 45, 25]   # Lini/Ldev/Lmid/Llate ≈ 130 يوم (الفول السوداني)
  source: "FAO-56 Table 11/12 (Groundnut)"

salinity:
  threshold_ece_ds_m: 3.2        # الفول السوداني متوسّط التحمّل للملوحة (Maas-Hoffman)
  slope_pct_per_ds_m: 29.0       # انحدار 29% نقص لكل dS/m فوق العتبة
  germination_ece_max: 3.0       # الإنبات أكثر حساسية (لا يتجاوز ~3.0)
  source: "Maas & Hoffman 1977; FAO-29 (Groundnut)"

thermal:
  gdd_base_c: 10.0               # بقوليّة دافئة الموسم (حرارة أساس ~10°م)
  gdd_to_maturity: 1400
  flowering_safe_max_c: 33.0     # إجهاد حراري على الأزهار فوق ~33°م
  chilling_hours_required: 0
  source: "Groundnut agronomy (warm-season legume)"

governing:
  ph:        { min: 5.5, max: 7.0, error: 0.1, source: "ECOCROP Arachis hypogaea" }
  ece_ds_m:  { min: 0.0, max: 7.0, error: 0.02, source: "Maas-Hoffman (moderately tolerant)" }
  drainage:  { needs: good }     # يحتاج تربة رملية خفيفة جيّدة الصرف (light well-drained sandy soils)

modifying:
  organic_matter_pct:
    min_acceptable: 0.6
    optimal_min: 1.0
    optimal_max: 2.5
    max_acceptable: 5.0
    weight: 0.3
    error: 0.05
    source: "ECOCROP / legume agronomy (knowledge prior)"
    note_ar: "تقدير طيفي لـ OM يبقى قرينة؛ المختبر يحكم"
  # بقوليّة مثبّتة للنيتروجين (Rhizobium): الاحتياج النيتروجينيّ منخفض (دفعة بادئة فقط).
  nitrogen_kg_ha_required: 20
  phosphorus_kg_ha_required: 40
  potassium_kg_ha_required: 60
  note_ar: "يحتاج الفول السوداني الكالسيوم (الجبس) في منطقة تكوين القرون لامتلاء القرون"

pest_susceptibility:
  pests: [aphids, thrips, leaf_spot, rust, aspergillus_aflatoxin]
  note: "نوافذ الخطر الإقليمية في districts/<region>/pests.yaml"

# ── مراحل النمو (Phenology) — محايدة الموقع، مُحاذاة لمراحل FAO-56 ──
# الحدود اليوميّة تطابق kc.stage_days التراكميّة [0–25, 25–60, 60–105, 105–130].
phenology:
  source: "FAO-56 stage lengths (Groundnut); groundnut agronomy"
  total_cycle_days: 130
  stages:
    - stage: initial
      name_ar: "الإنبات والتأسيس"
      day_start: 0
      day_end: 25
      kc: 0.40
      key_action_ar: "ريّ خفيف متكرّر لضمان إنبات منتظم في تربة خفيفة"
    - stage: development
      name_ar: "النموّ الخضري"
      day_start: 25
      day_end: 60
      kc_end: 1.15
      key_action_ar: "تسميد فوسفاتي + مكافحة الأعشاب"
    - stage: mid
      name_ar: "التزهير وتكوين الأوتاد (peg) وامتلاء القرون"
      day_start: 60
      day_end: 105
      kc: 1.15
      key_action_ar: "ذروة الاحتياج المائي — إضافة الكالسيوم (الجبس) لدعم الأوتاد وامتلاء القرون وتجنّب الإجهاد فوق ~33°م"
    - stage: late
      name_ar: "نضج القرون والحصاد"
      day_start: 105
      day_end: 130
      kc: 0.60
      key_action_ar: "تقليل الريّ تدريجيّاً قبل القلع والحصاد"
