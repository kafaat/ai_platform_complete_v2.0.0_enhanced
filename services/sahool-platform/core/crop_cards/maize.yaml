# SAHOOL CORE crop card — Maize / grain (الذرة الشامية)
# REGION-AGNOSTIC. Physics & physiology ONLY. Knows no farm, no region.
# Calibration (zone_factor, yield) lives in districts/ and tenants/ — NOT here.
crop_id: maize
name_ar: الذرة الشامية
name_en: Maize (grain)
crop_family: cereal_C4

kc:
  initial: 0.30
  mid: 1.20
  end: 0.60
  stage_days: [25, 40, 45, 30]   # FAO-56 (arid/warm) grain maize ⇒ 140 يوماً
  source: "FAO-56 Table 11/12 (Maize, grain)"

salinity:
  threshold_ece_ds_m: 1.7        # الذرة الشامية حسّاسة نسبيّاً (Maas-Hoffman)
  slope_pct_per_ds_m: 12.0       # 12% نقص لكل dS/m فوق العتبة
  sar_max: 10.0
  germination_ece_max: 1.7       # الإنبات/البادرة حسّاس (لا يتجاوز العتبة العامّة)
  source: "FAO-56 Table 23; Maas & Hoffman 1977 (Maize)"

thermal:
  gdd_base_c: 10.0               # C4 دافئة — حرارة أساس 10°م
  gdd_to_maturity: 1400
  flowering_safe_max_c: 35.0     # عقم حبوب اللقاح فوق ~35°م عند التزهير/الحرير
  chilling_hours_required: 0
  source: "Maize agronomy; GDD base 10C; tassel/silk pollen sterility >35C"

governing:
  ph:        { min: 5.5, max: 8.0, error: 0.1,  source: "ECOCROP maize" }
  ece_ds_m:  { min: 0.0, max: 10.0, error: 0.02, source: "FAO-56 T23" }
  drainage:  { needs: good }     # حسّاسة للغدق

modifying:
  organic_matter_pct:
    min_acceptable: 0.6
    optimal_min: 1.2
    optimal_max: 2.5
    max_acceptable: 5.0
    weight: 0.3
    error: 0.05
    source: "Maize OM thresholds (agronomy)"
  nitrogen_kg_ha_required: 160   # مُستهلِك نيتروجين مرتفع (لا تثبيت حيويّ)
  phosphorus_kg_ha_required: 60
  potassium_kg_ha_required: 60

pest_susceptibility:
  pests: [stem_borer, fall_armyworm, aphids]
  note: "نوافذ الخطر الإقليمية في districts/<region>/pests.yaml"

# ── مراحل النمو (Phenology) — محايدة الموقع، مُحاذاة لمراحل FAO-56 ──
# الحدود اليوميّة تطابق kc.stage_days التراكميّة [25,40,45,30] ⇒ [0–25, 25–65, 65–110, 110–140].
phenology:
  source: "FAO-56 Table 11/12 (Maize, grain) stage lengths"
  total_cycle_days: 140
  # ══ سلسلة اشتقاق كسور الطلب الغذائيّ — قابلة لإعادة البناء رقماً رقماً ══
  nutrient_demand_provenance:
    primary_reference: "Bender, Haegele, Ruffo & Below (2013), 'Nutrient Uptake, Partitioning, and Remobilization in Modern, Transgenic Insect-Protected Maize Hybrids', Agronomy Journal 105(1):161–170, DOI 10.2134/agronj2012.0352"
    supporting_reference: "Ciampitti, Camberato, Murrell & Vyn (2013), 'Maize Nutrient Accumulation and Partitioning in Response to Plant Density and Nitrogen Rate: I. Macronutrients', Agronomy Journal 105(3):783–795, DOI 10.2134/agronj2012.0467"
    derivation: "منحنيات الامتصاص التراكميّ V0–R6 في Bender 2013 (هجن حديثة؛ إجماليّ موسميّ ≈286 N / 114 P2O5 / 202 K2O kg/ha): نصيب كلّ نافذة V/R = قيمة المنحنى التراكميّ عند نهايتها − قيمته عند بدايتها، لكلّ عنصر. ضابطٌ من Ciampitti 2013: عند الحرير (R1) ≈47% من P و≈100% من K من المحتوى الموسميّ، وذروة محتوى K عند ≈R3"
    stage_mapping: "initial(0–25d)≈VE–V4 · development(25–65d)≈V5–V12 · mid(65–110d)≈V13–R3 · late(110–140d)≈R4–R6"
    normalization: "نصيب النافذة ÷ الإجماليّ الموسميّ لكلّ عنصر، ثمّ تقريب إلى شبكة 0.05 وتسوية مجموع كلّ عنصر إلى 1.00"
    approximation: true
  stages:
    - stage: initial
      name_ar: "الإنبات والتأسيس"
      day_start: 0
      day_end: 25
      kc: 0.30
      key_action_ar: "ريّ تأسيس لضمان إنبات منتظم"
      # ≈ VE–V4: امتصاص ضئيل — الجذور تتوسّع والطلب الحقيقيّ لم يبدأ
      nutrient_demand:
        n_fraction: 0.05
        p_fraction: 0.05
        k_fraction: 0.08
        source: "Bender et al. 2013, Agron. J. 105(1):161–170, DOI 10.2134/agronj2012.0352 (cumulative uptake curves); V/R→stage mapping, approximate"
    - stage: development
      name_ar: "النموّ الخضري السريع"
      day_start: 25
      day_end: 65
      kc_end: 1.20
      key_action_ar: "تسميد آزوتيّ تعلويّ عند 6–8 أوراق + مكافحة الحشائش"
      # ≈ V5–V12: إقلاع الامتصاص — البوتاسيوم أسرع عنصر (نصف موسمه هنا)
      nutrient_demand:
        n_fraction: 0.40
        p_fraction: 0.35
        k_fraction: 0.50
        source: "Bender et al. 2013, Agron. J. 105(1):161–170, DOI 10.2134/agronj2012.0352; K uptake front-loaded (≈50% by ~V12), approximate"
    - stage: mid
      name_ar: "التزهير والحرير وامتلاء الحبّ"
      day_start: 65
      day_end: 110
      kc: 1.20
      key_action_ar: "ذروة الاحتياج المائي عند الحرير — تجنّب الإجهاد المائي والحراري (>35°م)"
      # ≈ V13–R3: ذروة النيتروجين حول الحرير (R1) — يتأخّر عن K ويتقدّم على P
      nutrient_demand:
        n_fraction: 0.45
        p_fraction: 0.45
        k_fraction: 0.40
        source: "Bender et al. 2013, Agron. J. 105(1):161–170, DOI 10.2134/agronj2012.0352; N peak uptake straddles R1, approximate"
    - stage: late
      name_ar: "النضج الفسيولوجيّ والجفاف"
      day_start: 110
      day_end: 140
      kc: 0.60
      key_action_ar: "تقليل الريّ نحو النضج الأسود (black layer)"
      # ≈ R4–R6: ذيول الامتصاص — البوتاسيوم شبه مكتمل، ونقلٌ داخليّ للحبّ
      nutrient_demand:
        n_fraction: 0.10
        p_fraction: 0.15
        k_fraction: 0.02
        source: "Bender et al. 2013, Agron. J. 105(1):161–170, DOI 10.2134/agronj2012.0352; late-season tails, approximate"
# ملاحظة صدق: الكسور تقريبيّة (approximation: true) مشتقّة من منحنيات V/R المنشورة
# ومعيَّنة على مراحل البطاقة الأربع — سلسلة الاشتقاق الكاملة في nutrient_demand_provenance
# أعلاه. البنية ثابتة، والمعايرة الإقليميّة (كمعدّل تصحيح) من districts/ لا من هنا.

# NO calibration block. NO yield. NO zone_factor. Those are districts/tenant OUTPUTS.
