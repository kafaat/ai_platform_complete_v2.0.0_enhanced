# SAHOOL CORE crop card — Faba bean (الفول / الباقلاء / Vicia faba)
# REGION-AGNOSTIC. Physics & physiology ONLY (FAO-56 / Maas-Hoffman / ECOCROP).
# الأصناف اليمنية المحلّية في varieties/ (مصدرها الدليل الزراعي للبقوليات الحبية 2023).
crop_id: faba_bean
name_ar: الفول
name_en: Faba bean
crop_family: legume_C3

kc:
  initial: 0.50
  mid: 1.15
  end: 0.30
  stage_days: [15, 25, 35, 15]   # Lini/Ldev/Lmid/Llate ≈ 90 يوم
  source: "FAO-56 Table 11/12 (Faba bean / Broad bean)"

salinity:
  threshold_ece_ds_m: 1.5        # الفول حسّاس للملوحة (Maas-Hoffman)
  slope_pct_per_ds_m: 9.6        # 9.6% نقص لكل dS/m فوق العتبة
  germination_ece_max: 1.5       # الإنبات أكثر حساسية (لا يتجاوز ~1.5)
  source: "Maas & Hoffman 1977; FAO-29 (Faba bean)"

thermal:
  gdd_base_c: 0.0                # بقوليّة باردة الموسم (حرارة أساس 0°م)
  gdd_to_maturity: 1500
  flowering_safe_max_c: 27.0     # إجهاد حراري للأزهار فوق ~27°م
  chilling_hours_required: 0
  source: "Faba bean agronomy (cool-season legume)"

governing:
  ph:        { min: 6.0, max: 8.5, error: 0.1, source: "ECOCROP Vicia faba" }
  ece_ds_m:  { min: 0.0, max: 6.0, error: 0.02, source: "Maas-Hoffman (Faba bean)" }
  drainage:  { needs: good }     # حسّاس للإغراق (waterlogging-intolerant)

modifying:
  organic_matter_pct:
    min_acceptable: 0.6
    optimal_min: 1.0
    optimal_max: 2.5
    max_acceptable: 5.0
    weight: 0.3
    error: 0.05
    source: "ECOCROP / legume agronomy (knowledge prior)"
    note_ar: "تقدير طيفي لـ OM يبقى قرينة؛ المختبر يحكم"
  # بقوليّة مثبّتة للنيتروجين (Rhizobium): الاحتياج النيتروجينيّ منخفض (دفعة بادئة فقط).
  nitrogen_kg_ha_required: 25
  phosphorus_kg_ha_required: 50
  potassium_kg_ha_required: 40

pest_susceptibility:
  pests: [aphids, chocolate_spot, ascochyta, rust, fbnyv]
  note: "نوافذ الخطر الإقليمية في districts/<region>/pests.yaml"

# ── مراحل النمو (Phenology) — محايدة الموقع، مُحاذاة لمراحل FAO-56 ──
# الحدود اليوميّة تطابق kc.stage_days التراكميّة [0–15, 15–40, 40–75, 75–90].
phenology:
  source: "FAO-56 stage lengths (Faba bean)"
  total_cycle_days: 90
  stages:
    - stage: initial
      name_ar: "الإنبات والتأسيس"
      day_start: 0
      day_end: 15
      kc: 0.50
      key_action_ar: "ريّ خفيف متكرّر لضمان إنبات منتظم"
    - stage: development
      name_ar: "النموّ الخضري"
      day_start: 15
      day_end: 40
      kc_end: 1.15
      key_action_ar: "تسميد بادئ + مكافحة الأعشاب"
    - stage: mid
      name_ar: "التزهير وتكوين القرون"
      day_start: 40
      day_end: 75
      kc: 1.15
      key_action_ar: "ذروة الاحتياج المائي — تجنّب الإجهاد المائي والحراري (>27°م)"
    - stage: late
      name_ar: "امتلاء البذور والنضج"
      day_start: 75
      day_end: 90
      kc: 0.30
      key_action_ar: "تقليل الريّ تدريجيّاً قبل الحصاد"
