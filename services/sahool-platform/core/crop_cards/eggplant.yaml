# SAHOOL CORE crop card — Eggplant / aubergine (الباذنجان)
# REGION-AGNOSTIC. Physics & physiology ONLY.
crop_id: eggplant
name_ar: الباذنجان
name_en: Eggplant (aubergine)
crop_family: vegetable_C3

kc:
  initial: 0.60
  mid: 1.05
  end: 0.90
  stage_days: [30, 40, 40, 20]   # ⇒ 130 يوماً (نقل شتلات)
  source: "FAO-56 Table 12 (Eggplant)"

salinity:
  threshold_ece_ds_m: 1.5        # الباذنجان حسّاس نسبيّاً (تقدير أدبيّ)
  slope_pct_per_ds_m: 7.0        # ليس Maas-Hoffman معياريّاً
  germination_ece_max: 1.3
  source: "Eggplant salinity literature (moderately sensitive; not in FAO-56 T23)"

thermal:
  gdd_base_c: 12.0
  gdd_to_maturity: 1400
  flowering_safe_max_c: 35.0
  chilling_hours_required: 0
  source: "Eggplant agronomy; warm-season solanaceous, base ~12C"

governing:
  ph:        { min: 5.5, max: 7.5, error: 0.1,  source: "ECOCROP eggplant" }
  ece_ds_m:  { min: 0.0, max: 6.0, error: 0.02, source: "Eggplant salt tolerance (indicative)" }
  drainage:  { needs: good }

modifying:
  organic_matter_pct:
    min_acceptable: 0.8
    optimal_min: 1.5
    optimal_max: 3.0
    max_acceptable: 5.0
    weight: 0.3
    error: 0.05
    source: "Eggplant OM thresholds (agronomy)"
  nitrogen_kg_ha_required: 120
  phosphorus_kg_ha_required: 60
  potassium_kg_ha_required: 120

pest_susceptibility:
  pests: [fruit_borer, whitefly, aphids, bacterial_wilt]
  note: "نوافذ الخطر الإقليمية في districts/<region>/pests.yaml"

# ── مراحل النمو ── الحدود = المجاميع التراكميّة [30,40,40,20] ⇒ [0–30, 30–70, 70–110, 110–130].
phenology:
  source: "FAO-56 Table 12 (Eggplant) stage lengths"
  total_cycle_days: 130
  stages:
    - stage: initial
      name_ar: "تأسيس الشتلة"
      day_start: 0
      day_end: 30
      kc: 0.60
      key_action_ar: "ريّ تأسيس بعد الشتل"
    - stage: development
      name_ar: "النموّ الخضري"
      day_start: 30
      day_end: 70
      kc_end: 1.05
      key_action_ar: "تسميد متوازن + تدعيم"
    - stage: mid
      name_ar: "التزهير والعقد والإثمار"
      day_start: 70
      day_end: 110
      kc: 1.05
      key_action_ar: "ذروة الاحتياج المائي عند الإثمار"
    - stage: late
      name_ar: "النضج والقطاف المتتابع"
      day_start: 110
      day_end: 130
      kc: 0.90
      key_action_ar: "قطاف متتابع مع انتظام الرطوبة"

# NO calibration block. NO yield. NO zone_factor.
