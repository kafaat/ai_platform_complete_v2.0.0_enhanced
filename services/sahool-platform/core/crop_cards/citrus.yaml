# SAHOOL CORE crop card — Citrus / orange (الحمضيات / البرتقال)
# REGION-AGNOSTIC. Physics & physiology ONLY.
# مُعمِّر (شجرة دائمة الخضرة) — كتلة phenology الحوليّة مُغفَلة عمداً.
crop_id: citrus
name_ar: الحمضيات (البرتقال)
name_en: Citrus (orange)
crop_family: tree_C3

kc:
  initial: 0.70
  mid: 0.65
  end: 0.70
  # الحمضيات: Kc منخفض نسبيّاً وثابت (شجرة دائمة، ظلّة كثيفة، لا نضج حوليّ).
  stage_days: [90, 90, 90, 95]   # ≈ سنة (إرشاديّ لمُعمِّر)
  source: "FAO-56 Table 12 (Citrus, no ground cover); perennial — indicative annual cycle"

salinity:
  threshold_ece_ds_m: 1.7        # الحمضيات حسّاسة للملوحة (Maas-Hoffman — برتقال)
  slope_pct_per_ds_m: 16.0
  source: "FAO-56 Table 23; Maas & Hoffman 1977 (Orange)"

thermal:
  gdd_base_c: 13.0
  gdd_to_maturity: 0             # مُعمِّر — إثمار موسميّ
  flowering_safe_max_c: 38.0
  chilling_hours_required: 0     # تحت-مداريّ — لا يحتاج ساعات برودة (يتضرّر بالصقيع)
  source: "Citrus agronomy (subtropical evergreen; frost-sensitive)"

governing:
  ph:        { min: 5.5, max: 7.5, error: 0.1,  source: "ECOCROP citrus" }
  ece_ds_m:  { min: 0.0, max: 6.0, error: 0.02, source: "FAO-56 T23" }
  drainage:  { needs: good }

modifying:
  organic_matter_pct:
    min_acceptable: 0.6
    optimal_min: 1.2
    optimal_max: 3.0
    max_acceptable: 6.0
    weight: 0.3
    error: 0.05
    source: "Citrus OM thresholds (agronomy)"
  nitrogen_kg_ha_required: 120
  phosphorus_kg_ha_required: 40
  potassium_kg_ha_required: 120

pest_susceptibility:
  pests: [citrus_leafminer, aphids, scale_insects, citrus_greening_hlb]
  note: "نوافذ الخطر الإقليمية في districts/<region>/pests.yaml"

# لا كتلة phenology (مُعمِّر). لا calibration/yield/zone_factor.
