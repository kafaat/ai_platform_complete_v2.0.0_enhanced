# SAHOOL CORE crop card — Lentil (العدس / Lens culinaris)
# REGION-AGNOSTIC. Physics & physiology ONLY (FAO-56 / Maas-Hoffman / ECOCROP).
# الأصناف اليمنية المحلّية في varieties/ (مصدرها دليل البقوليات الحبية 2023).
crop_id: lentil
name_ar: العدس
name_en: Lentil
crop_family: legume_C3

kc:
  initial: 0.40
  mid: 1.10
  end: 0.30
  stage_days: [20, 30, 60, 40]   # Lini/Ldev/Lmid/Llate ≈ 150 يوم (بقوليّة شتويّة باردة الموسم)
  source: "FAO-56 Table 11/12 (Lentil)"

salinity:
  threshold_ece_ds_m: 1.5        # العدس حسّاس للملوحة (sensitive)
  slope_pct_per_ds_m: 12.0       # 12% نقص في الإنتاج لكل dS/m فوق العتبة
  germination_ece_max: 1.5       # الإنبات أكثر حساسية (لا يتجاوز ~1.5)
  source: "FAO-29 / lentil salinity literature (sensitive)"

thermal:
  gdd_base_c: 0.0                # بقوليّة شتويّة باردة الموسم (حرارة أساس ~0°م)
  gdd_to_maturity: 1400
  flowering_safe_max_c: 27.0     # إجهاد حراري على التزهير فوق ~27°م
  chilling_hours_required: 0
  source: "Lentil agronomy; cool-season legume GDD base 0C; heat-sensitive flowering >27C"

governing:
  ph:        { min: 6.0, max: 8.5, error: 0.1, source: "ECOCROP Lens culinaris" }
  ece_ds_m:  { min: 0.0, max: 5.0, error: 0.02, source: "FAO-29 (Lentil, sensitive)" }
  drainage:  { needs: good }     # حسّاس للإغراق (waterlogging-intolerant)

modifying:
  organic_matter_pct:
    min_acceptable: 0.6
    optimal_min: 1.0
    optimal_max: 2.5
    max_acceptable: 5.0
    weight: 0.3
    error: 0.05
    source: "ECOCROP / legume agronomy (knowledge prior)"
    note_ar: "تقدير طيفي لـ OM يبقى قرينة؛ المختبر يحكم"
  # بقوليّة مثبّتة للنيتروجين (Rhizobium): الاحتياج النيتروجينيّ منخفض (دفعة بادئة فقط).
  nitrogen_kg_ha_required: 20
  phosphorus_kg_ha_required: 45
  potassium_kg_ha_required: 30

pest_susceptibility:
  pests: [aphids, whitefly, rust, downy_mildew, root_rot, lentil_pod_borer]
  note: "نوافذ الخطر الإقليمية في districts/<region>/pests.yaml"

# ── مراحل النمو (Phenology) — محايدة الموقع، مُحاذاة لمراحل FAO-56 ──
# الحدود اليوميّة تطابق kc.stage_days التراكميّة [0–20, 20–50, 50–110, 110–150].
phenology:
  source: "FAO-56 stage lengths (Lentil); lentil agronomy"
  total_cycle_days: 150
  stages:
    - stage: initial
      name_ar: "الإنبات والتأسيس"
      day_start: 0
      day_end: 20
      kc: 0.40
      key_action_ar: "ريّ خفيف متكرّر لضمان إنبات منتظم"
    - stage: development
      name_ar: "النموّ الخضري"
      day_start: 20
      day_end: 50
      kc_end: 1.10
      key_action_ar: "تسميد فوسفاتي بادئ + مكافحة الأعشاب"
    - stage: mid
      name_ar: "التزهير وتكوين القرون"
      day_start: 50
      day_end: 110
      kc: 1.10
      key_action_ar: "ذروة الاحتياج المائي — تجنّب الإجهاد المائي والحراري (>27°م)"
    - stage: late
      name_ar: "امتلاء البذور والنضج"
      day_start: 110
      day_end: 150
      kc: 0.30
      key_action_ar: "تقليل الريّ تدريجيّاً قبل الحصاد لتجنّب الانفراط"
