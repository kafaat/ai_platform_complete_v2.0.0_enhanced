# SAHOOL CORE crop card — Cotton (القطن)
# REGION-AGNOSTIC. Physics & physiology ONLY.
crop_id: cotton
name_ar: القطن
name_en: Cotton
crop_family: fiber_C3

kc:
  initial: 0.35
  mid: 1.15
  end: 0.70
  stage_days: [30, 50, 60, 55]   # ⇒ 195 يوماً
  source: "FAO-56 Table 12 (Cotton)"

salinity:
  threshold_ece_ds_m: 7.7        # القطن متحمّل للملوحة (Maas-Hoffman)
  slope_pct_per_ds_m: 5.2
  sar_max: 16.0
  germination_ece_max: 5.5       # الإنبات أحسّ من النبات البالغ
  source: "FAO-56 Table 23; Maas & Hoffman 1977 (Cotton)"

thermal:
  gdd_base_c: 15.0               # محصول حارّ — حرارة أساس مرتفعة
  gdd_to_maturity: 2200
  flowering_safe_max_c: 38.0
  chilling_hours_required: 0
  source: "Cotton agronomy; base ~15C; heat-loving"

governing:
  ph:        { min: 5.5, max: 8.5, error: 0.1,  source: "ECOCROP cotton" }
  ece_ds_m:  { min: 0.0, max: 16.0, error: 0.02, source: "FAO-56 T23" }
  drainage:  { needs: good }

modifying:
  organic_matter_pct:
    min_acceptable: 0.5
    optimal_min: 1.0
    optimal_max: 2.5
    max_acceptable: 5.0
    weight: 0.3
    error: 0.05
    source: "Cotton OM thresholds (agronomy)"
  nitrogen_kg_ha_required: 150
  phosphorus_kg_ha_required: 60
  potassium_kg_ha_required: 80

pest_susceptibility:
  pests: [bollworm, pink_bollworm, whitefly, aphids]
  note: "نوافذ الخطر الإقليمية في districts/<region>/pests.yaml"

# ── مراحل النمو ── الحدود = المجاميع التراكميّة [30,50,60,55] ⇒ [0–30, 30–80, 80–140, 140–195].
phenology:
  source: "FAO-56 Table 12 (Cotton) stage lengths"
  total_cycle_days: 195
  stages:
    - stage: initial
      name_ar: "الإنبات والتأسيس"
      day_start: 0
      day_end: 30
      kc: 0.35
      key_action_ar: "ريّ تأسيس + خفّ النباتات"
    - stage: development
      name_ar: "النموّ الخضري والتفريع"
      day_start: 30
      day_end: 80
      kc_end: 1.15
      key_action_ar: "تسميد آزوتيّ + مكافحة الحشائش"
    - stage: mid
      name_ar: "التزهير وتكوّن اللوز"
      day_start: 80
      day_end: 140
      kc: 1.15
      key_action_ar: "ذروة الاحتياج المائي — تجنّب الإجهاد أثناء تكوّن اللوز"
    - stage: late
      name_ar: "تفتّح اللوز والنضج"
      day_start: 140
      day_end: 195
      kc: 0.70
      key_action_ar: "تقليل الريّ عند بدء التفتّح لتجفيف اللوز"

# NO calibration block. NO yield. NO zone_factor.
