# SAHOOL CORE crop card — Chickpea (الحمّص)
# REGION-AGNOSTIC. Physics & physiology ONLY.
crop_id: chickpea
name_ar: الحمّص
name_en: Chickpea
crop_family: legume_C3

kc:
  initial: 0.40
  mid: 1.00
  end: 0.35
  stage_days: [20, 30, 40, 20]   # ⇒ 110 يوماً
  source: "FAO-56 Table 12 (Chickpea / pulses)"

salinity:
  threshold_ece_ds_m: 1.0        # الحمّص حسّاس للملوحة (خارج جدول FAO-56 T23)
  slope_pct_per_ds_m: 12.0       # تقدير أدبيّ — ليس Maas-Hoffman معياريّاً
  germination_ece_max: 1.0
  source: "Chickpea salinity literature (sensitive; not in FAO-56 T23 — indicative)"

thermal:
  gdd_base_c: 5.0                # بقوليّة باردة الموسم
  gdd_to_maturity: 1300
  flowering_safe_max_c: 30.0     # التزهير حسّاس للحرارة فوق ~30°م
  chilling_hours_required: 0
  source: "Chickpea agronomy; cool-season legume, base ~5C"

governing:
  ph:        { min: 6.0, max: 8.5, error: 0.1,  source: "ECOCROP chickpea" }
  ece_ds_m:  { min: 0.0, max: 6.0, error: 0.02, source: "Chickpea salt tolerance (indicative)" }
  drainage:  { needs: good }

modifying:
  organic_matter_pct:
    min_acceptable: 0.5
    optimal_min: 1.0
    optimal_max: 2.0
    max_acceptable: 4.0
    weight: 0.3
    error: 0.05
    source: "Chickpea OM thresholds (agronomy)"
  nitrogen_kg_ha_required: 20    # بقوليّة مثبّتة للنيتروجين
  phosphorus_kg_ha_required: 50
  potassium_kg_ha_required: 40

pest_susceptibility:
  pests: [pod_borer, ascochyta_blight, fusarium_wilt]
  note: "نوافذ الخطر الإقليمية في districts/<region>/pests.yaml"

# ── مراحل النمو ── الحدود = المجاميع التراكميّة [20,30,40,20] ⇒ [0–20, 20–50, 50–90, 90–110].
phenology:
  source: "FAO-56 Table 12 (Chickpea) stage lengths"
  total_cycle_days: 110
  stages:
    - stage: initial
      name_ar: "الإنبات والتأسيس"
      day_start: 0
      day_end: 20
      kc: 0.40
      key_action_ar: "ريّ تأسيس خفيف"
    - stage: development
      name_ar: "النموّ الخضري"
      day_start: 20
      day_end: 50
      kc_end: 1.00
      key_action_ar: "خفض النيتروجين (تثبيت حيويّ) + مكافحة الحشائش"
    - stage: mid
      name_ar: "التزهير وتكوّن القرون"
      day_start: 50
      day_end: 90
      kc: 1.00
      key_action_ar: "ذروة الاحتياج المائي — التزهير حسّاس للحرارة"
    - stage: late
      name_ar: "امتلاء الحبّ والنضج"
      day_start: 90
      day_end: 110
      kc: 0.35
      key_action_ar: "إيقاف الريّ نحو النضج"

# NO calibration block. NO yield. NO zone_factor.
