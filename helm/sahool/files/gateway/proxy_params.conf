# SAHOOL Helm gateway — headers set on every proxied request (W0-06, deploy-12).
#
# A superset of nginx/proxy_params.conf: every identity or service-channel header a client
# could forge is cleared here, before a route re-injects only what `auth_request` verified.
# `proxy_set_header` in a location replaces all inherited ones, so routes include this file
# first and then set the verified values (a later directive for the same header wins).
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Tenant-Id "";
proxy_set_header X-Tenant-Assertion "";
proxy_set_header X-User-Id "";
proxy_set_header X-User-Role "";
proxy_set_header X-Agent-Token "";
proxy_set_header X-Field-Forms-Token "";
proxy_set_header X-Field-Tasks-Token "";
proxy_set_header X-Scout-Media-Token "";
proxy_set_header Cookie "";
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_buffering off;
proxy_connect_timeout 10s;
proxy_send_timeout    60s;
