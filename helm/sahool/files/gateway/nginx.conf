# SAHOOL Helm gateway — main configuration (W0-06, findings deploy-2 / deploy-12).
#
# The Ingress has exactly one backend: this gateway. It is the same trust model as the
# compose gateway (nginx/nginx.v9.conf, "R6"): client identity headers are cleared
# (proxy_params.conf), the JWT is verified by `auth_request` against the auth service's
# `GET /v1/auth/verify`, and only the tenant/user/role that auth returns is injected
# upstream. A failed or unreachable verification rejects the request; nothing is passed.
# Each public prefix is rewritten to the path the service actually serves (/v1/...),
# which the previous Prefix-only Ingress never did (deploy-2).
#
# Mounted from a ConfigMap at /etc/sahool-gateway/ next to upstreams.conf (rendered by
# templates/gateway.yaml from the enabled workloads), routes.conf and proxy_params.conf.
# Relative includes resolve against this file's directory. The pod runs as the image's
# unprivileged nginx user with a read-only root filesystem, so every writable path is /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 2048; }
http {
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    client_max_body_size 50M;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # The ingress controller is the only external client (NetworkPolicy); trust its
    # X-Forwarded-For so rate limits key on the real client, not on the controller pod.
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    limit_req_status 429;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m  rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m   rate=60r/m;
    limit_req_zone $binary_remote_addr zone=agent_limit:10m rate=20r/m;

    # Access log without the `access_token` query value (tile <img> requests carry it).
    map $request $request_no_token {
        default                                             $request;
        "~^(?<pre>.*[?&])access_token=[^&\s]*(?<post>.*)$"  "${pre}access_token=REDACTED${post}";
    }
    log_format main_redacted '$remote_addr - [$time_local] "$request_no_token" '
                             '$status $body_bytes_sent "$http_user_agent"';
    access_log /dev/stdout main_redacted;

    include upstreams.conf;

    server {
        listen 8080;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        # Gateway liveness/readiness: answered by nginx itself, no upstream, no identity.
        location = /gateway/healthz { access_log off; return 200 "ok\n"; }

        include routes.conf;

        # No route is open by default: an unknown path is not forwarded anywhere.
        location / { return 404; }
    }
}
