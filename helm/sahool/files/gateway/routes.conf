# SAHOOL Helm gateway — public routes (W0-06, findings deploy-2 / deploy-12).
#
# One location per enabled chart workload, with the same semantics as the matching
# location in the compose gateway (nginx/nginx.v9.conf). Upstream names are the workload
# names with "-" replaced by "_" (templates/gateway.yaml renders them into upstreams.conf);
# tests_v9/test_helm_gateway_ingress_contract.py fails if a route names an upstream the
# chart does not render, or if an enabled workload has no route here.
#
# Identity model on every route: include proxy_params.conf FIRST (clears any client-sent
# X-Tenant-Id / X-User-* / service tokens), then, where `auth_request` ran, set the values
# auth verified. A route without `auth_request` forwards no identity header at all; its
# service verifies the bearer itself (platform, guardrails).

# Bearer source for the verification subrequest: the Authorization header by default,
# overridden in /_auth_verify by the HttpOnly `sahool_at` cookie. Tile routes that also
# accept the `access_token` query (an <img> carries no header) hand it over in
# $query_bearer: the subrequest re-runs this server-level `set`, so a `set $fwd_auth` in
# the calling location would be lost, while a variable only that location sets survives
# (subrequests share the parent's variables). The cookie still wins over the query.
set $fwd_auth $http_authorization;

# Auth is addressed by $sahool_auth_addr (rendered into upstreams.conf with a `resolver`)
# and resolved per request, not at start-up: nginx starts even while the auth Service does
# not exist yet, and every verification then fails (500), so nothing passes unverified.

# Internal only: never reachable by a client, only as the `auth_request` subrequest.
location = /_auth_verify {
    internal;
    uninitialized_variable_warn off;
    if ($query_bearer) { set $fwd_auth $query_bearer; }
    if ($cookie_sahool_at) { set $fwd_auth "Bearer $cookie_sahool_at"; }
    proxy_pass http://$sahool_auth_addr/v1/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header Authorization $fwd_auth;
    proxy_set_header X-Tenant-Id "";
    proxy_set_header X-Tenant-Assertion "";
    proxy_set_header X-User-Id "";
    proxy_set_header X-User-Role "";
    proxy_set_header X-Agent-Token "";
    proxy_set_header Cookie "";
}

# Login / refresh / logout on the auth service (both client spellings, as in compose).
location /auth/ {
    limit_req zone=auth_limit burst=10 nodelay;
    rewrite ^/auth/auth/(.*)$ /v1/auth/$1 break;
    rewrite ^/auth/(.*)$ /v1/auth/$1 break;
    proxy_pass http://$sahool_auth_addr;
    include proxy_params.conf;
}

# sahool-platform: COG tiles carry no Authorization header (<img>), so the bearer comes
# from the HttpOnly cookie and is verified here before the platform sees it.
location ~ ^/api/v1/gis/cloud-native/rasters/[^/]+/tiles/ {
    limit_req zone=api_limit burst=40 nodelay;
    if ($cookie_sahool_at) { set $fwd_auth "Bearer $cookie_sahool_at"; }
    auth_request /_auth_verify;
    proxy_pass http://sahool_platform;
    include proxy_params.conf;
    auth_request_set $tenant $upstream_http_x_tenant_id;
    proxy_set_header X-Tenant-Id $tenant;
    proxy_set_header Authorization $fwd_auth;
    proxy_read_timeout 60s;
}

# sahool-platform: the season simulation run awaits 83 s of upstream bounds before it saves,
# and the web client waits 110 s for it; /api/v1/ below would cut it at 60 s. Same trust
# model as /api/v1/ (the platform verifies the JWT itself); the path passes as is.
location ~ ^/api/v1/seasons/[^/]+/simulate$ {
    limit_req zone=api_limit burst=40 nodelay;
    proxy_pass http://sahool_platform;
    include proxy_params.conf;
    proxy_read_timeout 120s;
}

# sahool-platform: the unified /api/v1 surface. The platform verifies the JWT itself
# (get_current_user); identity headers are cleared, none is injected.
location /api/v1/ {
    limit_req zone=api_limit burst=40 nodelay;
    proxy_pass http://sahool_platform/api/v1/;
    include proxy_params.conf;
    proxy_read_timeout 60s;
}

# sahool-raster-service: /api/raster/<path> -> /<path> (the service serves /v1/*).
location /api/raster/ {
    limit_req zone=api_limit burst=30 nodelay;
    if ($arg_access_token) { set $query_bearer "Bearer $arg_access_token"; }
    auth_request /_auth_verify;
    proxy_pass http://sahool_raster_service/;
    include proxy_params.conf;
    auth_request_set $tenant $upstream_http_x_tenant_id;
    proxy_set_header X-Tenant-Id $tenant;
    proxy_set_header Authorization $fwd_auth;
    proxy_read_timeout 60s;
}

# sahool-ai-agronomist: unauthenticated liveness only, exact match.
location = /api/ai-agronomist/healthz {
    limit_req zone=agent_limit burst=10 nodelay;
    proxy_pass http://sahool_ai_agronomist/healthz;
    include proxy_params.conf;
}

# sahool-ai-agronomist: /api/ai-agronomist/<path> -> /v1/<path>, verified identity only.
location /api/ai-agronomist/ {
    limit_req zone=agent_limit burst=10 nodelay;
    auth_request /_auth_verify;
    proxy_pass http://sahool_ai_agronomist/v1/;
    include proxy_params.conf;
    auth_request_set $tenant $upstream_http_x_tenant_id;
    proxy_set_header X-Tenant-Id $tenant;
    auth_request_set $auth_uid $upstream_http_x_user_id;
    proxy_set_header X-User-Id $auth_uid;
    auth_request_set $auth_role $upstream_http_x_user_role;
    proxy_set_header X-User-Role $auth_role;
    proxy_read_timeout 120s;
}

# sahool-rag-retrieval: /api/rag/<path> -> /v1/<path>.
location /api/rag/ {
    limit_req zone=agent_limit burst=10 nodelay;
    if ($cookie_sahool_at) { set $fwd_auth "Bearer $cookie_sahool_at"; }
    auth_request /_auth_verify;
    proxy_pass http://sahool_rag_retrieval/v1/;
    include proxy_params.conf;
    auth_request_set $tenant $upstream_http_x_tenant_id;
    proxy_set_header X-Tenant-Id $tenant;
    proxy_set_header Authorization $fwd_auth;
    proxy_read_timeout 60s;
}

# sahool-knowledge-graph: /api/knowledge-graph/<path> -> /v1/<path>.
location /api/knowledge-graph/ {
    limit_req zone=agent_limit burst=10 nodelay;
    auth_request /_auth_verify;
    proxy_pass http://sahool_knowledge_graph/v1/;
    include proxy_params.conf;
    auth_request_set $tenant $upstream_http_x_tenant_id;
    proxy_set_header X-Tenant-Id $tenant;
    proxy_read_timeout 60s;
}

# sahool-guardrails-engine: /api/guardrails/<path> -> /<path>. The service verifies its
# own bearer / service token (_require_service_token); no identity header is injected.
location /api/guardrails/ {
    limit_req zone=agent_limit burst=10 nodelay;
    proxy_pass http://sahool_guardrails_engine/;
    include proxy_params.conf;
}
