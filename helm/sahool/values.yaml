global:
  environment: staging
  imageRegistry: ""
  imagePullPolicy: IfNotPresent
  tenantIsolation: true
  requireRuntimeAppRole: true
  runtimeDatabaseRole: sahool_app
  jobsDatabaseRole: sahool_jobs
  secretRefs:
    databaseUrl: sahool-database-url
    jobsDatabaseUrl: sahool-jobs-database-url
    # كلمات مرور الأدوار التي يُنشئها المُهاجر — تُقرأ فقط حين jobs.migration.apply=true.
    appDbPassword: sahool-app-db-password
    jobsDbPassword: sahool-jobs-db-password
    ingestDbPassword: sahool-ingest-db-password
    jwtPublicKey: sahool-jwt-public-key
    jwtPrivateKey: sahool-jwt-private-key
    agentToken: sahool-agent-token
    cdseClientId: sahool-cdse-client-id
    cdseClientSecret: sahool-cdse-client-secret

namespace:
  create: true
  name: sahool

networkPolicy:
  enabled: true
  # Same-namespace workloads are allowed explicitly below. Only ingress controller
  # namespaces listed here may enter from outside the SAHOOL namespace.
  trustedIngressNamespaces:
    - ingress-nginx
  # External HTTPS is required for CDSE/weather providers whose addresses rotate.
  # Clusters with an egress proxy should set this false and add proxy-specific policy.
  allowPublicHttpsEgress: true

ingress:
  enabled: true
  className: nginx
  host: sahool.example.invalid
  tlsSecretName: sahool-tls

resourcesDefault:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

workloads:
  sahool-platform:
    enabled: true
    image: sahool/platform:2026.06.26-rc.15
    replicas: 2
    port: 8000
    sourceDockerfile: services/sahool-platform/Dockerfile
    pathPrefix: /api/v1
    env:
      SERVICE_NAME: sahool-platform
      RUNTIME_ROLE_REQUIRED: "sahool_app"
      # احتياط اتّجاه الرياح من MET Norway حين يغيب من Open-Meteo (لا قيمة وهميّة).
      METNO_WIND_FALLBACK_ENABLED: "1"
      METNO_USER_AGENT: "SAHOOL-AgriPlatform/1.0 (https://sahool.ye; ops@sahool.ye)"
    secretEnv:
      DATABASE_URL: databaseUrl
      JWT_PUBLIC_KEY: jwtPublicKey
      SAHOOL_AGENT_TOKEN: agentToken
  sahool-raster-service:
    enabled: true
    image: sahool/raster-service:2026.06.26-rc.15
    replicas: 2
    port: 8001
    sourceDockerfile: services/raster-service/Dockerfile
    pathPrefix: /api/raster
    persistence:
      size: 20Gi
      accessMode: ReadWriteMany
      mountPath: /data/rasters
    env:
      SERVICE_NAME: sahool-raster-service
      RUNTIME_ROLE_REQUIRED: "sahool_app"
      CDSE_PROCESS_MIN_INTERVAL_SECONDS: "2.0"
      CDSE_PROCESS_MAX_RETRIES: "5"
      CDSE_PROCESS_RETRY_BASE_SECONDS: "5"
      CDSE_PROCESS_RETRY_MAX_SECONDS: "120"
    secretEnv:
      SAHOOL_AGENT_TOKEN: agentToken
      DATABASE_URL: databaseUrl
      CDSE_CLIENT_ID: cdseClientId
      CDSE_CLIENT_SECRET: cdseClientSecret
  sahool-ai-agronomist:
    enabled: true
    image: sahool/ai-agronomist:2026.06.26-rc.15
    replicas: 2
    port: 8000
    sourceDockerfile: services/ai_agronomist/Dockerfile
    pathPrefix: /api/ai-agronomist
    env:
      SERVICE_NAME: sahool-ai-agronomist
      FIELD_STATE_REQUIRED: "true"
    secretEnv:
      SAHOOL_AGENT_TOKEN: agentToken
  sahool-rag-retrieval:
    enabled: true
    image: sahool/rag-retrieval:2026.06.26-rc.15
    replicas: 2
    port: 8000
    sourceDockerfile: services/rag-retrieval/Dockerfile
    pathPrefix: /api/rag
    env:
      SERVICE_NAME: sahool-rag-retrieval
    secretEnv:
      SAHOOL_AGENT_TOKEN: agentToken
  sahool-knowledge-graph:
    enabled: true
    image: sahool/knowledge-graph:2026.06.26-rc.15
    replicas: 1
    port: 8000
    sourceDockerfile: services/knowledge-graph/Dockerfile
    pathPrefix: /api/knowledge-graph
    persistence:
      size: 5Gi
      accessMode: ReadWriteOnce
      mountPath: /data
    env:
      KG_SQLITE_PATH: /data/kg.sqlite
      SERVICE_NAME: sahool-knowledge-graph
    secretEnv:
      SAHOOL_AGENT_TOKEN: agentToken
  sahool-guardrails-engine:
    enabled: true
    image: sahool/guardrails-engine:2026.06.26-rc.15
    replicas: 2
    port: 8000
    sourceDockerfile: services/guardrails-engine/Dockerfile
    pathPrefix: /api/guardrails
    env:
      SERVICE_NAME: sahool-guardrails-engine
    secretEnv:
      SAHOOL_AGENT_TOKEN: agentToken

jobs:
  migration:
    enabled: true
    # صورة المُهاجر نفسها التي يبنيها Railway: postgres-alpine + bash + psql + /migrations/
    # (MANIFEST + apply_in_compose.sh). الأمر السابق (scripts_v9/migrate.py في صورة المنصّة) لا
    # تحويه تلك الصورة ولا psql ⇒ كان كلّ helm install يفشل (تدقيق 2026-11-01 I1).
    image: sahool/migrate:2026.06.26-rc.15
    sourceDockerfile: deploy/railway/Dockerfile.migrate
    # files/migration-dsn-env.sh يشتقّ PG* من JOBS_DATABASE_URL ثمّ يُسلِّم لمُشغّل Railway نفسه.
    command: ["bash", "/opt/sahool-migrate/migration-dsn-env.sh", "/migrations/apply_in_compose.sh"]
    # إذن التطبيق (SAHOOL_MIGRATE_APPLY في مسار Railway). false ⇒ قراءة فقط ولا هجرة تُطبَّق؛
    # يُضبط true عند قرار الهجرة فقط (docs/runbooks/MIGRATION_UNFREEZE_RUNBOOK_20261028.md).
    apply: false
    # UID مستخدم postgres في صورة alpine (الصورة تعمل جذراً افتراضيّاً، وrunAsNonRoot مفروض).
    runAsUser: 70
    secretEnv:
      # الـDSN لمالك الهجرات (sahool_user) رغم الاسم — migrations/POSTGRES_SETUP.md.
      JOBS_DATABASE_URL: jobsDatabaseUrl
    # تُشترط فقط حين apply=true: apply_in_compose.sh يرفض التطبيق بدونها قبل أيّ كتابة.
    applySecretEnv:
      APP_DB_PASSWORD: appDbPassword
      JOBS_DB_PASSWORD: jobsDbPassword
      INGEST_DB_PASSWORD: ingestDbPassword

observability:
  prometheusScrape: true
  serviceMonitor: false
  grafanaDashboardConfigMap: sahool-grafana-dashboards
