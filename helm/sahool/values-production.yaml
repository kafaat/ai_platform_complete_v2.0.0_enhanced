global:
  environment: production
  imagePullPolicy: IfNotPresent
ingress:
  host: app.sahool.example.invalid
gateway:
  replicas: 2
workloads:
  sahool-platform:
    replicas: 3
    env:
      # W2-02: pinned on in production (AC-1 always required there).
      AGRONOMIC_CONTEXT_COMPOSE_ENABLED: "true"
  sahool-raster-service:
    replicas: 3
  sahool-ai-agronomist:
    replicas: 2
  sahool-rag-retrieval:
    replicas: 2
  sahool-knowledge-graph:
    replicas: 1
  sahool-guardrails-engine:
    replicas: 2
  sahool-auth:
    replicas: 2
  sahool-weather-service:
    replicas: 2
  sahool-soil-service:
    replicas: 2
  sahool-decision-service:
    replicas: 2
  sahool-field-management:
    replicas: 2
observability:
  prometheusScrape: true
  serviceMonitor: true
