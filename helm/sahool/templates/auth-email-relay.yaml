{{- /*
HELM-AUTH-NO-SMTP-SMS-EGRESS-01.
This chart does NOT install a mail server. It connects auth only to a separately
approved, operator-managed in-namespace relay with matching Pod labels and a
trusted STARTTLS certificate. Disabled by default; no Internet SMTP/SMS egress.
NetworkPolicies are additive: verify the effective CNI policy in staging.
*/ -}}
{{- $relay := .Values.authEmailRelay | default dict -}}
{{- $auth := index .Values.workloads "sahool-auth" | default dict -}}
{{- $authEnv := $auth.env | default dict -}}
{{- $authSecretEnv := $auth.secretEnv | default dict -}}
{{- range $key := list "SMTP_HOST" "SMTP_PORT" "SMTP_USER" "SMTP_PASSWORD" "SMTP_FROM" "SMS_PROVIDER_URL" "SMS_API_KEY" -}}
{{- if or (hasKey $authEnv $key) (hasKey $authSecretEnv $key) -}}
  {{- fail (printf "authEmailRelay: workloads.sahool-auth must not set %s directly; use guarded authEmailRelay opt-in (SMS remains disabled)" $key) -}}
{{- end -}}
{{- end -}}
{{- if $relay.enabled -}}
{{- $dnsLabel := "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" -}}
{{- if not .Values.networkPolicy.enabled -}}
  {{- fail "authEmailRelay: networkPolicy.enabled must be true" -}}
{{- end -}}
{{- if not $auth.enabled -}}
  {{- fail "authEmailRelay: sahool-auth must be enabled" -}}
{{- end -}}
{{- if $auth.publicHttpsEgress -}}
  {{- fail "authEmailRelay: sahool-auth publicHttpsEgress is forbidden" -}}
{{- end -}}
{{- if not (regexMatch $dnsLabel (toString ($relay.serviceName | default ""))) -}}
  {{- fail "authEmailRelay.serviceName must be a same-namespace Kubernetes Service DNS label" -}}
{{- end -}}
{{- if not (regexMatch $dnsLabel (toString ($relay.podComponent | default ""))) -}}
  {{- fail "authEmailRelay.podComponent must be a Kubernetes Pod component label" -}}
{{- end -}}
{{- if eq $relay.podComponent "sahool-auth" -}}
  {{- fail "authEmailRelay.podComponent must not target sahool-auth itself" -}}
{{- end -}}
{{- if ne (int ($relay.port | default 0)) 587 -}}
  {{- fail "authEmailRelay: only internal STARTTLS submission port 587 is supported" -}}
{{- end -}}
{{- if not (regexMatch "^[^[:space:]@]+@[^[:space:]@]+[.][^[:space:]@]+$" (toString ($relay.from | default ""))) -}}
  {{- fail "authEmailRelay.from must be an explicit sender email address" -}}
{{- end -}}
{{- if not (regexMatch $dnsLabel (toString ($relay.credentialsSecret | default ""))) -}}
  {{- fail "authEmailRelay.credentialsSecret must name an existing operator-managed Secret" -}}
{{- end -}}
{{- range $key := list "usernameKey" "passwordKey" -}}
  {{- if not (regexMatch "^[A-Za-z0-9._-]+$" (toString (index $relay $key | default ""))) -}}
    {{- fail (printf "authEmailRelay.%s must be an existing Secret data key" $key) -}}
  {{- end -}}
{{- end -}}
{{- range $key := list "dnsNamespace" "dnsPodComponent" -}}
  {{- if not (regexMatch $dnsLabel (toString (index $relay $key | default ""))) -}}
    {{- fail (printf "authEmailRelay.%s must name a specific cluster DNS namespace/Pod" $key) -}}
  {{- end -}}
{{- end -}}
{{- $purposes := dict -}}
{{- range $peer := ($relay.dependencyEgress | default list) -}}
  {{- $purpose := toString ($peer.purpose | default "") -}}
  {{- if not (has $purpose (list "database" "redis")) -}}
    {{- fail "authEmailRelay.dependencyEgress supports only named database and redis peers" -}}
  {{- end -}}
  {{- if hasKey $purposes $purpose -}}
    {{- fail (printf "authEmailRelay.dependencyEgress has duplicate %s peer" $purpose) -}}
  {{- end -}}
  {{- $_ := set $purposes $purpose true -}}
  {{- range $key := list "namespace" "podComponent" -}}
    {{- if not (regexMatch $dnsLabel (toString (index $peer $key | default ""))) -}}
      {{- fail (printf "authEmailRelay.dependencyEgress.%s must be a specific namespace/Pod label" $key) -}}
    {{- end -}}
  {{- end -}}
  {{- $port := int ($peer.port | default 0) -}}
  {{- if or (lt $port 1) (gt $port 65535) (has $port (list 25 465 587)) -}}
    {{- fail "authEmailRelay.dependencyEgress port must be a specific non-SMTP port" -}}
  {{- end -}}
{{- end -}}
{{- if or (not (hasKey $purposes "database")) (not (hasKey $purposes "redis")) -}}
  {{- fail "authEmailRelay.dependencyEgress must name both database and redis peers" -}}
{{- end -}}
{{- /*
An egress policy alone cannot restrict auth when the namespace-wide egress
policy still selects it. networkpolicy.yaml excludes sahool-auth from that
wide allowance when authEmailRelay.enabled=true.
*/ -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sahool-auth-mail-relay-egress
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "sahool.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: sahool-auth
  policyTypes: [Egress]
  egress:
    # Only the approved in-namespace relay is allowed on submission port 587.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: {{ $relay.podComponent | quote }}
      ports:
        - protocol: TCP
          port: 587
    # Cluster DNS; Pod selector avoids allowing all of kube-system.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $relay.dnsNamespace | quote }}
          podSelector:
            matchLabels:
              k8s-app: {{ $relay.dnsPodComponent | quote }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Database and Redis destinations must be supplied by the operator.
    {{ range $peer := $relay.dependencyEgress }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $peer.namespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: {{ $peer.podComponent | quote }}
      ports:
        - protocol: TCP
          port: {{ int $peer.port }}
    {{ end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sahool-mail-relay-auth-ingress
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "sahool.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: {{ $relay.podComponent | quote }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: sahool-auth
      ports:
        - protocol: TCP
          port: 587
{{- end }}
