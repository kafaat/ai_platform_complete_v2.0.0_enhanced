{{- if .Values.jobs.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: sahool-migration-{{ .Chart.AppVersion | replace "." "-" }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "sahool.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/component: sahool-migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ .Values.jobs.migration.image | quote }}
          command: {{ toJson .Values.jobs.migration.command }}
          env:
            - name: JOBS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ index $.Values.global.secretRefs .Values.jobs.migration.secretEnv.JOBS_DATABASE_URL }}
                  key: value
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}
