{{- if .Values.networkPolicy.enabled }}
{{- /*
Ingress ports are derived from the enabled workloads' declared `port` values, not a
hand-kept list. The previous static list (8000, 8093, 8130, 8140, 8097) never carried
8001 after sahool-raster-service moved to it, so the Service pointed at a port the
namespace policy denied (Copilot on #997). Any new workload port is allowed as soon as
it is declared; a port nobody serves is never opened.
*/}}
{{- $ports := list }}
{{- range $name, $workload := .Values.workloads }}
{{- if $workload.enabled }}
{{- $ports = append $ports (printf "%d" (int $workload.port)) }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sahool-default-deny-and-api-allow
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "sahool.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.networkPolicy.trustedIngressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        {{- range $port := ($ports | uniq | sortAlpha) }}
        - protocol: TCP
          port: {{ $port }}
        {{- end }}
  egress:
    - to:
        - namespaceSelector: {}
    {{- if .Values.networkPolicy.allowPublicHttpsEgress }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
{{- end }}
