{{- if .Values.networkPolicy.enabled }}
{{- /*
Ingress ports are derived from the enabled workloads' declared `port` values, not a
hand-kept list. The previous static list (8000, 8093, 8130, 8140, 8097) never carried
8001 after sahool-raster-service moved to it, so the Service pointed at a port the
namespace policy denied (Copilot on #997). Any new workload port is allowed as soon as
it is declared; a port nobody serves is never opened.

W0-06 (deploy-12): the ingress controller namespaces reach only the gateway, and a
workload marked `gatewayOnly` (raster, ai-agronomist: both derive the tenant from
X-Tenant-Id) accepts traffic only from the gateway and from the in-namespace callers it
lists in `internalCallers`, which authenticate with the service token. Policies are
additive, so the namespace-wide allow below excludes those workloads instead of
overlapping them.

W3-09: a workload marked `internalOnly` (no auth of its own, no gateway route) is
restricted the same way but admits only its `internalCallers`, not the gateway; an empty
caller list is refused rather than rendered as a policy that admits nobody or everybody.

W3-09 egress: every pod may reach the cluster (namespaceSelector: DNS, the databases,
Redis and brokers the chart expects to be provided), and public HTTPS (TCP 443 to any
address) only for workloads that declare `publicHttpsEgress: true`, because they call an
external provider (Open-Meteo, MET Norway, CDSE, ISRIC SoilGrids, a hosted model API).
`networkPolicy.allowPublicHttpsEgress: false` withdraws it from all of them, for clusters
that egress through a proxy with its own policy. The gateway and the migration Job get no
public egress.
*/}}
{{- $ports := list }}
{{- $gatewayOnly := list "sahool-gateway" }}
{{- $publicHttps := list }}
{{- range $name, $workload := .Values.workloads }}
{{- if $workload.enabled }}
{{- if or $workload.gatewayOnly $workload.internalOnly }}
{{- $gatewayOnly = append $gatewayOnly $name }}
{{- else }}
{{- $ports = append $ports (printf "%d" (int $workload.port)) }}
{{- end }}
{{- if $workload.publicHttpsEgress }}
{{- $publicHttps = append $publicHttps $name }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sahool-default-deny
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "sahool.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector: {}
{{- if and .Values.networkPolicy.allowPublicHttpsEgress $publicHttps }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sahool-public-https-egress
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "sahool.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          {{- range ($publicHttps | sortAlpha) }}
          - {{ . | quote }}
          {{- end }}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
{{- end }}
{{- if $ports }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sahool-internal-allow
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "sahool.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values:
          {{- range $gatewayOnly }}
          - {{ . | quote }}
          {{- end }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        {{- range $port := ($ports | uniq | sortAlpha) }}
        - protocol: TCP
          port: {{ $port }}
        {{- end }}
{{- end }}
{{- if .Values.gateway.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sahool-gateway-from-ingress-controller
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "sahool.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: sahool-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- /* An empty `from` would admit every source in the cluster: refuse instead. */}}
        {{- if not .Values.networkPolicy.trustedIngressNamespaces }}
        {{- fail "networkPolicy.trustedIngressNamespaces must name the ingress controller namespace(s): an empty list renders a NetworkPolicy `from` with no peers, which admits every source to the gateway" }}
        {{- end }}
        {{- range .Values.networkPolicy.trustedIngressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.gateway.port }}
{{- end }}
{{- range $name, $workload := .Values.workloads }}
{{- if and $workload.enabled (or $workload.gatewayOnly $workload.internalOnly) }}
{{- if and $workload.gatewayOnly $workload.internalOnly }}
{{- fail (printf "workloads.%s: set gatewayOnly or internalOnly, not both" $name) }}
{{- end }}
{{- if and $workload.internalOnly (not $workload.internalCallers) }}
{{- fail (printf "workloads.%s: internalOnly needs internalCallers; an empty `from` would admit every source" $name) }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-{{ if $workload.gatewayOnly }}gateway-only{{ else }}internal-only{{ end }}
  namespace: {{ $.Values.namespace.name }}
  labels:
    {{- include "sahool.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: {{ $name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- if $workload.gatewayOnly }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: sahool-gateway
        {{- end }}
        {{- range $caller := $workload.internalCallers }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: {{ $caller | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $workload.port }}
{{- end }}
{{- end }}
{{- end }}
