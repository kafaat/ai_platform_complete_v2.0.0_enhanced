{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sahool-default-deny-and-api-allow
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "sahool.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.networkPolicy.trustedIngressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8093
        - protocol: TCP
          port: 8130
        - protocol: TCP
          port: 8140
        - protocol: TCP
          port: 8097
  egress:
    - to:
        - namespaceSelector: {}
    {{- if .Values.networkPolicy.allowPublicHttpsEgress }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
{{- end }}
