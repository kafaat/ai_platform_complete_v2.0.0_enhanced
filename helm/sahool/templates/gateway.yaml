{{- /*
SAHOOL gateway (W0-06, findings deploy-2 / deploy-12): the Ingress's only backend.
nginx verifies every protected request with `auth_request` -> auth `GET /v1/auth/verify`,
clears client-sent X-Tenant-* / X-User-* / service-token headers, injects only the
verified tenant, and rewrites each public prefix to the path the service serves. The
static configuration lives in files/gateway/ (tested with a real nginx by
tests_v9/test_helm_gateway_ingress_contract.py); only upstreams.conf is rendered here.
*/}}
{{- if .Values.gateway.enabled }}
{{- $upstreams := include "sahool.gatewayUpstreams" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sahool-gateway
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "sahool.labels" . | nindent 4 }}
    app.kubernetes.io/component: sahool-gateway
data:
  nginx.conf: |
    {{- .Files.Get "files/gateway/nginx.conf" | nindent 4 }}
  routes.conf: |
    {{- .Files.Get "files/gateway/routes.conf" | nindent 4 }}
  proxy_params.conf: |
    {{- .Files.Get "files/gateway/proxy_params.conf" | nindent 4 }}
  upstreams.conf: |
    {{- $upstreams | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sahool-gateway
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "sahool.labels" . | nindent 4 }}
    app.kubernetes.io/component: sahool-gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: sahool-gateway
  template:
    metadata:
      labels:
        {{- include "sahool.labels" . | nindent 8 }}
        app.kubernetes.io/component: sahool-gateway
      annotations:
        sahool.io/gateway-config-sha256: {{ printf "%s%s%s%s" (.Files.Get "files/gateway/nginx.conf") (.Files.Get "files/gateway/routes.conf") (.Files.Get "files/gateway/proxy_params.conf") $upstreams | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.gateway.runAsUser }}
        runAsGroup: {{ .Values.gateway.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sahool-gateway
          image: {{ .Values.gateway.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          # Bypass the image entrypoint (it rewrites /etc/nginx, which is read-only here).
          command: ["nginx", "-g", "daemon off;", "-c", "/etc/sahool-gateway/nginx.conf"]
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
          volumeMounts:
            - name: config
              mountPath: /etc/sahool-gateway
              readOnly: true
            - name: temporary
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /gateway/healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /gateway/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: sahool-gateway
        - name: temporary
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sahool-gateway
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "sahool.labels" . | nindent 4 }}
    app.kubernetes.io/component: sahool-gateway
spec:
  selector:
    app.kubernetes.io/component: sahool-gateway
  ports:
    - name: http
      port: {{ .Values.gateway.port }}
      targetPort: http
{{- end }}
