{{- if .Values.ingress.enabled }}
{{- /*
W0-06 (deploy-2, deploy-12): the Ingress has exactly one backend, the SAHOOL gateway.
It used to route each workload's pathPrefix straight to its Service: no JWT verification,
no rewrite to the /v1/* paths the services serve, and a client-sent X-Tenant-Id reached
raster and ai-agronomist, which derive the tenant from it. Routing and identity now live
in the gateway (templates/gateway.yaml); there is no direct path to any workload.
*/}}
{{- if not .Values.gateway.enabled }}
{{- fail "ingress.enabled requires gateway.enabled: the Ingress never routes to a workload directly (W0-06)" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sahool-api
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "sahool.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sahool-gateway
                port:
                  name: http
{{- end }}
