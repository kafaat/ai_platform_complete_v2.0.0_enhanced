apiVersion: v1
kind: Secret
metadata:
  name: sahool-runtime-secrets-required
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "sahool.labels" . | nindent 4 }}
  annotations:
    sahool.io/purpose: "placeholder-schema-only; replace with external-secrets/sealed-secrets"
type: Opaque
stringData:
  README: "Do not deploy this placeholder secret to production. Use External Secrets, Sealed Secrets, or your cloud secret manager."
  {{- /*
  W3-09: the Secrets the workloads and the migration Job read, one per global.secretRefs
  entry, each holding its value under the key `value` (templates/deployments.yaml
  secretKeyRef). Derived from values, so a secret added to secretRefs is listed here
  without a second hand-kept list. Names only; never a value.
  */}}
  required-secrets: |
    {{- range $ref, $name := .Values.global.secretRefs }}
    {{ $name }} (key: value) <- global.secretRefs.{{ $ref }}
    {{- end }}
